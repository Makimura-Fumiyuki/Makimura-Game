<style>
  @import url('https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Noto+Sans+JP:wght@400;700;900&display=swap');
  :root{
    --pp:#4a2490; --pp-d:#2e1259; --pp-ink:#3a1d66;
    --yel:#ffd23e; --pk:#ff5fa8; --cy:#3fd8e8; --grn:#5fe07a; --orn:#ff9a3e;
    --card:#fffdf6;
    --bw:min(94vw, 470px); --sf:1;   /* --sf=盤内の文字スケール(9路=1・5路=1.8) */
    --fw:"Yuji Syuku","Hiragino Mincho ProN","Yu Mincho",serif;   /* 和風=将棋要素(駒・「将棋」ロゴ)だけに使う */
  }
  *{ box-sizing:border-box; margin:0; padding:0; font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif; -webkit-tap-highlight-color:transparent; }
  html,body{ min-height:100%; }
  body{ color:#fff; overflow-x:hidden; background:var(--pp); -webkit-user-select:none; user-select:none; }   /* ドラッグで青く選択されるのを防ぐ */
  input,textarea{ -webkit-user-select:text; user-select:text; }
  /* ななめストライプ(流れ続ける。transform=軽量) */
  body::before{ content:""; position:fixed; inset:-160px; z-index:-2; pointer-events:none;
    background:repeating-linear-gradient(115deg, rgba(255,255,255,.04) 0 30px, transparent 30px 78px);
    animation:stripeMove 7s linear infinite; }
  @keyframes stripeMove{ from{ transform:translate(0,0); } to{ transform:translate(70.7px,33px); } }   /* 1周期ぶん動かす=つなぎ目なしでループ */
  /* 浮遊する紙吹雪ドット+将棋の駒(transformのみ=軽量) */
  .bgfx{ position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; }
  .bgfx i,.bgfx s{ position:absolute; will-change:transform; }
  .bgfx i{ border-radius:50%; }
  .bgfx i:nth-of-type(1){ left:6%;  top:10%; width:56px; height:56px; background:rgba(255,210,62,.2);  animation:bf1 11s ease-in-out infinite alternate; }
  .bgfx i:nth-of-type(2){ left:88%; top:6%;  width:44px; height:44px; background:rgba(63,216,232,.18); animation:bf2 9s  ease-in-out infinite alternate; }
  .bgfx i:nth-of-type(3){ left:92%; top:44%; width:64px; height:64px; background:rgba(255,95,168,.18); animation:bf3 13s ease-in-out infinite alternate; }
  .bgfx i:nth-of-type(4){ left:4%;  top:58%; width:48px; height:48px; background:rgba(95,224,122,.15); animation:bf2 12s ease-in-out infinite alternate; }
  .bgfx i:nth-of-type(5){ left:74%; top:86%; width:70px; height:70px; background:rgba(255,210,62,.13); animation:bf1 10s ease-in-out infinite alternate; }
  .bgfx i:nth-of-type(6){ left:14%; top:88%; width:40px; height:40px; background:rgba(63,216,232,.13); animation:bf3 8s  ease-in-out infinite alternate; }
  .bgfx s{ clip-path:polygon(50% 7%, 87% 28%, 96% 100%, 4% 100%, 13% 28%); }   /* 背景にただよう将棋の駒(本物のシルエット) */
  .bgfx s:nth-of-type(1){ left:78%; top:16%; width:52px; height:56px; background:rgba(255,255,255,.09);  animation:bk1 12s ease-in-out infinite alternate; }
  .bgfx s:nth-of-type(2){ left:8%;  top:34%; width:40px; height:44px; background:rgba(255,210,62,.12);   animation:bk2 10s ease-in-out infinite alternate; }
  .bgfx s:nth-of-type(3){ left:60%; top:78%; width:62px; height:66px; background:rgba(255,255,255,.07);  animation:bk1 14s ease-in-out infinite alternate; }
  @keyframes bf1{ from{ transform:translate(0,0) scale(1); } to{ transform:translate(26px,-34px) scale(1.15); } }
  @keyframes bf2{ from{ transform:translate(0,0) scale(1); } to{ transform:translate(-30px,24px) scale(.9); } }
  @keyframes bf3{ from{ transform:translate(0,0) scale(1); } to{ transform:translate(18px,30px) scale(1.1); } }
  @keyframes bk1{ from{ transform:translate(0,0) rotate(-10deg); } to{ transform:translate(22px,-28px) rotate(9deg); } }
  @keyframes bk2{ from{ transform:translate(0,0) rotate(8deg); } to{ transform:translate(-18px,26px) rotate(-11deg); } }
  button{ color:inherit; cursor:pointer; white-space:nowrap; }

  /* ===== 左上・右上の固定ボタン ===== */
  .help-btn,.se-btn{ position:fixed; top:10px; z-index:40; display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,.14); border:1.5px solid rgba(255,255,255,.5); border-radius:999px;
    font-size:13px; font-weight:900; padding:8px 14px; color:#fff; backdrop-filter:blur(2px); transition:transform .12s; }
  .help-btn{ left:10px; }
  .help-btn span{ display:inline-flex; width:18px; height:18px; border-radius:50%; background:var(--yel); color:var(--pp-ink); align-items:center; justify-content:center; font-size:12px; }
  .se-btn{ right:10px; }
  .se-btn svg{ width:15px; height:15px; }
  .se-btn.off{ opacity:.45; }

  /* ===== タイトル(ロゴ=左上・メニュー=右下のななめ構図) ===== */
  .scene{ display:none; }
  .scene.on{ display:flex; }
  #titleScene{ min-height:100vh; flex-direction:column; justify-content:center; gap:30px; padding:70px 16px 100px; }
  .t-wrap{ align-self:flex-start; margin-left:4vw; position:relative; text-align:center;
    animation:logoBob 4.5s ease-in-out infinite; }
  @keyframes logoBob{ 0%,100%{ transform:rotate(-5deg) translateY(0); } 50%{ transform:rotate(-3.6deg) translateY(-9px); } }
  /* ロゴ背景=ななめの四角2枚(フラット。BINGOの角ばったデザインと合わせる)。拡縮+ゆらぎで動き続ける */
  .t-sq{ position:absolute; left:50%; top:50%; width:104%; aspect-ratio:1; z-index:-1; pointer-events:none;
    animation:sqPulse1 3.4s ease-in-out infinite alternate; }
  .t-sq.a{ background:rgba(255,210,62,.17); }
  .t-sq.b{ width:86%; background:rgba(255,95,168,.15); animation-name:sqPulse2; animation-duration:4.6s; animation-delay:-2.1s; }
  @keyframes sqPulse1{ from{ transform:translate(-50%,-50%) rotate(7deg) scale(.94); } to{ transform:translate(-50%,-50%) rotate(13deg) scale(1.08); } }
  @keyframes sqPulse2{ from{ transform:translate(-50%,-50%) rotate(-16deg) scale(1.06); } to{ transform:translate(-50%,-50%) rotate(-9deg) scale(.95); } }
  .tl-shogi{ font-family:var(--fw); font-size:clamp(54px,15vw,92px); line-height:1; color:#fdf3da;
    text-shadow:4px 5px 0 rgba(20,8,45,.4); letter-spacing:.04em; position:relative; z-index:3; margin-bottom:-14px; }
  .tl-on{ font-size:clamp(26px,7vw,42px); font-weight:900; font-style:italic; opacity:.95; margin:-8px 0 -12px; letter-spacing:.1em;
    color:#fdf3da; text-shadow:3.5px 4px 0 rgba(20,8,45,.42); position:relative; z-index:2; }   /* 将棋onがビンゴの上にのる */
  .tl-bingo{ font-size:clamp(46px,13.5vw,84px); font-weight:900; line-height:1; letter-spacing:.02em; position:relative; z-index:1; }
  .tl-bingo b{ display:inline-block; text-shadow:4px 4px 0 rgba(20,8,45,.45); animation:bBounce 1.35s ease-in-out infinite alternate; }
  .tl-bingo b:nth-child(1){ --rot:-6deg; color:var(--yel); }
  .tl-bingo b:nth-child(2){ --rot:3deg;  color:var(--pk);  animation-delay:.18s; }
  .tl-bingo b:nth-child(3){ --rot:-2deg; color:var(--cy);  animation-delay:.36s; }
  .tl-bingo b:nth-child(4){ --rot:7deg;  color:var(--grn); animation-delay:.54s; }
  @keyframes bBounce{ from{ transform:rotate(var(--rot)) translateY(0); } to{ transform:rotate(var(--rot)) translateY(-8px); } }

  .menu{ align-self:flex-end; margin-right:3vw; display:flex; flex-direction:column; gap:26px; align-items:flex-end; }
  .sec-label{ font-size:12px; font-weight:900; letter-spacing:.3em; opacity:.75; text-align:right; margin-bottom:10px; }
  .m-col{ display:flex; flex-direction:column; gap:13px; align-items:flex-end; }
  /* ボタンは常時すこーしぷかぷか(+hover/activeはCSS変数でアニメと共存) */
  .mbtn{ width:min(76vw,330px); padding:14px 20px 15px; border:none; border-radius:16px; text-align:left;
    font-size:17px; font-weight:900; letter-spacing:.03em; color:var(--pp-ink);
    box-shadow:0 6px 0 rgba(20,8,45,.35);
    transition:box-shadow .14s ease, outline .14s ease; outline:3px solid transparent;
    animation:mFloat 3.8s ease-in-out infinite; }
  @keyframes mFloat{ 0%,100%{ transform:rotate(var(--r,0deg)) translateY(var(--lift,0px)) scale(var(--sc,1)); }
    50%{ transform:rotate(var(--r,0deg)) translateY(calc(var(--lift,0px) - 4px)) scale(var(--sc,1)); } }
  .mbtn small{ display:block; font-size:11px; font-weight:700; opacity:.75; margin-top:2px; letter-spacing:.04em; }
  .mbtn:active{ --lift:4px; box-shadow:0 2px 0 rgba(20,8,45,.35); }
  .mbtn.sel{ outline:3.5px solid #fff; }
  #modeRow .mbtn:nth-child(1){ --r:-1.5deg; background:var(--yel); }
  #modeRow .mbtn:nth-child(2){ --r:1deg;    background:var(--cy); animation-delay:-1.3s; }
  #modeRow .mbtn:nth-child(3){ --r:2deg;    background:var(--pk); animation-delay:-2.6s; }
  .opt-row{ display:flex; gap:9px; justify-content:flex-end; width:min(76vw,300px); margin-left:auto; }
  .opt-row .obtn{ flex:1 1 0; min-width:0; }   /* 同じカテゴリ内のボタンは必ず同じ幅 */
  .obtn{ padding:10px 14px 11px; border:none; border-radius:12px; font-size:14px; font-weight:900; color:var(--pp-ink);
    background:#fff; box-shadow:0 4px 0 rgba(20,8,45,.3); outline:3px solid transparent;
    transition:box-shadow .12s, outline .12s; animation:mFloat 4.4s ease-in-out infinite; }
  .obtn:nth-child(2){ animation-delay:-1.5s; } .obtn:nth-child(3){ animation-delay:-3s; }
  .obtn small{ display:block; font-size:10px; font-weight:700; opacity:.7; margin-top:1px; }
  .obtn:active{ --lift:3px; box-shadow:0 1px 0 rgba(20,8,45,.3); }
  .obtn.sel{ background:var(--yel); outline:3px solid #fff; }
  .setup{ display:none; flex-direction:column; gap:20px; align-items:flex-end; }
  .setup.on{ display:flex; animation:setupIn .3s cubic-bezier(.2,.9,.3,1); }
  @keyframes setupIn{ 0%{ opacity:0; transform:translateY(16px); } 100%{ opacity:1; transform:translateY(0); } }
  .prep-note{ font-size:12px; font-weight:700; opacity:.7; letter-spacing:.08em; text-align:right; }
  .start-btn{ margin-top:2px; padding:15px 54px 17px; border:none; border-radius:16px;
    font-size:22px; font-weight:900; letter-spacing:.18em; text-indent:.18em; color:var(--pp-ink);
    background:var(--yel);
    box-shadow:0 7px 0 rgba(20,8,45,.4);
    transition:box-shadow .14s; --r:-1deg; animation:mFloat 3.4s ease-in-out infinite; animation-delay:-.8s; }
  .start-btn:active{ --lift:5px; box-shadow:0 2px 0 rgba(20,8,45,.4); }
  /* マウスがある端末: カーソルを合わせた時の反応(スマホには影響なし) */
  @media (hover:hover){
    .mbtn:hover{ --lift:-5px; --sc:1.03; box-shadow:0 11px 0 rgba(20,8,45,.35); }
    .obtn:hover{ --lift:-3px; box-shadow:0 7px 0 rgba(20,8,45,.3); }
    .start-btn:hover{ --lift:-4px; --sc:1.04; box-shadow:0 11px 0 rgba(20,8,45,.4); }
    .help-btn:hover,.se-btn:hover{ transform:scale(1.07); }
    .txt-btn:hover{ background:rgba(255,255,255,.26); }
  }

  /* 横長(PC)ではロゴとメニューを横に並べて画面中央へ寄せる */
  @media (min-width:900px) and (min-aspect-ratio:1/1){
    #titleScene{ flex-direction:row; align-items:flex-start; justify-content:center; gap:min(7vw,90px); padding:30px 24px 60px; }
    .t-wrap{ align-self:flex-start; margin-left:0; margin-top:clamp(14px,6vh,60px); }        /* ロゴは左上(すこし下げる) */
    .menu{ align-self:flex-start; margin-right:0; margin-top:clamp(80px,19vh,200px); }       /* メニューは右下寄り。上端そろえなのでモードを選んでも動かない */
  }

  /* ===== ゲーム画面 ===== */
  #gameScene{ position:relative; min-height:100vh; flex-direction:column; align-items:center; padding:56px 8px 150px; gap:5px; }


  /* ===== ビンゴカード盤(フラット単色=黄色いカード・直角) ===== */
  /* 先手後手エリアはカードの外側(上) */
  .cap-row{ width:var(--bw); display:flex; gap:8px; margin-bottom:8px; }
  .cap-box{ flex:1 1 0; min-width:0; min-height:56px; border-radius:11px; padding:5px 8px 7px;
    background:rgba(255,255,255,.1); border:2.5px solid rgba(255,255,255,.3); transition:border-color .2s, background .2s; }
  .cap-box .cap-t{ font-size:10px; font-weight:900; letter-spacing:.14em; opacity:.7; margin-bottom:4px; }
  .cap-box.turn{ border-color:var(--yel); background:rgba(255,210,62,.16); }
  .cap-box.turn .cap-t{ opacity:1; color:var(--yel); }
  .cap-chips{ display:flex; gap:5px; flex-wrap:wrap; align-items:center; min-height:26px; }
  /* カード本体: 黄色ベタ塗り+濃インクの枠 */
  #boardWrap{ position:relative; padding:0 10px 12px; background:var(--yel);
    box-shadow:0 8px 0 rgba(20,8,45,.45); }
  #boardWrap.shake{ animation:bShake .35s ease; }
  @keyframes bShake{ 0%,100%{transform:translate(0,0);} 20%{transform:translate(-4px,2px);} 40%{transform:translate(4px,-2px);} 60%{transform:translate(-3px,-2px);} 80%{transform:translate(2px,2px);} }
  /* BINGOヘッダー: 紫の太字テキスト(帯の上下中央あたり) */
  .b-head{ display:flex; justify-content:center; align-items:center; padding:15px 4px 13px; position:relative; }
  .b-head .bh-txt{ font-size:clamp(23px,6.2vw,30px); font-weight:900; letter-spacing:.34em; text-indent:.34em; color:#4a2490; line-height:1; }
  #board{ position:relative; width:calc(var(--bw) - 20px); height:calc(var(--bw) - 20px); display:grid; grid-template-columns:repeat(9,1fr); grid-template-rows:repeat(9,1fr);
    background:var(--card); }
  .cell{ position:relative; border:1.5px solid var(--yel); display:flex; align-items:center; justify-content:center; cursor:pointer; background:var(--card); }
  .cell .bn{ position:absolute; left:0; top:0; right:0; bottom:0; z-index:1; display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--bw)*0.05*var(--sf)); font-weight:900; color:rgba(15,15,15,.09); transition:color .4s; }   /* 薄い時が既定(戻りは速め) */   /* ふだんはかなり薄め(盤面を見やすく) */
  /* 駒が乗っている時は左上に小さく(数字は駒より上のレイヤー) */
  .cell.haspc .bn{ z-index:3; right:auto; bottom:auto; left:4px; top:2px; font-size:calc(var(--bw)*0.024*var(--sf));
    color:rgba(15,15,15,.24); line-height:1.25;
    text-shadow:-1.5px 0 0 rgba(255,255,255,.92), 1.5px 0 0 rgba(255,255,255,.92), 0 -1.5px 0 rgba(255,255,255,.92), 0 1.5px 0 rgba(255,255,255,.92),
      -1px -1px 0 rgba(255,255,255,.92), 1px -1px 0 rgba(255,255,255,.92), -1px 1px 0 rgba(255,255,255,.92), 1px 1px 0 rgba(255,255,255,.92); }   /* 左上数字は白の縁取り(アウトライン形式) */
  .cell.hole{ cursor:default; }
  .cell.hole .bn{ display:none; }
  /* 穴=アーチ型(上が丸く下が平ら)の押し抜き穴。フラット単色 */
  .cell.hole::after{ content:""; position:absolute; left:calc(8% + 5px*var(--sf)); right:calc(8% + 5px*var(--sf)); top:calc(12% + 1.5px*var(--sf)); bottom:calc(9% + 1.5px*var(--sf));
    border-radius:50% 50% 5% 5% / 42% 42% 4% 4%;
    background:#1d1128; }
  .punch{ position:absolute; left:calc(8% + 5px*var(--sf)); right:calc(8% + 5px*var(--sf)); top:calc(12% + 1.5px*var(--sf)); bottom:calc(9% + 1.5px*var(--sf)); z-index:5; display:flex; align-items:center; justify-content:center;
    border-radius:50% 50% 5% 5% / 42% 42% 4% 4%;
    background:#fff;
    font-size:calc(var(--bw)*0.046*var(--sf)); font-weight:900; color:rgba(15,15,15,.45); pointer-events:none;
    transform-origin:50% 100%;
    animation:punchFly .55s ease-in forwards; }
  @keyframes punchFly{ 0%{ transform:none; opacity:1; } 100%{ transform:perspective(300px) rotateX(-74deg) scale(.85); opacity:0; } }
  /* 選択・移動ガイドはそのマスの列の色(--gc)に合わせる */
  .cell.sel{ outline:3px solid rgba(74,36,144,.55); outline-offset:-1.5px; z-index:2; }   /* グリッド線に重ね・移動先の丸と同じ透明度 */
  .cell.mv::before{ content:""; position:absolute; width:30%; height:30%; border-radius:50%; background:var(--pp); opacity:.55; pointer-events:none; z-index:3; }
  /* 相手の駒を選んだ時(動かせない・見るだけ)は中空の輪郭にする */
  #board.viewsel .cell.mv::before{ background:none; border:2.5px solid var(--pp); opacity:.4; }
  #board.viewsel .cell.sel{ outline-style:dashed; }
  .cell.last::after{ content:""; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:var(--yel); opacity:.5; }   /* 最後に動いたマス=黄色(点滅なし・駒より下のレイヤー) */
  .cell.target{ z-index:4; }
  .cell.target::before{ content:""; position:absolute; inset:0; z-index:6; pointer-events:none;
    background:var(--yel);
    animation:tgtPulse .38s ease infinite alternate; }   /* マス自体が光る */
  @keyframes tgtPulse{ 0%{ opacity:.35; } 100%{ opacity:.8; } }

  .pc{ position:relative; z-index:2; width:66%; height:70%; display:flex; align-items:center; justify-content:center;
    font-family:var(--fw); font-weight:400; font-size:calc(var(--bw)*0.036*var(--sf)); color:#241a0c; line-height:1; padding-top:10%;
    clip-path:polygon(50% 7%, 87% 28%, 96% 100%, 4% 100%, 13% 28%);   /* 本物の駒のシルエット(上の尖りは控えめ) */
    background:#d0a055; margin-top:-2.4%; pointer-events:none;
    transition:opacity .15s; }
  .pc.dim{ filter:grayscale(.75); opacity:.5; }   /* 選べない駒(1台=相手の駒/身代わり選択中の対象外)をグレーアウト */
  /* 駒の移動アニメ: A地点からB地点へつなぐように滑る */
  .pc.slide{ z-index:6; animation:pcSlide .26s cubic-bezier(.3,.9,.35,1); }
  @keyframes pcSlide{ from{ transform:translate(var(--dx),var(--dy)); } to{ transform:translate(0,0); } }
  .pc.rot.slide{ animation:pcSlideR .26s cubic-bezier(.3,.9,.35,1); }
  @keyframes pcSlideR{ from{ transform:translate(var(--dx),var(--dy)) rotate(180deg); } to{ transform:translate(0,0) rotate(180deg); } }
  .pc.rot{ transform:rotate(180deg); margin-top:2.4%; }   /* 下向き(相手側)も同じ色(2026-07-31に色分けを廃止=上向きに統一) */
  .pc.prom{ color:#c1271b; }
  .pc.pop{ animation:pcPop .28s ease; }
  @keyframes pcPop{ 0%{ transform:scale(1.35); } 100%{ transform:scale(1); } }
  .pc.rot.pop{ animation:pcPopR .28s ease; }
  @keyframes pcPopR{ 0%{ transform:rotate(180deg) scale(1.35); } 100%{ transform:rotate(180deg) scale(1); } }
  /* 穴に駒が落ちる演出(縮小しながら右回転) */
  .fallpc{ position:absolute; left:17%; top:15%; width:66%; height:70%; z-index:6; display:flex; align-items:center; justify-content:center; pointer-events:none;
    font-family:var(--fw); font-size:calc(var(--bw)*0.036*var(--sf)); color:#241a0c; padding-top:7%;
    clip-path:polygon(50% 7%, 87% 28%, 96% 100%, 4% 100%, 13% 28%); background:#d0a055;
    animation:fallSpin .5s ease-in forwards; }
  @keyframes fallSpin{ 0%{ transform:scale(1) rotate(0deg); opacity:1; } 100%{ transform:scale(0) rotate(210deg); opacity:.5; } }
  .fallpc.slow{ animation-duration:1.2s; }   /* 王はゆっくり落ちる */
  /* 王手ボタン(盤が王手の間はいつでも押せる) */
  .check-btn{ display:none; padding:9px 22px; font-family:var(--fw); font-size:16px; letter-spacing:.16em; text-indent:.16em;
    color:var(--pp-ink); background:var(--yel); border:none; border-radius:999px; box-shadow:0 4px 0 rgba(20,8,45,.4); }
  .check-btn.on{ display:inline-block; animation:mFloat 2.6s ease-in-out infinite; }
  .check-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(20,8,45,.4); }
  /* 「王手」の宣言演出 */
  #checkFx{ position:absolute; transform:translate(-50%,-50%); z-index:58; pointer-events:none;
    font-family:var(--fw); font-size:clamp(66px,21vw,118px); color:var(--yel); letter-spacing:.1em; white-space:nowrap;
    text-shadow:5px 6px 0 var(--pp-d), 0 0 22px rgba(255,210,62,.45);
    animation:checkIn 1.25s cubic-bezier(.2,1.2,.3,1) forwards; }
  @keyframes checkIn{ 0%{ opacity:0; transform:translate(-50%,-50%) scale(2.2); }
    13%{ opacity:1; transform:translate(-50%,-50%) scale(1); }
    18%{ transform:translate(-49%,-51%) scale(1.03); } 23%{ transform:translate(-51%,-49%) scale(1); }
    80%{ opacity:1; } 100%{ opacity:0; transform:translate(-50%,-50%) scale(1); } }

  /* 王のマスが開いた時の特大リアクション */
  #kingFx{ position:absolute; transform:translate(-50%,-50%); z-index:58; pointer-events:none; display:flex; flex-direction:column; align-items:center; gap:4px;
    font-family:var(--fw); color:#ff4b3a; letter-spacing:.08em; white-space:nowrap;
    text-shadow:0 0 18px rgba(255,75,58,.5), 4px 5px 0 rgba(20,8,45,.6);
    animation:kingIn 2.1s cubic-bezier(.2,1.2,.3,1) forwards; }   /* 位置はJSでカード中央に */
  #kingFx b,#kingFx span{ font-family:var(--fw); }   /* 全称セレクタのNoto指定に負けないよう子にも和風フォントを明示 */
  #kingFx b{ font-size:clamp(64px,20vw,110px); font-weight:400; line-height:1; }
  #kingFx span{ font-size:clamp(28px,8.6vw,50px); line-height:1.15; }
  @keyframes kingIn{ 0%{ opacity:0; transform:translate(-50%,-50%) scale(2.6); } 12%{ opacity:1; transform:translate(-50%,-50%) scale(1); }
    16%{ transform:translate(-49%,-51%) scale(1.02); } 20%{ transform:translate(-51%,-49%) scale(1); }
    85%{ opacity:1; } 100%{ opacity:0; transform:translate(-50%,-50%) scale(1); } }
  /* 獲得エリアに上から降ってくるチップ(大きく出て縮小しながら着地) */
  .chip.drop{ animation:chipDrop .45s cubic-bezier(.3,.9,.4,1.15); z-index:5; }
  @keyframes chipDrop{ 0%{ transform:scale(2.6) translateY(-26px); } 70%{ transform:scale(.95) translateY(0); } 100%{ transform:scale(1) translateY(0); } }

  /* ===== 獲得した駒チップ(将棋の駒の形) ===== */
  .chip{ position:relative; width:30px; height:33px; padding:0; border:none; background:none; }
  .chip .kj{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--fw); font-weight:400; font-size:15px; color:#241a0c; padding-top:12%;
    clip-path:polygon(50% 7%, 87% 28%, 96% 100%, 4% 100%, 13% 28%);
    background:#d0a055; }   /* フラット単色。後手の駒も先手と同じ向き(とんがり上) */
  .chip .cnt{ position:absolute; right:-3px; bottom:-3px; z-index:2; min-width:15px; height:15px; padding:0 3px; border-radius:999px;
    background:var(--pp); color:#fff; font-size:9px; font-weight:900; line-height:1; padding-bottom:.5px; display:flex; align-items:center; justify-content:center; }
  .chip.sel .kj{ box-shadow:0 0 0 2.5px var(--yel); }

  /* ===== ビンゴ抽選(球がカードの周りを回り続ける) ===== */
  #flow{ position:absolute; left:0; top:0; width:0; height:0; z-index:55; pointer-events:none; overflow:visible; display:none; }   /* #gameScene基準の絶対配置=盤と一緒に動く(ビューポート固定はしない) */
  .fb{ position:absolute; left:0; top:0; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:900; line-height:1; color:#fff; will-change:transform;
    opacity:0; transition:opacity .45s; }   /* フラット単色の球。出現はフェードイン */

  /* 通常将棋モード: マスの数字を出さない */
  #board.rolling .bn,#board.rolling .cell.haspc .bn{ color:rgba(15,15,15,.34); transition:color 3.65s linear; }   /* 抽選の進行に合わせてじわじわ濃くなり、数字が決まる瞬間にMAX */
  #board.pure .bn{ display:none; }
  .pure-btn{ position:fixed; left:12px; bottom:64px; z-index:40; background:rgba(255,255,255,.14); border:1.5px solid rgba(255,255,255,.5);
    border-radius:999px; font-size:12px; font-weight:900; padding:9px 16px; color:#fff; }
  .pure-btn.on{ background:var(--yel); color:var(--pp-ink); border-color:var(--yel); }

  /* 数字決定時のビネット(選ばれたマスへ目線誘導) */
  #vig{ position:fixed; inset:0; z-index:54; pointer-events:none; opacity:0; transition:opacity .3s; }
  #vig.on{ opacity:1; }

  /* ビンゴ成立: 大きなBINGO表示+カードを新品に交換 */
  #bingoFx{ position:absolute; z-index:58; pointer-events:none; display:flex;
    font-size:clamp(64px,21vw,130px); font-weight:900; letter-spacing:.02em;
    animation:bingoIn .7s cubic-bezier(.2,1.1,.3,1) forwards; }   /* 位置はJSでカード中央に(#gameScene基準) */
  #bingoFx.out{ animation:bingoOut .28s cubic-bezier(.5,0,.75,0) forwards; }   /* カードが動き出すタイミングで縮小して消える */
  @keyframes bingoOut{ from{ transform:translate(-50%,-50%) scale(1); opacity:1; } to{ transform:translate(-50%,-50%) scale(.15); opacity:0; } }
  #bingoFx b{ text-shadow:5px 6px 0 var(--pp-d); }   /* 不透明・ぼかしなしのくっきりシャドー */
  #bingoFx b:nth-of-type(1){ color:var(--yel); }
  #bingoFx b:nth-of-type(2){ color:var(--pk); }
  #bingoFx b:nth-of-type(3){ color:var(--cy); }
  #bingoFx b:nth-of-type(4){ color:var(--grn); }
  #bingoFx b:nth-of-type(5){ color:var(--orn); }
  /* 文字の後ろにロゴと同じ「ななめの四角2枚」=回転しながらドンと出る */
  #bingoFx .bfx-sq{ position:absolute; left:50%; top:50%; width:104%; aspect-ratio:1; z-index:-1; pointer-events:none; }
  #bingoFx .bfx-sq.a{ background:rgba(46,18,89,.6); animation:bfxA .8s ease-out forwards; }
  #bingoFx .bfx-sq.b{ width:86%; background:rgba(255,95,168,.42); animation:bfxB .8s ease-out forwards; }
  @keyframes bfxA{ 0%{ transform:translate(-50%,-50%) rotate(-50deg) scale(.1); opacity:0; }
    28%{ opacity:1; transform:translate(-50%,-50%) rotate(5deg) scale(1.06); }
    47%{ transform:translate(-50%,-50%) rotate(8deg) scale(1); }
    100%{ transform:translate(-50%,-50%) rotate(14deg) scale(1.05); opacity:1; } }
  @keyframes bfxB{ 0%{ transform:translate(-50%,-50%) rotate(50deg) scale(.1); opacity:0; }
    34%{ opacity:1; transform:translate(-50%,-50%) rotate(-9deg) scale(1.03); }
    56%{ transform:translate(-50%,-50%) rotate(-12deg) scale(.98); }
    100%{ transform:translate(-50%,-50%) rotate(-18deg) scale(1.02); opacity:1; } }
  @keyframes bingoIn{ 0%{ opacity:0; transform:translate(-50%,-50%) scale(.25); } 25%{ opacity:1; transform:translate(-50%,-50%) scale(1.1); }
    43%{ transform:translate(-50%,-50%) scale(1); } 100%{ opacity:1; transform:translate(-50%,-50%) scale(1); } }

  /* ===== 駒の動きガイド(駒をタップするとビンゴカードの左隣に出る) ===== */
  .mv-guide{ position:absolute; z-index:20; visibility:hidden; display:flex; flex-direction:column; align-items:flex-start; gap:3px;
    background:rgba(255,255,255,.94); border-radius:14px; padding:7px 9px 7px 10px; box-shadow:0 4px 0 rgba(20,8,45,.4); }
  .mv-guide.on{ visibility:visible; }
  .mv-guide svg{ width:82px; height:82px; display:block; margin:0 auto; }
  .mv-guide.folded svg{ display:none; }
  .mv-guide.folded{ padding:5px 8px 6px 13px; }   /* 閉じている時は左をすこし広げる(文字と枠が近すぎないように) */
  .g-fold{ position:absolute; right:3px; top:2px; width:18px; height:18px; padding:0; border:none; background:none;
    color:var(--pp); font-size:15px; font-weight:900; line-height:1; opacity:.55; cursor:pointer; }
  .g-fold:active{ opacity:1; }
  .mv-guide.folded .g-name{ padding-right:12px; }
  .g-name{ font-family:var(--fw); color:var(--pp-ink); font-size:16px; line-height:1.1; text-align:left; white-space:nowrap; }
  .g-ruby{ display:block; font-size:6px; font-weight:700; opacity:.55; margin-bottom:2px; letter-spacing:.02em; text-align:left; }

  /* ===== オンライン: 合言葉まわり ===== */
  .room-area{ display:flex; flex-direction:column; align-items:flex-end; gap:12px; text-align:right; }
  .room-code{ font-size:clamp(34px,9vw,46px); font-weight:900; letter-spacing:.26em; color:var(--yel); display:flex; align-items:center; }
  .room-note{ font-size:13px; font-weight:700; opacity:.85; letter-spacing:.06em; }
  .room-note.err{ color:#ffb1a6; opacity:1; }
  .copy-ic{ width:.5em; height:.5em; margin-right:12px; opacity:.6; }
  .code-row{ display:flex; align-items:center; gap:8px; }
  .paste-btn{ flex:none; display:flex; align-items:center; justify-content:center; padding:4px; color:rgba(255,255,255,.75); background:none; border:none; }
  .paste-btn svg{ width:26px; height:26px; }
  .paste-btn:active{ transform:translateY(1px); }
  .code-input{ width:200px; padding:10px 6px; text-align:center; font-size:24px; font-weight:900; letter-spacing:.22em; text-indent:.22em; text-transform:uppercase;
    color:var(--pp-ink); background:#fff; border:none; border-radius:10px; outline:none; line-height:1.2; caret-color:var(--pp-ink); }

  /* ===== スタンプ(全対戦ゲーム共通の仕組みを流用) ===== */
  #stampBar{ position:fixed; left:50%; transform:translateX(-50%); bottom:10px; z-index:75; display:none; gap:9px; }   /* 結果ダイアログ(z70)より前=対局終了時も送れる */
  #stampBar.on{ display:flex; }
  .stamp-btn{ width:48px; height:48px; padding:0; border:none; border-radius:50%; cursor:pointer;
    background:rgba(255,255,255,.9); box-shadow:0 3px 0 rgba(20,8,45,.4);
    display:flex; align-items:center; justify-content:center; font-size:27px; line-height:1; }
  .stamp-btn:active{ transform:translateY(1px) scale(.93); }
  .stamp-mute{ width:34px; height:34px; padding:0; border:none; border-radius:50%; cursor:pointer;
    position:absolute; left:100%; top:7px; margin-left:9px; background:rgba(255,255,255,.9); box-shadow:0 3px 0 rgba(20,8,45,.4);
    display:flex; align-items:center; justify-content:center; color:#555; }
  .stamp-mute svg{ width:19px; height:19px; transform:translateY(1px); }
  .stamp-mute .mute-slash{ display:none; }
  .stamp-mute.muted{ color:#d23b30; }
  .stamp-mute.muted .mute-slash{ display:block; }
  .stamp-mute:active{ transform:translateY(1px) scale(.93); }
  .stamp-fly{ position:fixed; bottom:-30px; width:96px; z-index:53; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    filter:drop-shadow(0 5px 9px rgba(0,0,0,.3)); animation:stampFloat 2.2s cubic-bezier(.2,.75,.35,1) forwards; }
  .stamp-fly .s-emoji{ font-size:80px; line-height:1; }
  .stamp-fly .s-name{ margin-top:2px; font-size:15px; font-weight:900; color:#fff; white-space:nowrap; letter-spacing:.04em; }
  .stamp-fly.over-dialog{ z-index:74; }   /* ダイアログ表示中は暗幕(z70)より前 */
  @keyframes stampFloat{
    0%{ transform:translate(0,96px) scale(.5); opacity:0; }
    17%{ transform:translate(0,0) scale(1.06); opacity:1; }
    70%{ opacity:1; }
    100%{ transform:translate(var(--dx,0),var(--rise,-40vh)) scale(1.02); opacity:0; }
  }

  /* ===== 対局サブボタン ===== */
  .sub-btns{ display:flex; gap:16px; margin-top:14px; }
  #gameScene > .sub-btns .txt-btn{ min-width:132px; text-align:center; }   /* 一手戻る/降参の幅をそろえる */
  .txt-btn{ padding:9px 24px; font-size:14px; font-weight:900; letter-spacing:.12em; color:#fff;
    background:rgba(255,255,255,.14); border:1.5px solid rgba(255,255,255,.5); border-radius:999px; transition:background .12s; }
  .txt-btn:active{ transform:translateY(1px); }
  .txt-btn:disabled{ opacity:.35; cursor:default; pointer-events:none; }

  /* ===== トースト ===== */
  #toast{ position:fixed; bottom:86px; left:50%; transform:translateX(-50%); z-index:60; background:rgba(30,14,60,.94); color:#fff;
    font-size:13px; font-weight:800; padding:9px 20px; border-radius:999px; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap;
    border:1.5px solid rgba(255,255,255,.3); }
  #toast.on{ opacity:1; }

  /* ===== オーバーレイ(結果・確認・あそびかた) ===== */
  .overlay{ position:fixed; inset:0; z-index:70; background:rgba(20,8,45,.6); display:flex; align-items:center; justify-content:center; padding:18px;
    opacity:0; pointer-events:none; transition:opacity .25s linear; }
  .overlay.on{ opacity:1; pointer-events:auto; }
  .overlay .r-card{ transform:scale(.6); opacity:0; transition:transform .25s cubic-bezier(.2,1.2,.4,1), opacity .2s; }
  .overlay.on .r-card{ transform:scale(1); opacity:1; }
  .r-card{ background:#fff; border:none; border-radius:20px; color:var(--pp-ink);
    width:min(88vw, 420px); padding:26px 22px 24px; text-align:center;
    display:flex; flex-direction:column; gap:18px; align-items:center;
    box-shadow:0 10px 0 rgba(20,8,45,.4); }
  .cf-msg{ font-size:clamp(19px,5vw,25px); font-weight:900; letter-spacing:.06em; }
  .r-card .sub-btns{ width:100%; margin-top:0; }
  .r-card .txt-btn{ flex:1 1 0; min-width:110px; color:var(--pp-ink); background:#f1edf8; border:none; box-shadow:0 4px 0 rgba(20,8,45,.25); }
  .r-card .txt-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(20,8,45,.25); }
  .r-title{ font-size:32px; font-weight:900; animation:rPop .5s cubic-bezier(.2,1.4,.4,1); }
  @keyframes rPop{ 0%{ transform:scale(.3); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
  .r-reason{ font-size:14px; font-weight:700; opacity:.7; }
  .help-body{ font-size:14px; font-weight:500; line-height:1.95; text-align:left; max-height:62vh; overflow-y:auto; }
  /* 見出しは他ゲームと同じ「色の縦棒」方式 */
  .help-body .h-sec{ display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:900;
    letter-spacing:.08em; color:var(--pp-ink); margin:16px 0 2px; }
  .help-body .h-sec::before{ content:""; width:5px; height:17px; border-radius:2px; background:var(--pp); flex:none; }
  .help-body .h-sec.hl{ color:#c1271b; }
  .help-body .h-sec.hl::before{ background:#c1271b; }
  .help-body .h-sec:first-child{ margin-top:0; }
  .help-body p{ margin:3px 0 0; }
  /* ルール変更ダイアログ(白カードの中なので文字色を反転) */
  .rule-box{ display:flex; flex-direction:column; gap:12px; width:100%; }
  #ruleOv .sec-label{ color:var(--pp-ink); opacity:.7; text-align:left; margin-bottom:6px; }
  #ruleOv .opt-row{ width:100%; margin-left:0; }
  #ruleOv .obtn{ animation:none; box-shadow:0 3px 0 rgba(20,8,45,.22); }
  .rule-note{ font-size:11.5px; font-weight:700; color:var(--pp-ink); opacity:.6; }


  /* ===== フッター ===== */
  #gameScene.on ~ .home-foot{ display:none; }   /* インゲーム中は非表示 */
  .home-foot{ position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:center; padding:14px 0 16px;
    background:linear-gradient(to top, rgba(46,18,89,.96) 55%, rgba(46,18,89,0)); text-decoration:none; }
  .home-foot span{ font-size:13px; font-weight:800; color:rgba(255,255,255,.6); letter-spacing:.06em; }
</style>

<body>

<div class="bgfx" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><s></s><s></s><s></s></div>

<button class="help-btn" id="helpBtn"><span>?</span>あそびかた</button>
<button class="se-btn" id="seBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>効果音</button>

<!-- ===== タイトル(ロゴ=左上・メニュー=右下) ===== -->
<div class="scene on" id="titleScene">
  <div class="t-wrap">
    <div class="t-sq a" aria-hidden="true"></div><div class="t-sq b" aria-hidden="true"></div>
    <div class="tl-shogi">将棋</div>
    <div class="tl-on">on</div>
    <div class="tl-bingo"><b>ビ</b><b>ン</b><b>ゴ</b></div>
  </div>

  <button class="pure-btn" id="pureBtn">通常将棋モード</button>

  <div class="menu">
    <div class="m-col" id="modeRow">
      <button class="mbtn" data-mode="local">1台で遊ぶ<small>近くの友と対局</small></button>
      <button class="mbtn" data-mode="friend">オンラインで遊ぶ<small>遠くの友と対局</small></button>
      <button class="mbtn" data-mode="robot">ひとりで遊ぶ<small>ロボットと対局</small></button>
    </div>

    <!-- 1台で遊ぶ -->
    <div class="setup" id="localSetup">
      <div>
        <div class="sec-label">盤の広さ</div>
        <div class="opt-row sizeRow">
          <button class="obtn sel" data-n="5">ミニ<small>サクッと将棋</small></button>
          <button class="obtn" data-n="9">ノーマル<small>いつもの将棋</small></button>
        </div>
      </div>
      <div>
        <div class="sec-label">王のマス</div>
        <div class="opt-row ksRow">
          <button class="obtn sel" data-ks="1">開かない<small>王のマスは安全</small></button>
          <button class="obtn" data-ks="0">開く<small>究極の運ゲー</small></button>
        </div>
      </div>
      <div>
        <div class="sec-label">演出</div>
        <div class="opt-row fxRow">
          <button class="obtn sel" data-fx="1">あり<small>じっくり抽選</small></button>
          <button class="obtn" data-fx="0">なし<small>すぐ結果</small></button>
        </div>
      </div>
      <button class="start-btn" id="startLocalBtn">はじめる</button>
    </div>

    <!-- オンライン -->
    <div class="setup" id="friendSetup">
      <div>
        <div class="sec-label">盤の広さ</div>
        <div class="opt-row sizeRow">
          <button class="obtn sel" data-n="5">ミニ<small>サクッと将棋</small></button>
          <button class="obtn" data-n="9">ノーマル<small>いつもの将棋</small></button>
        </div>
      </div>
      <div>
        <div class="sec-label">王のマス</div>
        <div class="opt-row ksRow">
          <button class="obtn sel" data-ks="1">開かない<small>王のマスは安全</small></button>
          <button class="obtn" data-ks="0">開く<small>究極の運ゲー</small></button>
        </div>
      </div>
      <div>
        <div class="sec-label">演出</div>
        <div class="opt-row fxRow">
          <button class="obtn sel" data-fx="1">あり<small>じっくり抽選</small></button>
          <button class="obtn" data-fx="0">なし<small>すぐ結果</small></button>
        </div>
      </div>
      <div class="opt-row">
        <button class="obtn" id="makeRoomBtn">部屋を作る<small>合言葉を発行</small></button>
        <button class="obtn" id="joinRoomBtn">部屋に入る<small>合言葉で入室</small></button>
      </div>
      <div class="room-area" id="roomArea"></div>
      <div class="prep-note">※部屋を作った側のルールで遊びます</div>

    out.push([rr,cc]);

    let rr=r+d[0]*dir, cc=c+d[1];

  if((t==="P"||t==="L")&&r===lastRow) return false;
  if(t==="N"&&(o===0? r<=1 : r>=N-2)) return false;
  if(t==="P"){ for(let rr=0;rr<N;rr++){ const q=board[rr][c]; if(q&&q.o===o&&q.t==="P"&&!q.pr) return false; } }
  return true;
}
function genDrops(t,o){ const out=[]; for(let r=0;r<N;r++)for(let c=0;c<N;c++){ if(canDropAt(t,o,r,c)) out.push([r,c]); } return out; }
function hasAnyMove(o){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const p=board[r][c]; if(p&&p.o===o&&genMoves(r,c).length) return true; }
  for(const t of HAND_ORDER){ if((hands[o][t]|0)>0 && genDrops(t,o).length) return true; }
  return false;
}
/* 王手判定(王手・詰みでゲームは終わらないが、宣言ボタンのために盤を調べる) */
function kingPos(o){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const p=board[r][c]; if(p&&p.o===o&&p.t==="K"&&!holes[r][c]) return [r,c]; }
  return null;
}
function inCheck(o){
  const kp=kingPos(o); if(!kp) return false;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const p=board[r][c]; if(!p||p.o===o||holes[r][c]) continue;
    const ms=genMoves(r,c);
    for(let i=0;i<ms.length;i++){ if(ms[i][0]===kp[0]&&ms[i][1]===kp[1]) return true; }
  }
  return false;
}
function inZone(o,r){ const z=N===9?3:1; return o===0? r<z : r>=N-z; }   /* 敵陣=9路は3段・5路は1段(ミニ将棋準拠) */
function canProm(p,fr,tr){ return !p.pr && "PLNSBR".includes(p.t) && (inZone(p.o,fr)||inZone(p.o,tr)); }
function mustProm(p,tr){
  if(p.pr) return false;
  if((p.t==="P"||p.t==="L")&&(p.o===0? tr===0 : tr===N-1)) return true;
  if(p.t==="N"&&(p.o===0? tr<=1 : tr>=N-2)) return true;
  return false;
}

/* ================= 履歴(一手戻る) ================= */
function snapState(){
  return { board:board.map(row=>row.map(p=>p?{t:p.t,o:p.o,pr:p.pr}:null)),
    holes:holes.map(r=>r.slice()),
    hands:[Object.assign({},hands[0]),Object.assign({},hands[1])],
    turn:turn, pool:pool.slice(), moveCount:moveCount,
    last:lastMoveCell?lastMoveCell.slice():null };
}
function restoreState(s){
  board=s.board.map(row=>row.map(p=>p?{t:p.t,o:p.o,pr:p.pr}:null));
  holes=s.holes.map(r=>r.slice());
  hands=[Object.assign({},s.hands[0]),Object.assign({},s.hands[1])];
  turn=s.turn; pool=s.pool.slice(); moveCount=s.moveCount;
  lastMoveCell=s.last?s.last.slice():null;
  sel=null; legalCells=[]; phase="idle";
  render();
  if(mode==="cpu"&&turn===cpuSide()) setTimeout(cpuThink,600);
}
function undoTargetIdx(me){   // 「meの手番だった最後の局面」まで戻す
  let i=hist.length-1;
  while(i>=0 && hist[i].turn!==me) i--;
  return i;
}
function undoTo(i){
  if(i<0||i>=hist.length) return;
  const st=hist[i]; hist.length=i; restoreState(st);
}
function doUndo(){
  if(!hist.length) return;
  if(mode==="cpu"){ undoTo(undoTargetIdx(humanSide)); return; }
  const s=hist.pop();
  restoreState(s);
}

/* ================= 描画 ================= */
const boardEl=$("board");
function viewFlip(){ return bottomSide()===1; }
function render(){
  const flip=viewFlip();
  boardEl.classList.toggle("viewsel", !!(sel&&sel.view));   // 見るだけの選択=ガイドの見た目を変える
  let html="";
  for(let dr=0;dr<N;dr++)for(let dc=0;dc<N;dc++){
    const r=flip?N-1-dr:dr, c=flip?N-1-dc:dc;
    const n=numAt[r][c], p=board[r][c];
    let cls="cell";
    if(holes[r][c]) cls+=" hole";
    if(p&&!holes[r][c]) cls+=" haspc";
    if(sel&&sel.type==="board"&&sel.r===r&&sel.c===c) cls+=" sel";
    const lg=legalCells.find(m=>m[0]===r&&m[1]===c);
    if(lg) cls+=" mv";
    if(lastMoveCell&&lastMoveCell[0]===r&&lastMoveCell[1]===c&&!holes[r][c]) cls+=" last";
    html+='<div class="'+cls+'" data-r="'+r+'" data-c="'+c+'">';
    if(!holes[r][c]) html+='<span class="bn">'+n+'</span>';
    if(p&&!holes[r][c]){
      const kj = p.pr? KJP[p.t] : (p.t==="K"&&p.o===1? "玉" : KJ[p.t]);
      const rot = p.o!==bottomSide();
      const isLast = lastMoveCell&&lastMoveCell[0]===r&&lastMoveCell[1]===c;
      let extra="", style="";
      // 手番でない側の駒はグレーアウト(1台・オンライン・ロボット共通)
      if(phase==="idle"&&p.o!==turn) extra+=" dim";
      if(isLast && slideFrom){   // A地点→B地点をつなぐ移動アニメ(dimを上書きしない=+=)
        const cs=boardEl.clientWidth/N;
        const dx=(flip? (slideFrom[1]-c)*-1 : (slideFrom[1]-c))*cs;
        const dy=(flip? (slideFrom[0]-r)*-1 : (slideFrom[0]-r))*cs;
        extra+=" slide"; style=' style="--dx:'+dx+'px; --dy:'+dy+'px"';
      }else if(isLast && dropPop){ extra+=" pop"; }   // popは打った直後の1回だけ(毎renderで再生されない)
      html+='<div class="pc'+(rot?" rot":"")+(p.pr?" prom":"")+extra+'"'+style+'>'+kj+'</div>';
    }
    html+='</div>';
  }
  boardEl.innerHTML=html;
  slideFrom=null; dropPop=false;   // 移動/打つアニメは1回の描画で消費
  renderCaps(); updateBtns(); renderGuide();
}
/* 獲得した駒エリア(自分/あいて)。ターン中の側の枠を強調 */
function renderCaps(){
  const bo=bottomSide();
  [[bo,"capMine"],[1-bo,"capOpp"]].forEach(pair=>{
    const o=pair[0], boxId=pair[1];
    $(boxId+"T").textContent=capLabel(o);
    let html="";
    HAND_ORDER.forEach(t=>{
      const n=hands[o][t]|0; if(!n) return;
      const isSel = sel&&sel.type==="hand"&&sel.o===o&&sel.t===t;
      const isDrop = dropChip && dropChip.o===o && dropChip.t===t;
      html+='<button class="chip'+(isSel?" sel":"")+(isDrop?" drop":"")+(o!==bottomSide()?" dk":"")+'" data-o="'+o+'" data-t="'+t+'"><span class="kj">'+KJ[t]+'</span>'+(n>1?'<span class="cnt">×'+n+'</span>':'')+'</button>';   // 後手の駒も先手と同じ向き
    });
    $(boxId+"C").innerHTML=html;
    $(boxId).classList.toggle("turn", turn===o && phase!=="over");
  });
  dropChip=null;   // 降ってくる演出は1回の描画で消費

function updateBtns(){
  const busy = phase!=="idle" || (mode==="cpu"&&turn!==humanSide);
  $("undoBtn").disabled = busy || !hist.length || phase==="over" || undoPending;
  $("giveupBtn").disabled = phase!=="idle";
  const ck = phase==="idle" && !!board && (inCheck(0)||inCheck(1));   // 盤が王手の間はいつでも宣言できる
  $("checkBtn").classList.toggle("on", ck);
}
let toastTmr=0;
function toast(msg,ms){ const t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastTmr); toastTmr=setTimeout(()=>t.classList.remove("on"), ms||1800); }
function ballBg(num){ const h=COL_HUES[Math.floor((num-1)/N)*(N===9?1:2)]; return "hsl("+h+",72%,50%)"; }   /* 列の色(縦連番=列はfloor((num-1)/N)) */

/* ================= 駒の動きガイド(左上のパネル) ================= */
function guideSVG(p,kj){
  const mv=movesFor(p), U=22, S=5*U, cx=2.5*U, cy=2.5*U;
  let g="";
  for(let i=1;i<5;i++){
    g+='<line x1="'+(i*U)+'" y1="0" x2="'+(i*U)+'" y2="'+S+'" stroke="rgba(20,8,45,.12)" stroke-width="1"/>'
      +'<line x1="0" y1="'+(i*U)+'" x2="'+S+'" y2="'+(i*U)+'" stroke="rgba(20,8,45,.12)" stroke-width="1"/>';
  }
  const tri=(x,y,d)=>{
    const a=Math.atan2(d[1],-d[0])*180/Math.PI;   // 上向き(-1,0)を0度として回す
    return '<g transform="translate('+x.toFixed(1)+','+y.toFixed(1)+') rotate('+a.toFixed(1)+')"><polygon points="0,-6.4 5.4,3.6 -5.4,3.6" fill="#4a2490"/></g>';
  };
  mv.slides.forEach(d=>{   // 走り(飛角香)=線+先端に三角
    const ex=cx+d[1]*2*U, ey=cy+d[0]*2*U;
    g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+ex.toFixed(1)+'" y2="'+ey.toFixed(1)+'" stroke="#4a2490" stroke-width="3" stroke-linecap="round"/>'+tri(ex,ey,d);
  });
  mv.steps.forEach(d=>{   // 1マス(桂馬だけ2マス先)
    const r=2+d[0], c=2+d[1]; if(r<0||r>4||c<0||c>4) return;
    g+=tri(c*U+U/2, r*U+U/2, d);
  });
  // 中央の駒はゲームと同じ見た目(本物の駒のシルエット+Yuji Syuku)
  g+='<polygon points="'+(cx)+','+(cy-8.4)+' '+(cx+6.2)+','+(cy-5)+' '+(cx+7.2)+','+(cy+8.4)+' '+(cx-7.2)+','+(cy+8.4)+' '+(cx-6.2)+','+(cy-5)+'" fill="#d0a055"/>'
    +'<text x="'+cx+'" y="'+(cy+1.6)+'" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#241a0c" font-family="Yuji Syuku,serif">'+kj+'</text>';
  return '<svg viewBox="0 0 '+S+' '+S+'" xmlns="http://www.w3.org/2000/svg">'+g+'</svg>';
}
let guideFold=false; try{ guideFold=localStorage.getItem("sgb.gfold")==="1"; }catch(e){}
function renderGuide(){
  const gl=$("mvGuide");
  let p=null;
  if(sel&&sel.type==="board") p=board[sel.r]&&board[sel.r][sel.c];
  else if(sel&&sel.type==="hand") p={t:sel.t,o:sel.o,pr:false};
  if(!p){ gl.classList.remove("on"); gl.innerHTML=""; return; }
  const kj = p.pr? KJP[p.t] : (p.t==="K"&&p.o===1? "玉" : KJ[p.t]);

    +'<div class="g-name"><span class="g-ruby">'+nm[1]+'</span>'+nm[0]+'</div>'+guideSVG(p,kj);

/* ================= 入力 ================= */
function inputLocked(){ return phase!=="idle" || (mode==="cpu"&&turn!==humanSide) || (online&&turn!==mySide); }
boardEl.addEventListener("click",e=>{
  ensureAudio();
  const cell=e.target.closest(".cell"); if(!cell) return;
  const r=+cell.dataset.r, c=+cell.dataset.c;
  if(phase!=="idle") return;
  const lg=legalCells.find(m=>m[0]===r&&m[1]===c);
  if(sel&&lg&&!sel.view&&!inputLocked()){
    if(sel.type==="board") doMove(sel.r,sel.c,r,c,false);
    else doDrop(sel.t,r,c);
    return;
  }
  const p=board[r][c];
  if(p&&!holes[r][c]){   // 自分の駒=動かす / 相手の駒=動きガイドだけ見る(view)
    if(sel&&sel.type==="board"&&sel.r===r&&sel.c===c){ sel=null; legalCells=[]; }
    else{ sel={type:"board",r:r,c:c,view:!(p.o===turn&&!inputLocked())}; legalCells=genMoves(r,c); playSelect(); }
    render(); return;
  }
  if(sel){ sel=null; legalCells=[]; render(); }
});
document.addEventListener("click",e=>{
  const chip=e.target.closest(".chip"); if(!chip||inputLocked()) return;
  ensureAudio();
  const o=+chip.dataset.o, t=chip.dataset.t;
  if(o!==turn) return;
  if(sel&&sel.type==="hand"&&sel.t===t){ sel=null; legalCells=[]; }
  else{ sel={type:"hand",o:o,t:t}; legalCells=genDrops(t,o); playSelect(); }
  render();
});


/* ================= 手の実行 ================= */
/* 穴の上に動かした駒は、そのまま落ちて相手の持ち駒になる */
function fellIntoHole(tr,tc,p,then){
  if(p.t==="K"){ kingDoom(numAt[tr][tc], tr, tc, p, true); return; }   // 王(玉)が自分から落ちたらその時点で負け
  board[tr][tc]=null; lastMoveCell=null; slideFrom=null;
  sel=null; legalCells=[]; phase="anim";
  render(); updateBtns();
  const el=boardEl.querySelector('.cell[data-r="'+tr+'"][data-c="'+tc+'"]');
  if(el) fallThenDrop(el, p, 1-p.o);
  setTimeout(then, 1400);
}
function doMove(fr,fc,tr,tc,autoProm){
  hist.push(snapState());
  const p=board[fr][fc], cap=board[tr][tc];
  lastNetMove={k:"m",fr:fr,fc:fc,tr:tr,tc:tc,prom:false};
  if(cap&&cap.t==="K"){
    board[tr][tc]=p; board[fr][fc]=null; lastMoveCell=[tr,tc]; sel=null; legalCells=[]; render();
    if(online&&turn===mySide) sendMyMove(0);   // 決着の一手も相手へ届ける
    playCap(); gameOver(turn, nameOf(turn)+"が王を取った"); return;
  }
  if(cap){ hands[turn][cap.t]=(hands[turn][cap.t]|0)+1; playCap(); } else playPlace();
  board[tr][tc]=p; board[fr][fc]=null; lastMoveCell=[tr,tc]; slideFrom=[fr,fc];   // 移動アニメ用の出発地点
  sel=null; legalCells=[];
  if(holes[tr][tc]){ fellIntoHole(tr,tc,p,afterMove); return; }   // 穴の上へ動かした=落ちて相手のものに
  if(mustProm(p,tr)){ p.pr=true; render(); afterMove(); return; }
  if(canProm(p,fr,tr)){
    if(autoProm){ p.pr=true; render(); afterMove(); return; }
    render();
    phase="anim"; updateBtns();
    $("promOv").classList.add("on");
    promCb=(yes)=>{ if(yes) p.pr=true; render(); afterMove(); };
    return;
  }
  render(); afterMove();
}
let promCb=null;
$("promYes").addEventListener("click",()=>{ ensureAudio(); playSelect(); $("promOv").classList.remove("on"); const cb=promCb; promCb=null; if(cb) cb(true); });
$("promNo").addEventListener("click",()=>{ ensureAudio(); playSelect(); $("promOv").classList.remove("on"); const cb=promCb; promCb=null; if(cb) cb(false); });

function doDrop(t,r,c){
  hist.push(snapState());
  hands[turn][t]--; if(hands[turn][t]<=0) delete hands[turn][t];
  board[r][c]={t:t,o:turn,pr:false}; lastMoveCell=[r,c]; dropPop=true;
  lastNetMove={k:"d",t:t,r:r,c:c};
  sel=null; legalCells=[]; playPlace(); render();
  afterMove();
}

/* #gameScene基準の座標(ビューポート固定ではなくページに固定=スクロールしても盤との位置関係が崩れない) */
function localCenter(){
  const w=$("boardWrap");
  return { x:w.offsetLeft+boardEl.offsetLeft+boardEl.offsetWidth/2, y:w.offsetTop+boardEl.offsetTop+boardEl.offsetHeight/2, w:boardEl.offsetWidth };
}
function cellLocal(cell){
  const w=$("boardWrap");
  return { x:w.offsetLeft+boardEl.offsetLeft+cell.offsetLeft+cell.offsetWidth/2, y:w.offsetTop+boardEl.offsetTop+cell.offsetTop+cell.offsetHeight/2, w:cell.offsetWidth };
}

/* ================= ビンゴ抽選(球がカードの周りを回り続け、その中から1つをピックアップ) ================= */
function afterMove(){
  moveCount++;
  if(online&&turn===mySide){   // オンラインの自分の手: 抽選数字を先に決めて手と一緒に送る=両者で同じ抽選を再生
    const num = pool.length? pool[Math.floor(Math.random()*pool.length)] : 0;
    sendMyMove(num);
    if(pureShogi){ phase="anim"; updateBtns(); setTimeout(switchTurn,300); return; }
    if(!num){ switchTurn(); return; }
    bingoRoll(num); return;
  }
  if(pureShogi){ phase="anim"; updateBtns(); setTimeout(switchTurn,300); return; }   // 移動アニメ(0.26s)を見せてから手番交代
  bingoRoll();
}
function bingoRoll(forced){
  phase="anim"; updateBtns(); renderCaps();
  let num;
  if(typeof forced==="number"){   // オンライン: 送り手が決めた数字で同じ抽選を再生
    const fi=pool.indexOf(forced); if(fi<0){ switchTurn(); return; }
    pool.splice(fi,1); num=forced;
  }else{
    if(!pool.length){ switchTurn(); return; }
    let cands=pool;
    if(kingSafe){   // 王のマスは選ばれない(初期ルール)
      const safe=pool.filter(n2=>{ const rc=cellOfNum[n2]; const q=board[rc[0]][rc[1]]; return !(q&&q.t==="K"); });
      if(safe.length) cands=safe;
    }
    num=cands[Math.floor(Math.random()*cands.length)];
    pool.splice(pool.indexOf(num),1);
  }
  if(!fxOn){ openSquare(num); return; }   // 演出なし=動かした瞬間に穴が開く
  setTimeout(()=>boardEl.classList.add("rolling"),20);   // 抽選中は数字をしっかり見せる(★1フレーム遅らせる=直前のrenderで作り直したDOMだと初期値が濃い色になりtransitionが効かない)
  const flow=$("flow");
  const bc=localCenter();   // #gameScene基準の盤中心=スクロールしても座標は変わらない(ページに固定)
  const cx=bc.x, cy=bc.y, RB=bc.w/2;
  const outR=Math.max(window.innerWidth||0, window.innerHeight||0, document.documentElement.clientWidth||0, 900)*0.9+240;   // 画面の外(避ける距離・出現位置の基準)
  const TGT=100;   // 中央で止まる時の実寸(勝ち球はこの実寸で作って縮小表示=拡大ボケを防ぐ)
  const nums=[]; const cand=pool.slice();   // 回っている球はただの演出(当たりの数字は最後に差し替える)
  while(nums.length<(N===9?44:24) && cand.length){ nums.push(cand.splice(Math.floor(Math.random()*cand.length),1)[0]); }
  if(!nums.length) nums.push(num);
  const winIdx=Math.floor(Math.random()*nums.length);   // どの球が残るかも完全ランダム(重なり順も毎回変わる)
  const balls=[];
  nums.forEach((n,idx)=>{
    const isWin=idx===winIdx;
    const size=58;   // 球の大きさは全部そろえる(2026-08-01)
    const phys=isWin? TGT : size;   // 要素の実寸(勝ち球=100px→縮小表示で同じ見た目に)
    const el=document.createElement("span");
    el.className="fb"; el.textContent=n;
    el.style.width=phys+"px"; el.style.height=phys+"px"; el.style.fontSize=Math.round(phys*0.48)+"px";
    el.style.background=ballBg(n);
    flow.appendChild(el);
    balls.push({ n:n, el:el, size:size, half:phys/2, bs:size/phys, x:0, y:0,
      ang:Math.random()*6.283,
      av:(0.8+Math.random()*1.6),
      r0:(RB+34+Math.random()*70)*1.45,   // 出発点はビンゴカードの少し外側(フェードインで出す)
      rot:Math.random()*360, vr:(Math.random()<0.5?-1:1)*(140+Math.random()*420) });
    const b0=balls[balls.length-1];   // 出現フレームから画面外の出発点に置く
    b0.x=cx+b0.r0*Math.cos(b0.ang)-b0.half;
    b0.y=cy+b0.r0*Math.sin(b0.ang)-b0.half;
    el.style.transform="translate("+b0.x+"px,"+b0.y+"px) rotate("+b0.rot+"deg) scale("+b0.bs+")";
    setTimeout(()=>{ el.style.opacity=1; }, 20+Math.random()*260);   // ふわっと現れる(少しずつ)
  });
  const winner=balls[winIdx];
  flow.style.display="block";
  const CONV=4070;   // 中央に集まりきるまで(0.08秒だけ速く)   // 出てから中央に集まりきるまで(渦を巻きながらじわじわ寄る)
  const t0=performance.now();
  let prev=t0, st=1, stT=t0, vigCell=null;
  const rattleIv=setInterval(playRattle,110);
  const iv=setInterval(()=>{
    const t=performance.now(), dt=Math.min(0.05,(t-prev)/1000); prev=t;
    const cx2=cx, cy2=cy;   // 座標はページ固定(スクロールで動かない=盤と一緒に動く)
    balls.forEach(b=>{
      if(st>=3) return;   // ビネット以降はフェードのCSSに任せる
      let rad, sc=b.bs, rv=b.rot;
      if(st===1){          // 出た瞬間から、時間いっぱい使ってど真ん中へ寄っていく(円を描きながら)
        const k=Math.min(1,(t-stT)/CONV), e=0.2*k+0.8*(1-Math.pow(1-k,2.9));   // 終盤ほど寄る速さが落ちて、中央でそっと止まる
        b.ang+=b.av*dt;   // 回る速さは一定(加速させない)
        b.rot+=b.vr*dt*(1-e*0.7);
        rad=b.r0*(1-e);   // 中央までしっかり縮む(小さな渦で回り続ける案は撤回)
        sc = b.bs*(1-e*0.2);   // 当たりもこの間は他と同じ大きさのまま
        rv = (b===winner)? b.rot*(1-e) : b.rot;   // 当たりだけ、止まる頃には正立して読める向きに
      }
      else{                // 当たり以外が画面外へ避ける
        if(b===winner){ const k=Math.min(1,(t-stT)/330), e=k*k*(3-2*k); rad=0; rv=0; sc=b.bs*0.8+(1-b.bs*0.8)*e; }   // 残るのが確定した瞬間に大きくなり中心へ
        else{ const k=Math.min(1,(t-stT)/358), e=k*k; b.rot+=b.vr*dt; rv=b.rot; rad=e*outR; sc=b.bs*(1-e*0.2); }   // 弾け飛ぶ(確定〜穴あきは0.6倍速)
      }
      b.x=cx2+rad*Math.cos(b.ang)-b.half;
      b.y=cy2+rad*Math.sin(b.ang)-b.half;
      b.el.style.transform="translate("+b.x+"px,"+b.y+"px) rotate("+rv+"deg) scale("+sc+")";
    });
    if(vigCell){   // ビネットは画面全体の暗幕なのでビューポート座標。スクロールしても中心がマスに合うよう毎フレーム更新
      const cr=vigCell.getBoundingClientRect();
      $("vig").style.background="radial-gradient(circle at "+(cr.left+cr.width/2)+"px "+(cr.top+cr.height/2)+"px, rgba(20,8,45,0) "+(cr.width*1.1)+"px, rgba(20,8,45,.8) "+(cr.width*3.2)+"px)";
    }
    if(st===1 && t-stT>CONV*0.88){   // 完全な中央の少し手前でバッと発表
      st=2; stT=t; clearInterval(rattleIv);
      winner.el.textContent=num; winner.el.style.background=ballBg(num);   // 残る数字はここで確定(完全ランダム)
      playBallOut();
    }
    else if(st===2 && t-stT>500){
      st=3; stT=t;
      const cellPos=cellOfNum[num];
      const cellEl=boardEl.querySelector('.cell[data-r="'+cellPos[0]+'"][data-c="'+cellPos[1]+'"]');
      if(cellEl){
        cellEl.classList.add("target");
        vigCell=cellEl;
        $("vig").classList.add("on");
      }
      balls.forEach(b=>{ b.el.style.transition="opacity .22s"; b.el.style.opacity=0; });   // 当たりも含めてその場で消える(マスへ飛ぶ演出は2026-08-01に廃止)
      playTarget();
    }
    else if(st===3 && t-stT>700){
      clearInterval(iv);
      flow.innerHTML=""; flow.style.display="none";   // 球が消えるのと同時に穴が開く
      $("vig").classList.remove("on");
      boardEl.classList.remove("rolling");
      openSquare(num);
    }
  },16);
}
function openSquare(num){
  const cell=cellOfNum[num], r=cell[0], c=cell[1];
  const victim=board[r][c];
  if(victim&&victim.t==="K"){   // 王のマスが開いたら確定で負け(身代わりは2026-07-31廃止)。特別な演出つき
    kingDoom(num,r,c,victim);
    return;
  }
  holes[r][c]=true; board[r][c]=null;
  playOpen();
  render();
  const el=boardEl.querySelector('.cell[data-r="'+r+'"][data-c="'+c+'"]');
  if(el){ const pu=document.createElement("span"); pu.className="punch"; pu.textContent=num; el.appendChild(pu); setTimeout(()=>pu.remove(),600); }
  const bw=$("boardWrap"); bw.classList.remove("shake"); void bw.offsetWidth; bw.classList.add("shake");
  if(victim && el) fallThenDrop(el, victim, 1-victim.o);
  const bingo=checkBingo();
  setTimeout(bingo? doBingoSwap : switchTurn, victim?1400:(bingo?650:250));
}
/* 落下演出: 駒が縮小+右回転で穴に落ち(0.5秒)、完全に消えてから獲得エリアにチップが降ってくる */
function fallThenDrop(el, p, taker){
  const fk=document.createElement("span"); fk.className="fallpc"+(p.o!==bottomSide()?" dk":"");
  fk.textContent = p.pr? KJP[p.t] : (p.t==="K"&&p.o===1? "玉" : KJ[p.t]);
  el.appendChild(fk); setTimeout(()=>fk.remove(),600);
  playFall();
  setTimeout(()=>{
    hands[taker][p.t]=(hands[taker][p.t]|0)+1;
    dropChip={o:taker, t:p.t};
    renderCaps();
    setTimeout(playLand, 310);   // chipDrop(0.45秒)の着地=70%地点に合わせる
  }, 500);
}
/* ビンゴ成立判定(縦・横・ななめのどこか1列が全部穴) */
function checkBingo(){
  for(let r=0;r<N;r++){ let all=true; for(let c=0;c<N;c++){ if(!holes[r][c]){ all=false; break; } } if(all) return true; }
  for(let c=0;c<N;c++){ let all=true; for(let r=0;r<N;r++){ if(!holes[r][c]){ all=false; break; } } if(all) return true; }
  let d1=true,d2=true;
  for(let i=0;i<N;i++){ if(!holes[i][i]) d1=false; if(!holes[i][N-1-i]) d2=false; }
  return d1||d2;
}
/* ビンゴ成立: 大きなBINGO→カードを新品に交換(古いカードは左へ・新品は右から。駒は浮いて待つ) */
function doBingoSwap(){
  phase="anim"; updateBtns();
  const fx=document.createElement("div"); fx.id="bingoFx";
  fx.innerHTML='<i class="bfx-sq a"></i><i class="bfx-sq b"></i><b>B</b><b>I</b><b>N</b><b>G</b><b>O</b>';
  const bc=localCenter();   // ビンゴカードの上下左右中央(#gameScene基準=ページに固定)
  fx.style.left=bc.x+"px"; fx.style.top=bc.y+"px";
  $("gameScene").appendChild(fx); setTimeout(()=>fx.remove(),820);
  playWin();
  const wrap=$("boardWrap");
  setTimeout(()=>{
    wrap.classList.remove("shake");
    fx.classList.add("out");   // カードが動き出すのと同時にBINGOは縮小して消える
    wrap.style.transition="transform .22s ease-in"; wrap.style.transform="translateX(calc(-50vw - 51%))";   // 画面幅基準=PCの広い画面でも確実に画面外へ(駒はカードと一緒に動く=浮かせる演出は2026-07-31廃止)
  },500);
  setTimeout(()=>{
    holes=[...Array(N)].map(()=>Array(N).fill(false));   // 新品カード=穴なし・数字は全部復活
    pool=Object.keys(cellOfNum).map(n=>+n);
    render();
    wrap.style.transition="none"; wrap.style.transform="translateX(calc(50vw + 51%))";
    void wrap.offsetWidth;
    wrap.style.transition="transform .25s cubic-bezier(.2,.9,.3,1)"; wrap.style.transform="translateX(0)";
  },750);
  setTimeout(()=>{
    wrap.style.transition=""; wrap.style.transform="";
    switchTurn();
  },1100);
}
/* 王のマスが開いた=その時点で負け(2026-07-31)。長め+大きなリアクションの特別演出 */
function kingDoom(num,r,c,victim,fell){   // fell=true: 自分から穴へ動かして落ちた

  fx.style.left=bc.x+"px"; fx.style.top=bc.y+"px";

  setTimeout(()=>{

    if(el && !fell){ const pu=document.createElement("span"); pu.className="punch"; pu.textContent=num; el.appendChild(pu); setTimeout(()=>pu.remove(),600); }   // 自分から落ちた時は穴は既に開いている
    const bw2=$("boardWrap"); bw2.classList.remove("shake"); void bw2.offsetWidth; bw2.classList.add("shake");
    if(el){   // 王がゆっくり落ちる

function switchTurn(){
  if(phase==="over") return;
  turn=1-turn; phase="idle";
  if(!hasAnyMove(turn)){ gameOver(1-turn, nameOf(turn)+"は動ける駒がなくなった"); return; }
  render();
  if(mode==="cpu"&&turn===cpuSide()) setTimeout(cpuThink, 600);
  if(online&&queuedMove){ const q=queuedMove; queuedMove=null; applyNetMove(q); }   // 自分の演出中に届いていた相手の手
}
function gameOver(winner, reason){
  phase="over"; sel=null; legalCells=[]; updateBtns(); renderCaps(); renderGuide();
  $("rTitle").textContent=nameOf(winner)+"の勝ち";
  $("rReason").textContent=reason;
  playWin();
  setTimeout(()=>$("resultOv").classList.add("on"), 120);
}

/* ================= オンライン対局 ================= */
function sbClient(){ if(!sbc) sbc=window.supabase.createClient(SB_URL, SB_KEY); return sbc; }
function leaveChannel(){
  clearTimeout(joinWatch); clearTimeout(moveResendTimer); moveResendTimer=0;
  if(ch){ try{ sbClient().removeChannel(ch); }catch(e){} ch=null; }
  online=false; isHost=false; startSent=false;
}
function roomStatus(html){ $("roomArea").innerHTML=html; }
function presenceCount(){ try{ return Object.keys(ch.presenceState()).length; }catch(e){ return 0; } }
/* 一手を送り、ack(moveack)が届くまで送り直す(broadcastは配送保証がないため=碁石系列と同じ仕組み) */
function sendMove(payload){
  if(!ch) return;
  clearTimeout(moveResendTimer);
  const send=()=>{
    if(!online||!ch||payload.seq!==pendingSeq) return;
    ch.send({ type:"broadcast", event:"move", payload });
    moveResendTimer=setTimeout(send,1400);
  };
  send();
}
function sendMyMove(num){
  if(!online||!ch||!lastNetMove) return;
  if(lastNetMove.k==="m"&&lastMoveCell){ const lm=board[lastMoveCell[0]][lastMoveCell[1]]; lastNetMove.prom=!!(lm&&lm.pr); }
  mySeq++; pendingSeq=mySeq;
  sendMove({ seq:mySeq, mv:lastNetMove, num:num });
}
/* 相手の一手を自分の盤で再生(numも同送されるので抽選まで完全一致) */
function applyNetMove(payload){
  const m=payload.mv; if(!m) return;
  if(turn===mySide) turn=1-mySide;   // 手番ズレの自己修復(届いた手を信頼)
  if(m.k==="m"){
    const p=board[m.fr]&&board[m.fr][m.fc]; if(!p) return;
    hist.push(snapState());
    const cap=board[m.tr][m.tc];
    if(cap&&cap.t==="K"){
      board[m.tr][m.tc]=p; board[m.fr][m.fc]=null; lastMoveCell=[m.tr,m.tc]; sel=null; legalCells=[]; render();
      playCap(); gameOver(turn, nameOf(turn)+"が王を取った"); return;
    }
    if(cap){ hands[turn][cap.t]=(hands[turn][cap.t]|0)+1; playCap(); } else playPlace();
    board[m.tr][m.tc]=p; board[m.fr][m.fc]=null; lastMoveCell=[m.tr,m.tc]; slideFrom=[m.fr,m.fc];
    if(m.prom) p.pr=true;
    sel=null; legalCells=[]; render();
    if(holes[m.tr][m.tc]){ fellIntoHole(m.tr,m.tc,p,()=>netAfter(payload)); return; }   // 穴の上へ動かした=落ちて相手のものに
  }else{
    hist.push(snapState());
    hands[turn][m.t]=(hands[turn][m.t]|0)-1; if(hands[turn][m.t]<=0) delete hands[turn][m.t];
    board[m.r][m.c]={t:m.t,o:turn,pr:false}; lastMoveCell=[m.r,m.c]; dropPop=true;
    sel=null; legalCells=[]; playPlace(); render();
  }
  netAfter(payload);
}
function netAfter(payload){
  moveCount++;
  if(pureShogi){ phase="anim"; updateBtns(); setTimeout(switchTurn,300); return; }
  if(!payload.num){ switchTurn(); return; }
  bingoRoll(payload.num);
}
function openChannel(code, asHost){
  leaveChannel();
  isHost=asHost;
  ch=sbClient().channel("sgb_"+code, { config:{ presence:{ key:myId }, broadcast:{ self:false } } });
  ch.on("presence",{event:"sync"},()=>{
    if(isHost&&!startSent&&presenceCount()>=2){
      startSent=true;
      const hs=Math.random()<0.5?0:1;   // 先手後手はランダム
      ch.send({ type:"broadcast", event:"start", payload:{ hs:hs, n:sizeSel, pure:pureShogi?1:0, fx:fxOn?1:0, ks:kingSafe?1:0 } });
      startOnline(hs, sizeSel, pureShogi, fxOn, kingSafe);
    }
  });
  ch.on("presence",{event:"leave"},()=>{ if(!online||presenceCount()>=2) return; opponentLeft(); });
  ch.on("broadcast",{event:"bye"},()=>{ if(online) opponentLeft(); });
  ch.on("broadcast",{event:"start"},({payload})=>{
    if(isHost||!payload) return;
    startOnline(payload.hs===0?1:0, payload.n===9?9:5, !!payload.pure, payload.fx!==0, payload.ks!==0);
  });
  ch.on("broadcast",{event:"move"},({payload})=>{
    if(!payload) return;
    if(ch) ch.send({ type:"broadcast", event:"moveack", payload:{ seq:payload.seq } });   // 届いたことを必ず伝える
    if(!online||phase==="over") return;
    if(typeof payload.seq==="number"){ if(payload.seq<=lastRecvSeq) return; lastRecvSeq=payload.seq; }   // 再送の重複は無視
    if(phase!=="idle"){ queuedMove=payload; return; }   // 自分側の演出が終わってから適用
    applyNetMove(payload);
  });
  ch.on("broadcast",{event:"moveack"},({payload})=>{
    if(payload&&payload.seq===pendingSeq){ clearTimeout(moveResendTimer); moveResendTimer=0; }
  });
  ch.on("broadcast",{event:"resign"},()=>{
    if(!online||phase==="over") return;
    $("cfOv").classList.remove("on");
    gameOver(mySide, "あいてが降参した");
  });
  ch.on("broadcast",{event:"stamp"},({payload})=>{ if(payload) spawnStamp(payload.i|0, "あいて"); });
  ch.on("broadcast",{event:"check"},()=>{ if(online) showCheckFx(); });   // あいての王手宣言
  ch.on("broadcast",{event:"undoreq"},({payload})=>{   // あいてが一手戻したい
    if(!online||phase!=="idle"||!hist.length) return;
    peerUndoIdx = (payload&&typeof payload.i==="number")? payload.i : undoTargetIdx(1-mySide);
    $("undoOv").classList.add("on");
  });
  ch.on("broadcast",{event:"undoyes"},()=>{
    if(!online||!undoPending) return;
    undoPending=false; undoTo(undoIdx); undoIdx=-1;
    toast("「一手戻る」が受け入れられました");
  });
  ch.on("broadcast",{event:"undono"},()=>{
    if(!online||!undoPending) return;
    undoPending=false; undoIdx=-1; updateBtns();
    toast("「一手戻る」は断られました");
  });
  ch.on("broadcast",{event:"rematch"},()=>{
    peerRematch=true;
    if(myRematch){ if(isHost) hostRestart(); }
    else if($("resultOv").classList.contains("on")) $("rReason").textContent="あいてが「もう一回」を希望";
  });
  ch.on("broadcast",{event:"restart"},({payload})=>{
    if(isHost||!payload) return;
    startOnline(payload.hs===0?1:0, payload.n===9?9:5, !!payload.pure, payload.fx!==0, payload.ks!==0);
  });
  ch.subscribe(async(status)=>{
    if(status==="SUBSCRIBED"){ try{ await ch.track({}); }catch(e){} }
    else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){ roomStatus('<div class="room-note err">通信に失敗しました。電波を確認してもう一度</div>'); }
  });
}
function startOnline(side, n, pure, fx, ks){
  clearTimeout(joinWatch);
  online=true; mode="online"; mySide=side; sizeSel=n; pureShogi=pure; peerGone=false;
  if(typeof fx==="boolean"){ fxOn=fx; document.querySelectorAll(".fxRow .obtn").forEach(x=>x.classList.toggle("sel",(x.dataset.fx==="1")===fxOn)); }
  if(typeof ks==="boolean"){ kingSafe=ks; document.querySelectorAll(".ksRow .obtn").forEach(x=>x.classList.toggle("sel",(x.dataset.ks==="1")===kingSafe)); }
  $("pureBtn").classList.toggle("on", pureShogi);
  myRematch=false; peerRematch=false; queuedMove=null; lastNetMove=null;
  undoPending=false; undoIdx=-1; peerUndoIdx=-1; $("undoOv").classList.remove("on");
  mySeq=0; pendingSeq=-1; lastRecvSeq=-1;
  $("resultOv").classList.remove("on");
  toGame(); initGame();
  toast(mySide===0? "対局開始。あなたが先手" : "対局開始。あなたが後手");
}
function hostRestart(){   // 部屋主: 先手後手を引き直して再戦
  const hs=Math.random()<0.5?0:1;
  if(ch) ch.send({ type:"broadcast", event:"restart", payload:{ hs:hs, n:sizeSel, pure:pureShogi?1:0, fx:fxOn?1:0, ks:kingSafe?1:0 } });
  startOnline(hs, sizeSel, pureShogi, fxOn, kingSafe);
}
function opponentLeft(){
  online=false; leaveChannel(); peerGone=true;
  phase="over"; sel=null; legalCells=[]; updateBtns();
  $("rTitle").textContent="あいてが退出しました";
  $("rReason").textContent="タイトルから部屋を作りなおしてください";

}

/* ================= ロボット ================= */
const VAL={P:100,L:300,N:330,S:520,G:560,B:820,R:980,K:100000};
function pieceVal(p){ return VAL[p.t]+(p.pr?230:0); }
function allCands(o){
  const out=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const p=board[r][c]; if(!p||p.o!==o) continue;
    genMoves(r,c).forEach(m=>{
      if(holes[m[0]][m[1]]) return;   // ロボットは穴の上へは動かさない(自滅になる)
      let prom=false;
      if(mustProm(p,m[0])) prom=true;
      else if(canProm(p,r,m[0])) prom=true;
      out.push({k:"m",fr:r,fc:c,tr:m[0],tc:m[1],prom:prom});
    });
  }
  HAND_ORDER.forEach(t=>{ if((hands[o][t]|0)>0) genDrops(t,o).forEach(d=>out.push({k:"d",t:t,r:d[0],c:d[1]})); });
  return out;
}
function bestCaptureVal(o){
  let best=0;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const p=board[r][c]; if(!p||p.o!==o) continue;
    const ms=genMoves(r,c);
    for(let i=0;i<ms.length;i++){ const q=board[ms[i][0]][ms[i][1]]; if(q&&q.o!==o){ const v=pieceVal(q); if(v>best) best=v; } }
  }
  return best;
}
function cpuThink(){
  const me=cpuSide();
  if(phase!=="idle"||turn!==me||mode!=="cpu") return;
  const cands=allCands(me);
  if(!cands.length){ gameOver(humanSide, "ロボットは動ける駒がなくなった"); return; }
  let best=null, bestScore=-1e9;
  const fwd = me===1? 1 : -1;
  for(const cand of cands){
    let gain=0, undo=null;
    if(cand.k==="m"){
      const p=board[cand.fr][cand.fc], cap=board[cand.tr][cand.tc];
      if(cap) gain+=pieceVal(cap);
      if(cap&&cap.t==="K"){ best=cand; bestScore=1e9; break; }
      if(cand.prom&&!p.pr) gain+=180;
      undo={k:"m",p:p,cap:cap,prevPr:p.pr};
      board[cand.tr][cand.tc]=p; board[cand.fr][cand.fc]=null; if(cand.prom) p.pr=true;
    }else{
      gain+=15;
      undo={k:"d"};
      board[cand.r][cand.c]={t:cand.t,o:me,pr:false};
    }
    let score=gain;
    if(cpuLv>=1){ score -= bestCaptureVal(1-me)*0.92; }
    if(cpuLv>=2 && cand.k==="m"){ score += (cand.tr-cand.fr)*fwd*6 + (((N-1)/2)-Math.abs((N-1)/2-cand.tc))*2; }
    score += (Math.random()-0.5)*(cpuLv===0? 400 : cpuLv===1? 60 : 10);
    if(undo.k==="m"){ undo.p.pr=undo.prevPr; board[cand.fr][cand.fc]=undo.p; board[cand.tr][cand.tc]=undo.cap; }
    else{ board[cand.r][cand.c]=null; }
    if(score>bestScore){ bestScore=score; best=cand; }
  }
  if(cpuLv===0 && Math.random()<0.3) best=cands[Math.floor(Math.random()*cands.length)];
  if(best.k==="m") doMove(best.fr,best.fc,best.tr,best.tc,true);
  else doDrop(best.t,best.r,best.c);
}

/* ================= 一手戻る・降参 ================= */
$("undoBtn").addEventListener("click",()=>{
  ensureAudio(); playSelect();
  if(phase!=="idle"||!hist.length||undoPending) return;
  if(online){   // オンラインはあいての同意をもらってから双方で戻す
    const i=undoTargetIdx(mySide);
    if(i<0){ toast("まだ戻せる手がありません"); return; }
    undoIdx=i; undoPending=true; updateBtns();
    if(ch){ try{ ch.send({ type:"broadcast", event:"undoreq", payload:{ i:i } }); }catch(e){} }
    toast("あいてに「一手戻したい」と伝えました");
    return;
  }
  if(inputLocked()) return;
  doUndo();   // 1台・ロボットは確認ダイアログなしで即戻す
});
$("undoYes").addEventListener("click",()=>{
  ensureAudio(); playSelect(); $("undoOv").classList.remove("on");
  if(ch){ try{ ch.send({ type:"broadcast", event:"undoyes", payload:{} }); }catch(e){} }
  undoTo(peerUndoIdx); peerUndoIdx=-1;
  toast("一手戻しました");
});
$("undoNo").addEventListener("click",()=>{
  ensureAudio(); playSelect(); $("undoOv").classList.remove("on");
  if(ch){ try{ ch.send({ type:"broadcast", event:"undono", payload:{} }); }catch(e){} }
  peerUndoIdx=-1;
});

$("cfYes").addEventListener("click",()=>{

$("makeRoomBtn").addEventListener("click",()=>{
  ensureAudio(); playSelect();
  const code=genCode();
  roomStatus('<div class="room-note">合言葉</div>'
    +'<div class="room-code" id="codeShow" style="cursor:pointer">'
    +'<svg class="copy-ic" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="4" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>'
    +code+'</div>'
    +'<div class="room-note" id="hostNote">友だちに伝えて待とう</div>');
  $("codeShow").addEventListener("click", async ()=>{
    ensureAudio(); playSelect();
    let okc=true;
    try{ await navigator.clipboard.writeText(code); }
    catch(e){ try{ const ta=document.createElement("textarea"); ta.value=code; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }catch(_){ okc=false; } }
    const nEl=$("hostNote");
    if(nEl){ nEl.textContent=okc? "コピーした。友だちに送ろう" : "コピーできなかった。手入力でお願いします";
      setTimeout(()=>{ if(nEl.isConnected&&!online) nEl.textContent="友だちに伝えて待とう"; },2200); }
  });
  openChannel(code, true);
});
$("joinRoomBtn").addEventListener("click",()=>{
  ensureAudio(); playSelect();
  roomStatus('<div class="code-row">'
    +'<button class="paste-btn" id="pasteBtn" aria-label="合言葉を貼り付け"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5V3.4c0-.8.6-1.4 1.4-1.4h3.2c.8 0 1.4.6 1.4 1.4v1.1"/><path d="M9 10.5h6M9 14.5h6"/></svg></button>'
    +'<input class="code-input" id="codeInput" maxlength="5" autocomplete="off" spellcheck="false" placeholder="合言葉">'
    +'</div>'
    +'<button class="obtn" id="codeGo">入室</button>'
    +'<div class="room-note" id="joinNote"></div>');
  const inp=$("codeInput"), note=$("joinNote");
  $("pasteBtn").addEventListener("click", async ()=>{
    ensureAudio(); playSelect();
    try{
      const t=await navigator.clipboard.readText();
      const code=(t||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,5);
      if(code){ inp.value=code; note.textContent="貼り付けた"; note.className="room-note"; }
      else{ note.textContent="コピーした合言葉が見つからない"; note.className="room-note err"; }
    }catch(e){ note.textContent="貼り付けできない端末です。手入力でお願いします"; note.className="room-note err"; }
  });
  $("codeGo").addEventListener("click",()=>{
    const code=(inp.value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
    if(code.length!==5){ note.textContent="合言葉は5文字です"; note.className="room-note err"; return; }
    note.textContent="部屋を探しています…"; note.className="room-note";
    openChannel(code, false);
    joinWatch=setTimeout(()=>{
      if(!online){ note.textContent="部屋が見つからない。合言葉を確認してもう一度"; note.className="room-note err"; leaveChannel(); }
    },4000);
  });
  inp.focus();
});

/* ================= スタンプ(気持ちを送る。全対戦ゲーム共通の仕組み) ================= */
const STAMP_SVGS=['😭','😍','🤣'];   // このスタンプだけは牧村さんの明示指示で絵文字を採用
function playStamp(i){   // スタンプ別の音(0泣く / 1うっとり / 2爆笑)
  if(!actx) return; const t=actx.currentTime;
  if(i===0){ note(523,t,0.2,0.3,"sine"); note(392,t+0.15,0.22,0.3,"sine"); note(300,t+0.32,0.36,0.26,"sine"); }
  else if(i===1){ note(523,t,0.34,0.22,"sine"); note(784,t+0.11,0.38,0.24,"sine"); note(1047,t+0.24,0.62,0.2,"sine"); note(1568,t+0.34,0.55,0.1,"triangle"); note(2349,t+0.46,0.5,0.06,"sine"); }
  else{ const sq=[900,680,850,640,800,600,760,560]; sq.forEach((f,k)=>note(f, t+k*0.072, 0.07, 0.26, "triangle")); note(400, t+sq.length*0.072, 0.16, 0.24, "triangle"); }
}
let stampMuted=false; try{ stampMuted=localStorage.getItem("sgb.smute")==="1"; }catch(e){}
function spawnStamp(i, who){
  if(stampMuted) return;   // ミュート中は表示も音も止める(送信はsendStamp側なので相手には届く)
  i=Math.max(0, Math.min(2, i|0));
  const el=document.createElement("div"); el.className="stamp-fly";
  const hx=0.06+Math.random()*0.88;
  el.style.left="calc("+(hx*100).toFixed(1)+"% - 48px)";
  const central=1-Math.abs(hx-0.5)*2;
  el.style.setProperty("--rise", "-"+(24+(1-central)*16).toFixed(0)+"vh");
  el.style.setProperty("--dx", (Math.random()*24-12).toFixed(0)+"px");
  el.innerHTML='<span class="s-emoji">'+STAMP_SVGS[i]+'</span><span class="s-name">'+(who||"自分")+'</span>';
  if(seOn) playStamp(i);
  const overlayOpen=["resultOv","cfOv","promOv","helpOv"].some(id=>$(id).classList.contains("on"));
  if(overlayOpen) el.classList.add("over-dialog");
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2350);
}
function sendStamp(i){
  spawnStamp(i, "自分");
  if(online&&ch){ try{ ch.send({ type:"broadcast", event:"stamp", payload:{ i:i } }); }catch(e){} }   // ロストしても実害なし
}
(function(){
  const mb=$("stampMute");
  const rndr=()=>mb.classList.toggle("muted", stampMuted); rndr();
  mb.addEventListener("click",()=>{ stampMuted=!stampMuted; try{ localStorage.setItem("sgb.smute", stampMuted?"1":"0"); }catch(e){} rndr(); });
})();
document.querySelectorAll("#stampBar .stamp-btn").forEach(b=>{
  const i=+b.dataset.i; b.innerHTML=STAMP_SVGS[i];
  b.addEventListener("click",()=>{ ensureAudio(); sendStamp(i); });
});
