  .pill{ display:inline-flex; align-items:center; gap:8px; text-decoration:none; border-radius:999px; font-size:13px; font-weight:700; letter-spacing:.06em; white-space:nowrap; cursor:pointer; }

  @media(hover:hover){ .hero:hover .pill.solid{ transform:translateX(2px); } }
  /* これまでのつぶやき */

  .row .idx{ flex:none; width:34px; font-size:11px; letter-spacing:.12em; color:var(--sub); font-variant-numeric:tabular-nums; }
  .row .tt{ flex:1; min-width:0; font-size:15.5px; font-weight:700; line-height:1.55; }
  .row .by{ flex:none; font-size:12px; color:var(--sub); }
  .row .arw{ flex:none; display:flex; color:var(--ink); }
  .row .arw svg{ width:13px; height:13px; }
  @media(hover:hover){ .row:hover .arw{ transform:translateX(3px); } .row .arw{ transition:transform .15s; } }
  .empty{ padding:26px 0; font-size:13px; color:var(--sub); border-bottom:1px solid var(--line); }
  .foot{ margin-top:60px; text-align:center; }
  .foot a{ display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.26em; color:var(--ink); text-decoration:none; border-bottom:1px solid var(--ink); padding-bottom:4px; }
