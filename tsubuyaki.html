<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>牧村たちのつぶやき</title>
<meta name="apple-mobile-web-app-title" content="牧村たちのつぶやき">
<meta name="description" content="読んでください">
<meta property="og:title" content="牧村たちのつぶやき">
<meta property="og:description" content="読んでください">
<meta name="theme-color" content="#ff3616">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
  /* 生き物図鑑と同じ骨格(ヘッダー帯+クリーム地+紙のカード+金バー見出し+固定フッター)。色だけ本作の紺。緑にしたければ --pri/--pri-d/--pri-l の3つを図鑑の値に */
  :root{
    --pri:#ff3616; --pri-d:#d92a10; --pri-l:#ffece7; --pri-hi:#ff5a3e;
    --brown:#8a5a2b; --cream:#f6efe0; --paper:#fffdf7; --ink:#33291f; --gold:#d8a53a;
  }
  *{ box-sizing:border-box; font-family:"Noto Sans JP","Hiragino Sans",sans-serif; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; min-height:100%; }
  body{ background:var(--cream); color:var(--ink); line-height:1.7; }
  .wrap{ max-width:680px; margin:0 auto; padding:26px 14px 96px; }

  header.site{ background:linear-gradient(160deg,var(--pri-hi),var(--pri) 60%,var(--pri-d)); color:#fff; padding:26px 16px 28px; position:relative; overflow:hidden; }
  header .in{ width:100%; max-width:680px; margin:0 auto; position:relative; z-index:1; text-align:center; }
  header h1.logo{ margin:0 0 8px; display:flex; align-items:center; justify-content:center; gap:11px; }
  .logo-mark{ flex:none; width:92px; height:78px; display:flex; align-items:center; justify-content:center; }
  .logo-mark svg{ width:92px; height:78px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.22)); transform:translateY(2px); }
  .logo-txt{ display:flex; flex-direction:column; align-items:flex-start; text-align:left; line-height:1; }
  .logo-txt .k{ font-size:12px; font-weight:900; letter-spacing:.22em; color:rgba(255,255,255,.82); margin-bottom:4px; margin-left:2px; }
  .logo-txt .m{ font-size:clamp(27px,7.4vw,36px); font-weight:900; letter-spacing:.02em; color:#fff; text-shadow:0 2px 4px rgba(120,25,8,.3); }
  .logo-txt .m b{ color:#ffe08a; }
  header p{ margin:0; font-size:12px; font-weight:500; opacity:.92; }

  .section-label{ font-size:12px; font-weight:900; letter-spacing:.12em; color:var(--pri-d); margin:22px 4px 10px; display:flex; align-items:center; gap:8px; }
  .section-label::before{ content:""; width:6px; height:16px; border-radius:3px; background:var(--gold); }

  /* 最新のつぶやき */
  .hero{ position:relative; display:block; text-decoration:none; color:inherit; background:var(--paper); border:2px solid var(--pri); border-radius:18px; padding:20px 18px;
    box-shadow:0 8px 22px rgba(255,54,22,.14); transition:transform .15s; }
  .hero:active{ transform:scale(.99); }
  .hero .cdate{ position:absolute; top:15px; right:18px; font-size:12px; font-weight:800; color:rgba(138,90,43,.55); }
  .hero .nm{ font-size:clamp(20px,5.6vw,27px); font-weight:900; color:var(--pri-d); margin:4px 0 6px; letter-spacing:.01em; line-height:1.45; padding-right:84px; }
  .hero .by{ font-size:12.5px; font-weight:800; color:var(--brown); margin:0 0 8px 2px; }
  .hero .note{ font-size:13.5px; font-weight:600; color:rgba(51,41,31,.75); margin:0 0 0 2px; line-height:1.85; }
  .hero-foot{ display:flex; align-items:center; justify-content:flex-end; gap:10px; margin-top:14px; }
  .read-btn{ flex:none; font-size:14px; font-weight:900; letter-spacing:.06em; color:#fff;
    background:linear-gradient(150deg,var(--pri-hi),var(--pri) 60%,var(--pri-d)); border-radius:999px; padding:9px 22px 10px;
    box-shadow:0 3px 8px rgba(255,54,22,.35); white-space:nowrap; }

  /* これまでのつぶやき */
  .clist{ display:flex; flex-direction:column; gap:9px; }
  .crow{ display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; background:var(--paper); border:1.5px solid rgba(138,90,43,.22); border-radius:13px; padding:12px 15px; transition:transform .12s; }
  .crow:active{ transform:scale(.99); }
  .crow .cmain{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .crow .cn{ font-size:15.5px; font-weight:900; color:var(--pri-d); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .crow .cday{ font-size:11px; font-weight:700; color:rgba(138,90,43,.6); }
  .crow .arw{ color:rgba(138,90,43,.5); flex:none; display:flex; align-items:center; }
  .crow .arw svg{ width:11px; height:11px; }
  .empty{ background:var(--paper); border:2px dashed rgba(138,90,43,.35); border-radius:16px; padding:24px 18px; text-align:center;
    color:rgba(51,41,31,.6); font-weight:700; font-size:13.5px; line-height:1.8; }

  .home-foot{ position:fixed; left:0; right:0; bottom:0; z-index:40; display:block; text-align:center;
    padding:34px 0 16px; font-size:13px; font-weight:800; letter-spacing:.2em; text-decoration:none;
    color:rgba(255,255,255,.95); text-shadow:0 1px 2px rgba(10,30,50,.45);
    background:linear-gradient(to top, rgba(217,42,16,.34), rgba(217,42,16,.16) 50%, rgba(217,42,16,0)); }
  .home-foot:active{ opacity:.6; }
</style>

<body>
  <header class="site">
    <div class="in">
      <h1 class="logo">
        <span class="logo-mark"><svg viewBox="0 0 92 78" xmlns="http://www.w3.org/2000/svg">
          <!-- 吹き出し2つ=牧村と友達。中は文章に見立てた罫線 -->
          <path d="M20 56 L14 70 L34 56 Z" fill="#fffdf7"/>
          <rect x="6" y="8" width="56" height="48" rx="12" fill="#fffdf7"/>
          <g stroke="rgba(255,54,22,.45)" stroke-width="4.2" stroke-linecap="round"><path d="M17 23 H51"/><path d="M17 33 H45"/><path d="M17 43 H37"/></g>
          <path d="M72 62 L78 74 L60 62 Z" fill="#ffe08a"/>
          <rect x="44" y="30" width="42" height="32" rx="10" fill="#ffe08a"/>
          <g stroke="rgba(120,80,20,.5)" stroke-width="3.6" stroke-linecap="round"><path d="M53 42 H77"/><path d="M53 51 H69"/></g>
        </svg></span>
        <span class="logo-txt"><span class="k">牧村たちの</span><span class="m">つぶやき</span></span>
      </h1>
      <p>読んでください</p>
    </div>
  </header>

  <div class="wrap">
    <div class="section-label">最新のつぶやき</div>
    <a class="hero" href="./column-01.html">
      <span class="cdate">2026/09/03</span>
      <div class="nm">「本当にただの点に」― ノミのみができるまで</div>
      <div class="by">書いた人：牧村</div>
      <div class="note">最初に作ったノミには、脚が生えていました。トゲも影もモヤもあった。それを全部削って、最後に残ったのが「ただの黒い点」でした。なぜ削ったのか、にじみの原因が何だったのか、そして虹ノミの確率をどう決めたのか。</div>
      <div class="hero-foot"><span class="read-btn">読む</span></div>
    </a>

    <div class="section-label">これから増えていきます</div>
    <div class="clist">
      <div class="empty">2本目からここに並びます<br>思いついたときに書き足していきます</div>
    </div>
  </div>

  <a class="home-foot" href="./index.html">牧村が作ったゲーム集へ</a>

</html>
