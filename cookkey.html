<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
  :root{
    --bg:#12403c;
    --card:#fdf6e7;
    --ink:#22241f;
    --gold:#e8b647;
    --gold-d:#b8871f;
    --red:#e3452f;
    --uiw:min(94vw,520px);
  }
  /* フォントは源ノ角ゴシックに統一(全要素へ強制=取りこぼし防止) */
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;
     font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif; }
  body{
    min-height:100svh; background:var(--bg); color:var(--card);
    display:flex; flex-direction:column; align-items:center;
    user-select:none; -webkit-user-select:none; overflow-x:hidden;
  }
  input{ user-select:text; -webkit-user-select:text; }
  body::before{
    content:""; position:fixed; inset:-40% -60%; z-index:-2; opacity:.5;
    background:repeating-linear-gradient(24deg, rgba(255,255,255,.028) 0 26px, transparent 26px 74px);
    animation:flow 26s linear infinite;
  }
  @keyframes flow{ to{ transform:translate(74px, 166px); } }

  .scene{ display:none; width:100%; flex-direction:column; align-items:center; padding:14px 0 40px; }
  .scene.on{ display:flex; animation:sceneIn .34s cubic-bezier(.2,.8,.3,1); }
  @keyframes sceneIn{ 0%{ opacity:0; transform:translateY(18px); } 100%{ opacity:1; transform:none; } }
  #gameScene, #lobbyScene{ padding-top:54px; }   /* 左上の「あそびかた」右上の「効果音」と重ならないように */

  /* ===== タイトル ===== */
  .logo{ margin:5vh 0 2px; display:flex; align-items:baseline; justify-content:center; gap:2px; }
  .logo .ku{ font-size:clamp(46px,13vw,74px); font-weight:900; letter-spacing:.02em; color:var(--card);
    text-shadow:0 5px 0 rgba(0,0,0,.28); }
  /* 「Key」はクッキーの見た目。柄はゲーム中のクッキーとまったく同じものをJSで敷いている */
  .logo .key{ font-size:clamp(54px,15.5vw,88px); font-weight:900; letter-spacing:.01em; color:transparent;
    -webkit-background-clip:text; background-clip:text; image-rendering:pixelated;
    filter:drop-shadow(0 5px 0 rgba(0,0,0,.3)); }
  /* 長方形のクッキーが残っていて、そこから「Key」の形にくり抜かれた見た目
     = 生地色の長方形を敷き、その上に文字型で背景色をくり抜く(mix-blend-mode) */
  .logo-sub{ display:block; width:var(--uiw); text-align:center; margin-bottom:18px; }

  .sec-label{ font-size:12px; font-weight:900; letter-spacing:.22em; opacity:.55; margin-bottom:9px; }
  .rule-frame{
    width:var(--uiw); background:rgba(0,0,0,.16); border:1.5px solid rgba(253,246,231,.18);
    border-radius:16px; padding:15px 14px; display:flex; flex-wrap:wrap; gap:14px; justify-content:center;
  }
  .rule-col{ display:flex; flex-direction:column; align-items:center; gap:7px; min-width:170px; }
  .rc-name{ font-size:12px; font-weight:800; letter-spacing:.1em; opacity:.7; }
  .rc-row{ display:flex; align-items:center; gap:10px; }
  .rule-frame.v{ flex-direction:column; align-items:center; gap:14px; }          /* 上段=協力/対戦・下段=数値 */
  .rule-frame.v .mode-row{ gap:12px; }
  .rule-frame.v .rule-cols{ display:flex; flex-wrap:wrap; gap:14px 22px; justify-content:center; width:100%; }
  .rc-val{ min-width:92px; text-align:center; font-size:19px; font-weight:900; color:var(--gold); }
  .mode-opt{ padding:7px 16px; border:1.5px solid rgba(253,246,231,.35); border-radius:999px; background:transparent; color:var(--card); font-size:14px; font-weight:900; cursor:pointer; }
  .mode-opt.sel{ background:var(--gold); border-color:var(--gold); color:#3a2a06; }
  .stp{
    width:36px; height:36px; border:none; border-radius:10px; cursor:pointer;
    background:rgba(253,246,231,.14); color:var(--card); font-size:19px; font-weight:900; line-height:1;
  }
  .stp:active{ transform:translateY(2px); }
  .stp:disabled{ opacity:.3; cursor:default; }

  .btn-main{
    width:var(--uiw); max-width:340px; margin-top:16px; padding:14px; border:none; border-radius:16px; cursor:pointer;
    background:linear-gradient(165deg,#f4c85f,var(--gold) 55%,var(--gold-d));
    color:#3a2a06; font-size:19px; font-weight:900; letter-spacing:.14em; box-shadow:0 5px 0 #8d6712;
  }
  .btn-main:active{ transform:translateY(3px); box-shadow:0 2px 0 #8d6712; }
  .btn-sub{
    margin-top:10px; padding:9px 22px; border:1.5px solid rgba(253,246,231,.35); border-radius:999px;
    background:transparent; color:var(--card); font-size:13.5px; font-weight:800; letter-spacing:.08em; cursor:pointer;
  }
  .btn-sub:active{ transform:translateY(1px); }
  .room-row{ display:flex; gap:10px; margin-top:16px; }
  .room-row button{
    padding:13px 20px; border:none; border-radius:14px; cursor:pointer; min-width:150px;
    background:rgba(253,246,231,.12); color:var(--card); font-size:16px; font-weight:900; letter-spacing:.06em;
  }
  .room-row button small{ display:block; margin-top:4px; font-size:11px; font-weight:700; opacity:.72; letter-spacing:.02em; }
  .room-row button:active{ transform:translateY(2px); }
  /* モード選択(ひとり/オンライン)は横幅を均等に、部屋を作る/入るより大きく */
  #modeRow{ width:var(--uiw); max-width:420px; }
  #modeRow button{ flex:1 1 0; min-width:0; padding:18px 10px; font-size:18px; border-radius:16px; }
  #modeRow button small{ font-size:12px; margin-top:6px; }
  #onlineRow{ justify-content:center; }
  #soloSetup{ display:none; flex-direction:column; align-items:center; width:var(--uiw); }   /* はじめるを左右中央に */
  #soloSetup.on{ display:flex; }

  /* ===== ゲーム ===== */
  /* 左・中央・右を3等分にして、中央のものが画面のど真ん中に来るようにする */
  .top-bar{ width:var(--uiw); display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; margin-bottom:8px; }
  .top-bar>:first-child{ justify-self:start; }
  .top-bar>:last-child{ justify-self:end; }
  .top-bar.one{ grid-template-columns:1fr; }
  .top-bar.one>*{ justify-self:center; }
  .pill{ font-size:12.5px; font-weight:900; letter-spacing:.08em; background:rgba(0,0,0,.22);
    border:1.5px solid rgba(253,246,231,.2); border-radius:999px; padding:6px 13px; white-space:nowrap; }
  .role{ font-size:14px; font-weight:900; letter-spacing:.08em; color:var(--gold); white-space:nowrap; }
  .timer{ font-size:30px; font-weight:900; letter-spacing:.04em; }
  .timer.moving{ position:relative; z-index:7; transition:transform .42s cubic-bezier(.2,.8,.3,1);
    text-shadow:0 3px 0 rgba(0,0,0,.34); }   /* クッキーの上でも読めるように */
  /* ±N秒は「タイマーの上」に出す(右上からは動かさない) */
  #addFloat{ position:absolute; left:0; right:0; top:calc(50% - 58px); text-align:center; display:none;
    font-size:25px; font-weight:900; letter-spacing:.04em; z-index:7; pointer-events:none;
    text-shadow:none; }
  #addFloat.on{ display:block; animation:addIn .3s ease-out; }
  #addFloat.plus{ color:#1aa83f; }
  #addFloat.minus{ color:#d92a10; }
  @keyframes addIn{ 0%{ opacity:0; transform:translateY(8px); } 100%{ opacity:1; transform:none; } }
  .timer.warn{ color:#ffd9d2; }
  /* のこり30秒の赤は「一番後ろのレイヤー」= クッキーやUIより後ろ(z-index:-1) */
  #dangerVeil{ position:fixed; inset:0; z-index:-1; background:#ff2410; opacity:0; pointer-events:none; }
  body.danger #dangerVeil{ animation:dangerPulse 1.7s ease-in-out infinite; }
  /* のこり5秒の大きなカウント=画面の左右・最下層(クッキーやUIの後ろ)。とても大きく、残り時間の少なさを見た目で伝える */
  #bigCount{ position:fixed; inset:0; z-index:-1; display:none; justify-content:space-between; align-items:center; padding:0 calc(9vw - 20px); pointer-events:none; }
  #bigCount.on{ display:flex; }
  #bigCount .bc{ font-size:min(46vh,44vw); font-weight:900; line-height:1; color:#ff5a3c; opacity:.22; letter-spacing:-.04em; }
  @keyframes dangerPulse{ 0%,100%{ opacity:.10; } 50%{ opacity:.30; } }
  #warn15{ position:fixed; left:0; right:0; top:0; height:100svh; z-index:72; display:none; align-items:center; justify-content:center; pointer-events:none; }
  #warn15.on{ display:flex; animation:w15 1.6s ease-out forwards; }   /* forwards=終わった形のまま(消える瞬間の一瞬の再表示を防ぐ) */
  #warn15 span{ font-size:clamp(34px,10vw,58px); font-weight:900; letter-spacing:.1em; color:#fff;
    text-shadow:0 4px 0 rgba(0,0,0,.4); }
  @keyframes w15{ 0%{opacity:0; transform:scale(1.3);} 15%{opacity:1; transform:scale(1);} 75%{opacity:1;} 100%{opacity:0;} }
  #endFx{ position:fixed; left:0; right:0; top:0; height:100svh; z-index:73; display:none; align-items:center; justify-content:center; pointer-events:none; }
  #endFx.on{ display:flex; animation:w15 1.5s ease-out forwards; }
  #endFx span{ font-size:clamp(32px,9.4vw,54px); font-weight:900; letter-spacing:.14em; color:var(--gold);
    text-shadow:0 4px 0 rgba(0,0,0,.42); }

  .plate{ position:relative; }   /* クッキーの周りの囲みはなし */
  #cookie{ display:block; touch-action:none; cursor:crosshair; image-rendering:pixelated; }
  #penGhost{ position:absolute; display:none; pointer-events:none; border:2px dashed rgba(253,246,231,.9);
    background:rgba(253,246,231,.12); border-radius:2px; }

  .pen-row{ width:var(--uiw); margin-top:35px; display:flex; flex-direction:column; align-items:center; gap:9px; }
  .pen-sizes{ display:flex; gap:8px; align-items:flex-end; }
  .score-btn{ top:54px; }   /* 効果音ボタンの下 */
  .sc-row{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; background:rgba(34,36,31,.06); margin-top:6px; font-weight:800; text-align:left; }
  .sc-sw{ width:14px; height:14px; border-radius:4px; flex:none; }
  .sc-nm{ flex:1; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sc-pt{ font-size:15px; font-weight:900; min-width:56px; text-align:right; }
  .sc-kick{ padding:4px 10px; border-radius:999px; border:1.5px solid rgba(215,71,63,.6); background:#fff; color:#d7473f; font-size:12px; font-weight:900; cursor:pointer; }
  .done-list{ font-size:12.5px; font-weight:700; opacity:.75; text-align:center; min-height:16px; letter-spacing:.03em; }
  .size-btn{
    width:56px; height:56px; border:2px solid rgba(253,246,231,.28); border-radius:13px; cursor:pointer;
    background:rgba(253,246,231,.08); display:flex; align-items:center; justify-content:center;
  }
  .size-btn.sel{ border-color:var(--gold); background:rgba(232,182,71,.18); }
  .size-btn i{ display:block; background:var(--card); border-radius:2px; }

  .note{ font-size:12px; font-weight:700; letter-spacing:.04em; opacity:.6; text-align:center; margin-top:6px; line-height:1.7; }

  /* ===== 判定 ===== */
  .judge-wrap{ width:var(--uiw); margin-top:10px; display:none; flex-direction:column; align-items:center; gap:8px; }
  .judge-wrap.on{ display:flex; }
  .judge-big{ font-size:25px; font-weight:900; letter-spacing:.06em; min-height:32px; }
  .judge-big.ok{ color:var(--gold); }
  .judge-big.ng{ color:#ff8f7d; }
  .pen-list{ width:var(--uiw); display:flex; flex-direction:column; gap:6px; }
  .pen-item{ display:flex; align-items:center; gap:10px; padding:8px 13px; border-radius:11px;
    background:rgba(253,246,231,.1); font-size:14px; font-weight:800; }
  .pen-item .nm{ flex:1; text-align:left; }
  .pen-item .pt{ font-weight:900; }
  .pen-item.bad{ background:rgba(227,69,47,.22); }
  .pen-item.bad .pt{ color:#ff8f7d; }
  .pen-item.good .pt{ color:var(--gold); }

  .toast{
    position:fixed; left:50%; bottom:38px; transform:translateX(-50%); z-index:90;
    background:rgba(12,47,44,.95); border:1.5px solid rgba(253,246,231,.3); color:var(--card);
    padding:11px 20px; border-radius:999px; font-size:14px; font-weight:800; letter-spacing:.05em;
    opacity:0; pointer-events:none; transition:opacity .2s; white-space:nowrap; max-width:92vw;
  }
  .toast.on{ opacity:1; }

  #boom{ position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center;
    background:rgba(227,69,47,.3); pointer-events:none; }
  #boom.on{ display:flex; animation:boomFlash .5s ease-out; }
  #boom span{ font-size:clamp(34px,10vw,58px); font-weight:900; letter-spacing:.1em; color:#fff;
    text-shadow:0 4px 0 rgba(0,0,0,.4); }
  @keyframes boomFlash{ 0%{opacity:1;} 70%{opacity:1;} 100%{opacity:0;} }
  .shake{ animation:shk .38s; }
  @keyframes shk{ 0%,100%{transform:translate(0,0);} 20%{transform:translate(-7px,3px);} 45%{transform:translate(6px,-4px);} 70%{transform:translate(-4px,2px);} }

  .help-btn{
    position:fixed; left:12px; top:12px; z-index:40; display:flex; align-items:center; gap:6px;
    padding:7px 14px 7px 8px; border:none; border-radius:999px; cursor:pointer;
    background:rgba(253,246,231,.12); color:var(--card); font-size:13px; font-weight:900; letter-spacing:.06em;
  }
  .help-btn span{ width:20px; height:20px; border-radius:50%; background:var(--gold); color:#3a2a06;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900; }
  .snd-btn{
    position:fixed; right:12px; top:12px; z-index:40; display:flex; align-items:center; gap:6px;
    padding:7px 14px; border:none; border-radius:999px; cursor:pointer;
    background:rgba(253,246,231,.12); color:var(--card); font-size:13px; font-weight:900; letter-spacing:.06em;
  }
  .snd-btn svg{ width:17px; height:17px; }
  .snd-btn .wave{ display:block; }
  .snd-btn .slash{ display:none; }
  .snd-btn.off .wave{ display:none; }
  .snd-btn.off .slash{ display:block; }

  .overlay{
    position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center; padding:18px;
    background:rgba(6,26,24,.7); opacity:0; pointer-events:none; transition:opacity .24s;
  }
  .overlay.on{ opacity:1; pointer-events:auto; }
  .r-card::-webkit-scrollbar{ width:7px; }                      /* バーだけ。うしろの溝は出さない */
  .r-card::-webkit-scrollbar-track{ background:transparent; }
  .r-card::-webkit-scrollbar-thumb{ background:rgba(34,36,31,.26); border-radius:99px; }
  .r-card{ width:min(92vw,430px); max-height:82svh; overflow-y:auto; background:var(--card); color:var(--ink);
    border-radius:18px; border-top:9px solid var(--gold); padding:24px 20px 20px; text-align:center; }
  .r-title{ font-size:24px; font-weight:900; letter-spacing:.1em; margin-bottom:14px; }
  .r-big{ font-size:44px; font-weight:900; color:var(--gold-d); letter-spacing:.04em; }
  .h-sec{ position:relative; text-align:left; font-size:15px; font-weight:900; letter-spacing:.08em; margin:14px 0 6px; padding-left:12px; }
  .h-sec::before{ content:""; position:absolute; left:0; top:2px; bottom:2px; width:5px; border-radius:3px; background:var(--gold); }
  .h-sec.hl::before{ background:var(--red); }
  .r-card p{ text-align:left; font-size:14px; font-weight:500; line-height:1.85; }
  .r-card .close{ margin-top:16px; padding:10px 26px; border:none; border-radius:999px; cursor:pointer;
    background:var(--gold); color:#3a2a06; font-size:15px; font-weight:900; letter-spacing:.1em; }

  /* ===== 結果画面 ===== */
  #resultScene{ padding-top:54px; }
  .res-head{ text-align:center; margin-bottom:18px; }
  .res-lead{ font-size:14px; font-weight:800; letter-spacing:.18em; opacity:.6; margin-bottom:2px; }
  .res-count{ font-size:46px; font-weight:900; color:var(--gold); letter-spacing:.04em; line-height:1.1; }
  .res-grid{ width:min(94vw,520px); display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr));
    gap:14px 12px; justify-items:center; max-height:56svh; overflow-y:auto; padding:2px 2px 6px; }
  .res-item{ display:flex; flex-direction:column; align-items:center; gap:5px; }
  .res-item canvas{ display:block; image-rendering:pixelated; }
  .res-rate{ font-size:14px; font-weight:900; letter-spacing:.02em; color:var(--gold); }
  .res-rate.ng{ color:#ff9b8b; }
  .res-btns{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:20px; }
  /* 判定の得点表 */
  #ptList{ width:min(94vw,420px); margin:6px auto 0; }
  .pt-note{ font-size:12px; font-weight:700; opacity:.7; text-align:center; margin-bottom:6px; }
  .pt-row{ display:flex; align-items:center; gap:10px; padding:6px 10px; border-radius:10px; background:rgba(255,255,255,.07); margin-top:5px; font-weight:800; }
  .pt-sw{ width:14px; height:14px; border-radius:4px; flex:none; }
  .pt-nm{ flex:1; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pt-nm.me{ text-decoration:underline; text-decoration-color:rgba(255,255,255,.4); }
  .pt-pt{ font-size:16px; font-weight:900; min-width:64px; text-align:right; }
  .pt-pt.plus{ color:#78e88c; } .pt-pt.minus{ color:#ff8272; }
  .pt-tot{ font-size:12px; opacity:.65; min-width:44px; text-align:right; }
  /* 結果画面の順位 */
  .res-rank{ width:min(94vw,420px); margin:0 auto 14px; }
  .rk-row{ display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:12px; background:rgba(255,255,255,.08); margin-top:6px; font-weight:800; }
  .rk-row.top{ background:rgba(232,182,71,.22); }
  .rk-no{ width:28px; font-size:15px; font-weight:900; color:var(--gold); }
  .rk-sw{ width:14px; height:14px; border-radius:4px; flex:none; }
  .rk-nm{ flex:1; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rk-pt{ font-size:18px; font-weight:900; }
  .home-foot{
    margin-top:auto; padding:26px 0 16px; font-size:12px; font-weight:700; letter-spacing:.08em;
    color:rgba(253,246,231,.5); text-decoration:none;
  }
  #gameScene.on ~ .home-foot{ display:none; }

  /* ===== スタンプ(全ゲーム共通の作り) ===== */
  #stampBar{ position:fixed; left:50%; transform:translateX(-50%); bottom:10px; z-index:75; display:none; gap:9px; }
  #stampBar.on{ display:flex; }
  .stamp-btn{ width:48px; height:48px; padding:0; border:none; border-radius:50%; cursor:pointer;
    background:rgba(253,246,231,.92); box-shadow:0 3px 0 rgba(6,26,24,.5);
    display:flex; align-items:center; justify-content:center; font-size:27px; line-height:1; }
  .stamp-btn:active{ transform:translateY(1px) scale(.93); }
  .stamp-mute{ width:34px; height:34px; padding:0; border:none; border-radius:50%; cursor:pointer;

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const TAPW=(window.matchMedia&&matchMedia("(pointer:coarse)").matches)?"タップ":"クリック";
window.__TAPW=TAPW;

/* ================= 効果音(全合成) ================= */
let actx=null, seBus=null, noiseBuf=null;
let seOn=true; try{ seOn=localStorage.getItem("ck.se")!=="0"; }catch(e){}
function ensureAudio(){
  if(!actx){
    try{
      actx=new (window.AudioContext||window.webkitAudioContext)();
      seBus=actx.createGain(); seBus.gain.value=seOn?1:0; seBus.connect(actx.destination);
      const len=actx.sampleRate; noiseBuf=actx.createBuffer(1,len,actx.sampleRate);
      const d=noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    }catch(e){}
  }
  if(actx&&actx.state==="suspended"){ try{ actx.resume(); }catch(e){} }
}
function note(f,t,dur,vol,type){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.006); g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(g); g.connect(seBus); o.start(t); o.stop(t+dur+0.02);
}
function noiseHit(t,f1,f2,q,vol,dur){
  if(!actx) return;
  const n=actx.createBufferSource(); n.buffer=noiseBuf;
  const b=actx.createBiquadFilter(); b.type="bandpass"; b.frequency.setValueAtTime(f1,t);
  b.frequency.exponentialRampToValueAtTime(f2,t+dur*0.9); b.Q.value=q;
  const g=actx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.002);
  g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  n.connect(b); b.connect(g); g.connect(seBus); n.start(t); n.stop(t+dur+0.02);
}
function playSelect(){ if(!actx) return; note(880,actx.currentTime,0.07,0.14,"triangle"); }
function playCrumb(){ if(!actx) return; const t=actx.currentTime;   // サクッと食べる音
  noiseHit(t, 2400+Math.random()*1200, 600, 1.1, 0.1, 0.05);
  note(150+Math.random()*60, t, 0.05, 0.09, "triangle"); }

function playSlide(){ if(!actx) return; noiseHit(actx.currentTime,600,2400,0.8,0.13,0.34); }
function playTick(){ if(!actx) return; note(1400,actx.currentTime,0.03,0.06,"triangle"); }
function playBoom(){ if(!actx) return; const t=actx.currentTime;    // 爆弾が爆発
  noiseHit(t,900,60,0.7,0.5,0.5); note(70,t,0.55,0.35,"square"); note(48,t+0.05,0.7,0.28,"sine"); }
function playOpen(){ if(!actx) return; const t=actx.currentTime;
  noiseHit(t,1200,3000,1.2,0.2,0.07);
  [784,1047,1319,1568].forEach((f,i)=>note(f,t+0.05+i*0.07,0.3,0.16,"triangle"));
  note(2093,t+0.4,0.5,0.07,"sine"); }
function playShut(){ if(!actx) return; const t=actx.currentTime;
  noiseHit(t,420,180,1.6,0.3,0.1); note(120,t+0.02,0.22,0.2,"square"); note(90,t+0.05,0.3,0.16,"sine"); }
function playDone(){ if(!actx) return; const t=actx.currentTime; note(523,t,0.09,0.16,"triangle"); note(784,t+0.1,0.22,0.14,"triangle"); }
function playWarn(){ if(!actx) return; const t=actx.currentTime;   // のこり15秒
  [880,660].forEach((f,i)=>{ note(f,t+i*0.16,0.14,0.2,"square"); }); note(440,t+0.34,0.3,0.16,"triangle"); }
function playOver(){ if(!actx) return; const t=actx.currentTime;   // 全ラウンド終了=うれしいファンファーレ(上昇アルペジオ+きらめき+和音)
  [523,659,784,1047].forEach((f,i)=>note(f,t+i*0.09,0.22,0.14,"triangle"));
  [1319,1568].forEach((f,i)=>note(f,t+0.42+i*0.08,0.18,0.09,"triangle"));
  [523,659,784,1047].forEach(f=>{ note(f,t+0.62,0.9,0.1,"triangle"); note(f*2,t+0.62,0.6,0.035,"sine"); });
  note(262,t+0.62,0.9,0.1,"sine"); }
function renderSnd(){ $("seBtn").classList.toggle("off", !seOn); }
$("seBtn").addEventListener("click",()=>{
  ensureAudio(); seOn=!seOn; try{ localStorage.setItem("ck.se", seOn?"1":"0"); }catch(e){}
  if(seBus&&actx) seBus.gain.setTargetAtTime(seOn?1:0, actx.currentTime, 0.02);
  renderSnd(); if(seOn) playSelect();
});

/* ================= 盤面 =================
   マス目は 55×84=4620マス。
   ※マス数が多いので、描画は「1マス=1ピクセル」のオフスクリーンに書いて拡大表示する
     (fillRectを4万回やらない。削った所だけピクセルを書き換える) */
const W=55, H=84;
const HZ_MIN=5, HZ_MAX=10;   // 鉄板と爆弾の一辺(マス)。1個ずつランダムに決まる
const idx=(x,y)=>y*W+x;
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

/* --- 鍵の生成: 型 + 毎回ランダムな凹凸。突起と凹みは左右どちらにも出る --- */
const HANDLES=["round","square","hex","drop","clover"];
function randomKey(){
  const cx=Math.round(W/2)-1;
  const R0=R(13,17), hole=Math.max(4,Math.round(R0*(0.32+Math.random()*0.18)));
  const htype=HANDLES[R(0,HANDLES.length-1)];
  const wob={ k1:R(2,4), p1:Math.random()*6.28, a1:0.018+Math.random()*0.032,
              k2:2, p2:Math.random()*6.28, a2:0.01+Math.random()*0.02 };
  const sw=R(9,13), x0=cx-Math.floor(sw/2), x1=x0+sw-1;
  const cy=R0+3, top=cy+Math.round(R0*0.45);
  const nb=R(5,7);
  const first=top+5;
  const per=Math.max(5, Math.floor((H-3-first)/nb));
  const D=R(5,8);
  const nd=Math.max(2, Math.min(Math.floor(sw/3), Math.round(D*0.5)));
  const bands=[];
  for(let i=0;i<nb;i++){
    const lv=[-nd,0,D,D*2];
    let L=lv[R(0,3)], Rt=lv[R(0,3)];
    if(L<0 && Rt<0){ if(Math.random()<0.5) L=0; else Rt=0; }   // 左右から同時に削ると軸が切れる
    bands.push({ y:first+i*per, h:Math.max(3,per-2), L:L, Rt:Rt });
  }
  return { kind:"key", cx:cx, R0:R0, hole:hole, htype:htype, wob:wob, sw:sw, x0:x0, x1:x1, cy:cy, top:top, bands:bands,
           seed:Math.floor(Math.random()*4294967296), chipSeed:Math.floor(Math.random()*4294967296) };
}
/* --- 2枚目以降のお手本: 鍵にこだわらず、いろんな形。どれも種(seed)から作るので全員が同じ形になる --- */
const SHAPE_KINDS=["apple","grape","rabbit","fish","star","heart","house","mushroom","cat","car","cup","moon","umbrella","flower","cloud","bone"];
function randomShapeMeta(){
  return { kind:SHAPE_KINDS[R(0,SHAPE_KINDS.length-1)], seed:Math.floor(Math.random()*4294967296),
           chipSeed:Math.floor(Math.random()*4294967296) };
}
function shapeCells(m){
  const rnd=seeded(m.seed||1), rf=(a,b)=>a+rnd()*(b-a), ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
  const s=new Uint8Array(W*H);
  const CX=W/2, CY=H/2;
  /* ★3マス四方のブロック単位で塗る=角の数が減って角張った形になる(なめらかな楕円だと階段状の角が多すぎる) */
  const B=2;   // 2=なめらか(1)と角張り(3)の中間
  const blocks=(fn,v)=>{ for(let by=0;by*B<H;by++) for(let bx=0;bx*B<W;bx++){ if(!fn((bx+0.5)*B,(by+0.5)*B)) continue;
    for(let dy=0;dy<B;dy++) for(let dx=0;dx<B;dx++){ const x=bx*B+dx, y=by*B+dy; if(x<W&&y<H) s[idx(x,y)]=v; } } };
  const fill=fn=>blocks(fn,1);
  const cut =fn=>blocks(fn,0);

function handleRadius(k, ang){
  const w=k.wob;
  let f=1 + w.a1*Math.sin(w.k1*ang+w.p1) + w.a2*Math.sin(w.k2*ang+w.p2);
  if(k.htype==="square") f*= 1/Math.max(Math.abs(Math.cos(ang)),Math.abs(Math.sin(ang)))*0.82;
  else if(k.htype==="hex")   f*= 1/Math.max(Math.abs(Math.cos(ang)),Math.abs(Math.cos(ang-2.094)),Math.abs(Math.cos(ang+2.094)))*0.9;
  else if(k.htype==="drop")  f*= 1+0.10*Math.cos(ang-1.571);
  else if(k.htype==="clover")f*= 1+0.055*Math.cos(3*ang);
  return k.R0*f;
}

  const ell=(cx,cy,rx,ry,rot)=>(x,y)=>{ let dx=x-cx, dy=y-cy; if(rot){ const c=Math.cos(rot), sn=Math.sin(rot); const u=dx*c-dy*sn, v=dx*sn+dy*c; dx=u; dy=v; } return (dx/rx)*(dx/rx)+(dy/ry)*(dy/ry)<=1; };
  const rect=(x0,y0,x1,y1)=>(x,y)=>x>=x0&&x<=x1&&y>=y0&&y<=y1;
  const poly=pts=>(x,y)=>{ let inside=false; for(let i=0,j=pts.length-1;i<pts.length;j=i++){ const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside; } return inside; };

  const star=(cx,cy,R1,r1,rot)=>{ const pts=[]; for(let i=0;i<10;i++){ const a=rot+i*Math.PI/5, rr=(i%2)?r1:R1; pts.push([cx+rr*Math.cos(a), cy+rr*Math.sin(a)]); } return poly(pts); };
  return { fill:fn=>blocks(fn,1), cut:fn=>blocks(fn,0), ell, rect, poly, box, star, rf, ri };

function keyCellsBase(k){
  const s=new Uint8Array(W*H);

  for(let y=0;y<lim;y++) for(let x=0;x<W;x++){
    const dx=x-k.cx, dy=y-k.cy, d=Math.hypot(dx,dy);
    if(d<0.001) continue;
    const rr=handleRadius(k, Math.atan2(dy,dx));
    if(d<=rr && d>=k.hole) s[idx(x,y)]=1;
  }
  for(let y=k.top;y<H-1;y++) for(let x=k.x0;x<=k.x1;x++) s[idx(x,y)]=1;
  k.bands.forEach(b=>{
    for(let dy=0;dy<b.h;dy++){
      const y=b.y+dy; if(y>=H-1) continue;
      if(b.L>0){ for(let d=0;d<b.L;d++){ const x=k.x0-1-d; if(x>=0) s[idx(x,y)]=1; } }
      else if(b.L<0){ for(let d=0;d<-b.L;d++){ const x=k.x0+d; if(x<=k.x1) s[idx(x,y)]=0; } }
      if(b.Rt>0){ for(let d=0;d<b.Rt;d++){ const x=k.x1+1+d; if(x<W) s[idx(x,y)]=1; } }
      else if(b.Rt<0){ for(let d=0;d<-b.Rt;d++){ const x=k.x1-d; if(x>=k.x0) s[idx(x,y)]=0; } }
    }

  return s;
}

/* --- 石と爆弾(16×16の塊) --- */
function placeHazards(key, nTotal, owners){
  const used=[], out=[];
  /* ドクロは鍵に重なってもよい(重なった所は「残す」形になる) */
  function far(x,y,sz){ return used.every(u=>Math.abs(u.x-x)>=Math.max(u.s,sz)+2 || Math.abs(u.y-y)>=Math.max(u.s,sz)+2); }
  function tryPlace(sz){
    for(let t=0;t<300;t++){
      const x=R(1,W-sz-1), y=R(1,H-sz-1);
      if(!far(x,y,sz)) continue;
      used.push({x:x,y:y,s:sz}); return {x:x,y:y,s:sz};
    }
    return null;
  }
  function pick(){                       // 入らない時は少しずつ小さくして必ず置く
    let sz=R(HZ_MIN,HZ_MAX);
    for(; sz>=HZ_MIN; sz--){ const p=tryPlace(sz); if(p) return p; }
    return null;
  }
  /* nTotal=盤全体の個数。人数が多い時は行きわたらない人もいる(ドクロなし) */
  const list=owners.slice(0, nTotal);
  for(let i=list.length;i<nTotal;i++) list.push(owners[R(0,owners.length-1)]);
  list.forEach(o=>{
    const p=pick(); if(p) out.push({type:"bomb", x:p.x, y:p.y, s:p.s, owner:o, revealed:false});
  });
  return out;
}
function hazCells(h){ const a=[]; for(let j=0;j<h.s;j++) for(let i=0;i<h.s;i++) a.push(idx(h.x+i,h.y+j)); return a; }
function targetCells(key, hazards){
  const t=Uint8Array.from(key);
  hazards.forEach(h=>{ hazCells(h).forEach(i=>{ t[i]=1; }); });   // 爆弾は残さないといけない
  return t;
}

const TOL=2;
function dilate(s,r){
  let cur=s;
  for(let step=0;step<r;step++){
    const o=new Uint8Array(W*H);
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      if(!cur[idx(x,y)]) continue;
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
        const nx=x+dx, ny=y+dy;
        if(nx>=0&&nx<W&&ny>=0&&ny<H) o[idx(nx,ny)]=1;
      }
    }
    cur=o;
  }
  return cur;
}
function shapeRate(carved, target){
  const td=dilate(target,TOL);
  let inter=0, uni=0;
  for(let i=0;i<W*H;i++){
    if(carved[i]&&td[i]) inter++;
    if(carved[i]||target[i]) uni++;
  }
  return uni? inter/uni : 0;
}

function paintCell(x,y,p){
  const n=(x*7+y*13)%5;                    // 地色は1マス単位の細かいムラ(帯にすると縞に見える)
  let r=201,g=138,b=69;
  if(n===0){ r=208; g=146; b=76; } else if(n===1){ r=194; g=131; b=63; }
  if(chipMask[idx(x,y)]){ r=110; g=64; b=26; }   // チョコチップ(毎回ちがう位置・大きさは固定)
  img.data[p]=r; img.data[p+1]=g; img.data[p+2]=b; img.data[p+3]=255;
}
let chipMask=null;
const CHIP_BASE=2;      // チョコチップは2マス四方(大きさは固定)
/* ★チョコチップは全員が同じ位置で見えないといけない(位置を口で言うため)。
   毎回の乱数ではなく、ホストが配る種(chipSeed)から作る */
function seeded(seed){ let a=seed>>>0; return ()=>{ a=(a*1664525+1013904223)>>>0; return a/4294967296; }; }
function buildChips(seed){
  const rnd=seeded(seed||1);
  const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
  chipMask=new Uint8Array(W*H);
  const NB=7;
  for(let by=0;by<Math.ceil(H/NB);by++) for(let bx=0;bx<Math.ceil(W/NB);bx++){   // ★ceilで右端・下端まで置く
    if(rnd()<0.5) continue;
    const sz=CHIP_BASE;                                    // マスの大きさは全部同じ(差はpxで付ける)
    let cx=0, cy=0, okp=false;
    for(let t=0;t<14 && !okp;t++){
      cx=bx*NB+ri(0,NB-1); cy=by*NB+ri(0,NB-1);
      if(cx<2 || cy<2 || cx+sz>W-2 || cy+sz>H-2) continue;   // ふちにくっつけない
      okp=true;
      for(let dy=-1;dy<=sz && okp;dy++) for(let dx=-1;dx<=sz;dx++){
        const x=cx+dx, y=cy+dy;
        if(x<0||x>=W||y<0||y>=H) continue;
        if(chipMask[idx(x,y)]){ okp=false; break; }
      }
    }
    if(!okp) continue;
    for(let dy=0;dy<sz;dy++) for(let dx=0;dx<sz;dx++){
      const x=cx+dx, y=cy+dy;
      if(x>=0&&x<W&&y>=0&&y<H) chipMask[idx(x,y)]=1;
    }
  }
}

    for(let k=1;k<=players.length;k++){ const m=new Uint8Array(W*H); let any=false;
      for(let i=0;i<W*H;i++){ if(eater[i]===k && !cookie[i]){ m[i]=1; any=true; } }
      if(any) fillMask(ctx, m, cell, 0, 0, PCOL[(k-1)%PCOL.length]); }
    ctx.restore();
  }
  hazards.filter(h=>h.exploded).forEach(h=>drawHazard(ctx,h,cell,0,0));   // 爆発した爆弾は食べる人にも見える
  fxRing.forEach(f=>{                        // 爆発(刃が当たった場所)
    const k=1-Math.max(0,(f.until-Date.now())/620);
    ctx.save(); ctx.globalAlpha=Math.max(0,1-k);
    ctx.fillStyle="rgba(255,164,64,.9)";
    ctx.beginPath(); ctx.arc(f.x*cell, f.y*cell, f.r*cell*(0.4+k*2.0), 0, 6.284); ctx.fill();
    ctx.strokeStyle="rgba(255,240,200,.95)"; ctx.lineWidth=Math.max(2,cell*1.4);
    ctx.beginPath(); ctx.arc(f.x*cell, f.y*cell, f.r*cell*(0.6+k*2.5), 0, 6.284); ctx.stroke();
    ctx.restore();
  });

  if(rev){                                   // 判定中: 右からお手本が滑ってきて重なる
    const el=performance.now()-rev.t0;
    let dx, alpha;
    if(rev.hold){ dx=0; alpha=0.7; }
    else if(el<REV_T0){ const k=Math.min(1,el/REV_T0), e=1-Math.pow(1-k,3); dx=(W*cell*1.25)*(1-e); alpha=0.35+0.35*e; }
    else{ dx=0; alpha=0.7; }
    ctx.save(); ctx.globalAlpha=alpha;
    fillMask(ctx, rev.keyOnly, cell, dx, 0, "#e8b647");
    ctx.restore();
    const mineR=myRegion()>=0;                        // 自分のドクロと爆発済みはもう見えている=動かさない
    hazards.forEach(h=>{ if(h.exploded||(mineR&&h.owner===myId)) return;
      drawHazard(ctx,h,cell,dx,0); });                 // ほかの人のドクロが右から運ばれてくる
  }
  popTx.forEach(t=>{                         // 「−30」を爆弾のそばに(テキストだけ)
    const left=(t.until-Date.now())/1500;
    ctx.save(); ctx.globalAlpha=Math.max(0, Math.min(1, left*2));
    ctx.font="900 "+Math.max(15, cell*4.2)+"px 'Noto Sans JP',sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillStyle="#ff8f7d";
    ctx.fillText(t.txt, t.x*cell, (t.y-(1-left)*2.2)*cell);
    ctx.restore();
  });
  crumbs.forEach(cr=>{                       // 食べカス
    ctx.save(); ctx.globalAlpha=Math.max(0,cr.life);
    ctx.fillStyle=cr.dark? "#6e4018" : "#c98a45";
    ctx.fillRect(cr.x*cell, cr.y*cell, cr.s*cell, cr.s*cell);
    ctx.restore();
  });
}
function drawRegionLines(c, cs){
  /* 分割数に関わらず十字で出す=位置を口で言うための共通の目印 */
  c.save();
  c.strokeStyle="rgba(253,246,231,.22)"; c.lineWidth=1.5; c.setLineDash([6,6]);
  c.beginPath();
  c.moveTo(Math.floor(W/2)*cs, 0); c.lineTo(Math.floor(W/2)*cs, H*cs);
  c.moveTo(0, Math.floor(H/2)*cs); c.lineTo(W*cs, Math.floor(H/2)*cs);
  c.stroke(); c.restore();
}
function fillMask(c, t, cs, ox, oy, style){   // 横に連続する分をまとめて塗る(マスが多いので)
  c.fillStyle=style;
  for(let y=0;y<H;y++){
    let run=-1;
    for(let x=0;x<=W;x++){
      const on=(x<W)&&t[idx(x,y)];
      if(on&&run<0) run=x;
      if(!on&&run>=0){ c.fillRect(ox+run*cs, oy+y*cs, (x-run)*cs+0.4, cs+0.4); run=-1; }
    }
  }
}
function strokeTarget(c, t, cs, ox, oy){
  c.save();
  fillMask(c, t, cs, ox, oy, "rgba(232,182,71,.16)");
  c.lineWidth=Math.max(1.5, cs*0.55);
  c.strokeStyle="rgba(255,214,110,.98)"; c.lineCap="butt";
  c.beginPath();
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    if(!t[idx(x,y)]) continue;
    const X=ox+x*cs, Y=oy+y*cs;
    if(y===0   || !t[idx(x,y-1)]){ c.moveTo(X,Y);    c.lineTo(X+cs,Y); }
    if(y===H-1 || !t[idx(x,y+1)]){ c.moveTo(X,Y+cs); c.lineTo(X+cs,Y+cs); }
    if(x===0   || !t[idx(x-1,y)]){ c.moveTo(X,Y);    c.lineTo(X,Y+cs); }
    if(x===W-1 || !t[idx(x+1,y)]){ c.moveTo(X+cs,Y); c.lineTo(X+cs,Y+cs); }
  }
  c.stroke(); c.restore();
}
function drawHazard(c,h,cs,ox,oy){
  const X=ox+h.x*cs, Y=oy+h.y*cs, S=h.s*cs;
  c.save();
  for(let jj=0;jj<h.s;jj++) for(let ii=0;ii<h.s;ii++){          // 下地は赤の市松
    c.fillStyle=bombColor(h.x+ii, h.y+jj, false);
    c.fillRect(X+ii*cs, Y+jj*cs, cs+0.5, cs+0.5);
  }
  drawSkull(c, X+S*0.5, Y+S*0.5, S*0.74);                       // ドクロは必ずタイルのど真ん中
  c.restore();
}
/* ドクロ。100×100の枠に中心そろえで描いて、あとは大きさぶんだけ拡大する
   =タイルの大きさが変わっても位置がぶれない(位置合わせをやり直さなくていい) */
function drawSkull(c, cxp, cyp, S){
  c.save();
  c.translate(cxp, cyp); c.scale(S/100, S/100);
  c.fillStyle="#f7f1e4";
  c.beginPath(); c.ellipse(0, -9, 33, 30, 0, 0, 6.284); c.fill();          // 頭
  c.beginPath(); c.ellipse(-25, 6, 9, 9, 0, 0, 6.284); c.fill();           // ほお骨
  c.beginPath(); c.ellipse( 25, 6, 9, 9, 0, 0, 6.284); c.fill();
  c.beginPath();                                                          // あご
  c.moveTo(-19, 12); c.lineTo(19, 12); c.lineTo(15, 38); c.lineTo(-15, 38); c.closePath(); c.fill();
  c.fillStyle="#20160f";
  c.beginPath(); c.ellipse(-14, -12, 11, 12, 0, 0, 6.284); c.fill();       // 目
  c.beginPath(); c.ellipse( 14, -12, 11, 12, 0, 0, 6.284); c.fill();
  c.beginPath();                                                          // 鼻
  c.moveTo(0, 2); c.lineTo(6, 14); c.lineTo(-6, 14); c.closePath(); c.fill();
  for(let k=-1;k<=1;k++) c.fillRect(k*9-1.6, 20, 3.2, 18);                // 歯のすき間
  c.restore();
}

let blockMask=null;   // 爆弾のマス(絶対に削れない)
let blockShown=null;   // (未使用。オンラインの互換のため残す)
function buildStoneMask(){
  blockMask=new Uint8Array(W*H); blockShown=new Uint8Array(W*H);
  hazards.forEach((h,n)=>{ h.exploded=false; hazCells(h).forEach(i=>{ blockMask[i]=n+1; }); });   // 値=爆弾の番号
}
/* ペンの範囲(偶数サイズ=2マスにも対応。左上寄せ) */
function penSpan(size){ const k0=Math.floor((size-1)/2); return [k0, size-1-k0]; }
function penCells(cx,cy){
  const [k0,k1]=penSpan(penSize), out=[];
  for(let dy=-k0;dy<=k1;dy++){
    const y=cy+dy; if(y<0||y>=H) continue;
    for(let dx=-k0;dx<=k1;dx++){
      const x=cx+dx; if(x<0||x>=W) continue;
      out.push(idx(x,y));
    }
  }
  return out;
}
function cellAt(px,py){
  const r=cv.getBoundingClientRect();
  return [Math.floor((px-r.left)/(r.width/W)), Math.floor((py-r.top)/(r.height/H))];
}
let lastCarveSound=0, lastCell=null;
let crumbs=[], crIv=0, popTx=[];
function spawnCrumbs(cx,cy,n){          // 食べカスが飛び散る
  for(let i=0;i<n;i++){
    crumbs.push({ x:cx+(Math.random()*2-1)*penSize*0.5, y:cy+(Math.random()*2-1)*penSize*0.5,
                  vx:(Math.random()*2-1)*0.5, vy:-0.4-Math.random()*0.7,
                  s:0.7+Math.random()*1.1, life:1, dark:Math.random()<0.25 });
  }
  if(crumbs.length>90) crumbs.splice(0, crumbs.length-90);
  if(!crIv) crIv=setInterval(()=>{
    crumbs.forEach(c=>{ c.x+=c.vx; c.y+=c.vy; c.vy+=0.09; c.life-=0.055; });
    crumbs=crumbs.filter(c=>c.life>0);
    drawCookie();
    if(!crumbs.length){ clearInterval(crIv); crIv=0; }
  },40);
}
function carveAt(px,py){
  const [cx,cy]=cellAt(px,py);
  if(cx<-12||cx>W+12||cy<-12||cy>H+12) return;
  const pts=[];
  if(lastCell){
    const d=Math.max(Math.abs(cx-lastCell[0]), Math.abs(cy-lastCell[1]));
    const step=Math.max(1, Math.floor(penSize*0.45));
    for(let i=step;i<d;i+=step) pts.push([Math.round(lastCell[0]+(cx-lastCell[0])*i/d), Math.round(lastCell[1]+(cy-lastCell[1])*i/d)]);
  }
  pts.push([cx,cy]);
  let hit=false; const bang=[];
  pts.forEach(p=>penCells(p[0],p[1]).forEach(i=>{
    if(blockMask[i]){                                    // 爆弾に刃が当たった
      const h=hazards[blockMask[i]-1];
      if(h && !h.exploded){ h.exploded=true; bang.push(h); }
      return;
    }
    if(cookie[i]){ cookie[i]=0; clearPixel(i); hit=true; if(eater) eater[i]=ownerIdx(myId); }
  }));
  bang.forEach(h=>{                                      // その爆弾の範囲がまるごと吹き飛ぶ
    hazCells(h).forEach(i=>{ if(cookie[i]){ cookie[i]=0; clearPixel(i); } blockMask[i]=0; });
    blowUp(h);                                           // 触れた数だけライフが減る
  });
  lastCell=[cx,cy];

  if(hit||bang.length){
    if(online) pts.forEach(q=>pushCarve(q[0],q[1],penSize));   // 相手にも同じ形を作らせる
    drawCookie();
    const now=Date.now();
    if(now-lastCarveSound>55){ lastCarveSound=now; if(!bang.length){ playCrumb(); spawnCrumbs(cx,cy,3); } }
  }
}
let fxRing=[], fxIv=0;
function blowUp(h){            // 触れた爆弾の数だけライフが減る(ひと削りでもまとめて減る)
  const bx=h.x+h.s/2, by=h.y+h.s/2;
  addClock(-BOMB_PENALTY);            // 爆弾を削ると時間が減る
  popTx.push({ x:Math.max(4,Math.min(W-4,bx)), y:Math.max(3.4, by-h.s*0.7), txt:"−"+BOMB_PENALTY, until:Date.now()+1500 });   // 削った爆弾のそばに出す
  playBoom();
  if(navigator.vibrate){ try{ navigator.vibrate(80); }catch(_){}}
  fxRing.push({x:bx, y:by, r:h.s, until:Date.now()+620});   // 当たった場所で爆発
  if(!fxIv) fxIv=setInterval(()=>{
    fxRing=fxRing.filter(f=>f.until>Date.now());
    popTx=popTx.filter(t=>t.until>Date.now());
    drawCookie();

}

const REV_T0=760, REV_T1=620, REV_END=560;
function revFrame(now){
  if(!rev) return;
  const el=now-rev.t0;
  drawCookie();
  if(el>=REV_T0 && !rev.fin){
    const k=Math.min(1,(el-REV_T0)/REV_T1), shown=Math.round(rev.rate*100*k);
    $("judgeBig").textContent="一致度 "+shown+"%";
    $("judgeBig").className="judge-big";
    if(now-rev.tickAt>60 && k<1){ rev.tickAt=now; playTick(); }
    if(k>=1){
      rev.fin=true;
      const ok=rev.rate>=0.80;
      $("judgeBig").textContent="一致度 "+Math.round(rev.rate*100)+"%";
      $("judgeBig").className="judge-big "+(ok?"ok":"ng");
      if(ok) playOpen(); else playShut();
    }
  }
  if(el < REV_T0+REV_T1+REV_END) setTimeout(()=>revFrame(performance.now()), 30);
  else { const d=rev.done; rev.hold=true; drawCookie(); if(d) d(); }   // 重ねたお手本は次のクッキーまで残す

/* ドクロの数は「盤全体で何個」で決める。指示する人1人につき必ず1個は行きわたり、
   あまったぶんはランダムな人に2個目・3個目として渡る。
   3枚目で5個/6枚目で6個/9枚目で7個/12枚目で8個。上限8個
   (増やしすぎると、1つも食べなくても一致度が上がってしまうので上限は動かさないこと) */
const HZ_TOTAL_MAX=8;
function hazardTotal(){
  let n=4;
  if(roundNo>=3) n=5;
  if(roundNo>=6) n=6;
  if(roundNo>=9) n=7;
  if(roundNo>=12) n=8;

function newKey(){
  cookie=new Uint8Array(W*H).fill(1);
  /* レベル1/2: 1枚目=必ず鍵、2枚目=鍵以外、3枚目以降=鍵もふくめて何でも／レベル3=大きな複雑モチーフ。直前と同じ形は出さない */
  const lv=shapeLevel();
  if(lv>=2){
    let pool=SHAPE_LV2.filter(k=>k!==lastKind); if(!pool.length) pool=SHAPE_LV2.slice();
    keyMeta=Object.assign(randomShapeMeta(), {kind:pool[R(0,pool.length-1)], lv:2});
  }else if(roundNo===1 && !devLevel && !devRegen){ keyMeta=randomKey(); keyMeta.lv=lv; }   // 1枚目は鍵(デバッグの作り直しは何でも出る)
  else{
    let pool=SHAPE_KINDS.slice(); if(roundNo>=3 || devLevel || devRegen) pool.push("key");
    pool=pool.filter(k=>k!==lastKind); if(!pool.length) pool=SHAPE_KINDS.slice();
    const kind=pool[R(0,pool.length-1)];
    keyMeta=(kind==="key")? randomKey() : Object.assign(randomShapeMeta(), {kind:kind});
    keyMeta.lv=lv;
  }
  lastKind=keyMeta.kind;
  key=keyCells(keyMeta);
  const ins=instructors();
  regions = (ins.length<=1)? 1 : (ins.length<=3? 2 : 4);
  hazards=[];                       // ドクロ(爆弾)の仕様は2026-08-19に廃止=お手本の形に合わせて食べるだけ
  target=targetCells(key, hazards);
  eater=new Uint8Array(W*H); lastScores=null; scoreView=false; pens={};
  buildStoneMask();
  buildChips(keyMeta.chipSeed);
  buildImage();
  fxRing=[]; if(fxIv){ clearInterval(fxIv); fxIv=0; }
  crumbs=[]; if(crIv){ clearInterval(crIv); crIv=0; }
  popTx=[]; rev=null;

function startClock(){                     // 削っている間だけ進む

function miniKey(grid, tgt){       // 削り上がったクッキーを小さく描く(お手本のシルエットも重ねる)
  const MW=84, c=document.createElement("canvas");
  const sc=Math.max(1, Math.floor(MW/W)), d=dprv();
  c.width=W*sc*d; c.height=H*sc*d;
  c.style.width=(W*sc)+"px"; c.style.height=(H*sc)+"px";
  const g=c.getContext("2d");
  const o=document.createElement("canvas"); o.width=W; o.height=H;
  const oc=o.getContext("2d"), im=oc.createImageData(W,H);
  for(let i=0;i<W*H;i++){
    if(!grid[i]) continue;
    const p=i*4;
    im.data[p]=201; im.data[p+1]=138; im.data[p+2]=69; im.data[p+3]=255;
  }
  oc.putImageData(im,0,0);
  g.imageSmoothingEnabled=false;
  g.drawImage(o, 0, 0, W*sc*d, H*sc*d);
  if(tgt){                                   // お手本の形のアウトライン(ふちのマス)を金色で重ねる
    const o2=document.createElement("canvas"); o2.width=W; o2.height=H;
    const c2=o2.getContext("2d"), im2=c2.createImageData(W,H);
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=idx(x,y); if(!tgt[i]) continue;
      const edge = x===0||y===0||x===W-1||y===H-1 || !tgt[idx(x-1,y)] || !tgt[idx(x+1,y)] || !tgt[idx(x,y-1)] || !tgt[idx(x,y+1)];
      if(!edge) continue; const q=i*4; im2.data[q]=255; im2.data[q+1]=214; im2.data[q+2]=110; im2.data[q+3]=235; }
    c2.putImageData(im2,0,0);
    g.drawImage(o2, 0, 0, W*sc*d, H*sc*d);
  }
  return c;
}

    if(presentIds().indexOf(id)>=0) return; onLeave(id); }, GONE_GRACE);
}
function clearGone(){ Object.keys(goneTmr).forEach(cancelGone); }
function leaveChannel(){
  clearTimeout(joinWatch); clearInterval(hbIv); hbIv=0; clearGone();
  if(ch){ const c0=ch; ch=null;
    try{ c0.send({type:"broadcast",event:"bye",payload:{id:myId}}); }catch(e){}
    try{ c0.untrack(); }catch(e){}

function onLeave(id){
  if(id===myId) return;
  cancelGone(id);
  if(id===hostId && !isHost){ toast("部屋主が退出しました"); goTitle(); return; }
  if(!isHost) return;

  if(players.length<2){ toast("メンバーが足りなくなりました"); hostToLobby(); return; }
  if(wasCarver){ toast(nmOf(gone)+" が抜けたので削り直し"); startRound(); return; }

}

function openChannel(c, onReady){
  ch=sbClient().channel("ck-"+c, { config:{ presence:{ key:myId } } });
  ch.on("broadcast",{event:"hello"},({payload})=>{
    if(!isHost||!payload) return;
    cancelGone(payload.id);
    if(byId(payload.id)){ sendSnap(); return; }          // すでにメンバー(再接続)
    if(phase!=="lobby"){ try{ ch.send({type:"broadcast",event:"locked",payload:{to:payload.id}}); }catch(e){} return; }
    if(players.length>=9){ try{ ch.send({type:"broadcast",event:"locked",payload:{to:payload.id}}); }catch(e){} return; }
    players.push({id:payload.id, n:String(payload.n||"").slice(0,8), s:0, t:Date.now()});
    renderLobby(); sendSnap();
  });
  ch.on("broadcast",{event:"locked"},({payload})=>{
    if(payload && payload.to===myId){ toast("次のゲーム開始まで待ってね"); leaveChannel();
      roomStatus('<div class="room-note err">今はゲーム中みたい。次のゲーム開始まで待ってね</div>'); }
  });
  ch.on("broadcast",{event:"snap"},({payload})=>{ if(!isHost && payload) applySnap(payload); });
  ch.on("broadcast",{event:"act"},({payload})=>{ if(isHost && payload) hostAct(payload); });
  ch.on("broadcast",{event:"carve"},({payload})=>{ if(payload && payload.from!==myId) applyCarve(payload); });
  ch.on("broadcast",{event:"pen"},({payload})=>{ if(!payload||payload.from===myId) return;
    if(payload.off) delete pens[payload.from]; else pens[payload.from]={x:payload.x,y:payload.y,s:payload.s,t:Date.now()};
    if(phase==="carve") drawCookie(); });
  ch.on("broadcast",{event:"stamp"},({payload})=>{ if(payload) spawnStamp(payload.i|0, payload.n||"あいて"); });
  ch.on("broadcast",{event:"bye"},({payload})=>{ if(payload) onLeave(payload.id); });
  ch.on("broadcast",{event:"kick"},({payload})=>{ if(payload && payload.to===myId && !isHost){ toast("部屋主に退出させられました"); goTitle(); } });
  ch.on("presence",{event:"leave"},({leftPresences})=>{ (leftPresences||[]).forEach(p=>{ if(!p||!p.id) return;
    if(isHost && phase==="lobby") onLeave(p.id); else markGone(p.id); }); });   // ロビー中は猶予なしで即消す(リロードで同じ名前が増殖して見えた対策)
  ch.on("presence",{event:"sync"},()=>{                                        // ロビー中は在室者と照合して、いない人を消す
    if(!isHost || phase!=="lobby") return;
    const ids=presentIds(), now=Date.now(), n0=players.length;
    players=players.filter(p=>p.id===myId || ids.indexOf(p.id)>=0 || (now-(p.t||0))<3000);   // 入室直後3秒はpresenceが遅れても消さない
    if(players.length!==n0){ turnOrder=turnOrder.filter(x=>players.some(p=>p.id===x)); renderLobby(); sendSnap(); }
  });
  ch.on("presence",{event:"join"},({newPresences})=>{ (newPresences||[]).forEach(p=>{ if(p&&p.id) cancelGone(p.id); }); });
  let readyDone=false;
  ch.subscribe(async status=>{
    if(status==="SUBSCRIBED"){
      try{ await ch.track({id:myId}); }catch(e){}
      if(readyDone){ if(isHost) sendSnap(); else { try{ ch.send({type:"broadcast",event:"hello",payload:{id:myId,n:myName}}); }catch(e){} } return; }
      readyDone=true; if(onReady) onReady();
    } else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){
      roomStatus('<div class="room-note err">通信失敗。通信環境を見直そう</div>');
    }
  });
}

/* --- ホスト権威: 状態を配る --- */
/* 食べた所を1マス1ビットで詰める(1=食べた)。受け側はORで取り込む=自分が先に食べた所を巻き戻さない */
function packCookie(){
  const n=W*H, bytes=new Uint8Array(Math.ceil(n/8));
  for(let i=0;i<n;i++) if(!cookie[i]) bytes[i>>3]|=(1<<(i&7));
  let str=""; for(let i=0;i<bytes.length;i++) str+=String.fromCharCode(bytes[i]);
  return btoa(str);
}
function mergeCookie(b64){
  try{
    const str=atob(b64); let changed=false;
    for(let i=0;i<W*H;i++){ if((str.charCodeAt(i>>3)>>(i&7))&1){ if(cookie[i]){ cookie[i]=0; clearPixel(i); changed=true; } } }
    if(changed) drawCookie();
  }catch(e){}
}
function packEater(){   // 1マス4ビット(0〜15)=2マスで1バイト
  const n=W*H, bytes=new Uint8Array(Math.ceil(n/2));
  for(let i=0;i<n;i++){ const v=Math.min(15, eater[i]|0); if(i&1) bytes[i>>1]|=(v<<4); else bytes[i>>1]|=v; }
  let str=""; for(let i=0;i<bytes.length;i++) str+=String.fromCharCode(bytes[i]);
  return btoa(str);
}
function unpackEater(b64){
  try{ const str=atob(b64); if(!eater) eater=new Uint8Array(W*H);
    for(let i=0;i<W*H;i++){ const b=str.charCodeAt(i>>1); eater[i]=(i&1)? (b>>4)&15 : b&15; } }catch(e){}
}
function packHaz(){ return hazards.map(h=>[h.x, h.y, h.s, h.owner, h.revealed?1:0]); }
function unpackHaz(a){ return a.map(v=>({ type:"bomb", x:v[0], y:v[1], s:v[2], owner:v[3], revealed:!!v[4] })); }
function sendSnap(){
  if(!isHost||!ch) return;
  const p={ hostId:hostId, ph:phase, round:roundNo, carver:carverIdx, regions:regions, tl:timeLimit,
            clk:(clockRunning? Math.max(0,tEnd-Date.now()) : clockMs), run:clockRunning?1:0,
            players:players.map(x=>({id:x.id,n:x.n})) };
  if(phase!=="lobby"){
    p.km=keyMeta;
    if(cookie && (phase==="carve"||phase==="judge")) p.ck=packCookie();   // 食べた所(578バイト)=誰かの削りが届かなくても2.2秒で追いつく
    if(phase==="judge" && eater){ p.et=packEater(); p.sc=lastScores; }   // 判定中は「誰が食べたか」と得点も配る(全員同じ表を見る)
  }
  p.rds=rounds; p.tot=totals; p.md=gameMode; p.thr=clearThr; p.cf=coopFailed?1:0; if(phase==="carve") p.dn=[...doneSet];
  try{ ch.send({type:"broadcast",event:"snap",payload:p}); }catch(e){}
}
function applySnap(p){
  clearTimeout(joinWatch);
  hostId=p.hostId; players=p.players||[]; roundNo=p.round||1;
  clockMs=p.clk||0; clockRunning=(p.run===1); if(clockRunning) tEnd=Date.now()+clockMs; renderClock();
  carverIdx=p.carver||0; regions=p.regions||1;
  if(p.tl!==timeLimit){ timeLimit=p.tl||0; tIdx=Math.max(0,TIMES.indexOf(timeLimit)); }
  if(p.rds) rounds=p.rds;
  if(p.md) gameMode=p.md; if(p.thr) clearThr=p.thr; coopFailed=(p.cf===1);
  if(p.tot) totals=p.tot;
  if(p.dn){ doneSet=new Set(p.dn); renderDoneList(); if(doneSet.has(myId)){ const db=$("doneBtn"); db.disabled=true; db.textContent="みんなを待っています…"; } }
  const ph=p.ph;
  if(ph!=="lobby" && p.km){
    const fresh = !keyMeta || JSON.stringify(keyMeta)!==JSON.stringify(p.km);
    if(fresh){
      keyMeta=p.km; key=keyCells(keyMeta);
      hazards=[];
      target=targetCells(key, hazards);
      buildStoneMask(); buildChips(keyMeta.chipSeed);
      cookie=new Uint8Array(W*H).fill(1); buildImage();
      eater=new Uint8Array(W*H); lastScores=null; scoreView=false; pens={};
      rev=null; popTx=[]; crumbs=[];                       // ★前のお手本のシルエットを残さない(ゲスト側で残っていたバグ)
    }
  }
  if(p.ck && (ph==="carve"||ph==="judge")) mergeCookie(p.ck);   // ホストの「食べた所」を取り込む(取りこぼした削りを補正)
  if(ph==="judge"){ if(p.et) unpackEater(p.et); if(p.sc) lastScores=p.sc; }   // 判定中はホストの「誰が食べたか」と得点で上書き(全員同じ)
  if(ph===lastPh){
    if(ph==="lobby") renderLobby();
    else drawCookie();
    return;
  }
  lastPh=ph; phase=ph;
  if(ph==="lobby"){ showScene("lobbyScene"); renderLobby(); $("stampBar").classList.remove("on"); }
  else if(ph==="carve"){ enterCarveUI(); }
  else if(ph==="judge"){ enterJudgeUI(); }
  else if(ph==="over"){ gameOverUI(); }
}
function hostAct(a){
  if(a.t==="rename"){ const p=byId(a.from); if(p){ p.n=String(a.n||"").slice(0,8); if(phase==="lobby") renderLobby(); sendSnap(); } return; }
  if(a.t==="carve" && phase==="carve" && byId(a.from)){                       // 誰の削りでも受ける(全員が食べる)
    applyCarve(a);                                         // 食べる人からの削り(ホストも同じ形にする)
    try{ ch.send({type:"broadcast",event:"carve",payload:{from:a.from, pts:a.pts}}); }catch(e){}   // ★ほかのゲストにも配る(以前はホストで止まっていた)
    return;
  }
  if(a.t==="done" && phase==="carve" && byId(a.from)){ doneSet.add(a.from); checkAllDone(); return; }   // 全員そろったら判定
  if(a.t==="next" && phase==="judge" && a.from===hostId){ nextRound(); return; }
}
/* 削りは「ペンの位置と太さ」を送って各自が同じ形にする(画像は送らない) */
let carveBuf=[], carveIv=0;
function pushCarve(cx,cy,sz){
  carveBuf.push([cx,cy,sz]);
  if(!carveIv) carveIv=setInterval(flushCarve, 90);
}
function flushCarve(){
  if(!carveBuf.length){ clearInterval(carveIv); carveIv=0; return; }
  const pk={ from:myId, pts:carveBuf.slice() }; carveBuf.length=0;
  if(!online||!ch) return;
  try{
    if(isHost) ch.send({type:"broadcast",event:"carve",payload:pk});
    else ch.send({type:"broadcast",event:"act",payload:{t:"carve", from:myId, pts:pk.pts}});
  }catch(e){}
}
function ownerIdx(id){ const k=players.findIndex(p=>p.id===id); return k>=0? k+1 : 0; }   // eaterに入れる番号(0=不明)
function applyCarve(pk){
  const own=ownerIdx(pk.from);
  (pk.pts||[]).forEach(q=>{
    const cx=q[0], cy=q[1], [k0,k1]=penSpan(q[2]||1);
    for(let dy=-k0;dy<=k1;dy++) for(let dx=-k0;dx<=k1;dx++){
      const x=cx+dx, y=cy+dy;
      if(x<0||x>=W||y<0||y>=H) continue;
      const i=idx(x,y);
      if(blockMask[i]){                                   // 爆弾に当たった=その爆弾ごと吹き飛ぶ
        const h=hazards[blockMask[i]-1];
        if(h && !h.exploded){ h.exploded=true;
          hazCells(h).forEach(j=>{ if(cookie[j]){ cookie[j]=0; clearPixel(j); } blockMask[j]=0; }); }
        continue;
      }
      if(cookie[i]){ cookie[i]=0; clearPixel(i); if(eater) eater[i]=own; }
    }
  });
  drawCookie();
}

function drawLogo(){   // ロゴの「Key」に、ゲーム中とまったく同じクッキーの柄を敷く
  const el=document.querySelector(".logo .key"); if(!el) return;
  const GW=48, GH=20, CELL=5;
  const c=document.createElement("canvas"); c.width=GW; c.height=GH;
  const g=c.getContext("2d"), im=g.createImageData(GW,GH);
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){
    const p=(y*GW+x)*4, n=(x*7+y*13)%5;
    let r=201,gg=138,b=69;
    if(n===0){ r=208; gg=146; b=76; } else if(n===1){ r=194; gg=131; b=63; }
    im.data[p]=r; im.data[p+1]=gg; im.data[p+2]=b; im.data[p+3]=255;
  }
  g.putImageData(im,0,0);
  el.style.backgroundImage="url("+c.toDataURL()+")";
  el.style.backgroundSize=(GW*CELL)+"px "+(GH*CELL)+"px";
  el.style.backgroundRepeat="repeat";
}
