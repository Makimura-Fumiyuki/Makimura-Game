<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
  *{ box-sizing:border-box; margin:0; padding:0; font-family:"Noto Sans JP",sans-serif; -webkit-tap-highlight-color:transparent; }
  :root{
    --grass:#8ccb70; --grass-d:#6aae52; --grass-dd:#4f8d3d;
    --sky:#a8ddf5; --sky-l:#d9f2ff;
    --wood:#a97846; --wood-d:#7c5530;
    --rail:#b9bfc7; --gravel:#d8cdb4;
    --tomato:#e0443a; --tomato-d:#b32c24;
    --ink:#2b3327; --sub:rgba(43,51,39,.6); --paper:#fbf8ee;
  }
  html,body{ height:100%; overflow:hidden; }
  body{ background:var(--grass); color:var(--ink); line-height:1.7; }
  .btn{ border:none; cursor:pointer; font-family:inherit; }

  /* ================= タイトル ================= */
  #titleScene{ position:fixed; inset:0; z-index:30; overflow:hidden;
    background:linear-gradient(#bfe8fb 0%, var(--sky) 42%, #cfeeb4 58%, var(--grass) 72%, var(--grass-d) 100%); }
  /* 雲 */
  .cloud{ position:absolute; background:#fff; border-radius:999px; opacity:.9;
    box-shadow:0 6px 0 rgba(255,255,255,.55); animation:cloudFlow linear infinite; }
  .cloud::before,.cloud::after{ content:""; position:absolute; background:#fff; border-radius:50%; }
  .cloud.c1{ width:96px; height:30px; top:8%; left:-140px; animation-duration:19s; }
  .cloud.c1::before{ width:44px; height:44px; top:-20px; left:14px; }
  .cloud.c1::after{ width:32px; height:32px; top:-14px; left:52px; }
  .cloud.c2{ width:70px; height:22px; top:20%; left:-140px; animation-duration:26s; animation-delay:-8s; opacity:.75; }
  .cloud.c2::before{ width:34px; height:34px; top:-16px; left:10px; }
  .cloud.c2::after{ width:24px; height:24px; top:-10px; left:40px; }
  .cloud.c3{ width:120px; height:34px; top:31%; left:-180px; animation-duration:33s; animation-delay:-16s; opacity:.6; }
  .cloud.c3::before{ width:52px; height:52px; top:-24px; left:18px; }
  .cloud.c3::after{ width:38px; height:38px; top:-16px; left:66px; }
  @keyframes cloudFlow{ from{ transform:translateX(0); } to{ transform:translateX(calc(100vw + 320px)); } }
  /* 遠くの丘 */
  .hill{ position:absolute; border-radius:50% 50% 0 0 / 100% 100% 0 0; }
  .hill.h1{ left:-14%; width:78%; height:19%; top:44%; background:#79bb62; }
  .hill.h2{ right:-16%; width:70%; height:15%; top:48%; background:#8ac96f; }
  /* 走行ステージ */
  .t-stage{ position:absolute; left:0; right:0; top:58%; height:20%; }
  .t-ground{ position:absolute; inset:0;
    background:linear-gradient(var(--grass) 0%, var(--grass) 38%, #ded3ba 38%, var(--gravel) 46%, var(--gravel) 84%, #c9bda2 84%, var(--grass) 92%, var(--grass) 100%); }
  .t-sleepers{ position:absolute; left:-40px; right:-40px; top:50%; height:26%; z-index:1;
    background-image:repeating-linear-gradient(90deg, var(--wood) 0 12px, transparent 12px 38px);
    background-size:38px 100%; animation:flowLeft .5s linear infinite; }
  .t-rail{ position:absolute; left:0; right:0; height:5px; z-index:2;
    background:linear-gradient(#e7edf4 0 1.6px, var(--rail) 1.6px 100%); box-shadow:0 2px 2px rgba(0,0,0,.18); }
  .t-rail.r1{ top:52%; } .t-rail.r2{ top:72%; }
  @keyframes flowLeft{ from{ background-position-x:0; } to{ background-position-x:-38px; } }
  .t-cart{ position:absolute; left:50%; top:22%; z-index:3; width:132px; margin-left:-66px;
    animation:cartBump .3s ease-in-out infinite alternate; }
  @keyframes cartBump{ from{ transform:translateY(0) rotate(-.7deg); } to{ transform:translateY(-4px) rotate(.7deg); } }
  .t-wheel{ transform-box:fill-box; transform-origin:center; animation:spin .42s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  /* ロゴ */
  .t-wrap{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; padding:11vh 20px 0; pointer-events:none; }
  .t-logo{ position:relative; font-size:clamp(40px,13vw,72px); font-weight:900; letter-spacing:.06em; color:#fff;
    text-shadow:0 4px 0 var(--grass-dd), 0 8px 18px rgba(20,50,10,.35); animation:logoRun 2.2s ease-in-out infinite; }
  .t-logo::before{ content:"トロッコ問題"; position:absolute; left:0; top:5px; color:rgba(255,255,255,.22);
    text-shadow:none; filter:blur(3px); z-index:-1; }
  @keyframes logoRun{
    0%{ transform:translate(0,0) rotate(0deg); }
    25%{ transform:translate(0,-4px) rotate(1.3deg); }
    50%{ transform:translate(0,0) rotate(0deg); }
    75%{ transform:translate(0,-4px) rotate(-1.3deg); }
    100%{ transform:translate(0,0) rotate(0deg); }
  }
  .start-btn{ position:absolute; left:50%; transform:translateX(-50%); bottom:calc(11% + env(safe-area-inset-bottom));
    min-width:210px; font-size:17px; font-weight:900; letter-spacing:.14em; color:#fff;
    background:linear-gradient(150deg,#ec6a5c,var(--tomato) 60%,var(--tomato-d)); border-radius:999px; padding:15px 34px;
    box-shadow:0 5px 0 var(--tomato-d), 0 10px 22px rgba(0,0,0,.22); }
  .start-btn:active{ transform:translateX(-50%) translateY(4px); box-shadow:0 1px 0 var(--tomato-d); }
  .t-foot{ position:absolute; left:0; right:0; bottom:calc(16px + env(safe-area-inset-bottom)); text-align:center;
    font-size:12px; color:rgba(255,255,255,.85); text-decoration:none; text-shadow:0 1px 3px rgba(0,0,0,.25); }

  /* ================= ゲーム ================= */
  #gameScene{ position:fixed; inset:0; display:none; flex-direction:column; background:var(--grass); }
  #gameScene.on{ display:flex; }
  .top-bar{ position:absolute; left:0; right:0; top:0; z-index:5; display:flex; align-items:center;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px; pointer-events:none; }
  .tb-q{ font-size:12.5px; font-weight:900; letter-spacing:.1em; color:#fff;
    background:rgba(43,51,39,.42); padding:5px 14px; border-radius:999px; backdrop-filter:blur(2px); }
  #cv{ flex:1; display:block; width:100%; min-height:0; }

  #centerMsg{ position:fixed; left:0; right:0; top:34%; z-index:20; text-align:center; pointer-events:none;
    opacity:0; transition:opacity .25s; padding:0 20px; }
  #centerMsg.on{ opacity:1; }
  #centerMsg .cm{ display:inline-block; background:rgba(43,51,39,.86); color:#fff; padding:14px 26px; border-radius:999px;
    font-size:clamp(15px,4.4vw,20px); font-weight:800; letter-spacing:.08em; box-shadow:0 8px 24px rgba(0,0,0,.25); }
  /* 正誤マーク */
  #judge{ position:fixed; inset:0; z-index:22; display:flex; align-items:center; justify-content:center; pointer-events:none; opacity:0; }
  #judge.on{ animation:judgePop 1.15s ease-out forwards; }
  #judge svg{ width:min(52vw,230px); height:min(52vw,230px); filter:drop-shadow(0 6px 16px rgba(0,0,0,.3)); }
  @keyframes judgePop{
    0%{ opacity:0; transform:scale(.45); }
    18%{ opacity:1; transform:scale(1.14); }
    32%{ transform:scale(1); }
    75%{ opacity:1; transform:scale(1); }
    100%{ opacity:0; transform:scale(1.06); }
  }

  /* 問題エリア */
  .qbox{ flex:none; background:var(--paper); border-top:4px solid var(--grass-dd); border-radius:20px 20px 0 0;
    margin-top:-16px; z-index:4; padding:14px 16px calc(12px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 24px rgba(43,51,39,.14); }
  .q-text{ font-size:clamp(14px,3.9vw,16.5px); font-weight:800; line-height:1.55; margin-bottom:9px; min-height:3.1em; }
  .q-opts{ display:grid; grid-template-columns:1fr 1fr; gap:7px; min-height:104px; }
  .q-opts.one{ grid-template-columns:1fr; }
  .opt{ position:relative; display:flex; align-items:center; gap:8px; width:100%; text-align:left; cursor:pointer;
    background:#fff; border:2px solid rgba(79,141,61,.3); border-radius:12px; padding:8px 10px;
    font-size:13.5px; font-weight:700; line-height:1.35; color:var(--ink);
    transition:border-color .12s, background .12s, transform .1s; }
  .opt .no{ flex:none; width:25px; height:25px; border-radius:50%; background:var(--grass-dd); color:#fff;
    font-size:13px; font-weight:900; display:flex; align-items:center; justify-content:center; line-height:1; }
  .opt .tx{ flex:1; }
  .opt .go{ display:none; position:absolute; right:6px; top:-9px; font-size:10.5px; font-weight:900; letter-spacing:.08em;
    color:#fff; background:var(--tomato); padding:3px 10px; border-radius:999px; white-space:nowrap;
    box-shadow:0 2px 5px rgba(0,0,0,.2); }
  .opt.sel{ border-color:var(--tomato); background:#fff4f2; }
  .opt.sel .no{ background:var(--tomato); }
  .opt.sel .go{ display:block; animation:goPulse .9s ease-in-out infinite; }
  @keyframes goPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.07); } }
  .opt:active{ transform:scale(.99); }
  .opt.lock{ pointer-events:none; }
  .opt.ans{ border-color:#2f9e52; background:#eefaf1; }
  .opt.ans .no{ background:#2f9e52; }
  .opt.bad{ border-color:var(--tomato); background:#fdf0ef; opacity:.85; }
  .opt.bad .no{ background:var(--tomato); }

  /* ================= 結果 ================= */
  #resultScene{ position:fixed; inset:0; z-index:40; display:none; flex-direction:column; background:var(--paper); }
  #resultScene.on{ display:flex; }
  .r-head{ position:relative; flex:none; overflow:hidden; color:#fff; text-align:center;
    background:linear-gradient(#bfe8fb, var(--sky) 45%, #cfeeb4 62%, var(--grass) 100%);
    padding:calc(20px + env(safe-area-inset-top)) 18px 22px; }
  .r-title{ font-size:12px; font-weight:900; letter-spacing:.2em; color:#3f6b2c; }
  .r-score{ font-size:clamp(34px,11vw,52px); font-weight:900; color:#fff; letter-spacing:.03em;
    text-shadow:0 3px 0 var(--grass-dd), 0 6px 14px rgba(20,50,10,.3); }
  .r-score small{ font-size:.42em; font-weight:800; margin-left:5px; text-shadow:none; color:#3f6b2c; }
  .r-rank{ margin-top:4px; font-size:14.5px; font-weight:900; color:#fff;
    background:var(--tomato); display:inline-block; padding:4px 18px; border-radius:999px; box-shadow:0 3px 0 var(--tomato-d); }
  .r-list{ flex:1; overflow-y:auto; padding:14px 14px 8px; -webkit-overflow-scrolling:touch; }
  .r-item{ background:#fff; border-radius:14px; padding:13px 14px; margin-bottom:10px; border-left:5px solid #2f9e52;
    box-shadow:0 2px 8px rgba(43,51,39,.08); }
  .r-item.ng{ border-left-color:var(--tomato); }
  .r-q{ font-size:14px; font-weight:800; line-height:1.55; }
  .r-a{ margin-top:6px; font-size:13.5px; font-weight:800; color:#2f9e52; }
  .r-a .mark{ font-size:11.5px; font-weight:900; margin-right:6px; background:#2f9e52; color:#fff;
    padding:2px 8px; border-radius:999px; }
  .r-yours{ margin-top:3px; font-size:12.5px; font-weight:700; color:var(--tomato); }
  .r-e{ margin-top:6px; font-size:12.5px; font-weight:500; line-height:1.75; color:var(--sub); }
  .r-btns{ flex:none; display:flex; gap:10px; padding:10px 14px calc(14px + env(safe-area-inset-bottom)); background:var(--paper); }
  .r-btns .btn{ flex:1; font-size:15px; font-weight:900; letter-spacing:.08em; border-radius:999px; padding:13px 0; }
  .btn.primary{ color:#fff; background:linear-gradient(150deg,#ec6a5c,var(--tomato) 60%,var(--tomato-d));
    box-shadow:0 3px 0 var(--tomato-d); }
  .btn.ghost{ color:var(--grass-dd); background:#fff; border:2px solid rgba(79,141,61,.4); }
  .btn:active{ transform:translateY(2px); }
</style>
</head>
<body>

<!-- ============ タイトル ============ -->
<div id="titleScene">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="hill h1"></div><div class="hill h2"></div>
  <div class="t-stage">
    <div class="t-ground"></div>
    <div class="t-sleepers"></div>
    <div class="t-rail r1"></div><div class="t-rail r2"></div>
    <svg class="t-cart" viewBox="0 0 132 84" aria-hidden="true">
      <!-- 荷台(左右対称) -->
      <path d="M24 26 L108 26 L98 62 L34 62 Z" fill="#a97846" stroke="#7c5530" stroke-width="3" stroke-linejoin="round"/>
      <path d="M24 26 L108 26 L105.6 33 L26.4 33 Z" fill="#c08f57"/>
      <g stroke="#7c5530" stroke-width="2" opacity=".5">
        <line x1="47.3" y1="33" x2="45" y2="62"/><line x1="66" y1="33" x2="66" y2="62"/><line x1="84.7" y1="33" x2="87" y2="62"/>
      </g>
      <!-- 車輪(同サイズ・中心から等距離) -->
      <g class="t-wheel"><circle cx="46" cy="66" r="13" fill="#3f4650"/><circle cx="46" cy="66" r="5" fill="#8d97a3"/>
        <g stroke="#8d97a3" stroke-width="2.4"><line x1="46" y1="55" x2="46" y2="77"/><line x1="35" y1="66" x2="57" y2="66"/></g></g>
      <g class="t-wheel"><circle cx="86" cy="66" r="13" fill="#3f4650"/><circle cx="86" cy="66" r="5" fill="#8d97a3"/>
        <g stroke="#8d97a3" stroke-width="2.4"><line x1="86" y1="55" x2="86" y2="77"/><line x1="75" y1="66" x2="97" y2="66"/></g></g>
    </svg>
  </div>
  <div class="t-wrap">
    <h1 class="t-logo">トロッコ問題</h1>
  </div>
  <button class="btn start-btn" id="startBtn">はじめる</button>
  <a class="t-foot" href="./index.html">牧村が作ったゲーム集へ</a>
</div>

<!-- ============ ゲーム ============ -->
<div id="gameScene">
  <div class="top-bar"><span class="tb-q" id="tbQ">第1問 / 10</span></div>
  <canvas id="cv"></canvas>
  <div class="qbox">
    <div class="q-text" id="qText"></div>
    <div class="q-opts" id="qOpts"></div>
  </div>
</div>

<div id="centerMsg"><span class="cm" id="centerMsgTxt"></span></div>
<div id="judge"></div>

<!-- ============ 結果 ============ -->
<div id="resultScene">
  <div class="r-head">
    <div class="r-title">RESULT</div>
    <div class="r-score" id="rScore">0<small>/ 10問正解</small></div>
    <div><span class="r-rank" id="rRank"></span></div>
  </div>
  <div class="r-list" id="rList"></div>
  <div class="r-btns">
    <button class="btn ghost" id="rTitle">タイトルへ</button>
    <button class="btn primary" id="rAgain">もう一回</button>
  </div>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);

/* ================= 問題データ（a[0]が正解／2択のときは a[0],a[1] を使う） ================= */
const EASY=[
 {q:"「トロッコ」という言葉の由来は？",a:["英語の truck","フランス語","日本語の「取ろう」","ドイツ語"],
  e:"明治時代に truck がなまって定着しました。道路を走る「トラック」と語源は同じです。"},
 {q:"トロッコは本来、何を運ぶための乗り物？",a:["土や鉱石","手紙","家畜","食料"],
  e:"鉱山や工事現場の運搬役でした。人が乗るのは“おまけ”だったのです。"},
 {q:"もともとのトロッコの動力は？",a:["動力なし（人が押す）","蒸気機関","電気モーター","風力"],
  e:"動力を持たない台車が本来の姿。今の観光トロッコ列車は機関車が引いています。"},
 {q:"富山の黒部峡谷トロッコ電車が、毎年おやすみする季節は？",a:["冬","夏","春","秋"],
  e:"12月から4月上旬まで、深い雪のため全線運休になります。"},
 {q:"英語で、鉱山のトロッコのことを何という？",a:["minecart（マインカート）","rockcar","digtruck","stonebox"],
  e:"ゲーム「マインクラフト」に出てくるトロッコも、英語ではこの名前です。"},
 {q:"トロッコの線路の幅は、ふつうの鉄道とくらべて？",a:["狭い","広い","同じ","線路がない"],
  e:"山道や坑道の狭い場所を通り、急なカーブを曲がるためです。"}
];
const NORMAL=[
 {q:"黒部峡谷トロッコ電車は、もともと何のために作られた？",a:["ダム・発電所の建設資材を運ぶため","観光のため","郵便を運ぶため","温泉を運ぶため"],
  e:"今も電力会社の資材運搬に使われています。観光はあくまで後からでした。"},
 {q:"京都の嵯峨野トロッコ列車が走っている線路の正体は？",a:["使われなくなった旧・山陰本線","新しく作った専用線","道路を改造した線路","地下鉄の跡"],
  e:"路線が新ルートに移ったあと、残った保津川沿いの線路を観光用に活用しています。"},
 {q:"栃木県の足尾銅山観光では、トロッコに乗ってどこへ入れる？",a:["坑道（鉱山の中）","ダムの中","洞窟の水中","城の地下"],
  e:"約460mの坑道を進みます。坑道見学にトロッコ列車を走らせたのは日本初でした。"},
 {q:"黒部峡谷鉄道の線路の幅は、新幹線とくらべると？",a:["およそ半分","同じ","およそ2倍","少しだけ広い"],
  e:"762mmで、新幹線（1435mm）の約半分。「ナローゲージ」と呼ばれます。"},
 {q:"木材を山から運び出すために作られた、トロッコの仲間の鉄道は？",a:["森林鉄道","牧場鉄道","漁業鉄道","砂漠鉄道"],
  e:"長野の木曽では、最盛期に総延長400km以上もありました。"},
 {q:"芥川龍之介の小説「トロッコ」で、少年が乗ったトロッコは何のためのもの？",a:["鉄道工事の土砂運搬用","観光用","遊園地の乗り物","農作業用"],
  e:"小田原〜熱海の軽便鉄道の工事現場が舞台。1922年（大正11年）の作品です。"}
];
const HARD=[
 {q:"昔の黒部峡谷鉄道で、観光客に渡された「便乗証」に書かれていた但し書きは？",a:["安全は保証しません","写真撮影は禁止","立ち席のみ","帽子の着用は必須"],
  e:"「便乘ノ安全ニ付テハ一切保證致シマセン」。断崖絶壁を走る危険と隣り合わせだったためです。"},
 {q:"ジェットコースターの祖先とされるアメリカの鉄道は、もともと何を運んでいた？",a:["石炭","木材","水","郵便物"],
  e:"坂を下るスリルが観光客に大人気となり、のちのコースターにつながりました。"},

const PLAN=[2,2,2,3,3,3,4,4,4,4];

/* ================= 音 ================= */
let actx=null;
function ensureAudio(){
  if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==="suspended"){ try{ actx.resume(); }catch(e){} }
}
function note(freq,dur,type,vol,delay){
  if(!actx) return;
  const t=actx.currentTime+(delay||0);
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+0.05);
}
function noiseBurst(dur,vol,freq,q,delay){
  if(!actx) return;
  const t=actx.currentTime+(delay||0);
  const n=Math.max(1,Math.floor(actx.sampleRate*dur));
  const buf=actx.createBuffer(1,n,actx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=actx.createBufferSource(); src.buffer=buf;
  const bp=actx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=freq||900; bp.Q.value=q||1;
  const g=actx.createGain(); g.gain.value=vol||0.2;
  src.connect(bp); bp.connect(g); g.connect(actx.destination); src.start(t);
}
function playClack(v){ noiseBurst(0.045,0.05*(v||1),300,1.7); }
function playSelect(){ note(720,0.07,"square",0.07); note(940,0.06,"square",0.05,0.045); }
function playSwitch(){ noiseBurst(0.05,0.13,1600,3); note(430,0.06,"square",0.06,0.02); }
function playGo(){ note(392,0.1,"triangle",0.1); note(587,0.14,"triangle",0.1,0.08); }
function playSquash(){ noiseBurst(0.22,0.32,250,0.7); noiseBurst(0.13,0.18,700,1.1,0.02); note(140,0.2,"sine",0.15,0.01); }
function playGood(){ note(784,0.12,"triangle",0.13); note(1047,0.13,"triangle",0.12,0.1); note(1319,0.26,"triangle",0.11,0.2); }
function playBad(){ note(392,0.16,"triangle",0.1); note(330,0.3,"triangle",0.09,0.14); }   // やわらかい下降(不快音は避ける)
function playStart(){ note(392,0.12,"triangle",0.11); note(523,0.16,"triangle",0.11,0.11); }
function playFanfare(n){
  [523,659,784,1047].forEach((f,i)=>note(f,0.3,"triangle",0.12,i*0.11));
  if(n>=8) note(1319,0.5,"triangle",0.11,0.5);
}

/* ================= キャンバス ================= */
const cv=$("cv"), ctx=cv.getContext("2d");
let W=0,H=0,dpr=1,lastCW=0,lastCH=0;
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  const r=cv.getBoundingClientRect();
  W=Math.max(1,r.width); H=Math.max(1,r.height);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  lastCW=r.width; lastCH=r.height;
}
window.addEventListener("resize",resize);

/* ---- ワールド定数（下から上へ進む） ---- */
const SPREAD=190, PARALLEL=300, JOIN_LEN=190;
const FORK_TOTAL=SPREAD+PARALLEL+JOIN_LEN;
const SEG_LEN=1400;
const FIRST_FORK=760;
const APPROACH=200;          // 分岐がしっかり画面に入る位置で止まる
const STOP_GAP=48;           // 分岐点の手前これだけで停止
const SPEED_RUN=310;
const TOMATO_OFF=SPREAD+PARALLEL*0.45;
const RAIL_HW=14;
const SLEEPER=26;

const forkYOf=i=>FIRST_FORK+i*SEG_LEN;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);
function laneGap(n){ return Math.min(W/(n+0.55), 106); }
function laneX(i,n){ return W/2 + (i-(n-1)/2)*laneGap(n); }
function railXAt(worldY,i,lane,n){
  const d=worldY-forkYOf(i), cx=W/2, lx=laneX(lane,n);
  if(d<=0) return cx;
  if(d<SPREAD) return lerp(cx,lx,smooth(d/SPREAD));
  if(d<SPREAD+PARALLEL) return lx;
  if(d<FORK_TOTAL) return lerp(lx,cx,smooth((d-SPREAD-PARALLEL)/JOIN_LEN));
  return cx;
}
function screenY(y){ return H - H*0.28 - (y-trainY); }
function rnd(k){ const s=Math.sin(k*127.1+7.13)*43758.5453; return s-Math.floor(s); }

/* ================= 状態 ================= */
let quiz=[], qi=0, trainY=0, speed=SPEED_RUN, phase="idle";
let selected=null, locked=false, answers=[], tomatoes=[], splash=[], dust=[];
let lastTs=0, clackAcc=0, shake=0;

function pickN(arr,k){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a.slice(0,k);
}
function buildQuiz(){
  const raw=pickN(EASY,3).concat(pickN(NORMAL,3),pickN(HARD,4));
  quiz=raw.map((item,idx)=>{
    const cnt=PLAN[idx];
    const opts=item.a.slice(0,cnt).map((txt,k)=>({txt,ok:k===0}));
    for(let i=opts.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=opts[i]; opts[i]=opts[j]; opts[j]=t; }
    return { q:item.q, e:item.e, opts, n:cnt, correct:opts.findIndex(o=>o.ok) };
  });
}
let judgeTmr=0;
function showJudge(ok){
  const el=$("judge");
  el.innerHTML = ok
    ? '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" fill="none" stroke="#ffffff" stroke-width="16"/><circle cx="50" cy="50" r="34" fill="none" stroke="#2f9e52" stroke-width="10"/></svg>'
    : '<svg viewBox="0 0 100 100"><g stroke="#ffffff" stroke-width="18" stroke-linecap="round"><line x1="24" y1="24" x2="76" y2="76"/><line x1="76" y1="24" x2="24" y2="76"/></g><g stroke="#e0443a" stroke-width="11" stroke-linecap="round"><line x1="24" y1="24" x2="76" y2="76"/><line x1="76" y1="24" x2="24" y2="76"/></g></svg>';
  el.classList.remove("on"); void el.offsetWidth; el.classList.add("on");
  clearTimeout(judgeTmr); judgeTmr=setTimeout(()=>el.classList.remove("on"),1200);
}
let msgTmr=0;
function showMsg(text,ms){
  const box=$("centerMsg"); $("centerMsgTxt").textContent=text;
  box.classList.add("on"); clearTimeout(msgTmr);
  msgTmr=setTimeout(()=>box.classList.remove("on"), ms||1800);
}

/* ================= 問題UI ================= */
function renderQuestion(){
  const q=quiz[qi];
  $("qText").textContent=q.q;
  const box=$("qOpts"); box.innerHTML=""; box.classList.toggle("one", q.n<=1);
  q.opts.forEach((o,k)=>{
    const b=document.createElement("button");
    b.className="opt"; b.type="button";
    b.innerHTML='<span class="no">'+(k+1)+'</span><span class="tx"></span><span class="go">決定</span>';
    b.querySelector(".tx").textContent=o.txt;
    b.addEventListener("click",()=>choose(k));
    box.appendChild(b);
  });
  $("tbQ").textContent="第"+(qi+1)+"問 / "+quiz.length;
}
function clearQuestion(){ $("qText").textContent=""; $("qOpts").innerHTML=""; }
function choose(k){
  if(locked||phase!=="quiz") return;
  ensureAudio();
  if(selected===k){ confirmChoice(); return; }      // 2回目=決定
  selected=k; playSwitch();
  [...$("qOpts").children].forEach((el,i)=>el.classList.toggle("sel",i===k));
}

/* ================= 進行 ================= */
function startGame(){
  ensureAudio(); buildQuiz();
  qi=0; trainY=0; speed=SPEED_RUN; selected=null; locked=false;
  answers=[]; tomatoes=[]; splash=[]; dust=[]; shake=0;
  $("titleScene").style.display="none";
  $("resultScene").classList.remove("on");
  $("gameScene").classList.add("on");
  resize(); clearQuestion();
  $("tbQ").textContent="第1問 / "+quiz.length;
  phase="intro";
  showMsg("これからトロッコ問題を開始します", 2500);
  playStart();
  setTimeout(()=>{ if(phase==="intro") phase="run"; }, 2600);
  lastTs=0; draw(); requestAnimationFrame(loop);
}
function enterQuiz(){ phase="quiz"; selected=null; locked=false; renderQuestion(); }
function confirmChoice(){
  const q=quiz[qi];
  locked=true; playGo();
  const ok=q.opts[selected].ok;
  answers.push({ q:q.q, opts:q.opts, correct:q.correct, chosen:selected, ok, e:q.e });
  q.opts.forEach((o,k)=>{ if(!o.ok) tomatoes.push({ i:qi, lane:k, n:q.n, squashed:false, t:0 }); });
  [...$("qOpts").children].forEach((el,idx)=>{
    el.classList.add("lock"); el.classList.remove("sel");
    if(q.opts[idx].ok) el.classList.add("ans");
    else if(idx===selected) el.classList.add("bad");
  });
  setTimeout(()=>{ ok?playGood():playBad(); showJudge(ok); }, 200);
  phase="pass";
}
function nextQuestion(){
  clearQuestion(); qi++;
  if(qi>=quiz.length){ phase="done"; showResult(); return; }
  phase="run";
  $("tbQ").textContent="第"+(qi+1)+"問 / "+quiz.length;
}

/* ================= ループ ================= */
function loop(ts){
  if(phase==="done"||phase==="idle") return;
  const rc=cv.getBoundingClientRect();
  if(rc.width!==lastCW||rc.height!==lastCH) resize();
  if(!lastTs) lastTs=ts;
  let dt=(ts-lastTs)/1000; lastTs=ts; if(dt>0.1) dt=0.1;

  if(phase==="run"){
    speed+=(SPEED_RUN-speed)*Math.min(1,dt*3);
    trainY+=speed*dt;
    if(trainY>=forkYOf(qi)-APPROACH) enterQuiz();
  } else if(phase==="quiz"){
    // 分岐点に「近づき続けるが、決して着かない」= 残り距離に比例して減速(アキレスと亀)
    const stopY=forkYOf(qi)-STOP_GAP;
    const rest=stopY-trainY;
    if(rest>0.5){ speed=Math.max(6,rest*1.5); trainY+=Math.min(rest*0.985,speed*dt); }
    else { speed=6; trainY+=speed*dt*0.06; }   // ほぼ止まって見えるが、わずかに進み続ける
  } else if(phase==="pass"){
    speed+=(SPEED_RUN-speed)*Math.min(1,dt*2.2);
    trainY+=speed*dt;
    if(trainY-forkYOf(qi)>=FORK_TOTAL+140) nextQuestion();
  } else if(phase==="intro"){
    speed=0;
  }

  // 走行音＋土埃
  if(speed>40){
    clackAcc+=speed*dt;
    if(clackAcc>SLEEPER*2){ clackAcc=0; playClack(Math.min(1,speed/SPEED_RUN)); }
    if(Math.random()<speed/SPEED_RUN*0.6){
      const cx=cartX();
      dust.push({ x:cx+(Math.random()*2-1)*16, y:trainY-26, r:3+Math.random()*5, life:1,
        vx:(Math.random()*2-1)*22, vy:-30-Math.random()*40 });
    }
  }
  dust.forEach(d=>{ d.x+=d.vx*dt; d.y+=d.vy*dt; d.r+=dt*9; d.life-=dt*1.5; });
  dust=dust.filter(d=>d.life>0);

  // トマトを踏む
  if(locked && phase==="pass"){
    const ty=forkYOf(qi)+TOMATO_OFF;
    tomatoes.forEach(t=>{
      if(t.i===qi && t.lane===selected && !t.squashed && trainY>=ty){
        t.squashed=true; playSquash(); shake=1;
        for(let s=0;s<16;s++) splash.push({ x:railXAt(ty,qi,t.lane,t.n)+(Math.random()*2-1)*9, y:ty,
          vx:(Math.random()*2-1)*150, vy:(Math.random()*2-1)*150, life:1, r:2+Math.random()*3.6 });
      }
    });
  }
  splash.forEach(s=>{ s.x+=s.vx*dt; s.y+=s.vy*dt; s.vx*=0.9; s.vy*=0.9; s.life-=dt*1.1; });
  splash=splash.filter(s=>s.life>0);
  if(shake>0) shake=Math.max(0,shake-dt*4);

  draw();
  requestAnimationFrame(loop);
}
function cartX(){
  const q=quiz[qi];
  if(q && locked && selected!==null && (phase==="pass")) return railXAt(trainY,qi,selected,q.n);
  return W/2;
}

/* ================= 描画 ================= */
function drawMeadow(){
  ctx.fillStyle="#8ccb70"; ctx.fillRect(0,0,W,H);
  // 草地のムラ
  const step=150, bot=trainY-H*0.4, top=trainY+H*0.85;
  for(let k=Math.floor(bot/step);k<=Math.ceil(top/step);k++){
    const r1=rnd(k*3.7), r2=rnd(k*8.1), r3=rnd(k*5.3);
    const y=k*step+r1*step, sy=screenY(y);
    if(sy<-160||sy>H+160) continue;
    ctx.fillStyle=r3>0.5?"rgba(106,174,82,.5)":"rgba(160,213,132,.45)";
    ctx.beginPath(); ctx.ellipse(r2*W, sy, 90+r1*130, 46+r3*54, 0,0,6.283); ctx.fill();
  }
  // 遠くの霞
  const g=ctx.createLinearGradient(0,0,0,H*0.32);
  g.addColorStop(0,"rgba(233,247,220,.85)"); g.addColorStop(1,"rgba(233,247,220,0)");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H*0.32);
}
function drawGrassTuft(x,sy,s,dark){
  ctx.strokeStyle=dark?"rgba(63,111,45,.75)":"rgba(94,160,70,.8)";
  ctx.lineWidth=2*s; ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(x,sy); ctx.quadraticCurveTo(x-3*s,sy-6*s,x-5*s,sy-9*s);
  ctx.moveTo(x,sy); ctx.quadraticCurveTo(x,sy-8*s,x+1*s,sy-12*s);
  ctx.moveTo(x,sy); ctx.quadraticCurveTo(x+3*s,sy-6*s,x+6*s,sy-9*s);
  ctx.stroke();
}
function drawFlower(x,sy,col,s){
  ctx.fillStyle=col;
  for(let a=0;a<5;a++){ const r=a/5*6.283; ctx.beginPath(); ctx.arc(x+Math.cos(r)*3*s,sy+Math.sin(r)*3*s,2.2*s,0,6.283); ctx.fill(); }
  ctx.fillStyle="#ffd94a"; ctx.beginPath(); ctx.arc(x,sy,1.8*s,0,6.283); ctx.fill();
}
function drawRock(x,sy,s){
  ctx.fillStyle="rgba(0,0,0,.1)"; ctx.beginPath(); ctx.ellipse(x+2,sy+3,12*s,6*s,0,0,6.283); ctx.fill();
  ctx.fillStyle="#a9a294"; ctx.beginPath(); ctx.ellipse(x,sy,11*s,8*s,0.2,0,6.283); ctx.fill();
  ctx.fillStyle="#c2bcae"; ctx.beginPath(); ctx.ellipse(x-3*s,sy-2*s,5*s,3.4*s,0.2,0,6.283); ctx.fill();
}
function drawProps(){
  const step=64, bot=trainY-H*0.4, top=trainY+H*0.85;
  const FLOWERS=["#ffffff","#ffd6e7","#ffe98a","#c9d8ff"];
  for(let k=Math.floor(bot/step);k<=Math.ceil(top/step);k++){
    for(let c=0;c<4;c++){
      const a=rnd(k*11.3+c*4.7), b=rnd(k*5.9+c*9.1), d=rnd(k*2.3+c*7.7);
      const y=k*step+a*step, sy=screenY(y);
      if(sy<-60||sy>H+60) continue;
      const x=b*W;
      const nearRail=Math.abs(x-W/2)<W*0.30;
      if(d<0.52){ drawGrassTuft(x,sy,0.8+a*0.7,d<0.2); }
      else if(d<0.72){ drawFlower(x,sy,FLOWERS[Math.floor(a*4)%4],0.9+b*0.5); }
      else { if(!nearRail) drawRock(x,sy,0.8+a*0.5); }
    }
  }
}
function drawTrack(y0,y1,xAt,hi){
  if(y1<y0) return;
  const a=Math.max(y0,trainY-H*0.45), b=Math.min(y1,trainY+H*0.85);
  if(b<a) return;
  // バラスト（砂利の帯）
  ctx.strokeStyle="rgba(216,205,180,.95)"; ctx.lineWidth=(RAIL_HW+13)*2; ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.beginPath();
  for(let y=a;y<=b;y+=10){ const sy=screenY(y); (y===a)?ctx.moveTo(xAt(y),sy):ctx.lineTo(xAt(y),sy); }
  ctx.stroke();
  // 枕木
  ctx.strokeStyle=hi===false?"rgba(169,120,70,.5)":"#a97846"; ctx.lineWidth=6.5; ctx.lineCap="butt";
  const first=Math.ceil(a/SLEEPER)*SLEEPER;
  for(let y=first;y<=b;y+=SLEEPER){
    const x=xAt(y), sy=screenY(y);
    ctx.beginPath(); ctx.moveTo(x-RAIL_HW-7,sy); ctx.lineTo(x+RAIL_HW+7,sy); ctx.stroke();
  }
  // レール
  ctx.lineCap="round";
  for(const off of [-RAIL_HW,RAIL_HW]){
    ctx.strokeStyle=hi===false?"rgba(150,157,166,.45)":"#8a939e"; ctx.lineWidth=hi?6.5:5;
    ctx.beginPath();
    for(let y=a;y<=b;y+=9){ const sy=screenY(y); (y===a)?ctx.moveTo(xAt(y)+off,sy):ctx.lineTo(xAt(y)+off,sy); }
    ctx.stroke();
    ctx.strokeStyle=hi===false?"rgba(214,220,228,.45)":"#dfe5ec"; ctx.lineWidth=hi?2.6:2;
    ctx.beginPath();
    for(let y=a;y<=b;y+=9){ const sy=screenY(y); (y===a)?ctx.moveTo(xAt(y)+off,sy-1):ctx.lineTo(xAt(y)+off,sy-1); }
    ctx.stroke();
  }
}
function drawTomato(x,sy,sc){
  ctx.save(); ctx.translate(x,sy); ctx.scale(sc,sc);
  ctx.fillStyle="rgba(0,0,0,.16)"; ctx.beginPath(); ctx.ellipse(2,4,12,7,0,0,6.283); ctx.fill();
  ctx.fillStyle="#e0443a"; ctx.beginPath(); ctx.arc(0,0,12,0,6.283); ctx.fill();
  ctx.fillStyle="#f4675c"; ctx.beginPath(); ctx.arc(-2,-2,9,0,6.283); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.45)"; ctx.beginPath(); ctx.ellipse(-4,-5,3.4,2.3,-0.5,0,6.283); ctx.fill();
  ctx.strokeStyle="#3f8f45"; ctx.lineWidth=2.6; ctx.lineCap="round";
  for(let a=0;a<5;a++){ const r=a/5*6.283; ctx.beginPath(); ctx.moveTo(0,-7.5); ctx.lineTo(Math.cos(r)*7.5,-7.5+Math.sin(r)*5.5); ctx.stroke(); }
  ctx.restore();
}
function drawSquashed(x,sy){
  ctx.save(); ctx.translate(x,sy);
  ctx.fillStyle="rgba(179,44,36,.72)"; ctx.beginPath(); ctx.ellipse(0,0,21,12,0.2,0,6.283); ctx.fill();
  ctx.fillStyle="rgba(224,68,58,.6)";
  ctx.beginPath(); ctx.ellipse(-8,4,9,5,-0.4,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse(10,-4,7,4,0.5,0,6.283); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.28)"; ctx.beginPath(); ctx.ellipse(-3,-2,5,2.6,0.3,0,6.283); ctx.fill();
  ctx.restore();
}
function drawCart(){
  const cx=cartX(), sy=screenY(trainY);
  const v=speed/SPEED_RUN;
  const bump=Math.sin(trainY/SLEEPER*Math.PI)*2.2*v;
  const sway=Math.sin(trainY/71)*1.6*v;
  ctx.save(); ctx.translate(cx+sway, sy+bump);
  // 車輪（左右に見せる）
  ctx.fillStyle="#3f4650";
  [[-RAIL_HW,-15],[RAIL_HW,-15],[-RAIL_HW,15],[RAIL_HW,15]].forEach(p=>{
    ctx.save(); ctx.translate(p[0],p[1]);
    ctx.beginPath(); ctx.roundRect(-5,-6,10,12,3.5); ctx.fill();
    ctx.fillStyle="#96a0ab"; ctx.fillRect(-5,-1.2,10,2.4); ctx.fillStyle="#3f4650";
    ctx.restore();
  });
  // 台枠
  ctx.fillStyle="#6b727c"; ctx.beginPath(); ctx.roundRect(-21,-25,42,50,5); ctx.fill();
  // 荷台（上面）
  ctx.fillStyle="#a97846"; ctx.strokeStyle="#7c5530"; ctx.lineWidth=2.6;
  ctx.beginPath(); ctx.roundRect(-19,-23,38,46,5); ctx.fill(); ctx.stroke();
  // 板の目
  ctx.strokeStyle="rgba(124,85,48,.5)"; ctx.lineWidth=1.6;
  [-9,0,9].forEach(x=>{ ctx.beginPath(); ctx.moveTo(x,-21); ctx.lineTo(x,21); ctx.stroke(); });
  // 内側
  ctx.fillStyle="rgba(60,40,22,.42)"; ctx.beginPath(); ctx.roundRect(-14,-18,28,36,4); ctx.fill();
  // 積んだ石
  const st=[[-5,-9,5.4],[6,-3,4.4],[-3,6,5],[6,11,3.6],[-8,13,3.2]];
  st.forEach((s,i)=>{
    ctx.fillStyle=i%2?"#9aa2ab":"#aeb6bf";
    ctx.beginPath(); ctx.arc(s[0],s[1]+Math.sin(trainY/SLEEPER*Math.PI+i)*0.8*v,s[2],0,6.283); ctx.fill();
  });
  // 進行方向のフチ（少し明るく）
  ctx.strokeStyle="rgba(255,255,255,.28)"; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.moveTo(-17,-22); ctx.lineTo(17,-22); ctx.stroke();
  ctx.restore();
}
function markY(){ return forkYOf(qi)+SPREAD*0.72; }   // トマト(SPREAD+PARALLEL*0.45)より手前
function drawLaneMarks(){
  const q=quiz[qi]; if(!q||(phase!=="quiz"&&phase!=="pass")) return;
  const my=markY(), sy=screenY(my);
  if(sy<-40||sy>H+40) return;
  for(let k=0;k<q.n;k++){
    const x=laneX(k,q.n), on=(selected===k);
    ctx.save(); ctx.translate(x,sy);
    // 標識のポール
    ctx.strokeStyle="rgba(60,60,60,.35)"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(0,16); ctx.lineTo(0,4); ctx.stroke();
    ctx.fillStyle="rgba(0,0,0,.16)"; ctx.beginPath(); ctx.ellipse(2,3,15,6,0,0,6.283); ctx.fill();
    ctx.fillStyle=on?"#e0443a":"#fff";
    ctx.strokeStyle=on?"#b32c24":"#4f8d3d"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,-4,16,0,6.283); ctx.fill(); ctx.stroke();
    ctx.fillStyle=on?"#fff":"#4f8d3d"; ctx.font="900 18px 'Noto Sans JP',sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(String(k+1),0,-3);
    ctx.restore();
  }
}
function draw(){
  ctx.save();
  if(shake>0) ctx.translate((Math.random()*2-1)*4*shake,(Math.random()*2-1)*4*shake);
  ctx.clearRect(-10,-10,W+20,H+20);
  drawMeadow();
  drawProps();

  const cxf=()=>W/2;
  const from=Math.floor((trainY-H*0.5-FIRST_FORK)/SEG_LEN)-1;
  const to=Math.ceil((trainY+H*0.9-FIRST_FORK)/SEG_LEN)+1;
  for(let i=Math.max(-1,from);i<=to;i++){
    const fy=forkYOf(i);
    const prevEnd=(i<=0)? -3000 : forkYOf(i-1)+FORK_TOTAL;
    drawTrack(prevEnd, fy, cxf);
    if(i<0||i>=quiz.length) continue;
    const n=quiz[i]?quiz[i].n:2;
    const cur=(i===qi);
    // 描画順: 手前に出したいレーンを最後に描く(未選択なら1番=index0を最前面、選択中はそのレーン)
    const front = cur ? (selected!==null?selected:0) : (n-1);
    const order=[]; for(let lane=0;lane<n;lane++) if(lane!==front) order.push(lane); order.push(front);
    order.forEach(lane=>{
      let hi;
      if(cur) hi = (selected===null) ? false : (lane===selected);   // 未選択=全部グレー / 選択後=その線だけ濃く
      drawTrack(fy, fy+FORK_TOTAL, y=>railXAt(y,i,lane,n), hi);
    });
  }
  if(quiz.length){
    const lastEnd=forkYOf(quiz.length-1)+FORK_TOTAL;
    drawTrack(lastEnd, lastEnd+4000, cxf);
  }

  tomatoes.forEach(t=>{
    const y=forkYOf(t.i)+TOMATO_OFF, sy=screenY(y);
    if(sy<-50||sy>H+50) return;
    const x=railXAt(y,t.i,t.lane,t.n);
    if(t.squashed) drawSquashed(x,sy);
    else { t.t=Math.min(1,t.t+0.07); const p=smooth(t.t); drawTomato(x,sy,p*(1.22-0.22*p)); }
  });
  // 土埃
  dust.forEach(d=>{
    const sy=screenY(d.y);
    ctx.globalAlpha=Math.max(0,d.life)*0.45; ctx.fillStyle="#cfc6ad";
    ctx.beginPath(); ctx.arc(d.x,sy,d.r,0,6.283); ctx.fill(); ctx.globalAlpha=1;
  });
  // 飛沫
  splash.forEach(s=>{
    const sy=screenY(s.y);
    ctx.globalAlpha=Math.max(0,s.life); ctx.fillStyle="#cf3b2f";
    ctx.beginPath(); ctx.arc(s.x,sy,s.r,0,6.283); ctx.fill(); ctx.globalAlpha=1;
  });

  drawLaneMarks();
  drawCart();
  ctx.restore();
}

/* ================= 結果 ================= */
function esc(s){ return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function showResult(){
  const n=answers.filter(a=>a.ok).length;
  $("rScore").innerHTML=n+'<small>/ '+answers.length+'問正解</small>';
  $("rRank").textContent = n>=10?"トロッコ博士":n>=8?"かなりの通":n>=6?"なかなか":n>=3?"これから":"まずは一周";
  const list=$("rList"); list.innerHTML="";
  answers.forEach((a,idx)=>{
    const d=document.createElement("div");
    d.className="r-item"+(a.ok?"":" ng");
    const yours=a.ok?"":'<div class="r-yours">あなたの答え：'+esc(a.opts[a.chosen].txt)+'</div>';
    d.innerHTML='<div class="r-q">第'+(idx+1)+'問　'+esc(a.q)+'</div>'
      +'<div class="r-a"><span class="mark">正解</span>'+esc(a.opts[a.correct].txt)+'</div>'
      +yours+'<div class="r-e">'+esc(a.e)+'</div>';
    list.appendChild(d);
  });
  list.scrollTop=0;
  $("gameScene").classList.remove("on");
  $("resultScene").classList.add("on");
  playFanfare(n);
}

/* ================= 配線 ================= */
$("startBtn").addEventListener("click",()=>{ ensureAudio(); playSelect(); startGame(); });
$("rAgain").addEventListener("click",()=>{ ensureAudio(); playSelect(); startGame(); });
$("rTitle").addEventListener("click",()=>{
  ensureAudio(); playSelect(); phase="idle";
  $("resultScene").classList.remove("on"); $("gameScene").classList.remove("on");
  $("titleScene").style.display="";
});
// キャンバスの標識をタップしても選べる
cv.addEventListener("pointerdown",e=>{
  ensureAudio();
  if(phase!=="quiz"||locked) return;
  const q=quiz[qi]; if(!q) return;
  const r=cv.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
  const sy=screenY(markY());
  for(let k=0;k<q.n;k++){
    const x=laneX(k,q.n);
    if(Math.hypot(px-x,py-(sy-4))<30){ choose(k); break; }
  }
},{passive:true});
window.addEventListener("pointerdown",ensureAudio,{passive:true});
resize();
})();
</script>

<!-- 端末別のタップ/クリック表記(全ゲーム共通スニペット) -->
<script>
(function(){
  window.__TAPW = matchMedia("(pointer:coarse)").matches ? "タップ" : "クリック";
  const w=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null); const arr=[]; let n;
  while(n=w.nextNode()) arr.push(n);
  arr.forEach(t=>{ if(t.nodeValue && t.nodeValue.indexOf("タッチ")<0 && (t.nodeValue.indexOf("タップ")>=0||t.nodeValue.indexOf("クリック")>=0)){ t.nodeValue=t.nodeValue.replace(/タップ|クリック/g, window.__TAPW); } });
})();
</script>
