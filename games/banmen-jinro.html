<!--
  盤面人狼（仮名称・2026-09-24着手）
  ■ オンラインは「方式A=クライアント側の性善説」(牧村了承済み)
    ホストが盤面・役職・毒タイマーなど全部を持ち、スナップショットをそのまま全員に配る。
    フォグ・オブ・ウォー(見えない所を隠す)は各端末の表示だけで行っている。
    ＝ブラウザの開発者ツールでbroadcastの生データを見れば、他人の位置や役職を覗けてしまう(既知の制約)。
    ★将来きちんと隠したくなったら、Supabase側にRPC(SQL関数)で進行ロジックを持たせ、
      各プレイヤーには「その人に見えてよい情報」だけを返す作りに全面的に作り直す必要がある。
  ■ 試作用の「ひとりでためす」(DEBUG)は本番公開前に外すか牧村さんに確認すること(window.__bjDev と同じ位置づけ)
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
  :root{
    --bg:#1e1a2e;
    --card:#f4efe6;
    --ink:#211d2b;
    --gold:#e8b647;
    --gold-d:#b8871f;
    --red:#e3452f;
    --wolf:#e0533d;
    --seer:#4ea4e8;
    --vil:#6cc47a;
    --uiw:min(94vw,500px);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;
     font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif; }
  body{ min-height:100svh; background:var(--bg); color:var(--card);
    display:flex; flex-direction:column; align-items:center;
    user-select:none; -webkit-user-select:none; overflow-x:hidden; }
  input{ user-select:text; -webkit-user-select:text; }
  body::before{ content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
    background:radial-gradient(circle at 50% -10%, rgba(120,98,190,.28), transparent 60%); }

  .scene{ display:none; width:100%; flex-direction:column; align-items:center; padding:14px 0 40px; }
  .scene.on{ display:flex; animation:sceneIn .34s cubic-bezier(.2,.8,.3,1); }
  @keyframes sceneIn{ 0%{ opacity:0; transform:translateY(18px); } 100%{ opacity:1; transform:none; } }
  #lobbyScene{ padding-top:64px; }
  #gameScene{ padding-top:150px; padding-bottom:290px; }   /* 上下にスクロール余白(全ゲーム共通ルール) */

  /* ===== タイトル ===== */
  .logo{ margin:9vh 0 4px; font-size:clamp(50px,14vw,80px); font-weight:900; letter-spacing:.06em;
    text-shadow:0 5px 0 rgba(0,0,0,.35); }
  .logo .l2{ color:var(--wolf); }
  .t-sub{ font-size:13px; font-weight:700; letter-spacing:.12em; opacity:.6; margin-bottom:26px; }
  .room-row{ display:flex; gap:10px; margin-top:6px; }
  .room-row button{ padding:15px 12px; border:none; border-radius:14px; cursor:pointer; width:min(150px,calc((100vw - 42px)/2)); white-space:nowrap;
    background:rgba(244,239,230,.13); color:var(--card); font-size:16px; font-weight:900; letter-spacing:.06em; }
  .room-row button:active{ transform:translateY(2px); }
  #roomArea{ display:flex; flex-direction:column; align-items:center; gap:6px; width:var(--uiw); margin-top:14px; }
  .dev-box{ margin-top:34px; width:var(--uiw); max-width:380px; border:1.5px dashed rgba(244,239,230,.3); border-radius:14px;
    padding:12px 14px 14px; display:flex; flex-direction:column; align-items:center; gap:9px; opacity:.8; }
  #cpuRoleRow{ flex-wrap:nowrap; gap:5px; }
  #cpuRoleRow .txt-btn{ padding:7px 10px; font-size:12.5px; white-space:nowrap; }
  .dev-box .dev-h{ font-size:11.5px; font-weight:900; letter-spacing:.14em; opacity:.7; }

  .sec-label{ font-size:12px; font-weight:900; letter-spacing:.22em; opacity:.55; margin-bottom:9px; }
  .rule-frame{ width:var(--uiw); background:rgba(0,0,0,.18); border:1.5px solid rgba(244,239,230,.18);
    border-radius:16px; padding:14px 12px; display:grid; grid-template-columns:1fr 1fr; gap:12px 10px; }
  .rule-col{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .rc-name{ font-size:12px; font-weight:800; letter-spacing:.08em; opacity:.7; }
  .rc-row{ display:flex; align-items:center; gap:8px; }
  .rc-val{ min-width:72px; text-align:center; font-size:17px; font-weight:900; color:var(--gold); }
  .stp{ width:34px; height:34px; border:none; border-radius:10px; cursor:pointer;
    background:rgba(244,239,230,.14); color:var(--card); font-size:18px; font-weight:900; line-height:1; }
  .stp:active{ transform:translateY(2px); }
  .stp:disabled{ opacity:.3; cursor:default; }
  .rule-reset{ display:block; margin:10px auto 0; border:none; background:none; padding:4px 2px;
    font-size:12.5px; font-weight:800; color:var(--card); opacity:.85; text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
  .rule-sum{ font-size:12.5px; font-weight:700; opacity:.72; text-align:center; line-height:1.7; }

  .btn-main{ width:var(--uiw); max-width:340px; margin-top:14px; padding:14px; border:none; border-radius:16px; cursor:pointer;
    background:linear-gradient(165deg,#f4c85f,var(--gold) 55%,var(--gold-d));
    color:#3a2a06; font-size:18px; font-weight:900; letter-spacing:.12em; box-shadow:0 5px 0 #8d6712; }
  .btn-main:active{ transform:translateY(3px); box-shadow:0 2px 0 #8d6712; }
  .btn-main:disabled{ filter:grayscale(1) brightness(.75); cursor:default; }
  .txt-btn{ padding:9px 22px; border:1.5px solid rgba(244,239,230,.35); border-radius:999px;
    background:transparent; color:var(--card); font-size:14px; font-weight:800; letter-spacing:.08em; cursor:pointer; }
  .txt-btn:active{ transform:translateY(1px); }
  .txt-btn.sel{ background:var(--gold); border-color:var(--gold); color:#3a2a06; }

  /* ===== ロビー ===== */
  .lobby-title{ font-size:19px; font-weight:900; letter-spacing:.06em; margin-bottom:14px; }
  #lobbyBox{ display:flex; flex-direction:column; align-items:center; gap:13px; width:var(--uiw); }
  .lobby-list{ display:flex; flex-direction:column; gap:7px; width:100%; }
  .lobby-row{ display:flex; align-items:center; gap:10px; background:rgba(244,239,230,.1);
    border-radius:11px; padding:9px 14px; font-size:15px; font-weight:800; }
  .lobby-row .nm{ flex:1; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lobby-row .nm.undef{ opacity:.42; font-weight:700; }
  .p-dot{ width:12px; height:12px; border-radius:50%; flex:none; }
  .lobby-row .hostmark{ flex:none; font-size:11px; font-weight:900; color:#3a2a06; background:var(--gold); border-radius:999px; padding:2px 10px 3px; }
  .lobby-row .you{ flex:none; font-size:11px; font-weight:900; color:var(--card); background:rgba(244,239,230,.28); border-radius:999px; padding:2px 10px 3px; }
  .lobby-row .kick-btn{ flex:none; font-size:11px; font-weight:900; color:#ff8f7d; background:none;
    border:1.5px solid rgba(255,143,125,.55); border-radius:999px; padding:3px 10px; cursor:pointer; }
  .code-row{ display:flex; align-items:center; gap:8px; }
  .code-input{ width:170px; padding:11px 14px; border:2px solid rgba(244,239,230,.4); border-radius:12px;
    background:#fff; color:var(--ink); font-size:19px; font-weight:900; letter-spacing:.24em; text-align:center; }
  .paste-btn{ width:42px; height:42px; border:none; background:none; color:var(--card); cursor:pointer;
    display:flex; align-items:center; justify-content:center; opacity:.8; }
  .paste-btn svg{ width:22px; height:22px; }
  .code-show{ display:flex; align-items:center; gap:10px; justify-content:center; cursor:pointer;
    border:2px solid rgba(244,239,230,.4); border-radius:14px; padding:10px 22px; font-size:27px; font-weight:900; letter-spacing:.28em; }
  .code-show svg{ width:19px; height:19px; opacity:.7; }
  .room-note{ font-size:12.5px; font-weight:700; letter-spacing:.05em; opacity:.7; text-align:center; }
  .room-note.err{ color:#ff8f7d; opacity:1; }

  /* ===== ゲーム ===== */
  .top-bar{ width:var(--uiw); display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; margin-bottom:10px; }
  .top-bar>:first-child{ justify-self:start; }
  .top-bar>:last-child{ justify-self:end; }
  .pill{ font-size:12.5px; font-weight:900; letter-spacing:.06em; background:rgba(0,0,0,.24);
    border:1.5px solid rgba(244,239,230,.2); border-radius:999px; padding:6px 12px; white-space:nowrap; }
  .phase-tag{ font-size:17px; font-weight:900; letter-spacing:.1em; color:var(--gold); white-space:nowrap; }
  .timer{ font-size:22px; font-weight:900; letter-spacing:.04em; font-variant-numeric:tabular-nums; }
  .timer.warn{ color:#ff8f7d; }
  /* 常設のプレイヤー一覧(死亡は議論のはじめにだけ公表) */
  .roster{ width:var(--uiw); display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:12px; }
  .ros{ display:flex; align-items:center; gap:6px; padding:5px 10px 5px 6px; border-radius:999px;
    background:rgba(244,239,230,.1); font-size:12.5px; font-weight:800; max-width:48%; }
  .ros .nm{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ros .av{ width:20px; height:20px; border-radius:50%; flex:none; position:relative; }
  .ros.dead{ opacity:.42; }
  .ros.dead .nm{ text-decoration:line-through; }
  .ros.dead .av::after{ content:""; position:absolute; inset:-2px; background:
    linear-gradient(45deg,transparent 44%,#fff 44%,#fff 56%,transparent 56%),
    linear-gradient(-45deg,transparent 44%,#fff 44%,#fff 56%,transparent 56%); }
  .ros .tg{ font-size:10.5px; font-weight:900; border-radius:999px; padding:1px 7px; flex:none; }
  .tg.me{ background:rgba(244,239,230,.3); color:var(--card); }
  .tg.mate{ background:var(--wolf); color:#fff; }
  .tg.white{ background:#fff; color:#222; }
  .tg.black{ background:#111; color:#fff; border:1px solid rgba(255,255,255,.5); }
  .tg.role{ background:rgba(0,0,0,.4); color:var(--card); }

  .my-role{ font-size:13px; font-weight:800; letter-spacing:.06em; opacity:.8; margin-bottom:8px; display:flex; gap:8px; align-items:center; }
  .role-chip{ font-size:12px; font-weight:900; border-radius:999px; padding:3px 11px; color:#fff; }
  .role-chip.villager{ background:var(--vil); } .role-chip.seer{ background:var(--seer); } .role-chip.wolf{ background:var(--wolf); }

  .board-wrap{ width:min(94vw,460px); position:relative; }
  #board{ display:block; width:100%; height:auto; touch-action:manipulation; border-radius:12px; overflow:hidden;
    box-shadow:0 6px 20px rgba(0,0,0,.35); }
  #board .cell{ cursor:default; }
  #board .cell.can, #board.mv, #board.mv .cell{ cursor:pointer; }
  #board .pc{ transition:transform .38s cubic-bezier(.3,.8,.3,1), opacity .3s; }
  #board .pc.tg{ cursor:pointer; }
  #board .ring{ fill:none; stroke:#fff; stroke-width:.8; stroke-dasharray:1.6 1.2; animation:ringSpin 3s linear infinite; }
  @keyframes ringSpin{ to{ stroke-dashoffset:-11; } }

  .ctrl{ width:var(--uiw); margin-top:14px; display:flex; flex-direction:column; align-items:center; gap:10px; min-height:120px; }
  .hint{ font-size:13.5px; font-weight:800; letter-spacing:.04em; text-align:center; line-height:1.7; opacity:.88; }
  .hint.sub{ font-size:12px; font-weight:700; opacity:.62; }
  .pad{ display:grid; grid-template-columns:repeat(3,58px); grid-template-rows:repeat(3,52px); gap:6px; }
  .pad button{ border:none; border-radius:12px; cursor:pointer; background:rgba(244,239,230,.13); color:var(--card);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900; }
  .pad button svg{ width:24px; height:24px; }
  .pad button.sel{ background:var(--gold); color:#3a2a06; }
  .pad button.pre{ box-shadow:inset 0 0 0 2.5px var(--gold); color:var(--gold); }     /* 1回目で選んだ(まだ決定していない) */
  /* ささやき(となりの人に3文字まで) */
  #whBox{ display:none; width:var(--uiw); max-width:380px; margin-top:12px; padding:10px 12px 12px; border-radius:14px;
    background:rgba(0,0,0,.18); border:1.5px solid rgba(244,239,230,.14); flex-direction:column; align-items:center; gap:8px; }
  #whBox.on{ display:flex; }
  #whBox .wh-h{ font-size:12px; font-weight:900; letter-spacing:.12em; opacity:.7; }
  #whBox .wh-row{ display:flex; gap:7px; align-items:center; }
  #whIn{ width:96px; padding:8px 10px; border-radius:8px; border:none; font:inherit; font-size:16px; font-weight:800; text-align:center;
    background:#fff; color:#23211f; box-shadow:0 2px 7px rgba(0,0,0,.25); }
  #whGo{ padding:8px 14px; }
  #whBox.done #whIn, #whBox.done #whGo{ opacity:.35; pointer-events:none; }
  .pad button:disabled{ opacity:.25; cursor:default; }
  .pad button:active:not(:disabled){ transform:translateY(2px); }
  .opt-row{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .tchip{ display:flex; align-items:center; gap:7px; padding:8px 14px 8px 9px; border-radius:999px; cursor:pointer;
    border:2px solid rgba(244,239,230,.25); background:rgba(244,239,230,.08); color:var(--card); font-size:14px; font-weight:800; }
  .tchip.sel{ border-color:var(--gold); background:rgba(232,182,71,.22); }
  .tchip .av{ width:18px; height:18px; border-radius:50%; }
  .sub-btns{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .sub-btns .txt-btn{ min-width:132px; }
  .notes{ width:var(--uiw); margin-top:4px; font-size:12.5px; font-weight:700; line-height:1.8; opacity:.85; text-align:center; }
  .vres{ width:var(--uiw); display:flex; flex-direction:column; gap:5px; }
  .vres-row{ display:flex; align-items:center; gap:9px; padding:6px 12px; border-radius:10px; background:rgba(244,239,230,.08); font-size:14px; font-weight:800; }
  .vres-row .nm{ flex:1; text-align:left; }
  .vres-row.top{ background:rgba(224,83,61,.28); }
  .big-msg{ font-size:22px; font-weight:900; letter-spacing:.06em; text-align:center; }

  /* 試作用(DEBUG)パネル */
  .dbg{ width:var(--uiw); margin-top:18px; border:1.5px dashed rgba(244,239,230,.35); border-radius:14px; padding:10px 12px 12px; }
  .dbg-h{ font-size:11.5px; font-weight:900; letter-spacing:.12em; opacity:.7; margin-bottom:7px; text-align:center; }
  .dbg-row{ display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:9px; font-size:12.5px; font-weight:700; cursor:pointer; }
  .dbg-row.act{ background:rgba(232,182,71,.24); }
  .dbg-row.dead{ opacity:.45; }
  .dbg-row .nm{ min-width:34px; font-weight:900; }
  .dbg-row .inf{ flex:1; text-align:left; opacity:.85; }
  .dbg-row .ok{ font-size:11px; font-weight:900; color:var(--vil); }
  .dbg-btns{ display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin-top:9px; }
  .dbg-btns .txt-btn{ padding:6px 13px; font-size:12px; }

  .toast{ position:fixed; left:50%; bottom:38px; transform:translateX(-50%); z-index:90;
    background:rgba(24,20,38,.96); border:1.5px solid rgba(244,239,230,.3); color:var(--card);
    padding:11px 20px; border-radius:999px; font-size:14px; font-weight:800; letter-spacing:.05em;
    opacity:0; pointer-events:none; transition:opacity .2s; white-space:nowrap; max-width:92vw; }
  .toast.on{ opacity:1; }
  #bigFx{ position:fixed; inset:0; z-index:78; display:none; align-items:center; justify-content:center; pointer-events:none; }
  #bigFx.on{ display:flex; animation:bigFx 2.2s ease-out forwards; }
  #bigFx span{ font-size:clamp(28px,8.6vw,48px); font-weight:900; letter-spacing:.1em; color:#fff; text-shadow:0 4px 0 rgba(0,0,0,.45);
    background:rgba(20,16,32,.55); padding:10px 26px; border-radius:18px; }
  @keyframes bigFx{ 0%{opacity:0; transform:scale(1.25);} 12%{opacity:1; transform:scale(1);} 80%{opacity:1;} 100%{opacity:0;} }

  .help-btn{ position:fixed; left:12px; top:12px; z-index:40; display:flex; align-items:center; gap:6px;
    padding:7px 14px 7px 8px; border:none; border-radius:999px; cursor:pointer;
    background:rgba(244,239,230,.12); color:var(--card); font-size:13px; font-weight:900; letter-spacing:.06em; }
  .help-btn span{ width:20px; height:20px; border-radius:50%; background:var(--gold); color:#3a2a06;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900; }
  .snd-btn{ position:fixed; right:12px; top:12px; z-index:40; display:flex; align-items:center; gap:6px;
    padding:7px 14px; border:none; border-radius:999px; cursor:pointer;
    background:rgba(244,239,230,.12); color:var(--card); font-size:13px; font-weight:900; letter-spacing:.06em; }
  .snd-btn svg{ width:17px; height:17px; }
  .snd-btn .slash{ display:none; }
  .snd-btn.off .wave{ display:none; }
  .snd-btn.off .slash{ display:block; }
  #roleBtn{ top:54px; display:none; }
  #gameScene.on ~ #roleBtn{ display:flex; }

  .overlay{ position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center; padding:18px;
    background:rgba(10,8,20,.72); opacity:0; pointer-events:none; transition:opacity .24s; }
  .overlay.on{ opacity:1; pointer-events:auto; }
  .r-card{ width:min(92vw,430px); max-height:82svh; overflow-y:auto; background:var(--card); color:var(--ink);
    border-radius:18px; border-top:9px solid var(--gold); padding:24px 20px 20px; text-align:center;
    transition:opacity .2s, transform .2s; }
  .r-card::-webkit-scrollbar{ width:7px; }
  .r-card::-webkit-scrollbar-track{ background:transparent; }
  .r-card::-webkit-scrollbar-thumb{ background:rgba(33,29,43,.26); border-radius:99px; }
  .r-title{ font-size:24px; font-weight:900; letter-spacing:.1em; margin-bottom:12px; }
  .h-sec{ position:relative; text-align:left; font-size:15px; font-weight:900; letter-spacing:.08em; margin:14px 0 6px; padding-left:12px; }
  .h-sec::before{ content:""; position:absolute; left:0; top:2px; bottom:2px; width:5px; border-radius:3px; background:var(--gold); }
  .r-card p{ text-align:left; font-size:14px; font-weight:500; line-height:1.85; }
  .r-card .h-list{ text-align:left; font-size:14px; font-weight:500; line-height:1.85; margin:0 0 4px 18px; }
  .r-card .close{ margin-top:16px; padding:10px 26px; border:none; border-radius:999px; cursor:pointer;
    background:var(--gold); color:#3a2a06; font-size:15px; font-weight:900; letter-spacing:.1em; }
  .r-btns{ display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  .r-btns button{ margin-top:0 !important; }
  .r-btns .ghost{ padding:10px 22px; border:1.5px solid rgba(33,29,43,.3); border-radius:999px; background:transparent; color:var(--ink);
    font-size:14px; font-weight:900; cursor:pointer; }
  .role-big{ font-size:40px; font-weight:900; letter-spacing:.12em; margin:6px 0 10px; }
  .role-big.villager{ color:#2f9a47; } .role-big.seer{ color:#2b7fc2; } .role-big.wolf{ color:#c93b27; }

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const TAPW=(window.matchMedia&&matchMedia("(pointer:coarse)").matches)?"タップ":"クリック";
window.__TAPW=TAPW;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ================= 効果音(全合成) ================= */
let actx=null, seBus=null, noiseBuf=null;
let seOn=true; try{ seOn=localStorage.getItem("bj.se")!=="0"; }catch(e){}
function ensureAudio(){
  if(!actx){
    try{
      actx=new (window.AudioContext||window.webkitAudioContext)();
      seBus=actx.createGain(); seBus.gain.value=seOn?1:0; seBus.connect(actx.destination);
      const len=actx.sampleRate; noiseBuf=actx.createBuffer(1,len,actx.sampleRate);
      const d=noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    }catch(e){}
  }
  if(actx&&actx.state!=="running"){ try{ actx.resume(); }catch(e){} }
}
/* ★スマホで音が鳴らなくなる対策(2026-09-24牧村指摘「スマホだと音声が安定しない・ならないことが多々ある」)
   スマホは「他のアプリの音・電話・画面ロック・タブの切り替え」で音の箱(AudioContext)が勝手に止まる。
   止まったまま誰も起こさないと、そのあとの音は全部無音になる(とくにタイマーや通信で鳴る音)。
   → ①画面のどこを触っても ②アプリから戻ってきても ③ページを表示し直しても 起こし直す。
   ※音の箱を作れるのは「人が触った瞬間」だけなので、最初の1タップで必ず作られるようにもなる。 */
function audioWake(){ try{ ensureAudio(); }catch(e){} }
["pointerdown","touchend","keydown"].forEach(function(t){ document.addEventListener(t,audioWake,{capture:true,passive:true}); });
document.addEventListener("visibilitychange",function(){ if(!document.hidden) audioWake(); });
window.addEventListener("pageshow",audioWake);
window.addEventListener("focus",audioWake);
function note(f,t,dur,vol,type,f2){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.006); g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(g); g.connect(seBus); o.start(t); o.stop(t+dur+0.02);
}
function noiseHit(t,f1,f2,q,vol,dur){
  if(!actx) return;
  const n=actx.createBufferSource(); n.buffer=noiseBuf;
  const b=actx.createBiquadFilter(); b.type="bandpass"; b.frequency.setValueAtTime(f1,t);
  b.frequency.exponentialRampToValueAtTime(f2,t+dur*0.9); b.Q.value=q;
  const g=actx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.002);
  g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  n.connect(b); b.connect(g); g.connect(seBus); n.start(t); n.stop(t+dur+0.02);
}
const T0=()=>actx?actx.currentTime:0;
function playSelect(){ if(!actx) return; note(880,T0(),0.07,0.14,"triangle"); }
function playTick(){ if(!actx) return; note(1320,T0(),0.04,0.07,"triangle"); }
function playWhisper(){ if(!actx) return; const t=T0(); note(1568,t,0.09,0.06,"sine"); note(1175,t+0.08,0.14,0.05,"sine"); }
function playStep(){ if(!actx) return; const t=T0(); note(660,t,0.08,0.1,"triangle"); note(990,t+0.07,0.1,0.08,"triangle"); }
function playMove(){ if(!actx) return; noiseHit(T0(),500,1800,0.9,0.12,0.3); }
function playSeer(){ if(!actx) return; const t=T0(); [1047,1319,1568].forEach((f,i)=>note(f,t+i*0.07,0.4,0.09,"sine")); }
function playPoison(){ if(!actx) return; const t=T0(); note(420,t,0.18,0.14,"sine",180); note(300,t+0.12,0.28,0.1,"triangle",120); }
function playDeath(){ if(!actx) return; const t=T0(); note(220,t,0.7,0.18,"sawtooth",90); note(233,t,0.7,0.08,"sine",96); noiseHit(t,300,120,0.6,0.1,0.6); }
function playTalk(){ if(!actx) return; const t=T0(); [523,659,784].forEach((f,i)=>note(f,t+i*0.1,0.3,0.12,"triangle")); }
function playVote(){ if(!actx) return; const t=T0(); note(392,t,0.16,0.14,"square"); note(294,t+0.14,0.3,0.12,"square"); }
function playWarn(){ if(!actx) return; note(880,T0(),0.06,0.09,"square"); }
function playWin(){ if(!actx) return; const t=T0();
  [523,659,784,1047].forEach((f,i)=>note(f,t+i*0.09,0.22,0.14,"triangle"));
  [523,659,784,1047].forEach(f=>note(f,t+0.42,0.9,0.09,"triangle")); note(262,t+0.42,0.9,0.1,"sine"); }
function playLose(){ if(!actx) return; const t=T0(); [523,466,392,311].forEach((f,i)=>note(f,t+i*0.16,0.3,0.12,"triangle")); }
function renderSnd(){ $("seBtn").classList.toggle("off", !seOn); }
$("seBtn").addEventListener("click",()=>{
  ensureAudio(); seOn=!seOn; try{ localStorage.setItem("bj.se", seOn?"1":"0"); }catch(e){}
  if(seBus&&actx) seBus.gain.setTargetAtTime(seOn?1:0, actx.currentTime, 0.02);
  renderSnd(); if(seOn) playSelect();
});

/* ================= ルールと定数 ================= */
/* 視界。r=まわり何マスまでの正方形(1=周囲8マス)／cut=縦横の合計がこれを超える所は見えない(四隅を落とす)
   市民・占い師=周囲8マス(3×3)／人狼=3×3の各辺に3マスずつ足した21マス(5×5から四隅を抜いた形)
   役職を足す時はここに足すだけ */
const VIEW={ villager:{r:1}, seer:{r:1}, wolf:{r:2,cut:3} };
function inView(role,dx,dy){ const v=VIEW[role]||VIEW.villager, ax=Math.abs(dx), ay=Math.abs(dy);
  return Math.max(ax,ay)<=v.r && (!v.cut || ax+ay<=v.cut); }
const ROLE_NAME={ villager:"市民", seer:"占い師", wolf:"人狼" };
const WOLF_TEAM={ wolf:true };                       // 人狼陣営の役職(占いで「黒」が出る)
/* 人数ごとの役職の数(牧村さんの意向で調整しやすいようにここに集約) */
const ROLE_PLAN={ 4:{wolf:1,seer:1}, 5:{wolf:1,seer:1}, 6:{wolf:2,seer:1}, 7:{wolf:2,seer:1}, 8:{wolf:2,seer:1} };
const MIN_P=4, MAX_P=8;
const PCOL=["#ff6b6b","#4dabf7","#69db7c","#ffd43b","#da77f2","#ff922b","#38d9a9","#f783ac"];
const N_OPTS=[5,6,7,8,9];                             // 盤の広さ
const TURN_OPTS=[3,4,5,6,7,8,9,10,12,15];             // 移動フェーズのターン数
const TALK_OPTS=[30,60,90,120,150,180,240,300];        // 議論の時間(秒)
const STEP_OPTS=[10,15,20,30,45,60];                  // 1ステップ(移動/アクション)の制限時間(秒)
const VOTE_SEC=30;                                    // 投票の制限時間(秒)
const VRES_MS=5000;                                   // 投票結果を見せる時間
const DEF_RULES={ n:7, turns:8, talk:120, step:20 };
let rules=Object.assign({},DEF_RULES);
const DIRS={ u:[0,-1], d:[0,1], l:[-1,0], r:[1,0], s:[0,0] };
const dist=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
const fmtT=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");

/* ================= 状態 =================
   G=ゲームの全状態。ホスト(と試作モード)が正で、ゲストはスナップショットで同じものを持つ(方式A) */
let G=null;
let phaseUI="title";            // title / lobby / game
let online=false, isHost=false, hostId=null, ch=null, code="";
let debug=false, dbgActor=null, dbgFog=false;   // ★試作用
let cpuMode=false, cpuRole="";                  // ★試作用: ロボット対戦(自分1人+ロボット)。cpuRole=自分の役職(""=おまかせ)
let myId=Math.random().toString(36).slice(2,10);   // 端末ごとの乱数(固定値にしない=クッKeyの事故の教訓)
let myName=""; try{ myName=(localStorage.getItem("bj.name")||"").slice(0,16); }catch(e){}
let lobby=[];                   // ロビーのメンバー [{id,n,c,t}]
let localEnd=0;                 // このステップの締め切り(自分の端末の時計で)
let pending=null, pendingSent=0; // ゲストの未確認の入力(スナップに載るまで送り直す)
let sel={ move:null, tg:null, dl:0, vote:null, wt:null };   // 画面での選択中(move=1回目で選んだ移動先・wt=ささやく相手)
let whPending=[];                // ゲストの未確認のささやき(スナップに載るまで送り直す)
let bubbles=[];                  // 盤面に出すささやきの吹き出し [{f,t,until}]
let seen={ gid:"", sk:-1, tick:-1, phase:"", notes:{}, alive:{}, over:false };   // notes/alive=人ごと(試作モードで操作する人を切り替えても古い結果を出さない)

function me(){ return G && G.players.find(p=>p.id===VID()); }
function VID(){ return debug ? dbgActor : myId; }
function pById(id){ return G && G.players.find(p=>p.id===id); }
function alivePs(){ return G.players.filter(p=>p.alive); }
function isWolf(p){ return !!WOLF_TEAM[p.role]; }

/* ================= ホスト側の進行 ================= */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function newGame(members,fixRole){           // fixRole={id,role}=その人の役職を決めておく(ロボット対戦)
  const n=members.length, plan=ROLE_PLAN[n]||ROLE_PLAN[Math.min(MAX_P,Math.max(MIN_P,n))];
  const roles=[]; for(let i=0;i<plan.wolf;i++) roles.push("wolf"); for(let i=0;i<plan.seer;i++) roles.push("seer");
  while(roles.length<n) roles.push("villager"); shuffle(roles);
  if(fixRole && fixRole.role){ const i=members.findIndex(m=>m.id===fixRole.id), j=roles.indexOf(fixRole.role);
    if(i>=0 && j>=0){ [roles[i],roles[j]]=[roles[j],roles[i]]; } }
  const N=rules.n, cells=[]; for(let y=0;y<N;y++) for(let x=0;x<N;x++) cells.push([x,y]); shuffle(cells);
  G={ gid:Math.random().toString(36).slice(2,9), rules:Object.assign({},rules), N,
      round:1, turn:1, tick:0, sk:0, phase:"move", stepEnd:0,
      players:members.map((m,i)=>({ id:m.id, n:m.n||("P"+(i+1)), c:m.c||PCOL[i%PCOL.length], role:roles[i],
        x:cells[i%cells.length][0], y:cells[i%cells.length][1], alive:true, pub:false, cause:"", poison:null, notes:[] })),
      moves:{}, acts:{}, votes:{}, ready:{}, lastVote:null, winner:"", deathsThisRound:[], wh:[] };
  /* コマに書く1文字=名前の頭文字。頭文字がかぶる人がいたら、その人たちは番号にする */
  const heads=G.players.map(p=>[...p.n][0]||"?");
  G.players.forEach((p,i)=>{ p.lb = heads.filter(h=>h===heads[i]).length>1 ? String(i+1) : heads[i]; });
  cpuMem={ due:{}, claims:[], wolfTg:{}, talked:-1, poisoned:{} };
  startStep("move");
}
function stepMs(){ if(debug) return 0; return G.phase==="talk"? G.rules.talk*1000 : G.phase==="vote"? VOTE_SEC*1000 : G.phase==="vres"? VRES_MS : G.rules.step*1000; }
function startStep(ph){
  G.phase=ph; G.sk++;
  G.moves={}; G.acts={}; G.votes={}; G.ready={};
  const ms=(ph==="vres")? VRES_MS : stepMs();   // 投票結果の表示だけは試作モードでも自動で進める
  G.stepEnd= ms? Date.now()+ms : 0;
  bump();
}
function hostTick(){
  if(!G || !(isHost||debug) || G.phase==="over") return;
  if(cpuMode) cpuDrive();
  if(G && G.stepEnd && Date.now()>=G.stepEnd && G.phase!=="over") resolveNow();
}

/* ================= ★試作用: ロボット(自分以外の全員) =================
   すべてホスト(=自分の端末)の中だけで動く。ロボットも自分の役職の視界だけを見て動く */
let cpuMem={ due:{}, claims:[], wolfTg:{}, talked:-1, poisoned:{} };
const isCpu=p=>p && p.id!==myId && cpuMode;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function sees(p,q){ return inView(p.role, q.x-p.x, q.y-p.y); }
function stepToward2(p,tx,ty){                 // p から (tx,ty) へ近づく1マス(縦横の差が大きい方へ)
  const dx=tx-p.x, dy=ty-p.y; if(!dx&&!dy) return "s";
  if(Math.abs(dx)>=Math.abs(dy)) return dx>0?"r":"l"; return dy>0?"d":"u";
}
function randomStep(p){
  const ok=Object.keys(DIRS).filter(d=>{ const v=DIRS[d], nx=p.x+v[0], ny=p.y+v[1]; return nx>=0&&ny>=0&&nx<G.N&&ny<G.N; });
  return Math.random()<.2? "s" : pick(ok.filter(d=>d!=="s").concat(["s"]));
}
function cpuMove(p){
  const vis=alivePs().filter(q=>q.id!==p.id && sees(p,q));
  if(p.role==="wolf"){                          // 人狼: 見えている人狼以外に近づく(すでにとなりなら留まる)
    const prey=vis.filter(q=>!isWolf(q)&&!q.poison); if(prey.length && !cpuMem.poisoned[p.id+":"+G.round] && Math.random()<.6){
      const t=prey.sort((a,b)=>dist(a,p)-dist(b,p))[0]; if(dist(t,p)<=1) return Math.random()<.7?"s":randomStep(p);
      return stepToward2(p,t.x,t.y); }
  }
  if(p.role==="seer"){                          // 占い師: まだ占っていない人に近づく
    const done=new Set(p.notes.map(n=>n.tg)), c=vis.filter(q=>!done.has(q.id)); if(c.length){
      const t=c.sort((a,b)=>dist(a,p)-dist(b,p))[0]; if(dist(t,p)<=1) return "s"; return stepToward2(p,t.x,t.y); }
  }
  return randomStep(p);
}
function cpuAct(p){
  const adj=alivePs().filter(q=>q.id!==p.id && dist(q,p)<=1);
  if(p.role==="seer"){ const done=new Set(p.notes.map(n=>n.tg)), c=adj.filter(q=>!done.has(q.id)); if(c.length) return { tg:pick(c).id, dl:0 }; }
  if(p.role==="wolf"){ const c=adj.filter(q=>!isWolf(q)&&!q.poison);
    /* ロボットの人狼は1ラウンドに1回まで・確率も控えめ(強すぎるとラウンド1で終わってしまうため) */
    if(c.length && !cpuMem.poisoned[p.id+":"+G.round] && Math.random()<.4){ cpuMem.poisoned[p.id+":"+G.round]=1;
      const r=Math.random(); return { tg:pick(c).id, dl: r<.25?0 : r<.65?1 : 2 }; } }
  return { tg:null, dl:0 };
}
function cpuClaimsAtTalk(){                     // 議論のはじめ: 占い師(と、ときどき人狼の偽の占い師)が結果をチャットで言う
  if(cpuMem.talked===G.round) return; cpuMem.talked=G.round;
  let wolfFaked=false;
  alivePs().filter(isCpu).forEach(p=>{
    let line="", tg=null, black=false;
    if(p.role==="seer" && p.notes.length){
      const nt=p.notes[p.notes.length-1], t=pById(nt.tg); if(t){ tg=t; black=nt.black; }
    }else if(p.role==="wolf" && !wolfFaked && Math.random()<.3){
      const c=alivePs().filter(q=>!isWolf(q)&&q.id!==p.id); if(c.length){ tg=pick(c); black=Math.random()<.6; wolfFaked=true; }
    }
    if(!tg) return;
    line="占い師です。"+tg.n+"は"+(black?"黒":"白")+"でした";
    cpuMem.claims.push({ by:p.id, tg:tg.id, black, r:G.round });
    setTimeout(()=>{ if(G&&G.phase==="talk"&&p.alive) recvChat(p.n,line,p.c); }, 900+Math.random()*2600);
  });
}
function cpuVote(p){
  const others=alivePs().filter(q=>q.id!==p.id);
  if(!others.length) return "skip";
  if(p.role==="seer"){
    const blk=p.notes.filter(n=>n.black).map(n=>pById(n.tg)).filter(q=>q&&q.alive); if(blk.length) return blk[0].id;
    const white=new Set(p.notes.filter(n=>!n.black).map(n=>n.tg));
    const c=others.filter(q=>!white.has(q.id)); return (c.length?pick(c):pick(others)).id;
  }
  if(p.role==="wolf"){                          // 人狼どうしは同じ相手に入れる(占い師を名乗った人を優先)
    if(!cpuMem.wolfTg[G.round]){
      const cl=cpuMem.claims.filter(c=>c.r===G.round).map(c=>pById(c.by)).filter(q=>q&&q.alive&&!isWolf(q));
      const c=alivePs().filter(q=>!isWolf(q)); cpuMem.wolfTg[G.round]=(cl.length?cl[0]:pick(c)||{}).id||"skip";
    }
    const t=cpuMem.wolfTg[G.round]; return (t && t!==p.id && pById(t) && pById(t).alive)? t : "skip";
  }
  /* 市民: 「黒」と言われた人 → あなたの票に乗る → てきとう の順 */
  const blk=cpuMem.claims.filter(c=>c.r===G.round && c.black && c.tg!==p.id && pById(c.tg) && pById(c.tg).alive);
  if(blk.length && Math.random()<.7) return pick(blk).tg;
  const mine=G.votes[myId]; if(mine && mine!=="skip" && mine!==p.id && Math.random()<.4) return mine;
  if(Math.random()<.15) return "skip";
  return pick(others).id;
}
function cpuDrive(){                            // hostTickから0.2秒ごとに呼ばれる
  if(!G || !["move","act","talk","vote"].includes(G.phase)) return;
  if(G.phase==="talk") cpuClaimsAtTalk();
  const now=Date.now(), sk=G.sk;
  alivePs().filter(isCpu).forEach(p=>{
    if(!G || G.sk!==sk) return;
    const inp = G.phase==="move"?G.moves[p.id]!==undefined : G.phase==="act"?G.acts[p.id]!==undefined : G.phase==="vote"?G.votes[p.id]!==undefined : !!G.ready[p.id];
    if(inp) return;
    const k=sk+":"+p.id;
    if(!cpuMem.due[k]) cpuMem.due[k]= now + (G.phase==="vote"? 2000+Math.random()*3000 : G.phase==="talk"? 400 : 300+Math.random()*900);
    if(now<cpuMem.due[k]) return;
    if(G.phase==="move") hostAct({ t:"move", from:p.id, sk, d:cpuMove(p) });
    else if(G.phase==="act"){ const a=cpuAct(p); hostAct({ t:"act", from:p.id, sk, tg:a.tg, dl:a.dl }); }
    else if(G.phase==="talk") hostAct({ t:"ready", from:p.id, sk, on:true });
    else if(G.phase==="vote") hostAct({ t:"vote", from:p.id, sk, tg:cpuVote(p) });
  });
}
function resolveNow(){                       // 締め切り(または全員そろった)=未入力は「何もしない」扱い
  if(G.phase==="move") resolveMove();
  else if(G.phase==="act") resolveAct();
  else if(G.phase==="talk") startStep("vote");
  else if(G.phase==="vote") resolveVote();
  else if(G.phase==="vres") afterVote();
}
function resolveMove(){
  const N=G.N;
  alivePs().forEach(p=>{
    const v=DIRS[G.moves[p.id]||"s"]||DIRS.s, nx=p.x+v[0], ny=p.y+v[1];
    if(nx>=0&&ny>=0&&nx<N&&ny<N){ p.x=nx; p.y=ny; }
  });
  startStep("act");
}
function die(p,cause){ if(!p.alive) return; p.alive=false; p.cause=cause; p.poison=null; G.deathsThisRound.push(p.id); }
function resolveAct(){
  G.tick++;
  /* ① アクションは「このステップが始まった時の盤面」で同時に解決する(毒で死ぬ人のアクションも有効) */
  const newPoison=[];
  alivePs().forEach(p=>{
    const a=G.acts[p.id]; if(!a||!a.tg) return;
    const t=pById(a.tg); if(!t||!t.alive||t.id===p.id||dist(p,t)>1) return;
    if(p.role==="seer") p.notes.push({ r:G.round, t:G.turn, tg:t.id, black:isWolf(t) });
    if(p.role==="wolf" && !isWolf(t)) newPoison.push({ tg:t, dl:Math.max(0,Math.min(2,a.dl|0)) });
  });
  /* ② 前のターンまでに盛られた毒を1つ進める(0になったら死亡) */
  alivePs().forEach(p=>{ if(p.poison){ p.poison.left--; if(p.poison.left<=0) die(p,"poison"); } });
  /* ③ 今回の毒: 0=その場で即死／1〜2=本人は気づかず、そのターン数だけ普通に行動してから死亡 */
  newPoison.forEach(o=>{ const t=o.tg; if(!t.alive) return;
    if(o.dl===0) die(t,"poison");
    else if(!t.poison || t.poison.left>o.dl) t.poison={ left:o.dl };   // 2回盛られたら早い方
  });
  if(checkWin()) return;
  if(G.turn>=G.rules.turns){ startTalk(); return; }
  G.turn++; startStep("move");
}
function startTalk(){
  G.players.forEach(p=>{ if(!p.alive) p.pub=true; });   // ★死亡の公表はここだけ(ロースターが更新される)
  startStep("talk");
}
function resolveVote(){
  const cnt={};
  alivePs().forEach(p=>{ const v=G.votes[p.id]; if(v && v!=="skip" && pById(v) && pById(v).alive && v!==p.id) cnt[v]=(cnt[v]||0)+1; });
  let top=0, tops=[]; Object.keys(cnt).forEach(id=>{ if(cnt[id]>top){ top=cnt[id]; tops=[id]; } else if(cnt[id]===top) tops.push(id); });
  /* ★同数トップが複数いる時は「誰も吊られない」(再投票はしない)。1票も入らなかった時も同じ */
  const hanged=(tops.length===1)? tops[0] : null;
  G.lastVote={ cnt, hanged, votes:Object.assign({},G.votes), tie:tops.length>1 };
  if(hanged){ const p=pById(hanged); die(p,"hang"); p.pub=true; }
  G.winner=judge();
  startStep("vres");
}
function afterVote(){
  if(G.winner){ G.phase="over"; G.sk++; G.stepEnd=0; bump(); return; }
  G.round++; G.turn=1; G.deathsThisRound=[]; startStep("move");
}
function judge(){
  const al=alivePs(), w=al.filter(isWolf).length, o=al.length-w;
  if(w===0) return "village";
  if(w>=o) return "wolf";
  return "";
}
function checkWin(){                         // 毒殺・吊り・退出の直後に呼ぶ
  const w=judge(); if(!w) return false;
  G.winner=w; G.players.forEach(p=>{ if(!p.alive) p.pub=true; });
  G.phase="over"; G.sk++; G.stepEnd=0; bump(); return true;
}
function allIn(obj){ return alivePs().every(p=>obj[p.id]!==undefined); }
function hostAct(a){
  if(!G || a.sk!==G.sk) return;              // 前のステップの入力は捨てる
  const p=pById(a.from); if(!p||!p.alive) return;
  if(a.t==="move" && G.phase==="move" && DIRS[a.d]){ G.moves[p.id]=a.d; bump(); if(allIn(G.moves)) resolveMove(); return; }
  if(a.t==="act" && G.phase==="act"){ G.acts[p.id]={ tg:a.tg||null, dl:a.dl|0 }; bump(); if(allIn(G.acts)) resolveAct(); return; }
  if(a.t==="ready" && G.phase==="talk"){ if(a.on) G.ready[p.id]=1; else delete G.ready[p.id]; bump(); if(allIn(G.ready)) startStep("vote"); return; }
  if(a.t==="wh" && (G.phase==="move"||G.phase==="act")){   // ささやき=となり(同じマスも含む)の人に3文字まで・1ステップ1回
    const t=pById(a.to), tx=[...String(a.tx||"").trim()].slice(0,3).join("");
    if(!t||!t.alive||t.id===p.id||dist(t,p)>1||!tx) return;
    G.wh=G.wh||[]; if(G.wh.some(w=>w.id===a.wid)) return;
    if(G.wh.some(w=>w.f===p.id&&w.sk===G.sk)) return;
    G.wh.push({ id:String(a.wid||Math.random()), f:p.id, to:t.id, t:tx, sk:G.sk });
    while(G.wh.length>60) G.wh.shift();
    bump(); return;
  }
  if(a.t==="vote" && G.phase==="vote"){ if(a.tg!=="skip" && (!pById(a.tg)||a.tg===p.id)) return; G.votes[p.id]=a.tg; bump(); if(allIn(G.votes)) resolveVote(); return; }
}
function bump(){ sendSnap(); render(); }

/* ================= 入力(自分 or 試作モードの操作中の人) ================= */
function submit(o){
  if(!G) return;
  o.sk=G.sk; o.from=VID();
  if(debug){ const sk=G.sk; hostAct(o); if(G.sk===sk && !(o.t==="ready"&&!o.on)) dbgNext(); return; }
  if(isHost){ hostAct(o); return; }
  pending=o; pendingSent=Date.now(); sendAct(o); render();
}
function sendAct(o){ if(ch){ try{ ch.send({type:"broadcast",event:"act",payload:o}); }catch(e){} } }
function dbgNext(){                            // 試作モード: まだ入力していない次の人を操作
  const ps=alivePs(); if(!ps.length) return;
  const i=Math.max(0,ps.findIndex(p=>p.id===dbgActor));
  for(let k=1;k<=ps.length;k++){
    const p=ps[(i+k)%ps.length]; const id=p.id;
    const inp = G.phase==="move"?G.moves[id]!==undefined : G.phase==="act"?G.acts[id]!==undefined : G.phase==="vote"?G.votes[id]!==undefined : G.phase==="talk"?!!G.ready[id] : true;
    if(!inp){ if(id!==dbgActor){ dbgActor=id; sel={move:null,tg:null,dl:0,vote:null}; render(); } return; }
  }
}
function myInputIn(){                         // 自分の入力がスナップに反映されているか
  if(!G) return false; const id=VID();
  if(G.phase==="move") return G.moves[id]!==undefined;
  if(G.phase==="act") return G.acts[id]!==undefined;
  if(G.phase==="vote") return G.votes[id]!==undefined;
  if(G.phase==="talk") return !!G.ready[id];
  return false;
}

/* ================= 描画 ================= */
function canSeeAll(){ const m=me(); return (debug&&!dbgFog) || !m || !m.alive || G.phase==="over"; }
function visibleCell(x,y){
  if(canSeeAll()) return true;
  const m=me(); return inView(m.role, x-m.x, y-m.y);
}
function render(){
  if(phaseUI!=="game"||!G) return;
  renderTop(); renderRoster(); renderBoard(); renderCtrl(); renderWh(); renderNotes(); renderDbg(); updateChatLock();
}
function renderTop(){
  $("roundPill").textContent="ラウンド"+G.round+(["move","act"].includes(G.phase)? "・"+G.turn+"/"+G.rules.turns : "");
  $("phaseTag").textContent={move:"移動",act:"アクション",talk:"議論",vote:"投票",vres:"投票結果",over:"決着"}[G.phase]||"";
  renderTimer();
  const m=me();
  $("myRole").innerHTML= m? '<span>'+esc(debug?("操作中: "+m.n):"あなた")+'</span><span class="role-chip '+m.role+'">'+ROLE_NAME[m.role]+'</span>'+(m.alive?"":'<span style="opacity:.7;">（死亡）</span>') : "";
}
function renderTimer(){
  const el=$("timer"); if(!G) return;
  if(!G.stepEnd||G.phase==="over"){ el.textContent= debug&&G.phase!=="over" ? "--:--" : ""; el.classList.remove("warn"); return; }
  const s=Math.max(0,Math.ceil((localEnd-Date.now())/1000));
  el.textContent=fmtT(s); el.classList.toggle("warn", s<=5 && G.phase!=="vres");
}
function renderRoster(){
  $("roster").style.display = G.phase==="talk"? "" : "none";   // 生存者リストは議論の時だけ見られる
  const m=me(), all=canSeeAll()&&(debug||G.phase==="over");
  $("roster").innerHTML=G.players.map(p=>{
    const deadShown = !p.alive && (p.pub || all || (m&&p.id===m.id));
    let tags="";
    if(m && p.id===m.id) tags+='<span class="tg me">じぶん</span>';
    else if(m && isWolf(m) && isWolf(p)) tags+='<span class="tg mate">仲間</span>';
    if(m && m.role==="seer" && p.id!==m.id){ const nt=m.notes.filter(x=>x.tg===p.id).pop(); if(nt) tags+='<span class="tg '+(nt.black?"black":"white")+'">'+(nt.black?"黒":"白")+'</span>'; }
    if(all) tags+='<span class="tg role">'+ROLE_NAME[p.role]+'</span>';
    return '<div class="ros'+(deadShown?" dead":"")+'"><span class="av" style="background:'+p.c+'"></span><span class="nm">'+esc(p.n)+'</span>'+tags+'</div>';
  }).join("");
}
const SVGNS="http://www.w3.org/2000/svg";
function svgEl(tag,attrs){ const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
let boardN=0, pieceEls={};
function buildBoard(){
  const b=$("board"), N=G.N; b.innerHTML=""; pieceEls={}; boardN=N;
  b.setAttribute("viewBox","0 0 "+(N*10)+" "+(N*10));
  const cl=svgEl("g",{id:"cellL"}); b.appendChild(cl);
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const r=svgEl("rect",{x:x*10+.3,y:y*10+.3,width:9.4,height:9.4,rx:1.4,class:"cell","data-x":x,"data-y":y});
    cl.appendChild(r);
  }
  b.appendChild(svgEl("g",{id:"markL"}));
  b.appendChild(svgEl("g",{id:"pieceL"}));

function canMoveTo(x,y){
  const m=me(); if(!m||!m.alive||G.phase!=="move") return false;
  return Math.abs(m.x-x)+Math.abs(m.y-y)<=1;
}
function dirTo(x,y){ const m=me(); const dx=x-m.x, dy=y-m.y; for(const k in DIRS){ if(DIRS[k][0]===dx&&DIRS[k][1]===dy) return k; } return null; }
function actTargets(){                       // 隣接(同じマスも含む)にいる、アクションの対象にできるコマ
  const m=me(); if(!m||!m.alive||G.phase!=="act") return [];
  if(m.role!=="seer" && m.role!=="wolf") return [];
  return G.players.filter(p=>p.alive && p.id!==m.id && dist(p,m)<=1 && !(m.role==="wolf"&&isWolf(p)));
}
function provPos(p){                           // 仮の移動先 {x,y,moved}(自分だけ。試作モードは入力した全員)
  const m=me(); p=p||m; if(!G||!p||!p.alive||G.phase!=="move") return null;
  const isMe = m && p.id===m.id; if(!isMe && !debug) return null;
  const d = G.moves[p.id]!==undefined? G.moves[p.id] : isMe? (pending&&pending.t==="move"&&pending.sk===G.sk? pending.d : null) : null;   // 決定したものだけ(1回目の選択は予告の点線だけ)
  if(!d||!DIRS[d]) return null;
  const v=DIRS[d]; return { x:p.x+v[0], y:p.y+v[1], moved:d!=="s" };
}
function cellFromEvent(e){                      // 押した位置から盤面のマスを出す(コマの上を押してもよい)

  const pt=b.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  const q=pt.matrixTransform(ctm.inverse()), x=Math.floor(q.x/10), y=Math.floor(q.y/10);
  return (x>=0&&y>=0&&x<G.N&&y<G.N)? {x,y} : null;

function stepToward(x,y){                       // そのマスへ向かう1マス(自分のマスなら留まる)

function onState(){
  if(!G) return;
  if(debug && seen.gid===G.gid && seen.sk!==G.sk){   // 試作モード: 新しいステップは先頭の人から操作
    const f=alivePs()[0]; if(f) dbgActor=f.id; sel={move:null,tg:null,dl:0,vote:null};
  }
  const m=me();
  if(seen.gid!==G.gid){
    seen={ gid:G.gid, sk:-1, tick:G.tick, phase:"", notes:{}, alive:{}, over:false, wh:{} };
    sel={move:null,tg:null,dl:0,vote:null,wt:null}; pending=null; whPending=[]; bubbles=[];
    addSys("── あたらしいゲーム ──");
    if(!debug) setTimeout(openRole,350);
  }
  if(seen.sk!==G.sk){
    const prev=seen.phase; seen.sk=G.sk;
    sel.move=null; sel.vote=null; if(G.phase!=="act") sel.tg=null; pending=null;
    if(G.phase==="move"){ if(prev==="act") playMove(); else playStep(); }
    if(G.phase==="act"){ playMove(); }
    if(G.phase==="talk"){
      playTalk(); bigFx("議論タイム");
      const dead=G.players.filter(p=>!p.alive && p.pub);
      addSys("ラウンド"+G.round+" 議論タイム");
      const newDead=G.players.filter(p=>G.deathsThisRound.includes(p.id));
      addSys(newDead.length? newDead.map(p=>p.n).join("、")+" が死亡していた" : "死亡した人はいない");
      void dead;
    }
    if(G.phase==="vote"){ playVote(); bigFx("投票タイム"); }
    if(G.phase==="vres"){ const lv=G.lastVote||{}, h=pById(lv.hanged);
      addSys(h? h.n+" が吊られた" : lv.tie? "同数のため、誰も吊られなかった" : "誰も吊られなかった");
      if(h) playDeath(); }
    if(G.phase==="over" && !seen.over){
      seen.over=true;
      addSys(G.winner==="village"?"市民陣営の勝ち":"人狼陣営の勝ち","c-res");
      const mine = m? (isWolf(m)?"wolf":"village") : "village";
      if(debug||mine===G.winner) playWin(); else playLose();
      setTimeout(openResult,700);
    }
    seen.phase=G.phase;
  }
  if(m){
    const sn=seen.notes[m.id]; if(sn===undefined) seen.notes[m.id]=m.notes.length;
    else if(m.notes.length>sn){ const nt=m.notes[m.notes.length-1], p=pById(nt.tg);
      playSeer(); toast((p?p.n:"?")+" は "+(nt.black?"黒（人狼）":"白（人狼じゃない）"),2600); seen.notes[m.id]=m.notes.length; }
    const sa=seen.alive[m.id];
    if(sa===true && !m.alive && !debug){ playDeath(); bigFx(m.cause==="hang"?"あなたは吊られた":"あなたは死亡した"); }
    seen.alive[m.id]=m.alive;
  }
  if(G.tick!==seen.tick){ seen.tick=G.tick; }
  seen.wh=seen.wh||{};
  (G.wh||[]).forEach(w=>{ if(seen.wh[w.id]) return; seen.wh[w.id]=1;
    const f=pById(w.f), to=pById(w.to); if(!f||!to) return;
    const mineOut = w.f===VID(), mineIn = w.to===VID();
    if(!(mineOut||mineIn||debug)) return;
    bubbles.push({ f:w.f, t:w.t, until:Date.now()+4200 }); setTimeout(()=>{ if(G) render(); },4300);
    if(mineIn && !debug){ recvChat(f.n+"（ささやき）", w.t, f.c); playWhisper(); }
    else addChat((mineOut&&!debug? "あなた" : f.n)+"→"+to.n+"（ささやき）", w.t, f.c);
  });
  G.players.forEach(p=>{ if(!p.alive && p.cause==="gone" && !(seen.gone||(seen.gone={}))[p.id]){ seen.gone[p.id]=1; addSys(p.n+" が退出した"); toast(p.n+" が退出した"); } });
}

    hostAct(payload); });
  ch.on("broadcast",{event:"stamp"},({payload})=>{ if(!payload) return;
    if(G && (G.phase==="move"||G.phase==="act")) return;                    // 念のため受け側でも捨てる(送る側は送らない)
    const sp=G&&payload.from&&pById(payload.from); if(sp && !sp.alive && G.phase!=="over") return;
    speakStamp(payload.i|0); spawnStamp(payload.i|0, payload.n||"あいて"); });
  ch.on("broadcast",{event:"chat"},({payload})=>{
    if(!payload||!payload.t||payload.from===myId) return;
    if(G && (G.phase==="move"||G.phase==="act")) return;                    // 移動フェーズ中は受け付けない(私語禁止)
    const sp=G&&pById(payload.from); if(sp && !sp.alive && G.phase!=="over") return;   // 死亡者の発言は届かない
    recvChat(payload.n||"あいて", String(payload.t).slice(0,40), payload.c||""); });
  ch.on("broadcast",{event:"bye"},({payload})=>{ if(payload) onLeave(payload.id); });
  ch.on("broadcast",{event:"kick"},({payload})=>{ if(payload&&payload.to===myId&&!isHost){ toast("オーナーに退出させられました"); goTitle(); } });
  ch.on("presence",{event:"leave"},({leftPresences})=>{ (leftPresences||[]).forEach(p=>{ if(!p||!p.id) return;
    if(isHost && phaseUI==="lobby") onLeave(p.id); else markGone(p.id); }); });
  ch.on("presence",{event:"join"},({newPresences})=>{ (newPresences||[]).forEach(p=>{ if(p&&p.id) cancelGone(p.id); }); });
  let readyDone=false;
  ch.subscribe(async status=>{
    if(status==="SUBSCRIBED"){
      try{ await ch.track({id:myId}); }catch(e){}
      if(readyDone){ if(isHost) sendSnap(); else { try{ ch.send({type:"broadcast",event:"hello",payload:{id:myId,n:myName}}); }catch(e){} } return; }
      readyDone=true; if(onReady) onReady();
    } else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){ roomStatus('<div class="room-note err">通信失敗。通信環境を見直そう</div>'); }
  });
}
function startHb(){ clearInterval(hbIv); hbIv=setInterval(sendSnap,1500); }
function sendSnap(){
  if(!isHost||!ch||debug) return;
  ver++;
  const p={ v:ver, hid:hostId, rules, lob:lobby.map(x=>({id:x.id,n:x.n,c:x.c})) };
  if(phaseUI==="game"&&G){ p.G=G; p.left=G.stepEnd? Math.max(0,G.stepEnd-Date.now()) : 0; }
  try{ ch.send({type:"broadcast",event:"snap",payload:p}); }catch(e){}
}
function applySnap(p){
  if(p.hid!==hostId){ lastVer=-1; }                                     // オーナーが替わったら番号を振り直す
  if(p.v<=lastVer) return; lastVer=p.v;
  clearTimeout(joinWatch); hostId=p.hid; rules=p.rules||rules; lobby=p.lob||[];
  if(!p.G){
    if(phaseUI==="game"){ G=null; document.querySelectorAll(".overlay").forEach(o=>o.classList.remove("on","peek")); }
    if(phaseUI!=="lobby"){ phaseUI="lobby"; showScene("lobbyScene"); }
    renderLobby(); return;
  }
  G=p.G; localEnd=Date.now()+(p.left||0);
  if(pending && myInputIn()) pending=null;
  whPending=whPending.filter(w=>w.sk===G.sk && !(G.wh||[]).some(x=>x.id===w.wid));
  whPending.forEach(w=>{ if(Date.now()-(w._at||0)>900){ w._at=Date.now(); sendAct(w); } });   // 届いていなければ送り直す
  if(pending && pending.sk===G.sk && Date.now()-pendingSent>900){ pendingSent=Date.now(); sendAct(pending); }   // 届いていなければ送り直す
  if(phaseUI!=="game") enterGame();
  onState(); render();
}

function ruleFrameHTML(){
  const row=(name,key,val)=>'<div class="rule-col"><span class="rc-name">'+name+'</span><div class="rc-row"><button class="stp" data-k="'+key+'" data-s="-1">−</button><span class="rc-val">'+val+'</span><button class="stp" data-k="'+key+'" data-s="1">＋</button></div></div>';
  return '<div class="rule-frame">'
    +row("盤の広さ","n",rules.n+"×"+rules.n)+row("移動ターン数","turns",rules.turns+"ターン")
    +row("議論の時間","talk",fmtT(rules.talk))+row("1手の制限時間","step",rules.step+"秒")+'</div>'
    +'<button class="rule-reset" id="ruleReset">初期設定に戻す</button>';
}
const OPTS={ n:N_OPTS, turns:TURN_OPTS, talk:TALK_OPTS, step:STEP_OPTS };
function ruleSummary(){ return "盤 "+rules.n+"×"+rules.n+"・移動 "+rules.turns+"ターン<br>議論 "+fmtT(rules.talk)+"・1手 "+rules.step+"秒"; }
function planText(n){ const pl=ROLE_PLAN[n]; if(!pl) return ""; return "人狼"+pl.wolf+"・占い師"+pl.seer+"・市民"+(n-pl.wolf-pl.seer); }
function renderLobby(){
  if(!online||phaseUI!=="lobby") return;
  let h='<div class="lobby-list">';
  lobby.forEach(p=>{
    h+='<div class="lobby-row"><span class="p-dot" style="background:'+p.c+'"></span><span class="nm'+(p.n?"":" undef")+'">'+esc(p.n||UNDEF_NM)+'</span>'
      +(p.id===hostId?'<span class="hostmark">オーナー</span>':"")+(p.id===myId?'<span class="you">じぶん</span>':"")
      +((isHost&&p.id!==myId)?'<button class="kick-btn" data-kick="'+esc(p.id)+'">追放</button>':"")+'</div>';
  });
  h+='</div><div class="room-note">合言葉（'+TAPW+'でコピー）</div>'
    +'<div class="code-show" id="codeShow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>'+esc(code)+'</div>';
  h+= isHost? ruleFrameHTML() : '<div class="rule-sum">'+ruleSummary()+'</div>';
  const n=lobby.length, okN=n>=MIN_P&&n<=MAX_P;
  h+='<div class="room-note">'+(okN? n+"人："+planText(n) : MIN_P+"〜"+MAX_P+"人で遊べます（いま"+n+"人）")+'</div>';
  if(isHost) h+='<button class="btn-main" id="lobbyStart"'+(okN?"":" disabled")+'>はじめる</button>';
  $("lobbyBox").innerHTML=h;
  if(!nameAsked){ nameAsked=true; openNameOv(); }
  $("codeShow").onclick=async ()=>{ ensureAudio(); playSelect();
    try{ await navigator.clipboard.writeText(inviteText(code)); toast("招待メッセージをコピーした"); }
    catch(e){ try{ const ta=document.createElement("textarea"); ta.value=inviteText(code); document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("招待メッセージをコピーした"); }catch(_){ toast("コピーできなかった…"); } } };
  if(!isHost) return;
  $("lobbyBox").querySelectorAll(".stp").forEach(b=>b.onclick=()=>{ ensureAudio(); playSelect();
    const k=b.dataset.k, a=OPTS[k], i=Math.max(0,a.indexOf(rules[k])), j=Math.max(0,Math.min(a.length-1,i+(+b.dataset.s)));
    rules[k]=a[j]; renderLobby(); sendSnap(); });
  $("ruleReset").onclick=()=>{ ensureAudio(); playSelect(); rules=Object.assign({},DEF_RULES); renderLobby(); sendSnap(); };
  $("lobbyBox").querySelectorAll("[data-kick]").forEach(b=>b.onclick=()=>{ ensureAudio(); playSelect(); const id=b.dataset.kick;
    lobby=lobby.filter(p=>p.id!==id); try{ ch.send({type:"broadcast",event:"kick",payload:{to:id}}); }catch(e){} renderLobby(); sendSnap(); });
  const ls=$("lobbyStart"); if(ls) ls.onclick=()=>{ ensureAudio(); playSelect();
    if(!(lobby.length>=MIN_P&&lobby.length<=MAX_P)) return;
    enterGame(); newGame(lobby.map(p=>({id:p.id,n:p.n||UNDEF_NM,c:p.c}))); };
}

/* ================= スタンプ(全ゲーム共通) ================= */
const STAMP_SVGS=['😭','😍','🤣'];   // このスタンプだけは牧村さんの明示指示で絵文字を採用
function playStamp(i){
  if(!actx) return; const t=T0();
  if(i===0){ note(523,t,0.2,0.3,"sine"); note(392,t+0.15,0.22,0.3,"sine"); note(300,t+0.32,0.36,0.26,"sine"); }
  else if(i===1){ note(523,t,0.34,0.22,"sine"); note(784,t+0.11,0.38,0.24,"sine"); note(1047,t+0.24,0.62,0.2,"sine"); note(1568,t+0.34,0.55,0.1,"triangle"); }
  else{ const sq=[900,680,850,640,800,600,760,560]; sq.forEach((f,k)=>note(f,t+k*0.072,0.07,0.26,"triangle")); note(400,t+sq.length*0.072,0.16,0.24,"triangle"); }
}
let stampMuted=false;   // 毎回ミュートOFFで始める(保存しない)
function spawnStamp(i,who,self){
  if(stampMuted && !self) return;
  i=Math.max(0,Math.min(2,i|0));
  const el=document.createElement("div"); el.className="stamp-fly";
  const hx=0.06+Math.random()*0.88; el.style.left="calc("+(hx*100).toFixed(1)+"% - 48px)";
  const central=1-Math.abs(hx-0.5)*2;
  el.style.setProperty("--rise","-"+(24+(1-central)*16).toFixed(0)+"vh");
  el.style.setProperty("--dx",(Math.random()*24-12).toFixed(0)+"px");
  el.innerHTML='<span class="s-emoji">'+STAMP_SVGS[i]+'</span><span class="s-name">'+esc(who||"自分")+'</span>';
  if(seOn && !stampMuted) playStamp(i);
  if(document.querySelector(".overlay.on")) el.classList.add("over-dialog");
  document.body.appendChild(el); setTimeout(()=>el.remove(),2350);
}
const STAMP_WORDS=["やめてよぉ","すごぉい","わろたぁ"];
let stampTTSVoice=null, stampTTSWarm=false;
function speakStamp(i){
  try{
    if(!window.speechSynthesis||!seOn||stampMuted) return;
    if(!stampTTSVoice){ const vs=speechSynthesis.getVoices()||[]; stampTTSVoice=vs.find(v=>/ja/i.test(v.lang))||null; }
    if(!stampTTSWarm){ stampTTSWarm=true; speechSynthesis.onvoiceschanged=()=>{ const v2=speechSynthesis.getVoices()||[]; stampTTSVoice=v2.find(v=>/ja/i.test(v.lang))||stampTTSVoice; }; }
    const u=new SpeechSynthesisUtterance(STAMP_WORDS[Math.max(0,Math.min(2,i|0))]); u.lang="ja-JP"; u.rate=1.05; u.pitch=1.1;
    if(stampTTSVoice) u.voice=stampTTSVoice;
    if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}
}
function myDisp(){ if(debug){ const m=me(); return m? m.n : "自分"; } return myName||"あなた"; }
function myColor(){ const m=G&&pById(debug?dbgActor:myId); if(m) return m.c; const l=lobbyById(myId); return l? l.c : ""; }
function sendStamp(i){
  speakStamp(i); spawnStamp(i, debug? myDisp() : "自分", true);
  if(online&&ch&&chatDelivered()){ try{ ch.send({type:"broadcast",event:"stamp",payload:{i,n:myName,from:myId}}); }catch(e){} }   // 移動中・死亡中は自分の画面だけ
}
document.querySelectorAll("#stampBar .stamp-btn").forEach(b=>{ const i=+b.dataset.i; b.innerHTML=STAMP_SVGS[i]; b.onclick=()=>{ ensureAudio(); sendStamp(i); }; });
(function(){ const mb=$("stampMute"); const r=()=>mb.classList.toggle("muted",stampMuted); r(); mb.onclick=()=>{ stampMuted=!stampMuted; r(); }; })();

const POP_MS=4200, POP_FADE=150, POP_MAX=3;
const EYE_OPEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.8 12S5.5 5.4 12 5.4 22.2 12 22.2 12 18.5 18.6 12 18.6 1.8 12 1.8 12z"/><circle cx="12" cy="12" r="3.1"/></svg>';
const EYE_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.8 12S5.5 5.4 12 5.4 22.2 12 22.2 12 18.5 18.6 12 18.6 1.8 12 1.8 12z"/><circle cx="12" cy="12" r="3.1"/><line x1="3.6" y1="3.6" x2="20.4" y2="20.4"/></svg>';
function addChat(name,text,color){
  const log=$("chatLog"); const d=document.createElement("div"); d.className="c-line";
  const n=document.createElement("span"); n.className="c-nm"; if(color) n.style.color=color; n.textContent=name+"：";
  const t=document.createElement("span"); t.textContent=text;
  d.appendChild(n); d.appendChild(t); log.appendChild(d);
  while(log.children.length>60) log.removeChild(log.firstChild); log.scrollTop=log.scrollHeight;
}
function addSys(tx,cls){
  const log=$("chatLog"); const d=document.createElement("div"); d.className="c-line c-sys"+(cls?" "+cls:""); d.textContent=tx;
  log.appendChild(d); while(log.children.length>60) log.removeChild(log.firstChild); log.scrollTop=log.scrollHeight;
}
function clearChat(){ $("chatLog").innerHTML=""; $("chatIn").value=""; hidePop(); }
function hidePop(){ const el=$("chatPop"); [].slice.call(el.children).forEach(c=>clearTimeout(c._t)); el.innerHTML=""; }
function showPop(name,text,color){
  const el=$("chatPop"); const d=document.createElement("div"); d.className="pop-line";
  const n=document.createElement("span"); n.className="c-nm"; if(color) n.style.color=color; n.textContent=name+"：";
  const t=document.createElement("span"); t.textContent=text; d.appendChild(n); d.appendChild(t); el.appendChild(d);
  while(el.children.length>POP_MAX){ const o=el.firstChild; clearTimeout(o._t); el.removeChild(o); }
  d._t=setTimeout(()=>{ d.classList.add("out"); d._t=setTimeout(()=>{ if(d.parentNode) d.parentNode.removeChild(d); },POP_FADE+40); },POP_MS);
}
function setMini(mini){ $("chatBox").classList.toggle("mini",mini);
  $("chatTog").innerHTML="<span>"+(mini?"チャット欄 表示":"チャット欄 非表示")+"</span>"+(mini?EYE_OPEN:EYE_OFF); if(!mini) hidePop(); }
function recvChat(name,text,color){ addChat(name,text,color); playSelect(); if($("chatBox").classList.contains("mini")) showPop(name,text,color); }
function sendChat(){
  const el=$("chatIn"); const t=(el.value||"").trim().slice(0,40); if(!t) return; el.value="";
  addChat(myDisp(), t, myColor());
  if(online&&ch&&chatDelivered()){ try{ ch.send({type:"broadcast",event:"chat",payload:{t, n:myName, from:myId, c:myColor()}}); }catch(e){} }   // 移動中・死亡中は自分の画面だけ
}
