<!--
  盤上人狼（2026-09-24着手。旧仮名「盤面人狼」＝旧URL /games/banmen-jinro は_redirectsで301転送）
  ■ オンラインは「方式A=クライアント側の性善説」(牧村了承済み)
    ホストが盤面・役職・毒タイマーなど全部を持ち、スナップショットをそのまま全員に配る。
    フォグ・オブ・ウォー(見えない所を隠す)は各端末の表示だけで行っている。
    ＝ブラウザの開発者ツールでbroadcastの生データを見れば、他人の位置や役職を覗けてしまう(既知の制約)。
    ★将来きちんと隠したくなったら、Supabase側にRPC(SQL関数)で進行ロジックを持たせ、
      各プレイヤーには「その人に見えてよい情報」だけを返す作りに全面的に作り直す必要がある。
  ■ 試作用の「全員を操作する」「ロボットと遊ぶ」(DEBUG)は本番公開前に外すか牧村さんに確認すること(window.__bjDev と同じ位置づけ)
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
  :root{
    --bg:#1e1a2e;
    --card:#f4efe6;
    --ink:#211d2b;
    --gold:#e8b647;
    --gold-d:#b8871f;
    --red:#e3452f;
    --wolf:#e0533d;
    --seer:#4ea4e8;
    --vil:#6cc47a;
    --hawk:#2fa596;
    --mad:#9a5bd0;
    --uiw:min(94vw,500px);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;
     font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif; }
  body{ min-height:100svh; background:var(--bg); color:var(--card);
    display:flex; flex-direction:column; align-items:center;
    user-select:none; -webkit-user-select:none; overflow-x:hidden; }
  input{ user-select:text; -webkit-user-select:text; }
  body::before{ content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
    background:radial-gradient(circle at 50% -10%, rgba(120,98,190,.28), transparent 60%); }

  .scene{ display:none; width:100%; flex-direction:column; align-items:center; padding:14px 0 40px; }
  .scene.on{ display:flex; animation:sceneIn .34s cubic-bezier(.2,.8,.3,1); }
  @keyframes sceneIn{ 0%{ opacity:0; transform:translateY(18px); } 100%{ opacity:1; transform:none; } }
  #lobbyScene{ padding-top:64px; }
  #gameScene{ padding-top:150px; padding-bottom:290px; }   /* 上下にスクロール余白(全ゲーム共通ルール) */

  /* ===== タイトル ===== */
  .logo{ margin:9vh 0 4px; font-size:clamp(50px,14vw,80px); font-weight:900; letter-spacing:.06em;
    text-shadow:0 5px 0 rgba(0,0,0,.35); }
  .logo .l2{ color:var(--wolf); }
  .t-sub{ font-size:13px; font-weight:700; letter-spacing:.12em; opacity:.6; margin-bottom:26px; }
  .room-row{ display:flex; gap:10px; margin-top:6px; }
  .room-row button{ padding:15px 12px; border:none; border-radius:14px; cursor:pointer; width:min(150px,calc((100vw - 42px)/2)); white-space:nowrap;
    background:rgba(244,239,230,.13); color:var(--card); font-size:16px; font-weight:900; letter-spacing:.06em; }
  .room-row button:active{ transform:translateY(2px); }
  #roomArea{ display:flex; flex-direction:column; align-items:center; gap:6px; width:var(--uiw); margin-top:14px; }
  .dev-box{ margin-top:34px; width:var(--uiw); max-width:380px; border:1.5px dashed rgba(244,239,230,.3); border-radius:14px;
    padding:12px 14px 14px; display:flex; flex-direction:column; align-items:center; gap:9px; opacity:.8; }
  #cpuRoleRow{ flex-wrap:wrap; gap:5px; }
  .dev-box .rule-frame, .dev-box .role-box{ width:100%; }
  #cpuRoleRow .txt-btn{ padding:7px 10px; font-size:12.5px; white-space:nowrap; }
  .dev-box .dev-h{ font-size:11.5px; font-weight:900; letter-spacing:.14em; opacity:.7; }

  .sec-label{ font-size:12px; font-weight:900; letter-spacing:.22em; opacity:.55; margin-bottom:9px; }
  .rule-frame{ width:var(--uiw); background:rgba(0,0,0,.18); border:1.5px solid rgba(244,239,230,.18);
    border-radius:16px; padding:14px 12px; display:grid; grid-template-columns:1fr 1fr; gap:12px 10px; }
  .rule-col{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .rc-name{ font-size:12px; font-weight:800; letter-spacing:.08em; opacity:.7; }
  .rc-row{ display:flex; align-items:center; gap:8px; }
  .rc-val{ min-width:72px; text-align:center; font-size:17px; font-weight:900; color:var(--gold); }
  .stp{ width:34px; height:34px; border:none; border-radius:10px; cursor:pointer;
    background:rgba(244,239,230,.14); color:var(--card); font-size:18px; font-weight:900; line-height:1; }
  .stp:active{ transform:translateY(2px); }
  .stp:disabled{ opacity:.3; cursor:default; }
  .rule-reset{ display:block; margin:5px auto 0; border:none; background:none; padding:4px 2px;
    font-size:12.5px; font-weight:800; color:var(--card); opacity:.85; text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
  .rule-sum.err{ color:#ff8f7d; opacity:1; }
  .rule-sum{ font-size:12.5px; font-weight:700; opacity:.72; text-align:center; line-height:1.7; }
  .rule-frame.ro .stp{ visibility:hidden; }                                   /* 参加者側は見るだけ */
  /* 役職(ロビー): 1行=アイコン・内容・人数。陣営ごとにセクションを分ける */
  .role-box{ width:var(--uiw); background:rgba(0,0,0,.18); border:1.5px solid rgba(244,239,230,.18); border-radius:16px; padding:10px 12px 12px; }
  .role-sec{ font-size:11.5px; font-weight:900; letter-spacing:.14em; opacity:.62; text-align:left; margin:9px 2px 6px; }
  .role-sec.wolfs{ margin-top:17px; }
  .rrow{ display:flex; align-items:center; gap:10px; padding:7px 4px; border-top:1px solid rgba(244,239,230,.08); }
  .role-sec+.rrow{ border-top:none; }
  .ricon{ width:38px; height:38px; flex:none; cursor:pointer; padding:0; border:none; background:none; }   /* 押すと役職の詳細 */
  .ricon svg{ width:100%; height:100%; display:block; }
  .rtx{ flex:1; min-width:0; text-align:left; }
  .rname{ display:flex; align-items:center; gap:7px; font-size:14.5px; font-weight:900; letter-spacing:.04em; }
  .rbadge{ flex:none; width:72px; height:18px; display:inline-flex; align-items:center; justify-content:center; line-height:1; border-radius:999px; font-size:10.5px; font-weight:900; letter-spacing:.02em; }
  .rbadge.white{ background:#fff; color:#222; }
  .rbadge.black{ background:#111; color:#fff; box-shadow:inset 0 0 0 1px rgba(255,255,255,.55); }
  .rbadge.one{ width:18px; font-size:8.4px; letter-spacing:0; box-shadow:none; }   /* ロビー=「白」「黒」の丸(ふちなし・文字0.8倍)。.blackより後ろに書くこと */
  .rdesc{ margin-top:2px; font-size:11.5px; font-weight:600; line-height:1.5; opacity:.72; }
  .rcnt{ flex:none; width:78px; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .rcnt .rc-val{ min-width:0; width:66px; font-size:12px; line-height:1.4; }   /* 押せそうに見えないよう地は付けない(−＋と同じ横幅) */
  .rcnt .rc-row{ gap:6px; }
  .rcnt .stp{ width:30px; height:26px; font-size:16px; }
  .rcnt .stp.hide, .role-box.ro .stp{ visibility:hidden; }
  .role-err{ margin-top:7px; font-size:12.5px; font-weight:800; color:#ff8f7d; text-align:center; }
  .role-err:empty{ display:none; }
  #lobbyBox .sec-label{ margin:6px 0 -7px; }                               /* 見出しは枠に近づける(ロビーのgap13pxとあわせて6px) */

  .btn-main{ width:var(--uiw); max-width:340px; margin-top:14px; padding:14px; border:none; border-radius:16px; cursor:pointer;
    background:linear-gradient(165deg,#f4c85f,var(--gold) 55%,var(--gold-d));
    color:#3a2a06; font-size:18px; font-weight:900; letter-spacing:.12em; box-shadow:0 5px 0 #8d6712; }
  .btn-main:active{ transform:translateY(3px); box-shadow:0 2px 0 #8d6712; }
  .btn-main:disabled{ filter:grayscale(1) brightness(.75); cursor:default; }
  .txt-btn{ padding:9px 22px; border:1.5px solid rgba(244,239,230,.35); border-radius:999px;
    background:transparent; color:var(--card); font-size:14px; font-weight:800; letter-spacing:.08em; cursor:pointer; }
  .txt-btn:active{ transform:translateY(1px); }
  .txt-btn.sel{ background:var(--gold); border-color:var(--gold); color:#3a2a06; }
  .txt-btn:disabled{ opacity:.35; cursor:default; }

  /* ===== ロビー ===== */
  .lobby-title{ font-size:19px; font-weight:900; letter-spacing:.06em; margin-bottom:14px; }
  #lobbyBox{ display:flex; flex-direction:column; align-items:center; gap:13px; width:var(--uiw); }
  .lobby-list{ display:flex; flex-direction:column; gap:7px; width:100%; }
  .lobby-row{ display:flex; align-items:center; gap:10px; background:rgba(244,239,230,.1);
    border-radius:11px; padding:9px 14px; font-size:15px; font-weight:800; }
  .lobby-row .nm{ flex:1; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lobby-row .p-dot.mine{ cursor:pointer; }   /* 自分の色は押すと変えられる(見た目はほかの人と同じ) */
  .lobby-row .nm.undef{ opacity:.42; font-weight:700; }
  .p-dot{ width:12px; height:12px; border-radius:50%; flex:none; }
  .lobby-row .hostmark{ flex:none; font-size:11px; font-weight:900; color:#3a2a06; background:var(--gold); border-radius:999px; padding:2px 10px 3px; }
  .lobby-row .you{ flex:none; font-size:11px; font-weight:900; color:var(--card); background:rgba(244,239,230,.28); border-radius:999px; padding:2px 10px 3px; }
  .lobby-row .kick-btn{ flex:none; font-size:11px; font-weight:900; color:#ff8f7d; background:none;
    border:1.5px solid rgba(255,143,125,.55); border-radius:999px; padding:3px 10px; cursor:pointer; }
  .code-row{ display:flex; align-items:center; gap:8px; }
  .code-input{ width:170px; padding:11px 14px; border:2px solid rgba(244,239,230,.4); border-radius:12px;
    background:#fff; color:var(--ink); font-size:19px; font-weight:900; letter-spacing:.24em; text-align:center; }
  .paste-btn{ width:42px; height:42px; border:none; background:none; color:var(--card); cursor:pointer;
    display:flex; align-items:center; justify-content:center; opacity:.8; }
  .paste-btn svg{ width:22px; height:22px; }
  .code-show{ display:flex; align-items:center; gap:10px; justify-content:center; cursor:pointer;
    border:2px solid rgba(244,239,230,.4); border-radius:14px; padding:10px 22px; font-size:27px; font-weight:900; letter-spacing:.28em; }
  .code-show svg{ width:19px; height:19px; opacity:.7; }
  .room-note{ font-size:12.5px; font-weight:700; letter-spacing:.05em; opacity:.7; text-align:center; }
  .room-note.err{ color:#ff8f7d; opacity:1; }

  /* ===== ゲーム =====
     盤・メンバー一覧・操作をひとつの「ステージ」にまとめ、操作(HUD)は盤の上に重ねて出す(盤の下には何も置かない) */
  /* 上から「N日目 夜」→「移動 N/M ・ のこりN秒」→盤(ガイドは盤の中の下)→メンバーリスト */
  .stage{ width:min(96vw,484px); display:flex; flex-direction:column; gap:8px; }
  .day-title{ text-align:center; font-size:clamp(28px,8vw,36px); font-weight:900; letter-spacing:.08em; margin-bottom:10px; }
  .day-title .dn{ margin-left:.3em; }
  .day-title .dn.night{ color:#a9a4ff; } .day-title .dn.day{ color:var(--gold); }
  .phase-row{ display:flex; align-items:flex-end; justify-content:space-between; padding:0 2px; min-height:26px; }
  .phase-tag{ font-size:18px; font-weight:900; letter-spacing:.06em; white-space:nowrap; }
  .phase-tag small{ font-size:12px; margin-left:4px; opacity:.85; }
  .timer{ font-size:18px; font-weight:900; letter-spacing:.04em; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .timer.warn{ color:#ff8f7d; }
  /* メンバーリスト=4列の固定サイズのグリッド(名前やバッジで大きさを変えない)。1枠=上に名前・下にバッジ(右に詰める)
     死亡は議論のはじめに公表されるまで出さない */
  .roster{ width:100%; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; background:rgba(0,0,0,.2);
    border:1.5px solid rgba(244,239,230,.12); border-radius:12px; padding:6px; }
  .stage.talk .roster{ order:1; } .stage.talk .board-wrap{ order:2; }    /* 議論 & 投票の間はメンバーリストを盤の上に */
  .ros{ display:flex; flex-direction:column; justify-content:space-between; height:54px; padding:5px 6px; border-radius:9px; min-width:0;
    background:rgba(244,239,230,.08); border:1.5px solid transparent; font-size:12px; font-weight:800; }
  .ros.self{ background:rgba(232,182,71,.17); }                        /* 自分の枠だけ色を変える */
  .ros .r1{ display:flex; align-items:center; gap:5px; min-width:0; }
  .ros .r2{ display:flex; align-items:center; gap:4px; height:18px; }   /* チェックは左下・バッジは右下 */
  .ros .r2 .tgs{ margin-left:auto; display:flex; gap:4px; align-items:center; }
  .ros .nm{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:left; }
  .ros .av{ width:15px; height:15px; border-radius:50%; flex:none; position:relative; }
  .ros .av svg{ position:absolute; left:-2px; top:-3px; width:19px; height:19px; }
  .ros.dead{ opacity:.42; }
  .ros.dead .nm{ text-decoration:line-through; text-decoration-thickness:2px; }
  .ros.dead .av::before, .ros.dead .av::after{ content:""; position:absolute; left:50%; top:-2px; bottom:-2px; width:2px; margin-left:-1px;
    background:#fff; border-radius:1px; transform:rotate(45deg); }
  .ros.dead .av::after{ transform:rotate(-45deg); }
  .ros.can{ cursor:pointer; border-color:rgba(244,239,230,.3); }
  .ros.pick{ border:1.5px dashed var(--gold); }                         /* 1回目=選んだだけ(もう一度で確定) */
  .ros.voted{ border:1.5px solid var(--gold); background:rgba(232,182,71,.3); }   /* 確定した票 */
  .skip-btn{ grid-column:1/-1; height:34px; border-radius:9px; border:1.5px solid rgba(244,239,230,.3); background:rgba(244,239,230,.06);
    color:var(--card); font-size:12.5px; font-weight:900; letter-spacing:.08em; cursor:pointer; }
  .skip-btn.pick{ border-style:dashed; border-color:var(--gold); }
  .skip-btn.voted{ border-color:var(--gold); background:rgba(232,182,71,.3); }
  .ros .tg{ flex:none; height:18px; line-height:18px; font-size:9.5px; font-weight:900; border-radius:999px; text-align:center; white-space:nowrap; overflow:hidden; }
  .tg.rl{ padding:0 7px; color:#fff; cursor:pointer; }                   /* 役職バッジ(文字に合わせた幅・押すと役職の説明) */
  .tg.rl.villager{ background:var(--vil); } .tg.rl.seer{ background:var(--seer); } .tg.rl.wolf{ background:var(--wolf); }
  .tg.rl.hawk{ background:var(--hawk); } .tg.rl.mad{ background:var(--mad); }
  .tg.rl.medium{ background:#6f7fd0; } .tg.rl.doctor{ background:#8ab13a; } .tg.rl.talker{ background:#d89a3a; } .tg.rl.miner{ background:#a3342a; } .tg.rl.sensitive{ background:#d8729a; }
  .tg.poison{ padding:0 7px; background:#7a2540; color:#ffd9e4; box-shadow:inset 0 0 0 1px rgba(255,255,255,.35); }   /* ドクターにだけ見える「毒」 */
  .tg.white, .tg.black{ width:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; line-height:1; }   /* 占い結果は丸(文字は真ん中) */
  .ros .tg.white, .ros .tg.black{ font-size:7.6px; }   /* メンバーリストの白黒の丸も文字0.8倍 */
  .tg.white{ background:#fff; color:#222; }
  .tg.black{ background:#111; color:#fff; }
  .tg.vcnt{ width:26px; background:var(--gold); color:#3a2a06; }
  .ros .ck{ flex:none; width:16px; height:16px; display:flex; align-items:center; justify-content:center; }
  .ros .ck svg{ width:16px; height:16px; }

  .board-wrap{ width:100%; position:relative; }
  #board{ display:block; width:100%; height:auto; touch-action:manipulation; border-radius:10px; overflow:hidden;
    box-shadow:0 6px 20px rgba(0,0,0,.35); }
  #board .cell{ cursor:default; }
  #board .cell.can, #board.mv, #board.mv .cell{ cursor:pointer; }
  #board .pc{ transition:transform .38s cubic-bezier(.3,.8,.3,1), opacity .3s; }
  #board .pc.tg{ cursor:pointer; }
  #board .ring{ fill:none; stroke:#5ec8ff; stroke-width:3px; vector-effect:non-scaling-stroke; stroke-dasharray:1.6 1.2; animation:ringSpin 3s linear infinite; }   /* 選べる相手=水色の点線(移動の線と同じ3px) */
  @keyframes ringSpin{ to{ stroke-dashoffset:-11; } }
  #board .plb{ font-weight:900; paint-order:stroke fill; stroke:rgba(14,11,24,.92); stroke-width:4px; vector-effect:non-scaling-stroke; stroke-linejoin:round; pointer-events:none; }   /* ふちは見た目で2px(半分は文字の下に隠れる) */
  /* ターンのはじめに画面の真ん中へ大きな数字(残りターン)。残り3ターンから赤くなっていく */
  /* 盤の真ん中。「のこり」+数字(旧・画面の真ん中の2/3の大きさ) */
  #turnFx{ position:absolute; inset:0; z-index:2; display:none; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; color:var(--tc,#fff); opacity:.5; }
  #turnFx.on{ display:flex; animation:turnFx 1.8s ease-out forwards; }
  #turnFx small{ font-size:min(7vw,32px); font-weight:900; letter-spacing:.2em; line-height:1; margin-bottom:-.2em; }
  #turnFx span{ font-size:min(52vw,41vh,300px); font-weight:900; line-height:1; }
  @keyframes turnFx{ 0%{ opacity:0; transform:scale(1.25); } 15%{ opacity:1; transform:scale(1); } 70%{ opacity:1; } 100%{ opacity:0; transform:scale(.96); } }
  /* ガイド=操作の補助だけ。盤の中の下(自分のコマが下半分の時は上)に、盤より細い角丸の帯で出す。ボタンだけが押せる */
  .hud{ position:absolute; left:50%; transform:translateX(-50%); bottom:15px; z-index:3; pointer-events:none;
    width:calc(74% + 10px); background:rgba(18,14,30,.86); border-radius:999px;
    padding:10.5px 16px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .hud.tall{ border-radius:22px; }
  .hud.top{ bottom:auto; top:15px; }
  .hud:empty{ display:none; }
  .hud button{ pointer-events:auto; }
  .hud .hud-btns{ display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap; }
  #board .cno{ font-family:inherit; opacity:.85; user-select:none; }   /* マスの通し番号 */
  .hud .hint{ display:flex; align-items:center; justify-content:center; gap:6px; font-size:13px; font-weight:800; letter-spacing:.04em; text-align:center; line-height:1.5; }
  .hud .hint svg{ width:16px; height:16px; flex:none; }

  /* コマの横(基本は右・入らない時は左)に出す操作。上に「◯◯と接触」、ボタンは縦に並べる(全部同じサイズ・囲みの背景はなし) */
  /* コマから出ている吹き出し。右に出す時はしっぽが左、左に出す時はしっぽが右(--ty=しっぽの高さ) */
  .pop{ position:absolute; z-index:4; display:flex; flex-direction:column; align-items:stretch; gap:5px; width:183px; transform:translateY(-50%); box-sizing:border-box;

  .pop.r::before{ right:100%; border-right-color:rgba(232,182,71,.55); }
  .pop.r::after{ right:calc(100% - 2px); border-right-color:rgba(24,20,38,.97); }
  .pop.l::before{ left:100%; border-left-color:rgba(232,182,71,.55); }
  .pop.l::after{ left:calc(100% - 2px); border-left-color:rgba(24,20,38,.97); }
  .pop .pop-h{ font-size:12px; font-weight:900; letter-spacing:.02em; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--gold); padding:0 2px 2px; }
  .pbtn{ width:165px; height:34px; padding:0 8px; border:none; border-radius:10px; background:rgba(244,239,230,.1); color:var(--card);

  .pbtn.dang{ background:#c9432f; color:#fff; box-shadow:none; }

  /* ダイアログ=ゲームと同じ暗い紺の板に金のふち(2026-09-25にゲームの見た目へ寄せた) */
  .r-card{ width:min(92vw,430px); max-height:82svh; overflow-y:auto; color:var(--card);

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const TAPW=(window.matchMedia&&matchMedia("(pointer:coarse)").matches)?"タップ":"クリック";
window.__TAPW=TAPW;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ================= 効果音(全合成) ================= */
let actx=null, seBus=null, noiseBuf=null;
let seOn=true; try{ seOn=localStorage.getItem("bj.se")!=="0"; }catch(e){}
function ensureAudio(){
  if(!actx){
    try{
      actx=new (window.AudioContext||window.webkitAudioContext)();
      seBus=actx.createGain(); seBus.gain.value=seOn?1:0; seBus.connect(actx.destination);
      const len=actx.sampleRate; noiseBuf=actx.createBuffer(1,len,actx.sampleRate);
      const d=noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    }catch(e){}
  }
  if(actx&&actx.state!=="running"){ try{ actx.resume(); }catch(e){} }
}
/* ★スマホで音が鳴らなくなる対策(2026-09-24牧村指摘「スマホだと音声が安定しない・ならないことが多々ある」)
   スマホは「他のアプリの音・電話・画面ロック・タブの切り替え」で音の箱(AudioContext)が勝手に止まる。
   止まったまま誰も起こさないと、そのあとの音は全部無音になる(とくにタイマーや通信で鳴る音)。
   → ①画面のどこを触っても ②アプリから戻ってきても ③ページを表示し直しても 起こし直す。
   ※音の箱を作れるのは「人が触った瞬間」だけなので、最初の1タップで必ず作られるようにもなる。 */
function audioWake(){ try{ ensureAudio(); }catch(e){} }
["pointerdown","touchend","keydown"].forEach(function(t){ document.addEventListener(t,audioWake,{capture:true,passive:true}); });
document.addEventListener("visibilitychange",function(){ if(!document.hidden) audioWake(); });
window.addEventListener("pageshow",audioWake);
window.addEventListener("focus",audioWake);
function note(f,t,dur,vol,type,f2){
  if(!actx||document.hidden) return;              // 画面が裏にある間(別のタブ・アプリを見ている間)は鳴らさない
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.006); g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(g); g.connect(seBus); o.start(t); o.stop(t+dur+0.02);
}
function noiseHit(t,f1,f2,q,vol,dur){
  if(!actx||document.hidden) return;
  const n=actx.createBufferSource(); n.buffer=noiseBuf;
  const b=actx.createBiquadFilter(); b.type="bandpass"; b.frequency.setValueAtTime(f1,t);
  b.frequency.exponentialRampToValueAtTime(f2,t+dur*0.9); b.Q.value=q;
  const g=actx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.002);
  g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  n.connect(b); b.connect(g); g.connect(seBus); n.start(t); n.stop(t+dur+0.02);
}
const T0=()=>actx?actx.currentTime:0;
function playSelect(){ if(!actx) return; note(880,T0(),0.07,0.14,"triangle"); }
function playTick(){ if(!actx) return; note(1320,T0(),0.04,0.07,"triangle"); }
function playWhisper(){ if(!actx) return; const t=T0(); note(1568,t,0.09,0.06,"sine"); note(1175,t+0.08,0.14,0.05,"sine"); }
function playStep(){ if(!actx) return; const t=T0(); note(660,t,0.08,0.1,"triangle"); note(990,t+0.07,0.1,0.08,"triangle"); }
function playMove(){ if(!actx) return; noiseHit(T0(),500,1800,0.9,0.12,0.3); }
function playSeer(){ if(!actx) return; const t=T0(); [1047,1319,1568].forEach((f,i)=>note(f,t+i*0.07,0.4,0.09,"sine")); }
function playPoison(){ if(!actx) return; const t=T0(); note(420,t,0.18,0.14,"sine",180); note(300,t+0.12,0.28,0.1,"triangle",120); }
function playDeath(){ if(!actx) return; const t=T0(); note(392,t,1.0,0.055,"sine",370); note(294,t+0.22,1.3,0.05,"sine",277); note(196,t+0.22,1.3,0.03,"sine"); }   // 死亡(吊り・敏感肌のお知らせも)=小さくやさしい下がる2音
function playTalk(){ if(!actx) return; const t=T0(); [523,659,784].forEach((f,i)=>note(f,t+i*0.1,0.3,0.12,"triangle")); }
function playVote(){ if(!actx) return; const t=T0(); note(330,t,0.1,0.06,"triangle"); note(247,t+0.08,0.22,0.055,"sine"); }   // 投票の確定=低めでやわらかく
function playWarn(){ if(!actx) return; note(880,T0(),0.06,0.09,"square"); }
function playWin(){ if(!actx) return; const t=T0();
  [523,659,784,1047].forEach((f,i)=>note(f,t+i*0.09,0.22,0.14,"triangle"));
  [523,659,784,1047].forEach(f=>note(f,t+0.42,0.9,0.09,"triangle")); note(262,t+0.42,0.9,0.1,"sine"); }
function playLose(){ if(!actx) return; const t=T0(); [523,466,392,311].forEach((f,i)=>note(f,t+i*0.16,0.3,0.12,"triangle")); }
function renderSnd(){ $("seBtn").classList.toggle("off", !seOn); }
$("seBtn").addEventListener("click",()=>{
  ensureAudio(); seOn=!seOn; try{ localStorage.setItem("bj.se", seOn?"1":"0"); }catch(e){}
  if(seBus&&actx) seBus.gain.setTargetAtTime(seOn?1:0, actx.currentTime, 0.02);
  renderSnd(); if(seOn) playSelect();
});

/* ================= ルールと定数 ================= */
/* 視界。r=まわり何マスまでの正方形(1=周囲8マス)／cut=縦横の合計がこれを超える所は見えない(四隅を落とす)
   市民・占い師・狂人=周囲8マス(3×3)／毒殺人狼・鷹の目=3×3の各辺に3マスずつ足した21マス(5×5から四隅を抜いた形)
   役職を足す時はここに足すだけ */
const VIEW={ villager:{r:1}, seer:{r:1}, mad:{r:1}, medium:{r:1}, doctor:{r:1}, talker:{r:1}, sensitive:{r:1}, wolf:{r:2,cut:3}, hawk:{r:2,cut:3}, miner:{r:2,cut:3} };
function inView(role,dx,dy){ const v=VIEW[role]||VIEW.villager, ax=Math.abs(dx), ay=Math.abs(dy);
  return Math.max(ax,ay)<=v.r && (!v.cut || ax+ay<=v.cut); }
const ROLE_NAME={ villager:"市民", seer:"占い師", wolf:"毒殺人狼", hawk:"鷹の目", mad:"狂人", medium:"霊感が強い人", doctor:"ドクター", talker:"議論好き", sensitive:"敏感肌", miner:"地雷人狼" };
const ROLE_KEYS=["wolf","miner","seer","hawk","medium","doctor","talker","sensitive","mad"];          // ロビーで数を決める役職(残りは市民)
const ROLE_ORDER=["villager","seer","hawk","medium","doctor","talker","sensitive","wolf","miner","mad"];   // ロビーの並び(結果の並びにも使う)
function roleMax(n){ return Math.max(1,(n|0)-1); }         // 役職の数の上限=メンバー数-1(2026-09-25)
/* 人数ごとの役職の数(ロビーで役職をさわるまでの自動の値) */
const ROLE_PLAN={ 4:{wolf:1,seer:1}, 5:{wolf:1,seer:1}, 6:{wolf:2,seer:1}, 7:{wolf:2,seer:1}, 8:{wolf:2,seer:1} };
const MIN_P=4, MAX_P=8;
const POISON_GAP=2;                                    // 毒を盛ったターンから、次に盛れるまで(2=1ターンあける)
const MINE_GAP=2;                                      // 地雷を置いたターンから、次に置けるまで(2=1ターンあける)
const PCOL=["#ff6b6b","#4dabf7","#69db7c","#ffd43b","#da77f2","#ff922b","#38d9a9","#f783ac"];
const N_OPTS=[5,6,7,8,9];                             // 盤の広さ
const TURN_OPTS=[3,4,5,6,7,8,9,10,12,15];             // 移動フェーズのターン数
const TALK_OPTS=[30,60,90,120,150,180,240,300];        // 議論の時間(秒)
const STEP_OPTS=[10,15,20,30,45,60];                  // 1ステップ(移動/行動)の制限時間(秒)
const VOTE_SEC=30;                                    // 投票の制限時間(秒)
const VRES_MS=5000;                                   // 投票結果を見せる時間
const DEF_RULES={ n:7, turns:8, talk:120, step:20, roles:null };   // roles=null は「人数に合わせて自動」
let rules=Object.assign({},DEF_RULES);
const DIRS={ u:[0,-1], d:[0,1], l:[-1,0], r:[1,0], s:[0,0] };
const dist=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
const fmtT=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
/* 話す(となりの人に3文字)。漢字も使える(2026-09-25に戻した)。行動とは別に送れる */
function cleanMsg(s){ return [...String(s||"").trim()].slice(0,3).join(""); }

const ROLE_ZERO={ wolf:0, miner:0, seer:0, hawk:0, medium:0, doctor:0, talker:0, sensitive:0, mad:0 };
function autoRoles(n){ const pl=ROLE_PLAN[Math.min(MAX_P,Math.max(MIN_P,n))]; return Object.assign({},ROLE_ZERO,{ wolf:pl.wolf, seer:pl.seer }); }
function roleCounts(n){ return rules.roles? Object.assign({},ROLE_ZERO,{wolf:1},rules.roles) : autoRoles(n); }
function wolfNum(r){ return (r.wolf|0)+(r.miner|0); }   // 人狼の頭数(毒殺人狼＋地雷人狼)
function roleSum(r){ return ROLE_KEYS.reduce((a,k)=>a+(r[k]|0),0); }
function roleErr(n){
  const r=roleCounts(n);
  if(wolfNum(r)<1) return "人狼は1人以上";
  if(roleSum(r)>n) return "役職の数が人数より多い";
  if(wolfNum(r)*2>=n) return "人狼が多い";
  return "";
}
/* 役職のアイコン(1つにつき2色=役職の色の丸+白の絵。細部は丸と同じ色で抜く)・短い説明・占い結果 */
const ROLE_COL={ villager:"#5fb46e", seer:"#4a97d8", hawk:"#2a9a8c", wolf:"#d84c36", mad:"#8f55c4", medium:"#6f7fd0", doctor:"#8ab13a", talker:"#d89a3a", sensitive:"#d8729a", miner:"#a3342a" };
const ICON_G={

function newGame(members,fixRole){           // fixRole={id,role}=その人の役職を決めておく(ロボット対戦)

    if(i>=0 && roles[i]!==fixRole.role){

      [roles[i],roles[j]]=[roles[j],roles[i]];

  const N=rules.n, cells=[]; for(let y=0;y<N;y++) for(let x=0;x<N;x++) cells.push([x,y]); shuffle(cells);

let cpuMem={ due:{}, claims:[], wolfTg:{}, talked:-1, poisoned:{} };

const pick=a=>a[Math.floor(Math.random()*a.length)];
const CPU_MSG=["やあ","よろ","しろ","だれ?","あやし","にげて"];
function sees(p,q){ return inView(p.role, q.x-p.x, q.y-p.y); }
function stepToward2(p,tx,ty){                 // p から (tx,ty) へ近づく1マス(縦横の差が大きい方へ)
  const dx=tx-p.x, dy=ty-p.y; if(!dx&&!dy) return "s";
  if(Math.abs(dx)>=Math.abs(dy)) return dx>0?"r":"l"; return dy>0?"d":"u";
}
function randomStep(p){
  const ok=Object.keys(DIRS).filter(d=>{ const v=DIRS[d], nx=p.x+v[0], ny=p.y+v[1]; return nx>=0&&ny>=0&&nx<G.N&&ny<G.N; });
  return Math.random()<.2? "s" : pick(ok.filter(d=>d!=="s").concat(["s"]));
}
function cpuMove(p){
  const vis=alivePs().filter(q=>q.id!==p.id && sees(p,q));
  if(p.role==="wolf" && canPoison(p)){           // 毒殺人狼: 見えている人狼陣営以外に近づく(すでにとなりなら留まる)
    const prey=vis.filter(q=>canPoisonTo(p,q)&&!q.poison); if(prey.length && !cpuMem.poisoned[p.id+":"+G.round] && Math.random()<.6){
      const t=prey.sort((a,b)=>dist(a,p)-dist(b,p))[0]; if(dist(t,p)<=1) return Math.random()<.7?"s":randomStep(p);
      return stepToward2(p,t.x,t.y); }
  }
  if(p.role==="seer"){                          // 占い師: まだ占っていない人に近づく
    const done=new Set(p.notes.map(n=>n.tg)), c=vis.filter(q=>!done.has(q.id)); if(c.length){
      const t=c.sort((a,b)=>dist(a,p)-dist(b,p))[0]; if(dist(t,p)<=1) return "s"; return stepToward2(p,t.x,t.y); }
  }

}
function cpuAct(p){                            // 行動と、ときどき「話す」(行動とは別に同時にできる)

  if(p.role==="miner" && canMine(p) && Math.random()<.35){
    const c=[[1,0],[-1,0],[0,1],[0,-1]].map(d=>[p.x+d[0],p.y+d[1]]).filter(([x,y])=>mineOk(p,x,y)&&!mineAt(x,y)&&!G.players.some(q=>q.alive&&q.x===x&&q.y===y));
    if(c.length){ const [mx,my]=pick(c); return { k:"mine", mx, my }; } }
  if(!adj.length) return { k:"none" };
  const wh = Math.random()<.14? { tg:pick(adj).id, tx:pick(CPU_MSG) } : null;
  if(p.role==="doctor" && canCure(p)){ const c=adj.filter(q=>canCureTo(p,q)); if(c.length) return { k:"cure", tg:pick(c).id, wh }; }   // ドクターのロボット: となりに毒の人がいれば治す
  if(p.role==="seer"){ const done=new Set(p.notes.map(n=>n.tg)), c=adj.filter(q=>!done.has(q.id)); if(c.length) return { k:"seer", tg:pick(c).id, wh }; }
  if(p.role==="wolf" && canPoison(p)){ const c=adj.filter(q=>canPoisonTo(p,q)&&!q.poison);
    /* ロボットの毒殺人狼は1ラウンドに1回まで・確率も控えめ(強すぎるとラウンド1で終わってしまうため) */
    if(c.length && !cpuMem.poisoned[p.id+":"+G.round] && Math.random()<.4){ cpuMem.poisoned[p.id+":"+G.round]=1;
      const r=Math.random(); let dl= r<.35?0 : r<.75?1 : 2; while(dl>0 && !dlOk(dl)) dl--; return { k:"poison", tg:pick(c).id, dl, wh }; } }
  return { k:"none", wh };
}
function cpuSendAct(p,sk,a){ if(a.wh) hostAct({ t:"wh", from:p.id, sk, tg:a.wh.tg, tx:a.wh.tx }); if(G && G.sk===sk) hostAct({ t:"act", from:p.id, sk, k:a.k, tg:a.tg, dl:a.dl, mx:a.mx, my:a.my }); }
function cpuClaimsAtTalk(){                     // 議論のはじめ: 占い師(と、ときどき人狼陣営の偽の占い師)が結果をチャットで言う
  if(cpuMem.talked===G.round) return; cpuMem.talked=G.round;
  let faked=false;
  alivePs().filter(isCpu).forEach(p=>{
    let tg=null, black=false;
    if(p.role==="seer" && p.notes.length){
      const nt=p.notes[p.notes.length-1], t=pById(nt.tg); if(t){ tg=t; black=nt.black; }
    }else if(isWolfTeam(p) && !faked && Math.random()<(p.role==="mad"?.5:.3)){
      const c=alivePs().filter(q=>!knowsRole(p,q)||!isWolf(q)).filter(q=>q.id!==p.id); if(c.length){ tg=pick(c); black=Math.random()<.6; faked=true; }
    }
    if(!tg) return;
    const line="占い師です。"+tg.n+"は"+(black?"黒":"白")+"でした";
    cpuMem.claims.push({ by:p.id, tg:tg.id, black, r:G.round });
    setTimeout(()=>{ if(G&&G.phase==="talk"&&p.alive) recvChat(p.n,line,p.c); }, 900+Math.random()*2600);
  });
}
function cpuVote(p){
  const others=alivePs().filter(q=>q.id!==p.id);
  if(!others.length) return "skip";
  if(p.role==="seer"){
    const blk=p.notes.filter(n=>n.black).map(n=>pById(n.tg)).filter(q=>q&&q.alive); if(blk.length) return blk[0].id;
    const white=new Set(p.notes.filter(n=>!n.black).map(n=>n.tg));
    const c=others.filter(q=>!white.has(q.id)); return (c.length?pick(c):pick(others)).id;
  }
  if(isWolf(p)){                                // 人狼どうし(毒殺人狼・地雷人狼)は同じ相手に入れる(占い師を名乗った人を優先)。狂人は仲間が分からないので市民と同じ動き
    if(!cpuMem.wolfTg[G.round]){
      const cl=cpuMem.claims.filter(c=>c.r===G.round).map(c=>pById(c.by)).filter(q=>q&&q.alive&&!isWolf(q));
      const c=alivePs().filter(q=>!isWolf(q)); cpuMem.wolfTg[G.round]=(cl.length?cl[0]:pick(c)||{}).id||"skip";
    }
    const t=cpuMem.wolfTg[G.round]; return (t && t!==p.id && pById(t) && pById(t).alive)? t : "skip";
  }
  /* 市民・鷹の目: 「黒」と言われた人 → あなたの票に乗る → てきとう の順 */
  const blk=cpuMem.claims.filter(c=>c.r===G.round && c.black && c.tg!==p.id && pById(c.tg) && pById(c.tg).alive);
  if(blk.length && Math.random()<.7) return pick(blk).tg;
  const mine=G.votes[myId]; if(mine && mine!=="skip" && mine!==p.id && Math.random()<.4) return mine;
  if(Math.random()<.15) return "skip";
  return pick(others).id;
}
function cpuDrive(){                            // hostTickから0.2秒ごとに呼ばれる
  if(!G || !["move","act","talk"].includes(G.phase)) return;
  if(G.phase==="talk") cpuClaimsAtTalk();
  const now=Date.now(), sk=G.sk;
  alivePs().filter(isCpu).forEach(p=>{
    if(!G || G.sk!==sk) return;
    const inp = G.phase==="move"?G.moves[p.id]!==undefined : G.phase==="act"?G.acts[p.id]!==undefined : G.votes[p.id]!==undefined;
    if(inp) return;
    const k=sk+":"+p.id;
    if(!cpuMem.due[k]) cpuMem.due[k]= now + (G.phase==="talk"? 4000+Math.random()*9000 : 300+Math.random()*900);
    if(now<cpuMem.due[k]) return;
    if(G.phase==="move") hostAct({ t:"move", from:p.id, sk, d:cpuMove(p) });
    else if(G.phase==="act") cpuSendAct(p,sk,cpuAct(p));
    else if(G.phase==="talk") hostAct({ t:"vote", from:p.id, sk, tg:cpuVote(p) });
  });
}
function resolveNow(){                       // 締め切り(または全員そろった)=未入力は「何もしない」扱い
  if(G.phase==="move") resolveMove();
  else if(G.phase==="act") resolveAct();
  else if(G.phase==="talk") resolveVote();                // 議論 & 投票の時間切れ=その時の票で決める
  else if(G.phase==="vres") afterVote();
}
function resolveMove(){
  const N=G.N;
  alivePs().forEach(p=>{
    const v=DIRS[G.moves[p.id]||"s"]||DIRS.s, nx=p.x+v[0], ny=p.y+v[1];
    if(nx>=0&&ny>=0&&nx<N&&ny<N){ p.x=nx; p.y=ny; }
  });
  /* ★地雷を踏む(移動しきってから判定。人狼は踏んでも死なない) */
  if((G.mines||[]).length){
    alivePs().forEach(p=>{
      if(isWolf(p)) return;                                   // 毒殺人狼・地雷人狼は踏んでも平気
      const mn=mineAt(p.x,p.y); if(!mn) return;
      G.mines=G.mines.filter(z=>z!==mn);                      // 踏まれた地雷は無くなる
      die(p,"mine",mn.by);
    });
    if(checkWin()) return;
  }
  startStep("act");
  /* となり(同じマスも含む)に誰もいない人は、行動を自動でスキップ。★地雷人狼は相手がいなくても置けるのでスキップしない */
  alivePs().forEach(p=>{ if(!neighbors(p).length && !(p.role==="miner"&&canMine(p))) G.acts[p.id]={ k:"none", auto:true }; });
  if(allIn(G.acts)) resolveAct(); else bump();
}
function die(p,cause,by){ if(!p.alive) return; p.alive=false; p.cause=cause; p.killer=by||""; p.poison=null; G.deathsThisRound.push(p.id);
  /* 霊感が強い人だけが見える死体。吊りは議論中なので盤には残さない(議論をはさむと消えるため) */
  if(cause!=="hang"){ G.corpses=(G.corpses||[]).concat([{ x:p.x, y:p.y, id:p.id, n:p.n, c:p.c }]); } }
function resolveAct(){
  G.tick++;
  /* ① 行動は「このステップが始まった時の盤面」で同時に解決する(毒で死ぬ人の行動も有効)
        占う・毒殺は1人1ターンに1つ。「話す」はそれとは別にできる */
  const newPoison=[], whs=[], cured=[];
  alivePs().forEach(p=>{
    const w=(G.whs||{})[p.id];
    const a=G.acts[p.id]; if(!a||!a.tg||a.k==="none") return;
    const t=pById(a.tg); if(!t||!t.alive||t.id===p.id||dist(p,t)>1) return;
    if(a.k==="seer" && p.role==="seer") p.notes.push({ r:G.round, t:G.turn, tg:t.id, black:isWolf(t) });
    if(a.k==="poison" && p.role==="wolf" && canPoisonTo(p,t) && G.tick-(p.lastPoison==null?-99:p.lastPoison)>=POISON_GAP){
      p.lastPoison=G.tick; newPoison.push({ tg:t, dl:Math.max(0,Math.min(2,a.dl|0)), by:p.id }); }
    if(a.k==="cure" && p.role==="doctor" && p.lastCureRound!==G.round && t.poison){ p.lastCureRound=G.round; cured.push(t); }   // ★毒が進む前に治す
  });
  cured.forEach(t=>{ t.poison=null; });
  /* ①-b 地雷の設置(相手ではなくマスを選ぶ)。すでに誰かが立っていたら即発動 */
  const mineHits=[];
  alivePs().forEach(p=>{
    const a=G.acts[p.id]; if(!a || a.k!=="mine" || p.role!=="miner") return;
    if(G.tick-(p.lastMine==null?-99:p.lastMine)<MINE_GAP) return;
    const x=a.mx|0, y=a.my|0; if(!mineOk(p,x,y)) return;
    p.lastMine=G.tick;
    if(mineAt(x,y)) return;                                   // すでに地雷があるマスには重ねない
    G.mines=(G.mines||[]).concat([{ x, y, by:p.id }]);
    alivePs().forEach(q=>{ if(!isWolf(q) && q.x===x && q.y===y) mineHits.push({ q, by:p.id, x, y }); });   // 立っている人がいたら即発動
  });
  mineHits.forEach(o=>{ const mn=mineAt(o.x,o.y); if(mn) G.mines=G.mines.filter(z=>z!==mn); die(o.q,"mine",o.by); });
  /* ② 前のターンまでに盛られた毒を1つ進める(0になったら死亡) */
  alivePs().forEach(p=>{ if(p.poison){ const by=p.poison.by; p.poison.left--; if(p.poison.left<=0) die(p,"poison",by); } });
  /* ③ 今回の毒: 0=その場で即死／1〜2=本人は気づかず、そのターン数だけ普通に行動してから死亡 */
  newPoison.forEach(o=>{ const t=o.tg; if(!t.alive) return;
    if(o.dl===0) die(t,"poison",o.by);
    else if(!t.poison || t.poison.left>o.dl) t.poison={ left:o.dl, by:o.by };   // 2回盛られたら早い方
  });
  if(checkWin()) return;
  if(G.turn>=G.rules.turns){ startTalk(); return; }
  G.turn++; startStep("move");
}
function startTalk(){
  G.players.forEach(p=>{
    if(!p.alive) p.pub=true;            // ★死亡の公表はここだけ(メンバー一覧が更新される)
    p.poison=null; p.lastPoison=-99;    // ★議論をまたいだ毒は無かったことにする(毒のインターバルもリセット)
    p.lastMine=-99;                     // 地雷のインターバルもリセット
  });
  G.mines=[];                           // ★置いた地雷も議論をまたいだら消える(2026-09-25)
  G.corpses=[];                         // ★霊感が強い人が見ていた死体は、議論を1度はさむと消える
  startStep("talk");
}
function resolveVote(){
  const cnt={};
  alivePs().forEach(p=>{ const v=G.votes[p.id]; if(v && v!=="skip" && pById(v) && pById(v).alive && v!==p.id) cnt[v]=(cnt[v]||0)+1; });
  let top=0, tops=[]; Object.keys(cnt).forEach(id=>{ if(cnt[id]>top){ top=cnt[id]; tops=[id]; } else if(cnt[id]===top) tops.push(id); });
  /* ★同数トップが複数いる時は「誰も吊られない」(再投票はしない)。1票も入らなかった時も同じ */
  const hanged=(tops.length===1)? tops[0] : null;
  G.lastVote={ cnt, hanged, votes:Object.assign({},G.votes), tie:tops.length>1 };
  if(hanged){ const p=pById(hanged); die(p,"hang"); p.pub=true; }
  G.winner=judge();
  startStep("vres");
}
function afterVote(){
  if(G.winner){ G.phase="over"; G.sk++; G.stepEnd=0; bump(); return; }
  G.round++; G.turn=1; G.deathsThisRound=[]; startStep("move");
}
function judge(){                            // 数えるのは毒殺人狼だけ(狂人は「それ以外」の側に数える)
  const al=alivePs(), w=al.filter(isWolf).length, o=al.length-w;
  if(w===0) return "village";
  if(w>=o) return "wolf";
  return "";
}
function checkWin(){                         // 毒殺・吊り・退出の直後に呼ぶ
  const w=judge(); if(!w) return false;
  G.winner=w; G.players.forEach(p=>{ if(!p.alive) p.pub=true; });
  G.phase="over"; G.sk++; G.stepEnd=0; bump(); return true;
}
function allIn(obj){ return alivePs().every(p=>obj[p.id]!==undefined); }
function hostAct(a){
  if(!G || a.sk!==G.sk) return;              // 前のステップの入力は捨てる
  const p=pById(a.from); if(!p||!p.alive) return;
  if(a.t==="move" && G.phase==="move" && DIRS[a.d]){ G.moves[p.id]=a.d; bump(); if(allIn(G.moves)) resolveMove(); return; }
  if(a.t==="act" && G.phase==="act"){
    const cur=G.acts[p.id];
    if(cur && cur.auto) return;                                        // 自動スキップ。占う/毒殺は全員の行動がそろうまで相手を変えられる
    if(a.k==="clear"){ if(cur && ((cur.k==="none" && !cur.byWh) || cur.k==="mine")){ delete G.acts[p.id]; bump(); } return; }   // 「やっぱりなし」・置いた地雷の取り消し   // 「やっぱりなし」
    const k=["none","seer","poison","cure","mine"].includes(a.k)? a.k : "none";
    let o={ k:"none" };
    if(k==="mine"){                                                    // ★地雷は相手ではなくマスを選ぶ
      if(!(p.role==="miner" && canMine(p) && mineOk(p,a.mx|0,a.my|0))) return;
      o={ k:"mine", mx:a.mx|0, my:a.my|0 };
    } else if(k!=="none"){
      const t=pById(a.tg);
      const ok = t && t.alive && t.id!==p.id && dist(t,p)<=1 &&
        ((k==="seer"&&p.role==="seer") || (k==="poison"&&p.role==="wolf"&&canPoisonTo(p,t)&&canPoison(p)&&dlOk(a.dl))
         || (k==="cure"&&p.role==="doctor"&&canCure(p)&&canCureTo(p,t)));
      if(!ok) return;
      o={ k, tg:t.id };
      if(k==="poison") o.dl=Math.max(0,Math.min(2,a.dl|0));
    }
    G.acts[p.id]=o; bump(); if(allIn(G.acts)) resolveAct(); return;
  }
  if(a.t==="wh" && G.phase==="act"){                                  // 話す(3文字)。行動とは別。力のない人はこれで行動を終えたことにする
    if(G.acts[p.id] && G.acts[p.id].auto) return;
    const t=pById(a.tg), tx=cleanMsg(a.tx);
    G.whs=G.whs||{}; if(G.whs[p.id]) return;                         // 話すのも1ターンに1人まで
    if(!t||!t.alive||t.id===p.id||dist(t,p)>1||!tx) return;
    G.whs[p.id]={ tg:t.id, tx };
    G.wh=(G.wh||[]).concat([{ id:G.gid+":"+G.sk+":"+p.id, f:p.id, to:t.id, t:tx }]); while(G.wh.length>60) G.wh.shift();   // 話すは送った瞬間に届く(行動の解決を待たない)
    if(!hasPower(p) && G.acts[p.id]===undefined) G.acts[p.id]={ k:"none", byWh:1 };
    bump(); if(allIn(G.acts)) resolveAct(); return;
  }
  if(a.t==="ftalk" && G.phase==="act"){                               // ★議論好き: ゲーム中1回だけ、その場で議論に移す
    if(p.role!=="talker" || p.usedFTalk) return;
    p.usedFTalk=true; startTalk(); return; }
  if(a.t==="vote" && G.phase==="talk"){                               // 議論 & 投票: 確定した票(スキップも)。全員が確定したらすぐ終わる
    if(a.tg!=="skip"){ const t=pById(a.tg); if(!t||!t.alive||t.id===p.id) return; }
    G.votes[p.id]=a.tg; bump(); if(allIn(G.votes)) resolveVote(); return; }
}
function bump(){ sendSnap(); render(); }

/* ================= 入力(自分 or 試作モードの操作中の人) ================= */
function submit(o){

  o.sk=G.sk; o.from=VID();
  if(debug){ const sk=G.sk; hostAct(o); if(G.sk===sk && myInputIn()) dbgNext(); return; }
  if(isHost){ hostAct(o); return; }
  if(o.t==="wh"){ pendWh=o; pendWhSent=Date.now(); } else { pending=o; pendingSent=Date.now(); }
  sendAct(o); render();
}
function pendingDone(p){                         // ゲストの送った入力がスナップに載ったか(票の変更・取り消しも見分ける)
  const id=myId;
  if(p.sk!==G.sk) return true;
  if(p.t==="vote") return G.votes[id]===p.tg;
  if(p.t==="act" && p.k==="clear") return !G.acts[id];
  if(p.t==="act" && p.k==="mine"){ const c=G.acts[id]; return !!c && c.k==="mine" && c.mx===p.mx && c.my===p.my; }   // 置き直しがスナップに載ったか
  if(p.t==="act" && (p.k==="seer"||p.k==="poison"||p.k==="cure")){ const c=G.acts[id]; return !!c && c.k===p.k && c.tg===p.tg; }

function sendAct(o){ if(ch){ try{ ch.send({type:"broadcast",event:"act",payload:o}); }catch(e){} } }
function dbgNext(){                            // 試作モード: まだ入力していない次の人を操作

    if(!inp){ if(id!==dbgActor){ dbgActor=id; resetSel(); render(); } return; }
  }
}
function myInputIn(){                         // 自分の入力がスナップに反映されているか
  if(!G) return false; const id=VID();

  if(G.phase==="act") return G.acts[id]!==undefined;
  if(G.phase==="talk") return G.votes[id]!==undefined;
  return false;
}

const PHASE_NAME={ move:"行動", act:"行動", talk:"議論", vres:"投票結果", over:"決着" };

function myVoteNow(){ const m=me(); if(!m) return null;             // 確定した票(送ったばかりのものも)

/* メンバーリスト(常に表示・4列の固定サイズ)。自分の枠だけ色を変える・役職は分かる人にだけバッジ(押すと役職の詳細)
   バッジは右端に詰め、行動を終えた人はその右にチェック(チェックが無い時は右に詰めたまま)
   死亡は議論のはじめに公表されてから(1度公表された死亡は次のラウンド以降も出したまま)

    if(!id || !actTargets().some(t=>t.id===id)){
      /* ★地雷人狼: コマのない所を押したら地雷を置く(1回目=選ぶ・同じ所をもう一度=決定) */
      if(mineEditable(m)){
        const c=cellFromEvent(e), ma=myAct();
        if(c && ma && ma.k==="mine" && ma.mx===c.x && ma.my===c.y){   // 置いたマスをもう一度押す=取り消し
          ensureAudio(); playSelect(); sel.mine=null; sel.tg=null; sel.pop=""; sel.side=""; submit({t:"act",k:"clear"}); render(); return; }
        if(c && mineOk(m,c.x,c.y) && !mineAt(c.x,c.y)){
          ensureAudio(); const k=c.x+","+c.y;
          if(sel.mine===k){ playPoison(); sel.mine=null; sel.tg=null; sel.pop=""; sel.side="";
            submit({t:"act",k:"mine",mx:c.x,my:c.y}); render(); return; }
          playTick(); sel.mine=k; sel.tg=null; sel.pop=""; sel.side=""; render(); return;
        }
      }
      closePop(); return; }
    ensureAudio(); playSelect();
    if(sel.tg===id && sel.pop){ sel.tg=null; sel.pop=""; sel.side=""; } else { sel.tg=id; sel.pop="menu"; sel.tx=""; sel.side=""; }
    render(); return;
  }
  if(G.phase!=="move") return;
  const c=cellFromEvent(e); if(!c) return;
  ensureAudio(); chooseMove(stepToward(c.x,c.y));
});
/* 移動は2回押しで決定: 1回目=選ぶ(点線で予告)・同じ所をもう一度=決定 */
function confirmedMove(){ const m=me(); if(!m) return null;
  return G.moves[m.id]!==undefined? G.moves[m.id] : (pending&&pending.t==="move"&&pending.sk===G.sk? pending.d : null); }
function chooseMove(d){
  if(sel.move===d && confirmedMove()!==d){ playSelect(); submit({t:"move",d}); return; }
  if(confirmedMove()===d){ sel.move=d; return; }
  sel.move=d; playTick(); render();
}
document.addEventListener("keydown",e=>{          // 矢印キーでも移動(スペース=留まる)。入力欄の中では反応しない
  if(!G||G.phase!=="move"||e.isComposing) return;
  const t=e.target; if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA")) return;
  if(e.key==="Enter"){ if(sel.move){ e.preventDefault(); ensureAudio(); chooseMove(sel.move); } return; }   // Enter=いま選んでいる所で決定
  const d={ArrowUp:"u",ArrowDown:"d",ArrowLeft:"l",ArrowRight:"r"," ":"s"}[e.key]; if(!d) return;
  const m=me(); if(!m||!m.alive) return; const v=DIRS[d], nx=m.x+v[0], ny=m.y+v[1];
  if(nx<0||ny<0||nx>=G.N||ny>=G.N) return;
  e.preventDefault(); ensureAudio(); chooseMove(d);
});

/* ================= コマの横の操作(行動フェーズ) =================
   上に「◯◯と接触」、その下にボタンを縦に並べる(全部同じサイズ・アイコン付き・囲みの背景はなし)。基本はコマの右、入らない時は左
   menu=「話す」「占う/毒殺」／poison=「即殺」「1ターン後に死亡」「2ターン後に死亡」／talk=3文字の入力と送信
   占うは2回押しで確定(1回目で「確定」に変わる)。中身が変わった時だけ作り直す(入力欄が消えないように) */
function btnIcon(k){ return k==="talk"? SPEECH_SVG : k==="seer"? roleIcon("seer") : k==="poison"? roleIcon("wolf") : k==="cure"? roleIcon("doctor") : k==="mine"? roleIcon("miner") : ""; }
function renderPop(){
  const el=$("pop"), m=me();
  const ok = G.phase==="act" && m && m.alive && sel.tg && sel.pop && actTargets().some(t=>t.id===sel.tg) && pieceEls[sel.tg];
  if(!ok){ if(G.phase!=="act"){ sel.tg=null; sel.pop=""; sel.side=""; } if(el.style.display!=="none"){ el.style.display="none"; el.innerHTML=""; } popKey=""; return; }
  const t=pById(sel.tg), st=actState(), a=st.a, w=st.w;
  const pw = m.role==="seer"? "seer" : (m.role==="wolf" && canPoisonTo(m,t))? "poison"
    : (m.role==="doctor" && canCureTo(m,t))? "cure" : (m.role==="miner" && mineOk(m,t.x,t.y) && !mineAt(t.x,t.y))? "mine" : "";
  const key=[sel.tg,sel.pop,sel.side,m.id,JSON.stringify(a||0),JSON.stringify(w||0),poisonLeft(m),mineLeft(m),canCure(m),G.turn].join("|");
  if(key!==popKey){ popKey=key;
    let h='<div class="pop-h">'+esc(t.n)+'と接触</div>';
    if(sel.pop==="menu"){
      const talkMine = w && w.tg===t.id;
      h+='<button class="pbtn'+(talkMine?" sel":"")+'" data-p="talk"'+(w?" disabled":"")+'>'+btnIcon("talk")+'話す</button>';
      if(pw){
        const mine = a && ((a.k===pw && a.tg===t.id) || (pw==="mine" && a.k==="mine" && a.mx===t.x && a.my===t.y));
        const cool = (pw==="poison" && !canPoison(m)) || (pw==="cure" && !canCure(m)) || (pw==="mine" && !canMine(m));
        const lb = cool? (pw==="poison"? "毒殺（あと"+poisonLeft(m)+"ターン）" : pw==="mine"? "地雷（あと"+mineLeft(m)+"ターン）" : "毒を治す（このラウンドは使用済み）") : POWER_NAME[m.role];
        h+='<button class="pbtn'+(mine?" sel":"")+(cool?" off":"")+'" data-p="'+pw+'">'+btnIcon(pw)+lb+'</button>';
      }
    } else if(sel.pop==="poison"){
      h+=[0,1,2].map(d=>'<button class="pbtn dang'+(a&&a.k==="poison"&&a.tg===t.id&&(a.dl|0)===d?" sel":"")+'" data-dl="'+d+'"'+(dlOk(d)?"":" disabled")+'>'+(d? d+"ターン後に死亡" : "即殺")+'</button>').join("");
    } else if(sel.pop==="talk"){
      h+='<div class="talk-row"><input class="wh-in" id="whIn" autocomplete="off" placeholder="3文字"><button class="pbtn" id="whGo">送信</button></div>';
    }
    if(!sel.side){                                                                 // 右に出すのが基本。右2列にいる時と、右に入りきらない時だけ左。開いている間は向きを変えない
      const tr0=/translate\(([-\d.]+)px/.exec(pieceEls[t.id].style.transform)||[0,0], px=+tr0[1], r0=+pieceEls[t.id].querySelector(".body").getAttribute("r");
      const bw0=$("boardWrap").clientWidth, sc0=bw0/(G.N*10), fits=(px+r0)*sc0+11+183 <= bw0-2;
      sel.side = (Math.floor(px/10)>=G.N-2 || !fits)? "l" : "r"; }
    el.innerHTML=h; el.style.display="flex"; el.classList.toggle("talking", sel.pop==="talk");
    el.classList.toggle("r", sel.side==="r"); el.classList.toggle("l", sel.side==="l"); wirePop();
  }
  placePop();
}
function placePop(){                            // 選んだコマの右(入らない時は左)。盤の上下からはみ出さないように寄せる
  const el=$("pop"), g=pieceEls[sel.tg]; if(!g||!G||el.style.display==="none") return;
  const r=+g.querySelector(".body").getAttribute("r");
  const tr=/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/.exec(g.style.transform); if(!tr) return;
  const x=+tr[1], y=+tr[2], wrap=$("boardWrap"), bw=wrap.clientWidth, bh=$("board").clientHeight||bw, sc=bw/(G.N*10);
  const pw=el.offsetWidth, ph=el.offsetHeight, gap=11;               // gap=しっぽのぶん
  const left= sel.side==="l"? (x-r)*sc-gap-pw : (x+r)*sc+gap;         // 開いた時に決めた向きのまま(話すに切り替えても動かさない)
  const top=Math.max(4,Math.min(bh-ph-4, y*sc-ph/2));
  el.style.left=left+"px"; el.style.top=(top+ph/2)+"px";
  el.style.setProperty("--ty", Math.max(14,Math.min(ph-14, y*sc-top))+"px");   // しっぽはコマの高さを指す
}
function wirePop(){
  const el=$("pop"), m=me();
  el.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ ensureAudio(); const k=b.dataset.p, tg=sel.tg, t=pById(tg);
    if(k==="talk"){ playSelect(); sel.pop="talk"; render(); setTimeout(()=>{ const i=$("whIn"); if(i) i.focus(); },30); return; }
    if(k==="poison"){ if(!canPoison(m)){ playTick(); toast("再発動まで"+poisonLeft(m)+"ターン必要です"); return; } playSelect(); sel.pop="poison"; render(); return; }
    if(k==="seer"){ playSeer(); sel.tg=null; sel.pop=""; sel.side=""; submit({t:"act",k:"seer",tg}); render(); return; }
    if(k==="cure"){ if(!canCure(m)){ playTick(); toast("毒を治せるのは1ラウンドに1回までです"); return; }
      playSeer(); sel.tg=null; sel.pop=""; sel.side=""; submit({t:"act",k:"cure",tg}); render(); return; }
    if(k==="mine"){ if(!canMine(m)){ playTick(); toast("次に置けるまで"+mineLeft(m)+"ターン必要です"); return; }
      { const ma=myAct(); if(ma && ma.k==="mine" && ma.mx===t.x && ma.my===t.y){ playSelect(); sel.tg=null; sel.pop=""; sel.side=""; sel.mine=null; submit({t:"act",k:"clear"}); render(); return; } }
      playPoison(); sel.tg=null; sel.pop=""; sel.side=""; sel.mine=null; submit({t:"act",k:"mine",mx:t.x,my:t.y}); render(); return; }
  });
  el.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>{ ensureAudio(); const tg=sel.tg, t=pById(tg), dl=+b.dataset.dl; if(!dlOk(dl)) return; playPoison();
    sel.tg=null; sel.pop=""; sel.side=""; submit({t:"act",k:"poison",tg,dl}); render(); });
  const wi=$("whIn"), go=$("whGo");
  if(wi){ let comp=false; wi.value=sel.tx||"";
    const fix=()=>{ const c=cleanMsg(wi.value); if(wi.value.trim()!==c) wi.value=c; sel.tx=c; };
    wi.addEventListener("compositionstart",()=>{ comp=true; });
    wi.addEventListener("compositionend",()=>{ comp=false; fix(); });
    wi.addEventListener("input",()=>{ if(!comp) fix(); });
    wi.addEventListener("keydown",e=>{ if(e.key!=="Enter"||e.isComposing||e.keyCode===229) return; e.preventDefault(); if(go) go.click(); });
  }
  if(go) go.onclick=()=>{ ensureAudio(); const tx=cleanMsg(wi.value); if(!tx){ toast("3文字までで入力"); return; }
    const tg=sel.tg, t=pById(tg); playWhisper(); sel.tg=null; sel.pop=""; sel.tx=""; sel.side="";
    submit({t:"wh",tg,tx}); render(); };
}
window.addEventListener("resize",()=>{ if(G&&phaseUI==="game") placePop(); });

/* ================= ガイド(盤の中の帯)=操作の補助だけ =================
   死亡・吊られたなどのお知らせは画面の真ん中(bigFx)に出し、ここには出さない。中身が変わった時だけ作り直す */
function winTx(){ return G.winner==="village"?"市民陣営の勝ち":"人狼陣営の勝ち"; }
const WAIT_TX="他の人の選択を待っています";
function renderHud(){
  const h=$("hud"), m=me(), ph=G.phase;
  h.classList.toggle("top", !!(m&&m.alive&&(ph==="move"||ph==="act")&&m.y>=G.N/2));   // 自分のコマが下半分の時は上に出す
  let key=ph+"|"+G.sk+"|"+(m?m.id+":"+m.alive:"-"), html="", tall=false;
  const hint=(tx,ck)=>'<div class="hint">'+tx+(ck?CHECK_SVG:"")+'</div>';
  if(ph==="over"){ html='<button class="gbtn" id="reopenRes">結果を見る</button>'; }
  else if(!m || !m.alive || ph==="vres"){ html=""; }
  else if(ph==="move"){ const cur=confirmedMove(); key+="|"+cur;
    html= cur? hint(WAIT_TX,true) : hint("移動したいマスを選択"); }
  else if(ph==="act"){ const st=actState();
    const ftk = !!(m.role==="talker" && !m.usedFTalk);                                   // ★議論好き: ゲーム中1回だけ
    const ftb = ftk? '<button class="gbtn wide" id="ftalkBtn">議論強制スタート</button>' : "";
    key+="|"+JSON.stringify([st.exhausted,st.none,st.done,ftk]);
    const row=b=>'<div class="hud-btns">'+b+'</div>';
    if(st.exhausted){ html=hint(WAIT_TX,true);
      const nb=st.none? '<button class="gbtn sel'+(ftk?" wide":"")+'" id="noneBtn">やっぱりなし</button>' : "";
      if(ftb||nb){ tall=true; html+=row(ftb+nb); } }                                     // 何もしないボタンの「左」に並べる
    else{ html=hint(m.role==="miner"&&canMine(m)? "接触したい人か、地雷を置くマスを選択" : "接触したい人を選択");
      const nb=!st.done? '<button class="gbtn'+(ftk?" wide":"")+'" id="noneBtn">何もしない</button>' : "";
      if(ftb||nb){ tall=true; html+=row(ftb+nb); } } }
  else if(ph==="talk"){ const cur=myVoteNow(); key+="|"+cur; html= cur? hint(WAIT_TX,true) : hint("怪しい人を投票"); }
  if(key!==hudKey){ hudKey=key; h.innerHTML=html; h.classList.toggle("tall",tall); wireHud(); }
}
function wireHud(){
  const on=(id,f)=>{ const b=$(id); if(b) b.onclick=()=>{ ensureAudio(); f(); }; };
  on("reopenRes",()=>{ playSelect(); openResult(); });
  on("noneBtn",()=>{ playSelect(); sel.tg=null; sel.pop=""; sel.mine=null; const st=actState(); submit({t:"act",k: st.none? "clear" : "none"}); });   // 押している間は「やっぱりなし」=取り消し
  on("ftalkBtn",()=>{ const m=me(); if(!m||m.role!=="talker"||m.usedFTalk) return;        // ★議論好き: その場で議論へ(1回だけ)
    playTalk(); sel.tg=null; sel.pop=""; sel.mine=null; submit({t:"ftalk"}); });
}

function renderDbg(){
  const el=$("dbg"); if(!debug){ el.style.display="none"; return; }
  el.style.display="block";
  const ph=G.phase;
  let h='<div class="dbg-h">試作用パネル（行を'+TAPW+'でその人を操作）</div>';

    const a=G.acts[p.id];

      : ph==="talk"? (G.votes[p.id]? "→"+(pById(G.votes[p.id])||{}).n : undefined) : undefined;
    const kl=pById(p.killer);
    h+='<div class="dbg-row'+(p.id===dbgActor?" act":"")+(p.alive?"":" dead")+'" data-a="'+esc(p.id)+'"><span class="p-dot" style="background:'+p.c+'"></span>'
      +'<span class="nm">'+esc(p.n)+'</span><span class="inf">'+ROLE_NAME[p.role]+'・('+p.x+','+p.y+')'+(p.poison?'・毒あと'+p.poison.left:'')
      +(p.role==="wolf"&&p.alive&&!canPoison(p)?'・毒休み':'')

  });
  h+='<div class="dbg-btns">';

  const on=(id,f)=>{ const b=$(id); if(b) b.onclick=()=>{ ensureAudio(); playSelect(); f(); }; };
  on("dbRand",()=>{ const ks=Object.keys(DIRS); alivePs().forEach(p=>{ if(G.phase==="move") hostAct({t:"move",from:p.id,sk:G.sk,d:ks[Math.floor(Math.random()*ks.length)]}); }); });
  on("dbAuto",()=>{ const sk=G.sk; alivePs().forEach(p=>{ if(G.phase!=="act"||G.sk!==sk||G.acts[p.id]!==undefined) return;

  on("dbForce",()=>resolveNow());

/* 状態が変わった時の演出(ホストもゲストも同じ関数を通る) */
function onState(){
  if(!G) return;
  if(debug && seen.gid===G.gid && seen.sk!==G.sk){   // 試作モード: 新しいステップは先頭の未入力の人から操作
    const f=alivePs().find(p=>!(G.phase==="act"&&G.acts[p.id]!==undefined)) || alivePs()[0]; if(f) dbgActor=f.id;
  }
  const m=me();
  if(seen.gid!==G.gid){
    seen={ gid:G.gid, sk:-1, tick:G.tick, phase:"", notes:{}, alive:{}, over:false, wh:{} };
    resetSel(); pending=null; pendWh=null; bubbles=[];
    addSys("── あたらしいゲーム ──");
    if(!debug) setTimeout(openRole,350);
  }
  if(seen.sk!==G.sk){
    const prev=seen.phase; seen.sk=G.sk;
    resetSel(); pending=null; pendWh=null;
    if(G.phase==="move"){ if(prev==="act") playMove(); else playStep(); turnFx(G.rules.turns-G.turn+1); }
    if(G.phase==="act"){ playMove(); }
    if(G.phase==="talk"){
      playTalk(); bigFx("議論 & 投票");
      addSys(G.round+"日目　議論 & 投票");
      const newDead=G.players.filter(p=>G.deathsThisRound.includes(p.id));
      addSys(newDead.length? newDead.map(p=>p.n).join("、")+" が死亡していた" : "死亡した人はいない");
    }
    if(G.phase==="vres"){ const lv=G.lastVote||{}, h=pById(lv.hanged);           // 吊られた結果は画面の真ん中に大きく
      const tx=h? h.n+" が吊られた" : lv.tie? "同数のため\n誰も吊られなかった" : "誰も吊られなかった";
      addSys(tx.replace("\n","")); bigFx(tx);
      if(h) playDeath(); }
    if(G.phase==="over" && !seen.over){
      seen.over=true;
      addSys(winTx(),"c-res");
      const mine = m? (isWolfTeam(m)?"wolf":"village") : "village";
      if(debug||mine===G.winner) playWin(); else playLose();
      setTimeout(openResult,700);
    }
    seen.phase=G.phase;
  }
  if(m){
    const sn=seen.notes[m.id]; if(sn===undefined) seen.notes[m.id]=m.notes.length;
    else if(m.notes.length>sn){ const nt=m.notes[m.notes.length-1], p=pById(nt.tg);
      playSeer(); openSeerRes(p,nt.black); seen.notes[m.id]=m.notes.length; }
    const sa=seen.alive[m.id];
    if(sa===true && !m.alive && !debug){ const k=pById(m.killer); playDeath();
      bigFx(m.cause==="hang"? "あなたは吊られた" : m.cause==="poison"&&k? k.n+" に\n毒殺された" : m.cause==="mine"? "地雷を踏んだ" : "あなたは死亡した"); }
    seen.alive[m.id]=m.alive;
  }
  /* ★敏感肌: ほかの人が死んだ瞬間に知らせる(吊り・退出は別の知らせがあるので除く) */
  seen.dead=seen.dead||{};
  const newly=G.players.filter(p=>!p.alive && !seen.dead[p.id]);
  newly.forEach(p=>{ seen.dead[p.id]=1; });
  if(m && m.alive && m.role==="sensitive" && G.phase!=="over"){
    const nd=newly.filter(p=>p.id!==m.id && p.cause!=="hang" && p.cause!=="gone");
    if(nd.length){ playDeath(); openDeathNote(nd); }
  }
  if(G.tick!==seen.tick){ seen.tick=G.tick; }
  seen.wh=seen.wh||{};
  (G.wh||[]).forEach(w=>{ if(seen.wh[w.id]) return; seen.wh[w.id]=1;
    const f=pById(w.f), to=pById(w.to); if(!f||!to) return;
    const mineOut = w.f===VID(), mineIn = w.to===VID();
    if(!(mineOut||mineIn||debug)) return;
    const ms=mineIn? 6500 : 4200;                   // 話した3文字は盤の吹き出しだけ(左下のチャットには出さない)
    bubbles.push({ f:w.f, t:w.t, until:Date.now()+ms }); setTimeout(()=>{ if(G) render(); },ms+100);
    if(mineIn && !debug) playWhisper();
  });
  G.players.forEach(p=>{ if(!p.alive && p.cause==="gone" && !(seen.gone||(seen.gone={}))[p.id]){ seen.gone[p.id]=1; addSys(p.n+" が退出した"); toast(p.n+" が退出した"); } });
}

    if(lobbyById(payload.id)){ sendSnap(); return; }                       // もういる(再接続)
    if(phaseUI==="game"||lobby.length>=MAX_P){ try{ ch.send({type:"broadcast",event:"locked",payload:{to:payload.id,full:phaseUI!=="game"}}); }catch(e){} return; }
    lobby.push({ id:payload.id, n:String(payload.n||"").slice(0,16), c:nextColor(), t:Date.now() });
    renderLobby(); sendSnap();
  });
  ch.on("broadcast",{event:"locked"},({payload})=>{ if(payload&&payload.to===myId){ leaveChannel();
    roomStatus('<div class="room-note err">'+(payload.full?"満室です（"+MAX_P+"人まで）":"今はゲーム中みたい。次のゲーム開始まで待ってね")+'</div>'); } });
  ch.on("broadcast",{event:"snap"},({payload})=>{ if(!isHost&&payload) applySnap(payload); });
  ch.on("broadcast",{event:"act"},({payload})=>{ if(!isHost||!payload) return;
    if(payload.t==="color"){ const p=lobbyById(payload.from); if(p && /^#[0-9a-f]{6}$/i.test(payload.c||"")) p.c=payload.c; if(phaseUI==="lobby") renderLobby(); sendSnap(); return; }
    if(payload.t==="rename"){ const p=lobbyById(payload.from); if(p) p.n=String(payload.n||"").slice(0,16); if(G){ const q=pById(payload.from); if(q) q.n=p?p.n:q.n; } if(phaseUI==="lobby") renderLobby(); sendSnap(); return; }
    hostAct(payload); });
  ch.on("broadcast",{event:"stamp"},({payload})=>{ if(!payload) return;
    if(payload.g){ if(!iAmDead()) return; }                                   // 墓地のスタンプは死者だけに見える
    else if(G && phaseUI==="game" && (G.phase==="move"||G.phase==="act") && !iAmDead()) return;   // 念のため受け側でも捨てる(夜は使えない)
    speakStamp(payload.i|0); spawnStamp(payload.i|0, payload.n||"あいて", false, !!payload.g); });
  ch.on("broadcast",{event:"chat"},({payload})=>{
    if(!payload||!payload.t||payload.from===myId) return;
    if(payload.g){ if(!iAmDead()) return; }                                   // 墓地チャットは死者どうしだけ
    else if(G && phaseUI==="game" && (G.phase==="move"||G.phase==="act") && !iAmDead()) return;   // 夜は受け付けない
    recvChat(payload.n||"あいて", String(payload.t).slice(0,40), payload.c||"", !!payload.g); });
  ch.on("broadcast",{event:"bye"},({payload})=>{ if(payload) onLeave(payload.id); });
  ch.on("broadcast",{event:"kick"},({payload})=>{ if(payload&&payload.to===myId&&!isHost){ toast("オーナーに退出させられました"); goTitle(); } });
  ch.on("presence",{event:"leave"},({leftPresences})=>{ (leftPresences||[]).forEach(p=>{ if(!p||!p.id) return;
    if(isHost && phaseUI==="lobby") onLeave(p.id); else markGone(p.id); }); });
  ch.on("presence",{event:"join"},({newPresences})=>{ (newPresences||[]).forEach(p=>{ if(p&&p.id) cancelGone(p.id); }); });
  let readyDone=false;
  ch.subscribe(async status=>{
    if(status==="SUBSCRIBED"){
      try{ await ch.track({id:myId}); }catch(e){}
      if(readyDone){ if(isHost) sendSnap(); else { try{ ch.send({type:"broadcast",event:"hello",payload:{id:myId,n:myName}}); }catch(e){} } return; }
      readyDone=true; if(onReady) onReady();
    } else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){ roomStatus('<div class="room-note err">通信失敗。通信環境を見直そう</div>'); }
  });
}
function startHb(){ clearInterval(hbIv); hbIv=setInterval(sendSnap,1500); }
function sendSnap(){
  if(!isHost||!ch||debug) return;
  ver++;
  const p={ v:ver, hid:hostId, rules, lob:lobby.map(x=>({id:x.id,n:x.n,c:x.c})) };
  if(phaseUI==="game"&&G){ p.G=G; p.left=G.stepEnd? Math.max(0,G.stepEnd-Date.now()) : 0; }
  try{ ch.send({type:"broadcast",event:"snap",payload:p}); }catch(e){}
}
function applySnap(p){
  if(p.hid!==hostId){ lastVer=-1; }                                     // オーナーが替わったら番号を振り直す
  if(p.v<=lastVer) return; lastVer=p.v;
  clearTimeout(joinWatch); hostId=p.hid; rules=p.rules||rules; lobby=p.lob||[];
  if(!p.G){
    if(phaseUI==="game"){ G=null; document.querySelectorAll(".overlay").forEach(o=>o.classList.remove("on","peek")); }
    if(phaseUI!=="lobby"){ phaseUI="lobby"; showScene("lobbyScene"); }
    renderLobby(); return;
  }
  G=p.G; localEnd=Date.now()+(p.left||0);
  if(pending && pendingDone(pending)) pending=null;
  if(pending && pending.sk===G.sk && Date.now()-pendingSent>900){ pendingSent=Date.now(); sendAct(pending); }   // 届いていなければ送り直す
  if(pendWh){ const w=(G.whs||{})[myId]; if(pendWh.sk!==G.sk || (w&&w.tx===pendWh.tx&&w.tg===pendWh.tg)) pendWh=null; }
  if(pendWh && Date.now()-pendWhSent>900){ pendWhSent=Date.now(); sendAct(pendWh); }
  if(phaseUI!=="game") enterGame();
  onState(); render();
}

/* 役職→ルールの順(2026-09-25に入れ替え)。見出しは枠に近づけてある(#lobbyBox .sec-label)。ro=参加者側(見るだけ) */
function ruleFrameHTML(n,ro){
  const row=(name,key,val)=>'<div class="rule-col"><span class="rc-name">'+name+'</span><div class="rc-row"><button class="stp" data-k="'+key+'" data-s="-1">−</button><span class="rc-val">'+val+'</span><button class="stp" data-k="'+key+'" data-s="1">＋</button></div></div>';

    +row("盤の広さ","n",rules.n+"×"+rules.n)+row("移動ターン数","turns",rules.turns+"ターン")
    +row("議論の時間","talk",fmtT(rules.talk))+row("1手の制限時間","step",rules.step+"秒")+'</div>'
    +(ro? "" : '<button class="rule-reset" id="ruleReset">初期設定に戻す</button>');

const OPTS={ n:N_OPTS, turns:TURN_OPTS, talk:TALK_OPTS, step:STEP_OPTS };
function renderLobby(){
  if(!online||phaseUI!=="lobby") return;
  let h='<div class="lobby-list">';
  lobby.forEach(p=>{
    h+='<div class="lobby-row"><span class="p-dot'+(p.id===myId?' mine" id="myDot" title="色を変える':'')+'" style="background:'+p.c+'"></span><span class="nm'+(p.n?"":" undef")+'">'+esc(p.n||UNDEF_NM)+'</span>'
      +(p.id===hostId?'<span class="hostmark">オーナー</span>':"")+(p.id===myId?'<span class="you">じぶん</span>':"")
      +((isHost&&p.id!==myId)?'<button class="kick-btn" data-kick="'+esc(p.id)+'">追放</button>':"")+'</div>';
  });
  h+='</div><div class="room-note">合言葉（'+TAPW+'でコピー）</div>'
    +'<div class="code-show" id="codeShow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>'+esc(code)+'</div>';
  const n=lobby.length, okN=n>=MIN_P&&n<=MAX_P, err=okN? roleErr(n) : "";
  h+= ruleFrameHTML(n, !isHost);
  if(!okN) h+='<div class="room-note">'+MIN_P+"〜"+MAX_P+"人で遊べます（いま"+n+"人）"+'</div>';
  if(isHost) h+='<button class="btn-main" id="lobbyStart"'+(okN&&!err?"":" disabled")+'>はじめる</button>';
  $("lobbyBox").innerHTML=h;
  if(!nameAsked){ nameAsked=true; openNameOv(); }
  const md=$("myDot"); if(md) md.onclick=()=>{ ensureAudio(); playSelect(); const cp=$("colorPick"); const me0=lobbyById(myId); cp.value=/^#[0-9a-f]{6}$/i.test(me0&&me0.c||"")? me0.c : "#ff6b6b"; cp.click(); };
  $("codeShow").onclick=async ()=>{ ensureAudio(); playSelect();
    try{ await navigator.clipboard.writeText(inviteText(code)); toast("招待メッセージをコピーした"); }
    catch(e){ try{ const ta=document.createElement("textarea"); ta.value=inviteText(code); document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("招待メッセージをコピーした"); }catch(_){ toast("コピーできなかった…"); } } };
  if(!isHost) return;
  $("lobbyBox").querySelectorAll(".rule-frame .stp[data-k]").forEach(b=>b.onclick=()=>{ ensureAudio(); playSelect();
    const k=b.dataset.k, a=OPTS[k], i=Math.max(0,a.indexOf(rules[k])), j=Math.max(0,Math.min(a.length-1,i+(+b.dataset.s)));
    rules[k]=a[j]; renderLobby(); sendSnap(); });
  wireRoles($("lobbyBox"), n, ()=>{ renderLobby(); sendSnap(); });
  $("ruleReset").onclick=()=>{ ensureAudio(); playSelect(); rules=Object.assign({},DEF_RULES); renderLobby(); sendSnap(); };
  $("lobbyBox").querySelectorAll("[data-kick]").forEach(b=>b.onclick=()=>{ ensureAudio(); playSelect(); const id=b.dataset.kick;
    lobby=lobby.filter(p=>p.id!==id); try{ ch.send({type:"broadcast",event:"kick",payload:{to:id}}); }catch(e){} renderLobby(); sendSnap(); });
  const ls=$("lobbyStart"); if(ls) ls.onclick=()=>{ ensureAudio(); playSelect();
    if(!(lobby.length>=MIN_P&&lobby.length<=MAX_P)) return;
    const e=roleErr(lobby.length); if(e){ toast(e); return; }
    enterGame(); newGame(lobby.map(p=>({id:p.id,n:p.n||UNDEF_NM,c:p.c}))); };
}

const STAMP_SVGS=['😭','😍','🤣'];   // このスタンプだけは牧村さんの明示指示で絵文字を採用
function playStamp(i){
  if(!actx) return; const t=T0();
  if(i===0){ note(523,t,0.2,0.3,"sine"); note(392,t+0.15,0.22,0.3,"sine"); note(300,t+0.32,0.36,0.26,"sine"); }
  else if(i===1){ note(523,t,0.34,0.22,"sine"); note(784,t+0.11,0.38,0.24,"sine"); note(1047,t+0.24,0.62,0.2,"sine"); note(1568,t+0.34,0.55,0.1,"triangle"); }
  else{ const sq=[900,680,850,640,800,600,760,560]; sq.forEach((f,k)=>note(f,t+k*0.072,0.07,0.26,"triangle")); note(400,t+sq.length*0.072,0.16,0.24,"triangle"); }
}
let stampMuted=false;   // 毎回ミュートOFFで始める(保存しない)
const SKULL_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2C7 2 3.5 5.6 3.5 10.2c0 2.6 1.2 4.6 3 5.9V19c0 .8.6 1.4 1.4 1.4h1.4v1.1h1.6v-1.1h2.2v1.1h1.6v-1.1h1.4c.8 0 1.4-.6 1.4-1.4v-2.9c1.8-1.3 3-3.3 3-5.9C20.5 5.6 17 2 12 2zM8.6 14.3a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm6.8 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4zM12 17.6l-1.2-2.2h2.4z"/></svg>';   // 墓地(死者どうし)の印
function spawnStamp(i,who,self,grave){
  if(stampMuted && !self) return;
  i=Math.max(0,Math.min(2,i|0));
  const el=document.createElement("div"); el.className="stamp-fly";
  const hx=0.06+Math.random()*0.88; el.style.left="calc("+(hx*100).toFixed(1)+"% - 48px)";
  const central=1-Math.abs(hx-0.5)*2;
  el.style.setProperty("--rise","-"+(24+(1-central)*16).toFixed(0)+"vh");
  el.style.setProperty("--dx",(Math.random()*24-12).toFixed(0)+"px");
  el.innerHTML='<span class="s-emoji">'+STAMP_SVGS[i]+'</span><span class="s-name">'+(grave?SKULL_SVG:"")+esc(who||"自分")+'</span>';
  if(seOn && !stampMuted) playStamp(i);
  if(document.querySelector(".overlay.on")) el.classList.add("over-dialog");
  document.body.appendChild(el); setTimeout(()=>el.remove(),2350);
}
const STAMP_WORDS=["やめてよぉ","すごぉい","わろたぁ"];
let stampTTSVoice=null, stampTTSWarm=false;
function speakStamp(i){
  try{
    if(!window.speechSynthesis||!seOn||stampMuted||document.hidden) return;
    if(!stampTTSVoice){ const vs=speechSynthesis.getVoices()||[]; stampTTSVoice=vs.find(v=>/ja/i.test(v.lang))||null; }
    if(!stampTTSWarm){ stampTTSWarm=true; speechSynthesis.onvoiceschanged=()=>{ const v2=speechSynthesis.getVoices()||[]; stampTTSVoice=v2.find(v=>/ja/i.test(v.lang))||stampTTSVoice; }; }
    const u=new SpeechSynthesisUtterance(STAMP_WORDS[Math.max(0,Math.min(2,i|0))]); u.lang="ja-JP"; u.rate=1.05; u.pitch=1.1;
    if(stampTTSVoice) u.voice=stampTTSVoice;
    if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}
}
function myDisp(){ if(debug){ const m=me(); return m? m.n : "自分"; } return myName||"あなた"; }
function myColor(){ const m=G&&pById(debug?dbgActor:myId); if(m) return m.c; const l=lobbyById(myId); return l? l.c : ""; }
function sendStamp(i){
  const md=chatMode(); if(md==="off"){ toast("行動中は使用不可"); return; }
  speakStamp(i); spawnStamp(i, debug? myDisp() : "自分", true, md==="grave");
  if(online&&ch){ try{ ch.send({type:"broadcast",event:"stamp",payload:{i,n:myName,from:myId,g:md==="grave"?1:0}}); }catch(e){} }
}
document.querySelectorAll("#stampBar .stamp-btn").forEach(b=>{ const i=+b.dataset.i; b.innerHTML=STAMP_SVGS[i]; b.onclick=()=>{ ensureAudio(); sendStamp(i); }; });
(function(){ const mb=$("stampMute"); const r=()=>mb.classList.toggle("muted",stampMuted); r(); mb.onclick=()=>{ stampMuted=!stampMuted; r(); }; })();

const POP_MS=4200, POP_FADE=150, POP_MAX=3;
const EYE_OPEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.8 12S5.5 5.4 12 5.4 22.2 12 22.2 12 18.5 18.6 12 18.6 1.8 12 1.8 12z"/><circle cx="12" cy="12" r="3.1"/></svg>';

function addChat(name,text,color,grave){
  const log=$("chatLog"); const d=document.createElement("div"); d.className="c-line"+(grave?" c-grave":"");
  const n=document.createElement("span"); n.className="c-nm"; if(color) n.style.color=color; n.textContent=name+"：";
  const t=document.createElement("span"); t.textContent=text;
  d.appendChild(n); d.appendChild(t); log.appendChild(d);
  while(log.children.length>60) log.removeChild(log.firstChild); log.scrollTop=log.scrollHeight;
}
function addSys(tx,cls){
  const log=$("chatLog"); const d=document.createElement("div"); d.className="c-line c-sys"+(cls?" "+cls:""); d.textContent=tx;
  log.appendChild(d); while(log.children.length>60) log.removeChild(log.firstChild); log.scrollTop=log.scrollHeight;
}
function clearChat(){ $("chatLog").innerHTML=""; $("chatIn").value=""; hidePop(); }
function hidePop(){ const el=$("chatPop"); [].slice.call(el.children).forEach(c=>clearTimeout(c._t)); el.innerHTML=""; }
function showPop(name,text,color,grave){
  const el=$("chatPop"); const d=document.createElement("div"); d.className="pop-line"+(grave?" c-grave":"");
  const n=document.createElement("span"); n.className="c-nm"; if(color) n.style.color=color; n.textContent=name+"：";
  const t=document.createElement("span"); t.textContent=text; d.appendChild(n); d.appendChild(t); el.appendChild(d);
  while(el.children.length>POP_MAX){ const o=el.firstChild; clearTimeout(o._t); el.removeChild(o); }
  d._t=setTimeout(()=>{ d.classList.add("out"); d._t=setTimeout(()=>{ if(d.parentNode) d.parentNode.removeChild(d); },POP_FADE+40); },POP_MS);
}

/* ================= ★試作用: シーン一覧(すべての画面・ダイアログ・文言の分岐を行き来する) =================
   画面の多いゲームを調整するための道具。シーンを選ぶたびに状態を作り直して、その画面をそのまま出す。
   ・進行は止めてある(タイマーは残り時間のまま止まる・締め切り/ロボット/自動の確定は動かない)。通信もしない
   ・画面のボタンはふつうに押せる(そこから先も少しだけ触れる)。おかしくなったら同じシーンを選び直せば元どおり
   入口=SとDを同時に押す(もう一度で閉じる)・タイトルの試作用の枠「シーン一覧（試作）」・URLに ?scenes=1。キーボードの [ ] で前後のシーンへ
   パネルは頭の部分をつまんで動かせる(置いた場所は覚えておく) */
let gallery=false, sgIdx=0, sgLeft=15, sgSeq=0;
const SCENES=[];
function sc(g,n,run){ SCENES.push({ g, n, run }); }
function sgGo(i){
  if(!SCENES.length) return;
  sgIdx=(i+SCENES.length)%SCENES.length; try{ localStorage.setItem(SG_KEY,String(sgIdx)); }catch(e){}
  sgLeft=15; sgReset();
  try{ SCENES[sgIdx].run(); }catch(e){ console.error(e); toast("このシーンでエラー："+e.message,4000); }
  sgPanel();
}
function sgPanel(){
  let el=$("sgPanel");
  if(!el){
    el=document.createElement("div"); el.id="sgPanel"; if(window.innerWidth<700) el.classList.add("fold");
    el.innerHTML='<div class="sg-head"><svg class="sg-grip" viewBox="0 0 10 16" aria-hidden="true"><g fill="currentColor"><circle cx="3" cy="3" r="1.4"/><circle cx="7" cy="3" r="1.4"/><circle cx="3" cy="8" r="1.4"/><circle cx="7" cy="8" r="1.4"/><circle cx="3" cy="13" r="1.4"/><circle cx="7" cy="13" r="1.4"/></g></svg><b>シーン一覧</b><span id="sgNo"></span><button id="sgFold" type="button"></button></div>'
      +'<div class="sg-nav"><button id="sgPrev" type="button">◀ 前</button><button id="sgNext" type="button">次 ▶</button></div>'
      +'<div class="sg-cur" id="sgCur"></div><div class="sg-list" id="sgList"></div>'
      +'<button id="sgEnd" class="sg-end" type="button">シーン一覧をやめる</button>';
    document.body.appendChild(el);
    let h="", last="";
    SCENES.forEach((s,i)=>{ if(s.g!==last){ last=s.g; h+='<div class="sg-g">'+esc(s.g)+'</div>'; } h+='<button type="button" class="sg-i" data-i="'+i+'">'+esc(s.n)+'</button>'; });
    $("sgList").innerHTML=h;
    $("sgList").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>sgGo(+b.dataset.i));
    $("sgPrev").onclick=()=>sgGo(sgIdx-1);
    $("sgNext").onclick=()=>sgGo(sgIdx+1);
    $("sgFold").onclick=()=>{ el.classList.toggle("fold"); sgPanel(); };
    dragWin(el,[el.querySelector(".sg-head"),$("sgCur")],"bj.sgPos");   // 頭の部分をつまんで動かす
    $("sgEnd").onclick=closeGallery;
  }
  const s=SCENES[sgIdx];
  $("sgNo").textContent=(sgIdx+1)+" / "+SCENES.length;
  $("sgCur").textContent=s.g+"：" +s.n;
  $("sgFold").textContent=el.classList.contains("fold")? "ひらく" : "たたむ";
  $("sgList").querySelectorAll("[data-i]").forEach(b=>b.classList.toggle("on",+b.dataset.i===sgIdx));
  if(el._place) el._place();                                    // たたむ/ひらくで大きさが変わっても同じ端にくっつけ直す
  const on=$("sgList").querySelector(".sg-i.on"); if(on && !el.classList.contains("fold")){ const L=$("sgList"); if(on.offsetTop<L.scrollTop || on.offsetTop>L.scrollTop+L.clientHeight-30) L.scrollTop=on.offsetTop-L.clientHeight/2; }
}
function openGallery(){ gallery=true; let i=0; try{ i=parseInt(localStorage.getItem(SG_KEY),10)||0; }catch(e){} sgGo(i); }
function closeGallery(){ gallery=false; const el=$("sgPanel"); if(el) el.remove(); sgReset(); }
document.addEventListener("keydown",e=>{
  if(!gallery||e.isComposing) return; const t=e.target; if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA")) return;
  if(e.key==="]"){ e.preventDefault(); sgGo(sgIdx+1); } else if(e.key==="["){ e.preventDefault(); sgGo(sgIdx-1); }
});
$("sgStart").onclick=()=>{ ensureAudio(); playSelect(); openGallery(); };
/* ★デバッグ用の窓の共通部品(2026-09-25牧村指示)
   ・dragWin(窓, つまむ所[], 保存キー)=つまんで動かせる。離すといちばん近い画面の端に吸い付く・置いた場所は覚えておく
   ・onSD(関数)=SとDを同時に押した時に呼ぶ(開く/閉じる)。入力欄の中では反応しない。キーの位置で見るので日本語入力中でも効く */
function dragWin(el,handles,key){
  /* 離した時は左右どちらか近い方の画面の端へ吸い付く(2026-09-25牧村指示。上下には張り付かない=上下の位置は置いた所のまま)。
     保存するのは{e:吸い付いた端(l/r), p:上下の位置}=画面の大きさが変わっても同じ端にくっついたまま */
  const M=8;                                                   // 端からのすき間
  const vw=()=>window.innerWidth, vh=()=>window.innerHeight;
  const set=(x,y)=>{ el.style.left=x+"px"; el.style.top=y+"px"; el.style.right="auto"; el.style.bottom="auto"; };
  const fit=(v,max)=>Math.max(M,Math.min(max-M,v));            // 窓がまるごと画面に入る範囲
  const stick=(e,p)=>{ const w=el.offsetWidth, h=el.offsetHeight;
    if(!(vw()>0&&vh()>0)) return;                              // 画面の大きさが分からない時(裏のタブ等)は動かさない
    if(e==="l") set(M, fit(p,vh()-h)); else if(e==="r") set(vw()-w-M, fit(p,vh()-h));
    else if(e==="t") set(fit(p,vw()-w), M); else set(fit(p,vw()-w), vh()-h-M);
    el._snap={ e, p }; };
  const nearest=()=>{ const r=el.getBoundingClientRect();   // 窓の中心が画面の左半分なら左端・右半分なら右端
    return { e: (r.left+r.width/2)<=vw()/2? "l" : "r", p:r.top }; };
  el._place=()=>{ if(el._snap) stick(el._snap.e,el._snap.p); };
  el.dataset.drag="1";
  try{ const sv=JSON.parse(localStorage.getItem(key)||"null");
    if(sv&&(sv.e==="l"||sv.e==="r")) stick(sv.e,sv.p);
    else if(sv&&(sv.e==="t"||sv.e==="b")){ set(sv.p, sv.e==="t"? M : Math.max(M,vh()-el.offsetHeight-M)); if(vw()>0){ const n=nearest(); stick(n.e,n.p); } }   // 上下に張り付いていた古い保存は左右へ直す
    else if(sv&&typeof sv.x==="number"){ set(sv.x,sv.y); if(vw()>0){ const n=nearest(); stick(n.e,n.p); } }   // 吸い付く前に保存された位置
  }catch(e){}
  handles.forEach(h=>{ let d=null;
    h.addEventListener("pointerdown",e=>{ if(e.button!==0||e.target.closest("button")) return;
      const r=el.getBoundingClientRect(); d={ dx:e.clientX-r.left, dy:e.clientY-r.top, id:e.pointerId };
      el.classList.remove("snapping");
      try{ h.setPointerCapture(e.pointerId); }catch(_){} el.classList.add("dragging"); e.preventDefault(); });
    h.addEventListener("pointermove",e=>{ if(!d||e.pointerId!==d.id) return;
      let x=e.clientX-d.dx, y=e.clientY-d.dy;
      if(vw()>0&&vh()>0){ x=Math.max(-el.offsetWidth+60,Math.min(vw()-60,x)); y=Math.max(0,Math.min(vh()-30,y)); }
      set(x,y); });
    const up=()=>{ if(!d) return; d=null; el.classList.remove("dragging");
      if(!(vw()>0&&vh()>0)) return;
      const n=nearest(); el.classList.add("snapping"); stick(n.e,n.p);                 // すっと端へ吸い付く
      setTimeout(()=>el.classList.remove("snapping"),260);
      try{ localStorage.setItem(key,JSON.stringify(el._snap)); }catch(_){} };
    ["pointerup","pointercancel","lostpointercapture"].forEach(t=>h.addEventListener(t,up));
  });
  if(!dragWin.rs){ dragWin.rs=1; window.addEventListener("resize",()=>document.querySelectorAll("[data-drag]").forEach(w=>w._place&&w._place())); }
}
function onSD(fn){
  const held=new Set();
  document.addEventListener("keydown",e=>{
    if(e.ctrlKey||e.metaKey||e.altKey||e.repeat) return;
    const t=e.target; if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable)) return;
    if(e.code!=="KeyS"&&e.code!=="KeyD") return;
    held.add(e.code); if(held.has("KeyS")&&held.has("KeyD")){ held.clear(); e.preventDefault(); fn(); }
  });
  document.addEventListener("keyup",e=>held.delete(e.code));
  window.addEventListener("blur",()=>held.clear());
}
onSD(()=>{ ensureAudio(); if(gallery) closeGallery(); else openGallery(); });   // S+Dで開く/閉じる(はじめは閉じている)

function sgReset(){
  clearTimeout(toastT); $("toast").classList.remove("on"); clearTimeout(fxT); $("bigFx").classList.remove("on");
  goTitle();                                                     // 部屋・状態・チャット・ダイアログを片付けてタイトルへ
  rules=Object.assign({},DEF_RULES); code=""; nameAsked=true; pending=null; pendWh=null; bubbles=[]; resetSel(); dbgFog=false;
  setMini(true);
}
function sgKill(p,cause,by,pub){ p.alive=false; p.cause=cause; p.killer=by||""; p.pub=pub!==false; }
/* 盤面の状態を作って表示する。o.guest=参加者側で見る／o.set(G)=表示の前に状態をいじる */
function sgG(roles,o){
  o=o||{}; const pos=o.pos||SG_POS;
  G={ gid:"sg"+(++sgSeq), rules:Object.assign({},DEF_RULES), N:7, round:o.round||1, turn:o.turn||3, tick:4, sk:5,
      phase:o.phase||"move", stepEnd:o.phase==="over"? 0 : Date.now()+sgLeft*1000,
      players:roles.map((r,i)=>({ id:i?"g"+i:myId, n:SG_NM[i], c:PCOL[i], role:r, x:pos[i][0], y:pos[i][1],
        alive:true, pub:false, cause:"", killer:"", poison:null, lastPoison:-99, lastMine:-99, lastCureRound:0, usedFTalk:false, notes:[], lb:SG_NM[i][0] })),
      moves:{}, acts:{}, whs:{}, votes:{}, ready:{}, lastVote:null, winner:o.winner||"", deathsThisRound:[], wh:[], mines:[], corpses:[] };
  isHost=!o.guest; online=!!o.guest; hostId=o.guest? "g1" : myId;
  if(o.set) o.set(G);
  enterGame(); sgPrime(); localEnd=G.stepEnd; render();
  return G;
}
function sgPrime(){                     // 今の状態を「もう見た」ことにする(勝手に演出が出ないように)
  seen={ gid:G.gid, sk:G.sk, tick:G.tick, phase:G.phase, notes:{}, alive:{}, over:G.phase==="over", wh:{}, gone:{}, dead:{} };
  G.players.forEach(p=>{ seen.notes[p.id]=p.notes.length; seen.alive[p.id]=p.alive; if(p.cause==="gone") seen.gone[p.id]=1; if(!p.alive) seen.dead[p.id]=1; });
  (G.wh||[]).forEach(w=>{ seen.wh[w.id]=1; });
}
function sgFire(fn){ if(fn) fn(); onState(); render(); }                              // 変化を起こして、その時の演出を出す
function sgPhaseIn(prev){ seen.sk=-1; seen.phase=prev||""; seen.over=false; onState(); render(); }   // そのフェーズに入った瞬間の演出
function sgLobby(n,o){
  o=o||{}; online=true; isHost=!o.guest; hostId=o.guest? "g1" : myId; code="HUBAP"; nameAsked=true;
  const ids=[...Array(n)].map((_,i)=>i?"g"+i:myId);
  if(o.guest){ ids[0]="g1"; ids[1]=myId; }                         // 参加者側: オーナー(さくら)が先頭
  lobby=ids.map((id,i)=>({ id, n: (o.undef&&i===n-1)? "" : SG_NM[id===myId?0:+id.slice(1)], c:PCOL[i], t:i }));
  if(o.roles) rules.roles=o.roles;
  phaseUI="lobby"; showScene("lobbyScene"); renderLobby();
}

const sgOver=(win,o)=>sgG(RV,Object.assign({ phase:"over", turn:8, winner:win, set:g=>{ const P=g.players;
  if(win==="village"){ sgKill(P[1],"hang"); sgKill(P[3],"poison","g1"); }

let lastWarnS=-1;
tickIv=setInterval(()=>{
  hostTick();
  if(phaseUI==="game"&&G){
    if(gallery){ if(G.stepEnd) G.stepEnd=Date.now()+sgLeft*1000; localEnd=G.stepEnd; }   // ★シーン一覧: 残り時間は止めたまま
    else if(isHost||debug) localEnd=G.stepEnd||0;
    renderTimer();
    const s=Math.ceil((localEnd-Date.now())/1000);
    const m=me(), mine = m && m.alive && ["move","act","vote","talk"].includes(G.phase) && !myInputIn();   // 警告音は自分がまだ入力していない時だけ
    if(G.stepEnd && mine && s<=5 && s>=1 && s!==lastWarnS){ lastWarnS=s; playWarn(); }
  }
},200);

<script>/* 招待リンク(?join=合言葉)で来た人を自動で入室させる */
(function(){
  var m=/[?&]join=([A-Za-z0-9]{4,6})/.exec(location.search); if(!m) return;
  var jc=m[1].toUpperCase(); window.__pendingJoin=jc;
  setTimeout(function(){ try{
    var jb=document.getElementById("joinRoomBtn"); if(jb) jb.click();
    var inp=document.getElementById("codeInput");
    if(inp){ inp.value=jc; var go=document.getElementById("codeGo"); if(go) go.click(); }
  }catch(e){} },450);
})();
</script>
<script>document.addEventListener("focusin",function(e){var t=e.target;if(t&&t.tagName==="INPUT"&&t.value){setTimeout(function(){try{t.select();}catch(_){}},0);}});(function(){var tap=(window.matchMedia&&matchMedia("(pointer:coarse)").matches)?"タップ":"クリック";window.__TAPW=tap;function run(){var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);var n;while(n=w.nextNode()){var v=n.nodeValue;if(v&&(v.indexOf("タップ")>=0||v.indexOf("タッチ")>=0))n.nodeValue=v.split("タッチ").join(tap).split("タップ").join(tap);}}if(document.readyState!=="loading")run();else document.addEventListener("DOMContentLoaded",run);})();</script>
