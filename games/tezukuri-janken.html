<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Yusei+Magic&text=%E6%89%8B%E4%BD%9C%E3%82%8A%E3%81%98%E3%82%83%E3%82%93%E3%81%91%E3%82%93&display=swap');   /* ロゴだけ手書き風(油性マジック)。使う字だけ読み込む */
  :root{
    --bg:#f7f2ea;
    --card:#ffffff;
    --ink:#2a2521;
    --sub:#8e857b;
    --line:#e0d8cc;
    --a:#e0762e;  --a-d:#a8521a;  --a-bg:#fff2e8;    /* 側(a/b)の色=起動後はJS(applySkins)がその人の手の色で上書きする(2026-09-22) */
    --b:#2f7fbf;  --b-d:#1d5786;  --b-bg:#eaf3fb;
    --ui:#e0762e; --ui-d:#a8521a; --ui-bg:#fff2e8;   /* 共通UI(ボタン・ロゴ・見出し)=自分の手の色(JSが上書き) */
    --skin:#f6d0b0; --skin-d:#e2b08c; --skin-line:#c98d63;
    --tc:var(--a); --tc-d:var(--a-d);
  }
  *{ box-sizing:border-box; font-family:"Noto Sans JP","Hiragino Sans",sans-serif; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--bg);   /* 背景=自分の手の色をごく薄くした単色(グラデーションなし。JSのapplySkinsが--bgを入れる・2026-09-22) */
    color:var(--ink); -webkit-font-smoothing:antialiased;
    position:relative; height:100svh; overflow:hidden; user-select:none; -webkit-user-select:none; }
  button{ font-family:inherit; cursor:pointer; }

  /* ===== シーン ===== */
  .scene{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    opacity:0; pointer-events:none; transform:translateY(16px);
    transition:opacity .32s linear, transform .32s cubic-bezier(.2,.8,.3,1);
    overflow-y:auto; scrollbar-width:none; }
  .scene::-webkit-scrollbar{ display:none; }
  .scene.on{ opacity:1; pointer-events:auto; transform:translateY(0); }
  /* 上下に余分なスクロール範囲(全ゲーム共通・画面幅に関係なく常に)=上は「あそびかた」「効果音」・下はチャット枠/フッターのぶん */
  #titleScene{ padding:90px 20px 220px; gap:28px; }
  #gameScene{ padding:150px 10px 290px; gap:12px; justify-content:center; justify-content:safe center; }

  /* ===== 固定ボタン ===== */
  .help-btn,.snd-btn{ display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; font-weight:700; letter-spacing:.1em; color:rgba(42,37,33,.78);
    background:rgba(255,255,255,.86); border:1.6px solid var(--line);
    border-radius:999px; padding:6px 14px 7px; white-space:nowrap; }
  .help-btn{ position:fixed; left:10px; top:10px; z-index:80; }
  .snd-btns{ position:fixed; right:10px; top:10px; z-index:80; }
  .help-btn .q{ display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px;
    border-radius:50%; background:var(--ui); color:#fff; font-size:11.5px; font-weight:900; }
  .snd-btn svg{ width:14px; height:13px; }
  .snd-btn.off{ opacity:.5; } .snd-btn.off .w1,.snd-btn.off .w2{ display:none; }
  .help-btn:active,.snd-btn:active{ transform:translateY(1px); }

  /* ===== タイトル ===== */
  .t-wrap{ text-align:center; display:flex; flex-direction:column; align-items:center; gap:4px; position:relative; }
  .t-logo{ width:clamp(200px,54vw,280px); height:auto; display:block; margin-top:4px; }
  /* いま作っている形=手のすぐ下に大きな文字で(ラウンド中の表示と同じ見せ方)。どれでもない時は何も出さない */
  .t-shape{ min-height:40px; display:flex; align-items:center; justify-content:center; font-size:clamp(17px,4.93vw,28px); font-weight:900; letter-spacing:1px; text-indent:1px; line-height:1.1;
    color:var(--sw,var(--ink)); margin:-38px 0 0; position:relative; z-index:2;
    background:var(--swb,rgba(255,255,255,.7)); padding:4px 10px 6px; border-radius:999px; width:110px; box-sizing:border-box; text-align:center; }
  /* 文字=2/3(28px)・字間=1px(-4pxから+5)・背景は高さ40px/幅110px/完全な角丸(2026-09-22)。???の時は背景なし */   /* 文字=手の色を濃く・背景=手の色を薄く(--sw/--swbをJSが入れる)。手との間隔は-30px(2026-09-21) */
  .t-shape.pop{ animation:chipPop .3s cubic-bezier(.2,1.5,.4,1); }   /* タイトルの手も自由に動かせる */
  .t-main{ line-height:1.06; position:relative; z-index:2; }   /* ロゴは手の囲みより手前 */
  /* ロゴ=ゲーム中の「◯◯の勝ち」と同じ2重アウトライン(白文字・内線=手の色・外線=濃い手の色)。2026-09-22 */
  .t-main .l1,.t-main .l2{ position:relative; display:block; color:#fff; --ol1:var(--olm1,var(--ui)); --ol2:var(--olm2,var(--ui-d)); font-family:"Yusei Magic","Noto Sans JP",sans-serif; font-weight:400; }   /* ロゴは手書き風(2026-09-24) */
  .t-main .l1{ color:var(--olm1,var(--ui)); --ol1:var(--olm2,var(--ui-d)); --ol2:#fff; }   /* 「手作り」=中央から 手の色→濃い→白。「じゃんけん」=白→元色→濃い(2026-09-24) */
  .t-main .l1{ font-size:clamp(21px,5.6vw,33px); letter-spacing:.12em; text-indent:.12em; padding:0 .2em; }
  .t-main .l2{ margin-top:0; font-size:clamp(34px,9.4vw,60px); letter-spacing:.02em; white-space:nowrap; padding:0 .2em; }
  .t-main .l1::before,.t-main .l1::after,.t-main .l2::before,.t-main .l2::after{ content:attr(data-t); position:absolute; inset:0; padding:0 .2em; text-align:center; color:transparent; pointer-events:none; }
  .t-main .l1::before,.t-main .l2::before{ -webkit-text-stroke:.2em var(--ol2); z-index:-2; }
  .t-main .l1::after,.t-main .l2::after{ -webkit-text-stroke:.08em var(--ol1); z-index:-1; }
  .t-sub{ margin-top:12px; font-size:clamp(12px,3.4vw,15px); color:var(--sub); letter-spacing:.14em; font-weight:700; }
  .sec-label{ font-size:15px; letter-spacing:.5em; text-indent:.5em; opacity:.6;
    text-align:center; margin-bottom:12px; font-weight:700; }
  .fuda-row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; width:min(94vw,540px); }
  .fuda{ flex:1 1 0; min-width:148px; max-width:186px; padding:16px 8px 14px; white-space:nowrap;
    font-weight:900; font-size:16px; letter-spacing:.06em; text-align:center;
    color:var(--ink); background:var(--card); border:2px solid var(--line); border-radius:13px;
    box-shadow:0 3px 0 var(--line);
    transition:transform .14s cubic-bezier(.3,1.4,.5,1), box-shadow .14s ease, background .14s, color .14s, border-color .14s; }
  .fuda:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--line); }
  .fuda.sel{ color:#fff; background:var(--ui); border-color:var(--ui); box-shadow:0 3px 0 var(--ui-d); }
  .fuda.sel:active{ box-shadow:0 1px 0 var(--ui-d); }
  #modeRow .fuda{ min-width:0; max-width:none; font-size:clamp(12px,3.3vw,15px); letter-spacing:.02em; padding-left:4px; padding-right:4px; }
  .lv-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .lv-row .fuda{ min-width:110px; max-width:148px; padding:12px 6px 10px; font-size:15px; }
  .setup{ display:none; flex-direction:column; align-items:center; gap:20px; }
  /* デバッグ(タイトルでS+D)=指ごとの%だけを出す小さな窓。もう一度S+Dで閉じる・つまんで動かせる(2026-09-25) */
  .dbg-win{ display:none; position:fixed; right:10px; top:52px; z-index:90; background:rgba(255,255,255,.94); border-radius:10px;
    padding:8px 12px; font-size:12.5px; font-weight:700; color:var(--ink); box-shadow:0 2px 8px rgba(0,0,0,.14); line-height:1.7; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }
  .dbg-win.dragging{ cursor:grabbing; }
  .dbg-win.snapping{ transition:left .22s cubic-bezier(.2,.9,.3,1), top .22s cubic-bezier(.2,.9,.3,1); }
  .dbg-win.on{ display:block; }
  body.in-game .dbg-win{ display:none; }   /* タイトル画面でだけ出す */
  .dbg-win div{ display:flex; justify-content:space-between; gap:12px; }
  .dbg-win .hd{ font-size:10.5px; color:var(--sub); }
  .dbg-win span{ min-width:2.4em; }
  .dbg-win b{ font-variant-numeric:tabular-nums; min-width:2.4em; text-align:right; }
  /* ルール(先取本数)=ひとり/オンライン共通。オンラインは部屋を作った側の値で遊ぶ(2026-09-24) */
  .rule-box{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .rule-frame{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 18px 12px; background:var(--card); border:2px solid var(--line); border-radius:13px; }
  .rf-lb{ font-size:14px; font-weight:900; letter-spacing:.08em; }   /* 見出し「何本先取」は −N＋ の上 */
  .rf-row{ display:flex; align-items:center; gap:12px; }
  .rf-st{ width:34px; height:34px; border-radius:50%; border:2px solid var(--line); background:#fff; font-size:17px; font-weight:900; line-height:1; color:var(--ink); display:inline-flex; align-items:center; justify-content:center; padding:0 0 2px; }
  .rf-st:disabled{ opacity:.3; cursor:default; }
  .rf-v{ min-width:2em; text-align:center; font-size:18px; font-weight:900; color:var(--ui); font-variant-numeric:tabular-nums; }
  .rule-reset{ background:none; border:none; font-size:12.5px; font-weight:700; color:var(--sub); text-decoration:underline; letter-spacing:.06em; padding:2px 6px; }
  .rule-note{ display:none; font-size:12px; font-weight:700; color:var(--sub); letter-spacing:.04em; }
  body.online-mode .rule-note{ display:block; }
  .setup.on{ display:flex; animation:setupIn .36s cubic-bezier(.2,.9,.3,1); }
  @keyframes setupIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }

  .start-btn{ margin-top:2px; padding:15px 50px 17px; white-space:nowrap;
    font-size:22px; font-weight:900; letter-spacing:.3em; text-indent:.3em; color:#fff;
    background:var(--ui); border:none; border-radius:14px;
    box-shadow:0 5px 0 var(--ui-d), 0 9px 18px rgba(0,0,0,.16); }
  .start-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--ui-d); }
  .room-btns{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .room-area{ display:flex; flex-direction:column; align-items:center; gap:14px; min-height:20px; text-align:center; }
  /* オンライン: 合言葉まわり(碁石系列と同じ作り=枠なしの縦積み) */
  .room-note{ font-size:12.5px; font-weight:700; letter-spacing:.12em; color:var(--sub); }
  .room-note.err{ color:var(--ui); }
  @keyframes waitDots{ 0%,100%{ opacity:.4; } 50%{ opacity:1; } }
  .room-wait{ animation:waitDots 1.6s ease-in-out infinite; }
  .code-show{ display:inline-flex; align-items:center; gap:12px; margin-top:-6px;
    background:#fff; border:2.2px solid var(--ui); border-radius:12px; padding:6px 20px 8px 16px; cursor:pointer;
    transition:transform .12s ease, box-shadow .15s ease; }
  .code-show:hover{ box-shadow:0 3px 10px rgba(224,118,46,.24); }
  .code-show:active{ transform:scale(.97); }
  .code-show .cs-code{ font-size:clamp(34px,9vw,44px); font-weight:900; letter-spacing:.22em; text-indent:.22em;
    color:var(--ui); font-variant-numeric:tabular-nums; line-height:1.15; }
  .code-show .cs-copy{ width:24px; height:24px; flex:none; fill:none; stroke:var(--ui); stroke-width:2; opacity:.7; }
  .code-input{ width:230px; padding:10px 6px; text-align:center; font-family:inherit; font-weight:900;
    font-size:26px; letter-spacing:.25em; text-indent:.25em; text-transform:uppercase;
    color:var(--ink); background:#fff; border:2px solid var(--line); border-radius:8px; outline:none;
    line-height:1.2; caret-color:var(--ink); }
  .code-input:focus{ border-color:rgba(42,37,33,.55); }
  .code-row{ display:flex; align-items:center; gap:10px; }
  .paste-btn{ flex:none; display:flex; align-items:center; justify-content:center; cursor:pointer;
    padding:4px; background:none; border:none; color:var(--sub); }
  .paste-btn svg{ width:26px; height:26px; }
  .paste-btn:active{ transform:translateY(1px); }

  /* ===== 対局画面(既存作の「枠で囲む」型はやめて、手を大きく・文字で見せる) ===== */
  .round-tag{ font-size:12px; font-weight:900; letter-spacing:.3em; text-indent:.3em; color:var(--sub); text-align:center; }
  .arena{ position:relative; display:flex; gap:clamp(6px,2vw,24px); width:min(98vw,760px); align-items:flex-start; justify-content:center; }
  .side{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .side.a{ --sc:var(--a); --sc-d:var(--a-d); } .side.b{ --sc:var(--b); --sc-d:var(--b-d); }
  .who{ display:flex; align-items:center; gap:8px; max-width:100%; position:relative; z-index:3; }   /* 名前は囲みより手前 */
  .who .nm{ font-size:clamp(12px,3.4vw,15px); font-weight:900; letter-spacing:.06em; color:var(--sc-d); white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .dots{ display:flex; gap:5px; flex:none; color:var(--sc); }
  .dots i{ width:10px; height:10px; border-radius:50%; border:2px solid currentColor; opacity:.35; display:block; transition:background .2s, opacity .2s, transform .2s; }
  .dots i.on{ background:currentColor; opacity:1; transform:scale(1.2); }
  /* 手=枠・背景・影なし。手のひらと指は同じ色(角丸の四角)+うすい輪郭線(どんな色でも見えるよう黒の半透明) */
  .hand{ width:100%; height:auto; display:block; touch-action:none; overflow:visible; }
  .side .hand{ width:min(100%,340px); }
  .hand.mine{ cursor:grab; }
  .hand .fg,.hand .palm{ fill:var(--skin); stroke:var(--skin-o); stroke-width:1; stroke-linejoin:round; }
  /* 形ができた時の囲み(2026-09-24)=手のうしろ・手の色。グゥ=ゴツゴツ/チョ=ギザギザ/パァ=フワフワ。???は出さない */
  .hand .aura{ fill:var(--skin-hd); fill-opacity:.5; stroke:var(--skin); stroke-width:4; stroke-opacity:.75; opacity:0; pointer-events:none;
    transform-origin:163px 194px; }   /* 拡縮の中心=手の中心(AURA_CX/CY)に固定 */
  .hand .aura.on{ opacity:1; }
  .hand .aura.rock{ stroke-linejoin:round; stroke-width:5; }
  .hand .aura.scissors{ stroke-linejoin:miter; stroke-miterlimit:8; stroke-width:3; }
  .hand .aura.paper{ stroke-linejoin:round; stroke-width:3.5; }
  .hand .aura.on.pop.rock{ animation:auraIn .3s cubic-bezier(.2,1.5,.4,1), auraRock .5s steps(2,end) .3s infinite; }
  .hand .aura.on.pop.scissors{ animation:auraIn .25s cubic-bezier(.2,1.6,.4,1), auraSci 1.6s ease-in-out .25s infinite; }
  .hand .aura.on.pop.paper{ animation:auraIn .45s cubic-bezier(.2,1.2,.4,1), auraPap 2.4s ease-in-out .45s infinite; }
  /* 消える=出る時の逆再生。★出る時と同じ名前(auraIn)に reverse を付けるだけだと、ブラウザは「同じアニメの向きを変えただけ」と見なして
     再生し直さず、終わった状態のまま一瞬で消える(2026-09-24のバグ)→ 別名のauraOutにして、カーブも前後反転した値にする */
  .hand .aura.on.out.rock{ animation:auraOut .3s cubic-bezier(.2,.9,.4,1) forwards; }   /* 出る時と同じ長さ・同じ「最初が速い」カーブ=同じ速さに見える(2026-09-24) */
  .hand .aura.on.out.scissors{ animation:auraOut .25s cubic-bezier(.2,.9,.4,1) forwards; }
  .hand .aura.on.out.paper{ animation:auraOut .45s cubic-bezier(.2,.9,.4,1) forwards; }
  @keyframes auraIn{ 0%{ transform:scale(.7); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
  @keyframes auraOut{ 0%{ transform:scale(1); opacity:1; } 100%{ transform:scale(.7); opacity:0; } }
  @keyframes auraRock{ 0%{ transform:translate(-1px,1px); } 100%{ transform:translate(1px,-1px); } }
  @keyframes auraSci{ 0%,100%{ transform:rotate(-3deg); } 50%{ transform:rotate(3deg); } }
  @keyframes auraPap{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.04); } }   /* 輪郭=手の色を濃くしたもの */
  #logoHand .palm{ cursor:pointer; }                     /* タイトル=手のひらを押すと色を選べる */
  .hand .hd{ fill:var(--skin-hd); stroke:none; pointer-events:none; }   /* 指先の丸=つかめる印(手の色を明るくしたもの・輪郭なし・指の内側) */
  .hand .hd{ transition:opacity .07s linear; }
  .hand.holding .hd:not(.held){ opacity:0; }   /* 指をつかんでいる間は、つかんでいる指以外の丸を隠す(ほぼ一瞬のフェード・2026-09-22) */
  .hand .hd-hit{ fill:transparent; cursor:grab; }
  .hand.locked .hd-hit{ cursor:default; }
  .hand.locked .hd{ opacity:.45; }
  /* タイトル: 手の色は手のひらを押して選ぶ(カラーパレットの入力欄は見えない所に置く) */
  #skinCol{ position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; left:50%; top:40%; }
  .shape-word{ font-size:clamp(16px,4.93vw,28px); font-weight:900; letter-spacing:1px; text-indent:1px; line-height:1.1; margin-top:-36px;
    color:var(--sw,var(--sc)); transition:color .15s, transform .15s; }   /* 文字=その人の手の色を濃く・背景=薄く。手との間隔は-30px(2026-09-21) */
  .shape-word{ position:relative; z-index:2; display:flex; align-items:center; justify-content:center; min-height:40px; width:min(100%,110px);
    background:var(--swb,rgba(255,255,255,.7)); padding:4px 10px 6px; border-radius:999px; box-sizing:border-box; }
  .shape-word.pop{ animation:chipPop .3s cubic-bezier(.2,1.5,.4,1); }
  .shape-word.none,.t-shape.none{ background:transparent; }   /* ???の時は文字だけ(背景なし) */
  @keyframes chipPop{ 0%{ transform:scale(.7); } 60%{ transform:scale(1.14); } 100%{ transform:scale(1); } }
  /* デバッグ(手のためし) */
  /* デバッグ表は手の下・文字色は変えない(動くと見づらい) */
  /* 中央の演出(ラウンド開始・勝ち) */
  .fx{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    pointer-events:none; opacity:0; transition:opacity .16s; z-index:5; }
  .fx.on{ opacity:1; }
  /* 3カウント・「◯◯の勝ち」=背景の板なし。白い文字に2重のアウトライン(内側=手の色・外側=濃い手の色)。
     アウトラインは同じ文字を::before/::afterに重ねて描く(-webkit-text-strokeは輪郭線の中心に引かれるので、外側から 外線→内線→白い文字 の順に積む)。2026-09-22 */
  .fx .big{ position:relative; font-size:clamp(22px,7vw,48px); font-weight:900; letter-spacing:.1em; text-indent:.1em; color:#fff; line-height:1.2;
    max-width:94%; text-align:center; word-break:break-word; animation:fxIn .32s cubic-bezier(.2,1.4,.4,1); padding:0 .3em;
    --ol1:var(--olm1,var(--ui)); --ol2:var(--olm2,var(--ui-d)); }
  .fx .big.count{ font-size:clamp(64px,20vw,120px); letter-spacing:0; text-indent:0; }
  .fx .big::before,.fx .big::after{ content:attr(data-t); position:absolute; inset:0; padding:0 .3em; text-align:center; pointer-events:none; color:transparent; }
  .fx .big::before{ -webkit-text-stroke:.2em var(--ol2); z-index:-2; }    /* 外線(見える幅≒.06em) */
  .fx .big::after{ -webkit-text-stroke:.08em var(--ol1); z-index:-1; }    /* 内線(見える幅≒.04em)=外側より細く */
  .fx.gray .big{ --ol1:var(--olf1,var(--ink)); --ol2:var(--olf2,#000); }   /* あいての勝ち=あいての手の色 */
  .fx.count .big{ --ol1:var(--olm1,var(--ui)); --ol2:var(--olm2,var(--ui-d)); }   /* 3カウントは自分の色 */
  .fx .small{ position:relative; font-size:clamp(13px,3.6vw,16px); font-weight:900; letter-spacing:.1em; color:#fff; white-space:nowrap; --ol2:var(--olm2,var(--ui-d)); }
  .fx.gray .small{ --ol2:var(--olf2,#000); }
  .fx .small::before{ content:attr(data-t); position:absolute; inset:0; -webkit-text-stroke:.2em var(--ol2); z-index:-1; color:transparent; }
  @keyframes fxIn{ 0%{ transform:scale(.6) rotate(-4deg); } 60%{ transform:scale(1.08) rotate(1deg); } 100%{ transform:none; } }

  .sub-btns{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .txt-btn{ padding:9px 20px; font-size:14.5px; font-weight:700; letter-spacing:.1em; color:var(--ink);
    background:rgba(255,255,255,.9); border:1.8px solid var(--line); border-radius:9px; white-space:nowrap; }
  #gameScene .sub-btns .txt-btn{ min-width:132px; text-align:center; }
  .txt-btn:disabled{ opacity:.35; cursor:default; pointer-events:none; }

  /* ===== チャット(スタンプもこの中に入れる・全ゲーム共通) ===== */
  #chatBox{ position:fixed; left:10px; bottom:10px; z-index:75; display:none;
    flex-direction:column; align-items:flex-start; gap:7px; width:min(84vw,300px); }
  #chatBox.on{ display:flex; }
  #chatBox.mini .chat-log, #chatBox.mini .chat-row, #chatBox.mini #stampBar{ display:none; }
  .chat-tog{ align-self:flex-start; display:inline-flex; align-items:center; gap:5px;
    padding:5px 10px 5px 12px; border:none; border-radius:999px; box-shadow:none;

    font-size:11px; font-weight:900; letter-spacing:.02em; white-space:nowrap; }
  #chatBox:not(.mini) .chat-tog{ position:absolute; right:0; top:8px; align-self:auto; }

  .pop-line{ max-width:100%; background:rgba(255,255,255,.96); border-radius:8px;
    padding:8px 11px; box-shadow:0 2px 9px rgba(35,33,31,.3); font-size:12px; line-height:1.55;

    border:3px solid transparent; background-clip:padding-box; }

  .stamp-fly{ position:fixed; bottom:-30px; width:96px; z-index:63; pointer-events:none;

  /* ===== オーバーレイ ===== */
  .ov{ position:fixed; inset:0; z-index:70; background:rgba(28,25,22,.5); display:none; align-items:center; justify-content:center; padding:20px; }

    width:min(90vw,400px); background:var(--bg); border-radius:18px; border-top:10px solid var(--tc);

  .r-card .sub-btns{ width:100%; }

  .r-score .sa{ color:var(--a); } .r-score .sb{ color:var(--b); }
  .r-score .dash{ color:var(--sub); font-size:1em; }   /* 数字と同じ大きさ・同じベースライン(小さくして中央そろえにすると上にずれて見えた・2026-09-22) */
  .help-card::-webkit-scrollbar{ width:9px; } .help-card::-webkit-scrollbar-track{ background:transparent; }   /* スクロールバーは背景なし・バーだけ */

  .help-card p.h-txt{ margin:0 0 16px; font-size:13.5px; font-weight:500; line-height:1.95; letter-spacing:.03em; color:#3a352f; }

    animation:rIn .28s cubic-bezier(.2,.9,.3,1); }

  .help-card li b{ font-weight:900; }
  .help-card .close{ display:block; margin:2px auto 0; min-width:132px; }

  .toast{ position:fixed; left:50%; bottom:calc(26px + 62px); transform:translate(-50%,10px); z-index:80;
    background:rgba(35,33,31,.95); color:#fff; padding:9px 15px; border-radius:999px;
    font-size:12.5px; font-weight:700; letter-spacing:.06em; white-space:nowrap; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; }

  .home-foot{ position:fixed; left:0; right:0; bottom:0; z-index:40; text-align:center; padding:30px 0 16px;
    font-size:12.5px; font-weight:900; letter-spacing:.2em; color:var(--sub); text-decoration:none;
    background:linear-gradient(to top, var(--bg) 55%, rgba(247,242,234,0));
    opacity:0; pointer-events:none; transition:opacity .32s linear; }
  #titleScene.on ~ .home-foot{ opacity:1; pointer-events:auto; }
  .home-foot:hover{ color:var(--ink); }
  /* ===== スマホ(狭い画面)=手を縦に並べ、自分の手を下にする(2026-09-24牧村指示) =====
     DOMは「自分→あいて」の順なので column-reverse で自分が下に来る(.fxはabsoluteなので影響なし)。
     手の大きさは画面の高さから決める=2つ並べても、スクロールせずに両方見えるように
     (#gameSceneの上下パディング150/290はスクロール用なので触らない。150px引いた残りを2つで分ける) */
  @media (max-width:620px){
    /* 上のスクロール用の余白は、縦並びだと「ただの空白」になって手が小さくなるだけなので詰める。
       左上の「あそびかた」と右上の「効果音」の下端が約52pxなので、54pxあれば重ならない(下の290pxはそのまま) */
    #gameScene{ padding-top:54px; }
    .arena{ flex-direction:column-reverse; align-items:center; gap:28px; }   /* 手と手の間隔(2026-09-24に6px→28px) */
    .side{ flex:none; width:100%; }

    .side .hand{ width:min(96vw, 420px, max(190px, calc((100svh - 244px) / 2 * 1.1875))); }
  }

  @media(hover:hover){
    .fuda:hover{ transform:translateY(-3px); }
    .help-btn:hover,.snd-btn:hover{ background:#fff; }
  }
</style>

<script>
const $=id=>document.getElementById(id);

/* ===== サイト共通の名前(ハブのアカウント名) ===== */
const MK_GUEST="ゲスト";
function mkSes(){ try{ return JSON.parse(localStorage.getItem("mk.acct")||"null"); }catch(e){ return null; } }
function mkIn(){ return !!mkSes(); }
function mkName(){ try{ return (localStorage.getItem("mk.name")||"").trim(); }catch(e){ return ""; } }
function myAcctName(){ return mkIn()? mkName() : ""; }
let peerName="";
const foeLabel=()=>peerName||MK_GUEST;

/* ===== 手の形(幾何) =====
   右手・手のひらを正面に。指1本は「指先の位置(x,y)」だけで表す。付け根を中心に360°どこへでも動き、
   付け根からの距離にだけ上限 L(5指共通)がある。付け根と指先はただの直線でつなぐ(関節の表現はしない) */
const P={x:167,y:249};                                   /* 手のひらの中心 */
/* 見た目は角丸の四角だけで組む(手のひら=大きな角丸四角・指=細長い角丸四角・親指は左に離して斜め) */
const PALM={ x:92, y:195, w:150, h:108, r:18 };
const FINGERS=[                                          /* 0=親指 1=人差し指 2=中指 3=薬指 4=小指。b=付け根・a=伸ばした向き(度)・w=太さ・L=伸びる上限(2026-09-21=5本とも104) */

function poseTip(f,r,len){                               /* 判定の向きへr・横へ残り=長さlen(×L)。横は、伸ばす時は手のひらから離れる側・曲げる時は手のひら側 */

/* 手を囲う形(2026-09-24): グゥ=ゴツゴツ(角ばった岩)・チョ=ギザギザ(とげ)・パァ=フワフワ(雲)。???は出さない。
   ★手の中心(パァの手を囲む最小の円の中心)から固定の正円=指を動かしても大きさは変わらない。
   3つとも「内側の半径AURA_RI〜外側の半径AURA_RO」の同じ帯の中に収めるので、形によるサイズの差は無い */
const AURA_CX=163, AURA_CY=194, AURA_RI=156, AURA_RO=176;
const ROCK_U=[1,.05,.6,0,1,.35,0,.8,1,.1,.7,0,1,.4,.02,.75];   /* 岩のでこぼこ(0=内側〜1=外側)。上下左右は必ず外側=他の形と同じ大きさ。16角・深め */
const ROCK_RI=AURA_RO-40;                                /* 岩だけ内側を深く(外側の大きさは他と同じ) */
function auraPath(shape){
  const cx=AURA_CX, cy=AURA_CY, RI=AURA_RI, RO=AURA_RO;
  const P=(t,r)=>[(cx+Math.cos(t)*r).toFixed(1),(cy+Math.sin(t)*r).toFixed(1)];
  let d="";
  if(shape==="rock"){
    const n=ROCK_U.length;
    for(let i=0;i<n;i++){ const q=P(-Math.PI/2+i/n*Math.PI*2, ROCK_RI+(RO-ROCK_RI)*ROCK_U[i]); d+=(i?"L":"M")+q[0]+" "+q[1]; }
    return d+"Z";
  }
  if(shape==="scissors"){
    const n=26;
    for(let i=0;i<n;i++){ const q=P(-Math.PI/2+i/n*Math.PI*2, i%2?RI:RO); d+=(i?"L":"M")+q[0]+" "+q[1]; }
    return d+"Z";
  }
  /* 雲=内側の円の上に等間隔の点、隣どうしを外へふくらむ弧でつなぐ(ふくらみの頂点がちょうど外側の半径) */
  const n=13, h=RI*Math.sin(Math.PI/n), sg=RO-RI*Math.cos(Math.PI/n), rA=((h*h+sg*sg)/(2*sg)).toFixed(1);
  const pts=[]; for(let i=0;i<n;i++) pts.push(P(-Math.PI/2+i/n*Math.PI*2,RI));
  d="M"+pts[0][0]+" "+pts[0][1];
  for(let i=1;i<=n;i++){ const b=pts[i%n]; d+="A"+rA+" "+rA+" 0 0 1 "+b[0]+" "+b[1]; }
  return d+"Z";
}
const AURA_D={ rock:auraPath("rock"), scissors:auraPath("scissors"), paper:auraPath("paper") };
function setAura(parts,shape){
  if(!parts||!parts.aura||parts.shape===shape) return;
  const a=parts.aura, prev=parts.shape; parts.shape=shape;
  if(shape==="none"){                                     /* 消える時=出る時の逆再生 */
    if(prev&&prev!=="none") a.setAttribute("class","aura "+prev+" on out");
    return;
  }
  a.setAttribute("d",AURA_D[shape]);
  a.setAttribute("class","aura "+shape+" on"); void a.getBoundingClientRect(); a.classList.add("pop");
}
function drawHand(parts,tips){
  const geo=[];
  for(let i=0;i<5;i++){
    const f=FINGERS[i], B=f.b, T=tips[i];
    const dx=T.x-B.x, dy=T.y-B.y, d0=Math.hypot(dx,dy), len=Math.max(f.w,d0);
    /* 指先が付け根に近すぎる時は向きが決まらないので伸ばした向きを使う */
    const ux=d0>0.5?dx/d0:Math.cos(rad(f.a)), uy=d0>0.5?dy/d0:Math.sin(rad(f.a)), ang=Math.atan2(uy,ux)*180/Math.PI;
    geo[i]={ B, ux, uy, len, w:f.w, vx:B.x+ux*(len-f.w/2), vy:B.y+uy*(len-f.w/2) };
    const r=parts[i].g;                                   /* 付け根を原点に、指先の向きへ回した細長い角丸四角 */
    r.setAttribute("x",(-f.w/2).toFixed(1)); r.setAttribute("y",(-len).toFixed(1));
    r.setAttribute("width",f.w); r.setAttribute("height",len.toFixed(1));
    r.setAttribute("transform","translate("+B.x.toFixed(1)+" "+B.y.toFixed(1)+") rotate("+(ang+90).toFixed(2)+")");
  }
  if(!parts[0].hit) return;
  /* 丸はDOM順で手前の指に隠れる(部分的に重なれば部分的に隠れる)。描き順は小指(4)が奥・親指(0)が手前。
     重なっていてもつかめる(手前の指が優先=attachDrag側)。2026-09-22 */
  for(let i=0;i<5;i++){
    const g=geo[i];
    parts[i].hit.setAttribute("cx",tips[i].x.toFixed(1)); parts[i].hit.setAttribute("cy",tips[i].y.toFixed(1));
    /* 丸は「描いた四角の先端」から半幅ぶん内側(指が最小の長さの時も四角の中に収まる) */
    parts[i].hd.setAttribute("cx",g.vx.toFixed(1)); parts[i].hd.setAttribute("cy",g.vy.toFixed(1));
  }
}
/* つまんで動かす(複数の指を同時につまめる)。tips()=指先5点の配列・canMove()=いま動かせるか・onMove()=動いた時 */
function svgPoint(svg,e){
  const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  const m=svg.getScreenCTM(); if(!m) return {x:0,y:0};
  const q=pt.matrixTransform(m.inverse()); return {x:q.x,y:q.y};

function attachDrag(svg,tips,canMove,onMove){
  const drags=new Map();                                  /* pointerId → 指番号 */
  const hold=()=>{                                        /* つかんでいる指だけ丸を残す */
    const held=new Set(drags.values());
    svg.classList.toggle("holding",held.size>0);
    svg.querySelectorAll(".hd").forEach(h=>h.classList.toggle("held",held.has(+h.getAttribute("data-f"))));
  };
  svg.addEventListener("pointerdown",e=>{
    ensureAudio();
    if(!canMove()) return;
    const T=tips(), p=svgPoint(svg,e);
    /* 押した所の近く(22px以内)に指先が重なっていたら手前の指(番号の小さい方)を優先。無ければいちばん近い指(50px以内) */
    let best=-1, bd=1e9;
    for(let i=0;i<5;i++){ const d=Math.hypot(T[i].x-p.x,T[i].y-p.y); if(d<=22){ best=i; bd=d; break; } }
    if(best<0) for(let i=0;i<5;i++){ const d=Math.hypot(T[i].x-p.x,T[i].y-p.y); if(d<bd){ bd=d; best=i; } }
    if(best<0||bd>50) return;
    for(const [,fi] of drags) if(fi===best) return;
    drags.set(e.pointerId,best); hold();
    try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  });

    const fi=drags.get(e.pointerId); if(fi==null) return;
    if(!canMove()) return;
    const T=tips(), p=svgPoint(svg,e), n=tipFromPointer(FINGERS[fi],p);
    if(Math.abs(n.x-T[fi].x)>0.05||Math.abs(n.y-T[fi].y)>0.05){ T[fi].x=n.x; T[fi].y=n.y; if(onMove) onMove(); }
  });
  const end=e=>{ drags.delete(e.pointerId); hold(); };
  svg.addEventListener("pointerup",end); svg.addEventListener("pointercancel",end); svg.addEventListener("lostpointercapture",end);
  return { clear(){ drags.clear(); hold(); } };
}

function note(f1,f2,dur,type,vol,delay){
  if(!actx||!seOn) return;
  const t0=actx.currentTime+(delay||0), o=actx.createOscillator(), g=actx.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(f1,t0);
  if(f2&&f2!==f1) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+dur);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol||.16,t0+0.008);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+dur+0.02);
}
function noise(dur,vol,hp,delay){
  if(!actx||!seOn) return;
  const t0=actx.currentTime+(delay||0), n=Math.floor(actx.sampleRate*dur);
  const buf=actx.createBuffer(1,n,actx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=actx.createBufferSource(); s.buffer=buf;
  const f=actx.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp||900;
  const g=actx.createGain(); g.gain.value=vol||.06;
  s.connect(f); f.connect(g); g.connect(actx.destination); s.start(t0);
}

/* 手の色=タイトルに戻るたびランダム(手のひらを押すとカラーパレットで好きな色に)。ロボットの色も対局ごとにランダム(自分と離れた色相) */
function hslHex(h,sl,l){
  const sat=sl/100, li=l/100, c=(1-Math.abs(2*li-1))*sat, x=c*(1-Math.abs((h/60)%2-1)), m=li-c/2;
  let r=0,g=0,b=0; h=((h%360)+360)%360;
  if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;} else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
  return "#"+[r,g,b].map(v=>Math.round((v+m)*255).toString(16).padStart(2,"0")).join("");
}
function hueOf(hex){ const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn; if(!d) return 0;
  let h= mx===r ? ((g-b)/d)%6 : mx===g ? (b-r)/d+2 : (r-g)/d+4; return ((h*60)+360)%360; }
function randSkin(avoidHue){                             /* 明るめの色をランダムに。avoidHueから60°以上はなす */
  let h=Math.random()*360;
  if(avoidHue!=null){ const off=60+Math.random()*240; h=(avoidHue+off)%360; }
  return hslHex(h,52+Math.random()*26,58+Math.random()*14);
}
let mySkin=randSkin(null), peerSkin="", cpuSkin=randSkin(hueOf(mySkin));
function mixHex(hex,to,t){                              /* hexを to(0=黒/255=白)へ t だけ寄せる */
  const c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));
  return "#"+c.map(v=>Math.round(v+(to-v)*t).toString(16).padStart(2,"0")).join("");
}
function setSkin(svg,hex){                               /* 本体=その色・輪郭=濃く・指先の丸=明るく(手の色から決める) */
  const st=svg.style; st.setProperty("--skin",hex); st.setProperty("--skin-o",mixHex(hex,0,0.32)); st.setProperty("--skin-hd",mixHex(hex,255,0.62));
}
/* 手の形の文字を「手のひらの真下」に=手のひらの中心(x=167)はviewBox(-40〜340)の54.5%なので、svgの幅×(0.545-0.5)ぶん右へ(flexの中央そろえなのでmargin-leftは2倍) */

function placeWords(){                                   /* 手のひらの中心が左右中央に来るよう、手(svg)を左へずらす。形の文字は中央のまま=手のひらの真下(2026-09-22) */

  });
}

/* ===== ロボット ===== */
const cpu={ target:newTips(), startAt:[0,0,0,0,0], nextAt:0, shape:"paper", seen:"none", respAt:0, holdAt:0, dodgeAt:0, ph:"", playAt:0 };
/* speed=指先の速さ(px/秒。1本を伸ばし⇄曲げするのに約180px動く=速さ900なら1本0.2秒) / react=次に考え直すまでの間
   first=ラウンド開始から最初に動くまで / smart=「勝てる形」を選ぶ確率 / stagger=指ごとに動き出しをずらす幅
   ★2026-09-24に強化(牧村指示「CPUが弱すぎる」)。足したのは次の3つ:
   resp = あいての形が変わってから動き直すまで(人でいう反射神経)。タイマー(react)を待たずに考え直す
   safe = 「最後の1本を動かすと完成するが、その形ではあいてに負ける」時は、その指を止めて別の形へ切り替える(自滅しない)
   ambush = あいてがまだ「???」の間は、わざと最後の1本を残して待ち伏せる。あいてが形を決めた瞬間に1本だけ動かして勝つ
            (ずっと待つと勝負が終わらないので ambushMs で打ち切って自分から形を作る=人はここを狙って粘れる)
   read   = 先読み。あいての指を見て「あと何本でどの形になるか」を数える
   dodge  = 先読みで危ないと分かってから逃げ出すまでの時間(短いほど強い)
   open   = 「はじめ」の直後、この時間は形を完成させない=人が構えるための間。
            ★これが無いと、3カウントの間に指を4本そろえたロボットが「はじめ」の0.07秒後に勝ってしまい勝負にならない(2026-09-24に実測)
   ★強すぎ/弱すぎの調整は speed(指の速さ)→open(はじめの間)→resp(反射神経) の順にいじるのが分かりやすい */
const CPU_CFG=[
  { speed:200, react:[900,1800], first:1400, smart:0.15, stagger:240, resp:900, open:2400, safe:false, ambush:false, ambushMs:0,    read:false, dodge:0   },  /* 初級=ゆっくり・でたらめ */
  { speed:380, react:[400,700],  first:900,  smart:0.80, stagger:120, resp:350, open:1600, safe:true,  ambush:false, ambushMs:0,    read:true,  dodge:320 },  /* 中級=そこそこ速い・自滅はしない */
  { speed:560, react:[180,300],  first:420,  smart:1.0,  stagger:50,  resp:200, open:1200, safe:true,  ambush:true,  ambushMs:2400, read:true,  dodge:90  },  /* 上級=速い・的確・待ち伏せる */
];
function nearestShape(tp){                               /* いまの指先から「どの形へ向かっているか」を読む */
  let best="paper", bd=1e9;
  for(const k in SHAPE_TIPS){ let d=0; for(let i=0;i<5;i++){ const r=clamp(reach(FINGERS[i],tp[i]),0,1), t=SHAPE_TIPS[k][i]?1:0; d+=(r-t)*(r-t); } if(d<bd){ bd=d; best=k; } }
  return best;
}
function cpuRemain(tp){                                  /* 目標にまだ着いていない指の数(=形が完成するまでの手数) */
  let n=0; for(let i=0;i<5;i++){ const dx=cpu.target[i].x-tp[i].x, dy=cpu.target[i].y-tp[i].y; if(dx*dx+dy*dy>0.25) n++; }
  return n;
}
function needOf(st,k){ let n=0; for(let i=0;i<5;i++) if((!st[i])!==!!SHAPE_TIPS[k][i]) n++; return n; }
function humanRead(){                                    /* ★先読み=あいてが「あと何本で」どの形になるか(いちばん近い形) */
  const st=states[mySide]; let best="paper", bn=9;
  for(const k in SHAPE_TIPS){ const n=needOf(st,k); if(n<bn){ bn=n; best=k; } }
  return { shape:best, need:bn };
}
function breakFinger(st,want){                           /* いまの形をいちばん早くくずせる指=判定の線(0)にいちばん近い指 */
  let best=-1, bv=1e9;
  for(let i=0;i<5;i++){
    if((!st[i])===!!SHAPE_TIPS[want][i]) continue;       /* 動かしても曲げ/伸ばしが変わらない指は形をくずさない */
    const v=Math.abs(reach(FINGERS[i],tips[foeSide()][i]));
    if(v<bv){ bv=v; best=i; }
  }
  return best;
}
function cpuAim(now,want){                               /* 目標の形を決め直す */
  cpu.shape=want; const t=tipsOfShape(want);
  for(let i=0;i<5;i++){ const jit=(Math.random()*2-1)*7; cpu.target[i]={x:t[i].x+jit,y:t[i].y+jit}; cpu.startAt[i]=now+Math.random()*CPU_CFG[cpuLv].stagger; }
  cpu.order=[0,1,2,3,4].sort(()=>Math.random()-0.5);     /* 動かす順番は毎回ランダム */
}
function cpuDecide(now){
  const cfg=CPU_CFG[cpuLv];
  const humanNow=shapes[mySide], heading=nearestShape(tips[mySide]);
  let want=null;
  if(Math.random()<cfg.smart){
    want=beaterOf(humanNow!=="none"?humanNow:heading);
  }else{
    const ks=["paper","rock","scissors"]; want=ks[Math.floor(Math.random()*3)];
    if(humanNow!=="none"&&beats(humanNow,want)&&cpuLv>0) want=beaterOf(humanNow);   /* 中級以上は自殺手はしない */
  }
  /* あいてがまだ「???」の間は、途中まで進めた形を捨てない=読みのブレで指が行ったり来たりして永久に完成しないのを防ぐ */
  const rem=cpuRemain(tips[foeSide()]);
  if(humanNow==="none"&&want!==cpu.shape&&rem>=1&&rem<=2) want=cpu.shape;   /* rem=0=手が空いている時は止めない(止めると目標を変えられず固まる) */
  if(want&&want!==cpu.shape) cpuAim(now,want);
  cpu.nextAt=now+cfg.react[0]+Math.random()*(cfg.react[1]-cfg.react[0]);
}
function cpuTick(now,dt){
  if(phase!=="play"&&phase!=="ready") return;             /* 3カウントの間も動く(判定はplayから) */
  const cfg=CPU_CFG[cpuLv], hs=shapes[mySide], tp=tips[foeSide()], st=states[foeSide()];
  if(cpu.ph!==phase){ cpu.ph=phase; if(phase==="play") cpu.playAt=now; }
  /* あいての形が変わったら、反射神経ぶんだけおいて考え直す(reactのタイマーは待たない) */
  if(hs!==cpu.seen){ cpu.seen=hs; cpu.respAt=now+cfg.resp; }
  if(cpu.respAt&&now>=cpu.respAt){ cpu.respAt=0; cpuDecide(now); }
  if(now>=cpu.nextAt) cpuDecide(now);

  /* ★いま形を完成させてよいか。
     完成したかどうかは「指の向き」で決まる(目標の座標に着いたかではない)ので、
     1本動かす直前に『この1本を動かしたら何の形になるか』を試算して決める。
     距離で「あと1本」と数える作りにしていたら、目標より手前で形が出来上がってしまい、
     カウント中に完成 → 「はじめ」の瞬間に人が負ける、という不具合になった(2026-09-24に実測して修正) */
  /* ★先読みの逃げ=あいてが「あと1本」で自分に勝つ形になるなら、その形が出来上がる前に自分の形をくずす。
     これが無いと、人が「???」で粘ってロボットの形を見てから作れば必ず勝ててしまう(2026-09-24牧村指摘) */
  const cur=shapeOf(st), rd=cfg.read?humanRead():null;
  const danger = !!(rd && cur!=="none" && rd.need<=1 && beats(rd.shape,cur));
  if(danger){ if(!cpu.dodgeAt) cpu.dodgeAt=now+cfg.dodge; } else cpu.dodgeAt=0;
  if(danger&&now>=cpu.dodgeAt){
    const want=beaterOf(rd.shape);
    if(want!==cpu.shape) cpuAim(now,want);
    const bi=breakFinger(st,cpu.shape);                  /* 順番もstaggerも無視して、その1本だけ全速で動かす */
    if(bi>=0){
      const dx=cpu.target[bi].x-tp[bi].x, dy=cpu.target[bi].y-tp[bi].y, d=Math.hypot(dx,dy), step=cfg.speed*dt;
      if(d>0.5){ const k=(d<=step)?1:step/d; tp[bi].x+=dx*k; tp[bi].y+=dy*k; }
      return;
    }
  }

  /* holdAt=「あいてが???でいる時間」を測る。★ねらう形を変えた時に巻き戻してはいけない
     =巻き戻すと、あいてが指を動かし続けるかぎり待ち伏せが永久に解けず、決着しなくなる(2026-09-24に実測して修正) */
  if(hs==="none"){ if(!cpu.holdAt) cpu.holdAt=now; } else cpu.holdAt=0;
  let blockAny = (phase==="ready") || (now-cpu.playAt<cfg.open);   /* 3カウント中と「はじめ」直後は、どの形も完成させない */
  if(cfg.ambush&&cpu.holdAt&&now-cpu.holdAt<cfg.ambushMs) blockAny=true;   /* あいてが「???」の間は待ち伏せ(ambushMsで打ち切る) */

  /* 人と同じく1本ずつ=目標に着いていない指のうち、動き出し時刻を過ぎた最初の1本だけ動かす(2026-09-22)。
     ただし「その1本で形が完成してしまう」時は、その指は飛ばして別の指を動かす=最後の1本を残して構える */
  const step=cfg.speed*dt, order=cpu.order||[0,1,2,3,4];
  let blocked=false;
  for(const i of order){
    const dx=cpu.target[i].x-tp[i].x, dy=cpu.target[i].y-tp[i].y, d=Math.hypot(dx,dy);
    if(d<0.5) continue;
    if(now<cpu.startAt[i]) break;
    const k=(d<=step)?1:step/d, nx=tp[i].x+dx*k, ny=tp[i].y+dy*k;
    const sv=st[i]; st[i]=(reach(FINGERS[i],{x:nx,y:ny})<0); const ns=shapeOf(st); st[i]=sv;
    /* 止めるのは「新しい形が出来上がってしまう1本」だけ。いまの形を保つ動き(ns===cur)は止めない
       =これを止めると、ラウンド頭のパァから1本も動かせなくなる(2026-09-24に実測して修正) */
    if((blockAny&&ns!=="none"&&ns!==cur)||(cfg.safe&&beats(hs,ns))){ blocked=true; continue; }
    tp[i].x=nx; tp[i].y=ny; return;
  }
  if(blocked&&cfg.safe&&hs!=="none"&&beats(hs,cpu.shape)&&!cpu.respAt) cpu.respAt=now+cfg.resp;   /* 負ける形で詰まっているので考え直す */
}
function cpuReset(now){
  const cfg=CPU_CFG[cpuLv];
  cpu.shape="paper"; const t=newTips();
  for(let i=0;i<5;i++){ cpu.target[i]=t[i]; cpu.startAt[i]=0; }
  cpu.nextAt=now+cfg.first+Math.random()*200;
  cpu.seen="none"; cpu.respAt=0; cpu.holdAt=0; cpu.dodgeAt=0; cpu.order=null; cpu.ph=""; cpu.playAt=now+1e9;   /* playAtはplayに入った時に入る(それまでは完成させない) */
}

/* ===== 進行(ホスト側で判定する) ===== */
function startMatch(){
  round=0; score={a:0,b:0}; overWinner=null; endReason=""; matchStarted=true;
  resultLogged=false; resetGive();
  if($("chatLog").children.length) addSys("── あたらしい対局 ──");
  $("resultOv").classList.remove("on","peek");
  nextRound();
}
function resetHands(){
  for(const s of ["a","b"]){ tips[s]=newTips(); shown[s]=newTips(); for(let i=0;i<5;i++) states[s][i]=false; shapes[s]="paper"; }
  setWord("shMe",shapes[mySide]); setWord("shFoe",shapes[foeSide()]);
  drawHand(partsMe,shown[mySide]); drawHand(partsFoe,shown[foeSide()]);
  dragMe.clear();
}
function clearReadyTimers(){ readyT.forEach(clearTimeout); readyT=[]; }
function nextRound(){                                    /* 3カウント→はじめ。カウントの間も指は動かせる(判定はしない) */
  clearReadyTimers();
  round++; phase="ready"; lastWinner=null; count=3;
  resetHands(); myMoved=true;
  if(mode==="cpu") cpuReset(Date.now());                 /* ロボットもカウント開始から動き出す(firstはカウント開始からの時間) */
  showCount(3); renderStatic(); hostBroadcast();
  readyT.push(setTimeout(()=>{ if(phase!=="ready") return; count=2; showCount(2); hostBroadcast(); },700));
  readyT.push(setTimeout(()=>{ if(phase!=="ready") return; count=1; showCount(1); hostBroadcast(); },1400));
  readyT.push(setTimeout(()=>{ if(phase!=="ready") return; enterPlay(); },2100));
}
function showCount(n){ fx(String(n),"","gray count"); playReady(); }
function enterPlay(){
  phase="play"; count=0; myMoved=true;
  fx("はじめ","",""); playGo(); setTimeout(()=>{ if(phase==="play") fxOff(); },650);
  renderStatic(); hostBroadcast();
}
function judge(){                                        /* 両者の形をつき合わせる(ホストだけが呼ぶ) */
  if(phase!=="play") return;
  const sa=shapes.a, sb=shapes.b;
  let w=null;
  if(beats(sa,sb)) w="a"; else if(beats(sb,sa)) w="b";
  if(!w) return;
  roundWon(w,{a:sa,b:sb});
}
function roundWon(w,sh,reason){
  phase="end"; lastWinner=w; lastShapes={a:sh.a,b:sh.b}; lastReason=reason||"";
  score[w]++;
  const iWon=(w===mySide);
  fx(labelOf(w)+"の勝ち", reason?(labelOf(other(w))+"の"+reason):"", w===mySide?"":"gray");   /* 「パァ ＞ グゥ」の小文字は出さない(2026-09-22) */
  if(iWon) playRoundWin(); else playRoundLose();
  dragMe.clear();
  renderStatic(); hostBroadcast();
  if(score[w]>=winN){ setTimeout(()=>{ if(phase==="end") matchOver(w,""); },1400); }
  else setTimeout(()=>{ if(phase==="end") nextRound(); },1700);
}
function matchOver(w,reason){
  clearReadyTimers();
  phase="over"; overWinner=w; endReason=reason||""; fxOff();
  if(w===mySide) playWin(); else playLose();
  renderStatic(); hostBroadcast(); showResult();
}
function fx(big,small,cls,col){
  const el=$("fx"); el.className="fx on"+(cls?" "+cls:"");
  const b=$("fxBig"); b.className="big"+(cls&&cls.indexOf("count")>=0?" count":"");
  b.textContent=big; b.setAttribute("data-t",big); b.style.animation="none"; void b.offsetWidth; b.style.animation="";   /* data-t=アウトライン用の写し */
  $("fxSmall").textContent=small||""; $("fxSmall").setAttribute("data-t",small||""); $("fxSmall").style.display=small?"":"none";
}
function fxOff(){ $("fx").classList.remove("on"); }

/* ===== 毎フレーム(setInterval=裏タブでも止まらない。ホストの判定が止まると相手も止まるため) ===== */
let lastT=Date.now(), netAcc=0;
setInterval(()=>{
  const now=Date.now(), dt=Math.min(0.1,(now-lastT)/1000); lastT=now;
  if(!$("gameScene").classList.contains("on")) return;
  if(mode==="cpu"&&(phase==="play"||phase==="ready")) cpuTick(now,dt);
  /* 自分の手=そのまま。あいての手=届いた値へなめらかに寄せる */
  const me=mySide, fo=foeSide();
  for(let i=0;i<5;i++){
    shown[me][i].x=tips[me][i].x; shown[me][i].y=tips[me][i].y;
    const k=(mode==="cpu")?1:Math.min(1,dt*18);
    shown[fo][i].x+=(tips[fo][i].x-shown[fo][i].x)*k; shown[fo][i].y+=(tips[fo][i].y-shown[fo][i].y)*k;
  }
  drawHand(partsMe,shown[me]); drawHand(partsFoe,shown[fo]);
  /* 形の更新(3カウント中も表示は更新・勝敗の判定はplayの間だけ・ホストだけ) */
  if(phase==="play"||phase==="ready"){
    for(const s of ["a","b"]){
      const ch=stepStates(states[s],tips[s]);
      if(ch){ const sh=shapeOf(states[s]); if(sh!==shapes[s]){ shapes[s]=sh; setWord(s===me?"shMe":"shFoe",sh); if(s===me) playShape(sh); } else if(s===me) playTick(); }
    }
    if(phase==="play"&&amHost()) judge();
  }
  /* 自分の指位置を相手へ(50msごと・動いた時だけ) */
  if(mode==="online"&&online&&started){
    netAcc+=dt*1000;
    if(netAcc>=50){ netAcc=0; if(myMoved){ myMoved=false; send("fin",{id:myId,rd:round,t:tips[me].map(p=>[Math.round(p.x),Math.round(p.y)])}); } }
    if(isHost&&now-lastSnapAt>700) hostBroadcast();
  }
},30);

function pickCode(t){                            /* 招待メッセージを丸ごと貼っても合言葉だけ取り出す */
  t=String(t||"");
  var m=/[?&]join=([A-Za-z0-9]{4,6})/.exec(t);
  if(m) return m[1].toUpperCase();
  var u=t.toUpperCase();
  m=/合言葉[：:\s]*([A-Z0-9]{4,6})/.exec(u);

function applySnap(s){                             /* ゲスト: ホストの進行に合わせる */
  if(!s||typeof s.v!=="number") return;
  if(s.v<=lastVerSeen) return; lastVerSeen=s.v;
  const prevPh=phase, prevRd=round;
  score.a=s.sa|0; score.b=s.sb|0; if(s.wn&&s.wn!==winN) setWinN(s.wn);
  if(s.ph==="ready"){
    if(prevPh!=="ready"||prevRd!==s.rd){ round=s.rd|0; phase="ready"; lastWinner=null; resetHands(); myMoved=true; }
    if((s.ct|0)!==count){ count=s.ct|0; if(count>0) showCount(count); }   /* 3・2・1はホストの合図で出す */
  }else if(s.ph==="play"&&prevPh!=="play"){
    round=s.rd|0; phase="play"; count=0;
    if(prevPh!=="ready"){ resetHands(); myMoved=true; }
    fx("はじめ","",""); playGo(); setTimeout(()=>{ if(phase==="play") fxOff(); },650);
  }else if(s.ph==="end"&&prevPh!=="end"){
    round=s.rd|0; phase="end"; lastWinner=s.w; lastShapes=s.sh||lastShapes; lastReason=s.rs||"";
    const w=s.w;
    if(w){
      shapes.a=lastShapes.a; shapes.b=lastShapes.b; setWord("shMe",shapes[mySide]); setWord("shFoe",shapes[foeSide()]);
      fx(labelOf(w)+"の勝ち", lastReason?(labelOf(other(w))+"の"+lastReason):"", w===mySide?"":"gray");
      if(w===mySide) playRoundWin(); else playRoundLose();
    }
    dragMe.clear();
  }else if(s.ph==="over"&&prevPh!=="over"){
    phase="over"; overWinner=s.ow; endReason=s.er||""; fxOff();
    if(overWinner===mySide) playWin(); else playLose();
    showResult();
  }else{ round=s.rd|0; phase=s.ph; }
  renderStatic();
}

/* ★デバッグ用の窓の共通部品(2026-09-25牧村指示)
   ・dragWin(窓, つまむ所[], 保存キー)=つまんで動かせる。離すといちばん近い画面の端に吸い付く・置いた場所は覚えておく
   ・onSD(関数)=SとDを同時に押した時に呼ぶ(開く/閉じる)。入力欄の中では反応しない。キーの位置で見るので日本語入力中でも効く */
function dragWin(el,handles,key){
  /* 離した時は左右どちらか近い方の画面の端へ吸い付く(2026-09-25牧村指示。上下には張り付かない=上下の位置は置いた所のまま)。
     保存するのは{e:吸い付いた端(l/r), p:上下の位置}=画面の大きさが変わっても同じ端にくっついたまま */
  const M=8;                                                   // 端からのすき間
  const vw=()=>window.innerWidth, vh=()=>window.innerHeight;
  const set=(x,y)=>{ el.style.left=x+"px"; el.style.top=y+"px"; el.style.right="auto"; el.style.bottom="auto"; };
  const fit=(v,max)=>Math.max(M,Math.min(max-M,v));            // 窓がまるごと画面に入る範囲
  const stick=(e,p)=>{ const w=el.offsetWidth, h=el.offsetHeight;
    if(!(vw()>0&&vh()>0)) return;                              // 画面の大きさが分からない時(裏のタブ等)は動かさない
    if(e==="l") set(M, fit(p,vh()-h)); else if(e==="r") set(vw()-w-M, fit(p,vh()-h));
    else if(e==="t") set(fit(p,vw()-w), M); else set(fit(p,vw()-w), vh()-h-M);
    el._snap={ e, p }; };
  const nearest=()=>{ const r=el.getBoundingClientRect();   // 窓の中心が画面の左半分なら左端・右半分なら右端
    return { e: (r.left+r.width/2)<=vw()/2? "l" : "r", p:r.top }; };
  el._place=()=>{ if(el._snap) stick(el._snap.e,el._snap.p); };
  el.dataset.drag="1";
  try{ const sv=JSON.parse(localStorage.getItem(key)||"null");
    if(sv&&(sv.e==="l"||sv.e==="r")) stick(sv.e,sv.p);
    else if(sv&&(sv.e==="t"||sv.e==="b")){ set(sv.p, sv.e==="t"? M : Math.max(M,vh()-el.offsetHeight-M)); if(vw()>0){ const n=nearest(); stick(n.e,n.p); } }   // 上下に張り付いていた古い保存は左右へ直す
    else if(sv&&typeof sv.x==="number"){ set(sv.x,sv.y); if(vw()>0){ const n=nearest(); stick(n.e,n.p); } }   // 吸い付く前に保存された位置
  }catch(e){}
  handles.forEach(h=>{ let d=null;
    h.addEventListener("pointerdown",e=>{ if(e.button!==0||e.target.closest("button")) return;
      const r=el.getBoundingClientRect(); d={ dx:e.clientX-r.left, dy:e.clientY-r.top, id:e.pointerId };
      el.classList.remove("snapping");
      try{ h.setPointerCapture(e.pointerId); }catch(_){} el.classList.add("dragging"); e.preventDefault(); });
    h.addEventListener("pointermove",e=>{ if(!d||e.pointerId!==d.id) return;
      let x=e.clientX-d.dx, y=e.clientY-d.dy;
      if(vw()>0&&vh()>0){ x=Math.max(-el.offsetWidth+60,Math.min(vw()-60,x)); y=Math.max(0,Math.min(vh()-30,y)); }
      set(x,y); });
    const up=()=>{ if(!d) return; d=null; el.classList.remove("dragging");
      if(!(vw()>0&&vh()>0)) return;
      const n=nearest(); el.classList.add("snapping"); stick(n.e,n.p);                 // すっと端へ吸い付く
      setTimeout(()=>el.classList.remove("snapping"),260);
      try{ localStorage.setItem(key,JSON.stringify(el._snap)); }catch(_){} };
    ["pointerup","pointercancel","lostpointercapture"].forEach(t=>h.addEventListener(t,up));
  });
  if(!dragWin.rs){ dragWin.rs=1; window.addEventListener("resize",()=>document.querySelectorAll("[data-drag]").forEach(w=>w._place&&w._place())); }
}
function onSD(fn){
  const held=new Set();
  document.addEventListener("keydown",e=>{
    if(e.ctrlKey||e.metaKey||e.altKey||e.repeat) return;
    const t=e.target; if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable)) return;
    if(e.code!=="KeyS"&&e.code!=="KeyD") return;
    held.add(e.code); if(held.has("KeyS")&&held.has("KeyD")){ held.clear(); e.preventDefault(); fn(); }
  });
  document.addEventListener("keyup",e=>held.delete(e.code));
  window.addEventListener("blur",()=>held.clear());
}
onSD(()=>{

/* ===== スタンプ ===== */
const STAMP_SVGS=['😭','😍','🤣'];
const STAMP_WORDS=["やめてよぉ","すごぉい","わろたぁ"];
let stampMuted=false;   /* 毎回ミュートOFFで始める(保存しない) */
let stampTTSVoice=null, stampTTSWarm=false;
const meLabel=()=>(myAcctName()||"あなた");
function playStamp(i){
  if(!actx||!seOn) return;
  if(i===0){ note(523,523,.20,"sine",.30,0); note(392,392,.22,"sine",.30,.15); note(300,300,.36,"sine",.26,.32); }
  else if(i===1){ note(523,523,.34,"sine",.22,0); note(784,784,.38,"sine",.24,.11); note(1047,1047,.62,"sine",.20,.24); note(1568,1568,.55,"triangle",.10,.34); note(2349,2349,.50,"sine",.06,.46); }
  else{ const seq=[900,680,850,640,800,600,760,560]; seq.forEach((f,k)=>note(f,f,.07,"triangle",.26,k*.072)); note(400,400,.16,"triangle",.24,seq.length*.072); }
}
function speakStamp(i){
  try{
    if(!window.speechSynthesis||!seOn||stampMuted) return;
    if(!stampTTSVoice){ const vs=speechSynthesis.getVoices()||[]; stampTTSVoice=vs.find(v=>/ja/i.test(v.lang))||null; }
    if(!stampTTSWarm){ stampTTSWarm=true; speechSynthesis.onvoiceschanged=()=>{ const v2=speechSynthesis.getVoices()||[]; stampTTSVoice=v2.find(v=>/ja/i.test(v.lang))||stampTTSVoice; }; }
    const u=new SpeechSynthesisUtterance(STAMP_WORDS[Math.max(0,Math.min(2,i|0))]);
    u.lang="ja-JP"; u.rate=1.05; u.pitch=1.1; u.volume=1;
    if(stampTTSVoice) u.voice=stampTTSVoice;
    if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}
}
function spawnStamp(i,who,self){
  if(stampMuted&&!self) return;
  i=Math.max(0,Math.min(2,i|0));
  const el=document.createElement("div"); el.className="stamp-fly";
  const hx=0.06+Math.random()*0.88;
  el.style.left="calc("+(hx*100).toFixed(1)+"% - 48px)";
  const central=1-Math.abs(hx-0.5)*2;
  el.style.setProperty("--rise","-"+(24+(1-central)*16).toFixed(0)+"vh");
  el.style.setProperty("--dx",(Math.random()*24-12).toFixed(0)+"px");
  el.innerHTML='<span class="s-emoji">'+STAMP_SVGS[i]+'</span><span class="s-name">'+(who||meLabel())+'</span>';
  if(seOn&&!stampMuted) playStamp(i);
  if($("resultOv").classList.contains("on")) el.classList.add("over-dialog");
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2350);
}
function sendStamp(i){
  speakStamp(i);
  spawnStamp(i,meLabel(),true);
  if(mode==="online"&&online&&ch) send("stamp",{i:i,id:myId});
}
document.querySelectorAll("#stampBar .stamp-btn").forEach(b=>{
  b.textContent=STAMP_SVGS[+b.dataset.i];

});

const POP_MS=4200, POP_FADE=150, POP_MAX=3;
function hidePop(){ const el=$("chatPop"); [...el.children].forEach(c=>clearTimeout(c._t)); el.innerHTML=""; }
function showPop(name,text,side){
  const el=$("chatPop");
  const d=document.createElement("div"); d.className="pop-line";
  const n=document.createElement("span"); n.className="c-nm"+(side?" "+side:""); n.textContent=name+"：";
