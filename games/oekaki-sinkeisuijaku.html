<!--
  おえかき神経衰弱（仮名称・2026-09-24着手）
  ■ ながれ: お題づくり → 描き手の割り振り → お絵かき(全員同時・1枚ずつ制限時間) → 神経衰弱
  ■ オンラインは他のパーティ系と同じ「ホスト権威＋スナップショット」
    ・スナップショットには進行の状態だけを入れる(お題の文字も入っている＝開発者ツールで覗けば見える。牧村了承済みの割り切り)
    ・絵はスナップショットに入れない。描き終わった瞬間に「ペンの軌跡」を1回だけ全員へ配る(event "art"・大きい時は分割)
      取りこぼした人は "artreq" でホストに送り直してもらう(ホストは全員の絵を持っている)
  ■ 描き手の割り振りのきまり(assignDrawers)
    ① 3人以上いれば「お題を出した本人以外」から2人を選ぶ(1人あたりの上限=ceil(2×お題数÷人数)で均等にしながら、ランダムに何回かやり直す)
    ② ①が作れない時(2人プレイなど)は本人も含めて選ぶ
    ③ 同じお題の2枚を同じ人が描くことはない
    ④ それでも枚数がそろわない人には「フェイク」(お題のない自由枠・どのカードともペアにならない)を足して全員の枚数を最大の人にそろえる
    ※「1人◯個」でお題を出すので、ふつうは①の時点で全員ぴったり同じ枚数になり、フェイクは出ない
       (フェイクが出るのは、途中で抜けた人がいる等で数がずれた時)
    ※途中で抜けた人の描き終わっていないカードは取り除く。相方を失ったお題の1枚は、ペアのできないカード(フェイクと同じ扱い)になる
  ■ 試作用の「ひとりでためす」(DEBUG)は本番公開前に外すか牧村さんに確認すること(window.__osDev と同じ位置づけ)
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
  /* ===== 見た目: 白い画用紙に、カラフルなインクでらくがきしたような雰囲気 =====
     ・線はぜんぶ「墨色のインク」、塗りはマーカーの原色
     ・角丸は手描き風のいびつな形(--rough/--rough2)。影は黒インクのずらし(ぼかさない) */
  :root{
    --paper:#fffdf7;
    --ink:#2b2b2b;
    --sub:#6d6a64;
    --red:#ff4d4d; --org:#ff9f1c; --yel:#ffd23f; --grn:#3bb273; --mint:#2ec4b6; --blu:#3a86ff; --pur:#8338ec; --pnk:#ff5fa2;
    --rough:255px 15px 225px 15px/15px 225px 15px 255px;
    --rough2:15px 225px 15px 255px/255px 15px 225px 15px;
    --uiw:min(94vw,500px);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;
     font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif; }
  body{ min-height:100svh; color:var(--ink);
    background-color:var(--paper);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .4  0 0 0 0 .3  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    display:flex; flex-direction:column; align-items:center;
    user-select:none; -webkit-user-select:none; overflow-x:hidden; }
  input{ user-select:text; -webkit-user-select:text; }
  /* 背景のらくがき(JSで散らす) */
  #doodles{ position:fixed; inset:0; z-index:-1; pointer-events:none; }
  #doodles svg{ width:100%; height:100%; display:block; }

  .scene{ display:none; width:100%; flex-direction:column; align-items:center; padding:14px 0 40px; }
  .scene.on{ display:flex; animation:sceneIn .34s cubic-bezier(.2,.8,.3,1); }
  @keyframes sceneIn{ 0%{ opacity:0; transform:translateY(18px); } 100%{ opacity:1; transform:none; } }
  #lobbyScene{ padding-top:64px; }
  #gameScene{ padding-top:150px; padding-bottom:290px; }   /* 上下にスクロール余白(全ゲーム共通ルール) */

  /* ===== タイトル ===== */
  .logo{ margin:9vh 0 2px; display:flex; flex-direction:column; align-items:center; line-height:1.05; }
  .logo .l1{ display:flex; gap:.04em; font-size:clamp(34px,9.6vw,54px); font-weight:900; letter-spacing:.02em; }
  .logo .l1 span{ display:inline-block; -webkit-text-stroke:0; }
  .logo .l1 span:nth-child(1){ color:var(--red); transform:rotate(-8deg) translateY(2px); }
  .logo .l1 span:nth-child(2){ color:var(--org); transform:rotate(6deg) translateY(-3px); }
  .logo .l1 span:nth-child(3){ color:var(--grn); transform:rotate(-4deg) translateY(1px); }
  .logo .l1 span:nth-child(4){ color:var(--blu); transform:rotate(9deg) translateY(-2px); }
  .logo .l2{ position:relative; font-size:clamp(46px,13vw,74px); font-weight:900; letter-spacing:.04em; transform:rotate(-2deg); margin-top:4px; }
  .logo .l2::before{ content:""; position:absolute; left:-4%; right:-4%; bottom:10%; height:38%; z-index:-1;
    background:var(--yel); border-radius:var(--rough); transform:rotate(1.5deg); opacity:.9; }
  .t-sub{ font-size:13px; font-weight:800; letter-spacing:.12em; color:var(--sub); margin:16px 0 26px; }
  .room-row{ display:flex; gap:12px; margin-top:6px; }
  .room-row button{ padding:14px 12px; cursor:pointer; width:min(150px,calc((100vw - 46px)/2)); white-space:nowrap;
    background:#fff; color:var(--ink); border:2.5px solid var(--ink); border-radius:var(--rough); box-shadow:3px 4px 0 var(--ink);
    font-size:16px; font-weight:900; letter-spacing:.06em; }
  .room-row button:nth-child(1){ background:#ffe9ef; transform:rotate(-1.5deg); }
  .room-row button:nth-child(2){ background:#e4f4ff; transform:rotate(1.2deg); }
  .room-row button:active{ box-shadow:1px 1px 0 var(--ink); translate:2px 3px; }
  #roomArea{ display:flex; flex-direction:column; align-items:center; gap:6px; width:var(--uiw); margin-top:14px; }
  .dev-box{ margin-top:34px; width:var(--uiw); max-width:380px; border:2px dashed rgba(43,43,43,.4); border-radius:var(--rough2);
    padding:12px 14px 14px; display:flex; flex-direction:column; align-items:center; gap:9px; background:rgba(255,255,255,.6); }
  .dev-box .dev-h{ font-size:11.5px; font-weight:900; letter-spacing:.14em; color:var(--sub); }

  .sec-label{ font-size:12px; font-weight:900; letter-spacing:.22em; color:var(--sub); margin-bottom:9px; }
  .rule-frame{ width:var(--uiw); background:#fff; border:2.5px solid var(--ink); border-radius:var(--rough2); box-shadow:3px 4px 0 var(--ink);
    padding:14px 12px; display:grid; grid-template-columns:1fr 1fr; gap:12px 10px; }
  .rule-col{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .rc-name{ font-size:12px; font-weight:800; letter-spacing:.06em; color:var(--sub); }
  .rc-row{ display:flex; align-items:center; gap:8px; }
  .rc-val{ min-width:72px; text-align:center; font-size:17px; font-weight:900; color:var(--ink); }
  .stp{ width:34px; height:34px; border:2px solid var(--ink); border-radius:var(--rough); cursor:pointer;
    background:#fff; color:var(--ink); font-size:18px; font-weight:900; line-height:1; }
  .stp:active{ translate:1px 2px; }
  .stp:disabled{ opacity:.3; cursor:default; }
  .rule-reset{ display:block; margin:10px auto 0; border:none; background:none; padding:4px 2px;
    font-size:12.5px; font-weight:800; color:var(--ink); text-decoration:underline wavy rgba(43,43,43,.5); text-underline-offset:4px; cursor:pointer; }
  .rule-sum{ font-size:12.5px; font-weight:700; color:var(--sub); text-align:center; line-height:1.7; }

  .btn-main{ width:var(--uiw); max-width:340px; margin-top:14px; padding:13px; cursor:pointer;
    background:var(--yel); color:var(--ink); border:3px solid var(--ink); border-radius:var(--rough2); box-shadow:4px 5px 0 var(--ink);
    font-size:18px; font-weight:900; letter-spacing:.12em; transform:rotate(-.8deg); }
  .btn-main:active{ box-shadow:1px 1px 0 var(--ink); translate:3px 4px; }
  .btn-main:disabled{ filter:grayscale(1); opacity:.5; cursor:default; }
  .txt-btn{ padding:8px 20px; border:2px solid var(--ink); border-radius:var(--rough); box-shadow:2px 3px 0 var(--ink);
    background:#fff; color:var(--ink); font-size:14px; font-weight:800; letter-spacing:.06em; cursor:pointer; white-space:nowrap; }
  .txt-btn:active{ box-shadow:0 0 0 var(--ink); translate:2px 3px; }
  .txt-btn.sel{ background:var(--yel); }
  .txt-btn.deny{ background:var(--red); color:#fff; }
  .txt-btn:disabled{ opacity:.35; cursor:default; }

  /* ===== ロビー ===== */
  .lobby-title{ font-size:19px; font-weight:900; letter-spacing:.06em; margin-bottom:14px; }
  #lobbyBox{ display:flex; flex-direction:column; align-items:center; gap:13px; width:var(--uiw); }
  .lobby-list{ display:flex; flex-direction:column; gap:8px; width:100%; }
  .lobby-row{ display:flex; align-items:center; gap:10px; background:#fff; border:2px solid var(--ink); border-radius:var(--rough);
    padding:8px 14px; font-size:15px; font-weight:800; }
  .lobby-row:nth-child(even){ border-radius:var(--rough2); }
  .lobby-row .nm{ flex:1; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lobby-row .nm.undef{ opacity:.42; font-weight:700; }
  .p-dot{ width:13px; height:13px; border-radius:50%; flex:none; border:1.5px solid var(--ink); }
  .lobby-row .hostmark{ flex:none; font-size:11px; font-weight:900; color:var(--ink); background:var(--yel); border:1.5px solid var(--ink); border-radius:999px; padding:1px 9px 2px; }
  .lobby-row .you{ flex:none; font-size:11px; font-weight:900; color:#fff; background:var(--ink); border-radius:999px; padding:2px 10px 3px; }
  .lobby-row .kick-btn{ flex:none; font-size:11px; font-weight:900; color:var(--red); background:#fff;
    border:1.5px solid var(--red); border-radius:999px; padding:3px 10px; cursor:pointer; }
  .code-row{ display:flex; align-items:center; gap:8px; }
  .code-input{ width:170px; padding:10px 14px; border:2.5px solid var(--ink); border-radius:var(--rough2);
    background:#fff; color:var(--ink); font-size:19px; font-weight:900; letter-spacing:.24em; text-align:center; }
  .paste-btn{ width:42px; height:42px; border:none; background:none; color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center; }
  .paste-btn svg{ width:22px; height:22px; }
  .code-show{ display:flex; align-items:center; gap:10px; justify-content:center; cursor:pointer; background:#fff;
    border:2.5px solid var(--ink); border-radius:var(--rough); box-shadow:3px 4px 0 var(--ink); padding:9px 22px; font-size:27px; font-weight:900; letter-spacing:.28em; }
  .code-show svg{ width:19px; height:19px; opacity:.7; }
  .room-note{ font-size:12.5px; font-weight:700; letter-spacing:.05em; color:var(--sub); text-align:center; }
  .room-note.err{ color:var(--red); }

  /* ===== ゲーム ===== */
  .top-bar{ width:var(--uiw); display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; margin-bottom:10px; }
  .top-bar>:first-child{ justify-self:start; }
  .top-bar>:last-child{ justify-self:end; }
  .pill{ font-size:12.5px; font-weight:900; letter-spacing:.06em; background:#fff; border:2px solid var(--ink);
    border-radius:var(--rough); padding:4px 12px; white-space:nowrap; transform:rotate(-2deg); }
  .phase-tag{ font-size:16px; font-weight:900; letter-spacing:.06em; white-space:nowrap;
    background:linear-gradient(transparent 55%, rgba(255,210,63,.85) 55%, rgba(255,210,63,.85) 92%, transparent 92%); padding:0 4px; }
  .timer{ font-size:23px; font-weight:900; letter-spacing:.04em; font-variant-numeric:tabular-nums; }
  .timer.warn{ color:var(--red); }
  .roster{ width:var(--uiw); display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin-bottom:12px; }
  .ros{ display:flex; align-items:center; gap:6px; padding:3px 10px 3px 5px; border-radius:var(--rough);
    background:#fff; border:2px solid var(--ink); font-size:12.5px; font-weight:800; max-width:48%; }
  .ros:nth-child(even){ border-radius:var(--rough2); }
  .ros .nm{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ros .av{ width:17px; height:17px; border-radius:50%; flex:none; border:1.5px solid var(--ink); }
  .ros .sc{ font-size:12px; font-weight:900; flex:none; }
  .ros .ok{ font-size:10.5px; font-weight:900; border-radius:999px; padding:0 7px; flex:none; background:var(--grn); color:#fff; }
  .ros.turn{ background:var(--yel); box-shadow:2px 3px 0 var(--ink); transform:rotate(-1.5deg); }
  .ros.gone{ opacity:.35; text-decoration:line-through; }
  .status{ font-size:16px; font-weight:900; letter-spacing:.06em; text-align:center; margin:2px 0 12px; min-height:24px; }
  .status span{ padding:0 6px; background:linear-gradient(transparent 50%, var(--pc,var(--yel)) 50%, var(--pc,var(--yel)) 90%, transparent 90%); }
  .hint{ font-size:13.5px; font-weight:800; letter-spacing:.04em; text-align:center; line-height:1.7; }
  .hint.sub{ font-size:12px; font-weight:700; color:var(--sub); }
  .sub-btns{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .sub-btns .txt-btn{ min-width:120px; }

  /* お題づくり */
  #topicBox{ display:none; width:var(--uiw); flex-direction:column; align-items:center; gap:10px; }
  #topicBox.on{ display:flex; }
  .tp-row{ display:flex; gap:8px; align-items:center; width:100%; max-width:400px; }
  .tp-in{ flex:1; min-width:0; padding:10px 13px; border:2.5px solid var(--ink); border-radius:var(--rough2); font-size:16px; font-weight:800;
    background:#fff; color:var(--ink); }
  .tp-in:focus{ outline:none; box-shadow:3px 4px 0 var(--blu); }
  .tp-in:disabled{ opacity:.55; }
  .tp-row .txt-btn{ padding:8px 13px; font-size:13px; }

  /* お絵かき */
  #drawBox{ display:none; width:var(--uiw); flex-direction:column; align-items:center; gap:10px; }
  #drawBox.on{ display:flex; }
  .dr-topic{ font-size:13px; font-weight:800; color:var(--sub); letter-spacing:.08em; }
  .dr-word{ font-size:clamp(24px,6.8vw,32px); font-weight:900; letter-spacing:.06em; text-align:center; line-height:1.35; padding:0 8px;
    background:linear-gradient(transparent 58%, rgba(255,95,162,.45) 58%, rgba(255,95,162,.45) 92%, transparent 92%); transform:rotate(-1.5deg); }
  .dr-word.free{ font-size:clamp(18px,5vw,23px); background:linear-gradient(transparent 58%, rgba(58,134,255,.35) 58%, rgba(58,134,255,.35) 92%, transparent 92%); }
  .cv-wrap{ width:min(88vw,400px); aspect-ratio:1; background:#fff; border:3px solid var(--ink); border-radius:8px; box-shadow:5px 6px 0 var(--ink);
    overflow:hidden; position:relative; }
  #drawCv{ display:block; width:100%; height:100%; touch-action:none; cursor:crosshair; }
  .tools{ display:flex; flex-direction:column; align-items:center; gap:11px; width:100%; }
  .ink-row{ display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; max-width:380px; }
  .ink-b{ width:30px; height:30px; border-radius:50%; border:2px solid var(--ink); cursor:pointer; padding:0; }
  .ink-b.sel{ box-shadow:0 0 0 3px #fff, 0 0 0 5.5px var(--ink); }
  /* 自由に選べる色(文字化けかくれんぼと同じ input type=color) */
  .ink-free{ position:relative; width:34px; height:34px; border-radius:50%; cursor:pointer; flex:none;
    background:conic-gradient(#ff4d4d,#ff9f1c,#ffd23f,#3bb273,#2ec4b6,#3a86ff,#8338ec,#ff5fa2,#ff4d4d); border:2px solid var(--ink); }
  .ink-free input{ position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; border:none; padding:0; }
  .ink-free i{ position:absolute; inset:7px; border-radius:50%; border:2px solid #fff; pointer-events:none; }
  .ink-free.sel{ box-shadow:0 0 0 3px #fff, 0 0 0 5.5px var(--ink); }
  /* ペンの太さのバー(左=細い・右=太い)。つまみの丸が実際の太さ・色になる */
  .wbar{ display:flex; align-items:center; gap:10px; width:min(88vw,380px); }
  .wb-btn{ width:36px; height:36px; flex:none; border:2px solid var(--ink); border-radius:var(--rough); background:#fff; color:var(--ink);
    font-size:20px; font-weight:900; line-height:1; cursor:pointer; box-shadow:2px 3px 0 var(--ink); }
  .wb-btn:active{ box-shadow:0 0 0; translate:2px 3px; }
  .wtrack{ position:relative; flex:1; height:44px; cursor:pointer; touch-action:none; }
  .wtrack svg{ position:absolute; left:0; right:0; top:50%; width:100%; height:26px; transform:translateY(-50%); overflow:visible; }
  .wthumb{ position:absolute; top:50%; width:var(--d,14px); height:var(--d,14px); border-radius:50%; transform:translate(-50%,-50%);
    background:var(--pc,#2b2b2b); border:2.5px solid var(--ink); box-shadow:0 0 0 3px #fff, 2px 3px 0 3px var(--ink); pointer-events:none;
    transition:width .06s, height .06s; }
  .wval{ min-width:34px; text-align:right; font-size:13px; font-weight:900; font-variant-numeric:tabular-nums; color:var(--sub); }
  .tool-row{ display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .tool-b{ height:38px; padding:0 12px; border:2px solid var(--ink); border-radius:var(--rough); background:#fff; color:var(--ink); cursor:pointer;
    display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:900; white-space:nowrap; box-shadow:2px 3px 0 var(--ink); }
  .tool-b:nth-child(even){ border-radius:var(--rough2); }
  .tool-b svg{ width:18px; height:18px; }
  .tool-b:active{ box-shadow:0 0 0; translate:2px 3px; }
  .tool-b.sel{ background:#dff3ff; }
  .tool-b.deny{ background:var(--red); color:#fff; }
  .dr-wait{ display:none; flex-direction:column; align-items:center; gap:6px; margin:18px 0; }
  #drawBox.waiting .dr-wait{ display:flex; }
  #drawBox.waiting .dr-main{ display:none; }
  .dr-main{ display:flex; flex-direction:column; align-items:center; gap:12px; width:100%; }

  /* 神経衰弱(並べ方はJSで列数を決めてグリッドにする) */
  #matchBox{ display:none; width:100%; flex-direction:column; align-items:center; }
  #matchBox.on{ display:flex; }
  #grid{ display:grid; gap:10px; margin:0 auto; }
  .card{ aspect-ratio:1; perspective:700px; cursor:pointer; position:relative; }
  .card:nth-child(3n){ rotate:1.2deg; } .card:nth-child(3n+1){ rotate:-1deg; } .card:nth-child(5n+2){ rotate:.6deg; }
  .card-in{ position:absolute; inset:0; transition:transform .45s cubic-bezier(.3,.8,.3,1); transform-style:preserve-3d; }
  .card.up .card-in{ transform:rotateY(180deg); }
  .face{ position:absolute; inset:0; border-radius:9px; backface-visibility:hidden; -webkit-backface-visibility:hidden; overflow:hidden;
    border:2.5px solid var(--ink); box-shadow:3px 4px 0 var(--ink); }

  .face.front canvas{ display:block; width:100%; height:100%; }
  .card .cap{ position:absolute; left:0; right:0; bottom:0; padding:1px 4px 2px; font-size:11px; font-weight:900; color:var(--ink);

  .big-msg{ font-size:22px; font-weight:900; letter-spacing:.06em; text-align:center; }

  /* 試作用(DEBUG)パネル */

  .toast{ position:fixed; left:50%; bottom:38px; transform:translateX(-50%); z-index:90;
    background:var(--ink); color:#fff; border-radius:var(--rough);
    padding:10px 20px; font-size:14px; font-weight:800; letter-spacing:.05em;
    opacity:0; pointer-events:none; transition:opacity .2s; white-space:nowrap; max-width:92vw; }
  .toast.on{ opacity:1; }
  #bigFx{ position:fixed; inset:0; z-index:78; display:none; align-items:center; justify-content:center; pointer-events:none; }
  #bigFx.on{ display:flex; animation:bigFx 2.2s ease-out forwards; }
  #bigFx span{ font-size:clamp(26px,8vw,46px); font-weight:900; letter-spacing:.06em; color:var(--ink);
    background:#fff; border:3px solid var(--ink); box-shadow:5px 6px 0 var(--ink); border-radius:var(--rough);
    padding:10px 28px; text-align:center; max-width:92vw; transform:rotate(-3deg); }
  #bigFx span small{ display:block; font-size:.45em; letter-spacing:.12em; color:var(--sub); }
  #bigFx.get span{ background:var(--yel); }
  #bigFx.get span small{ color:var(--ink); }
  @keyframes bigFx{ 0%{opacity:0; transform:scale(1.3) rotate(4deg);} 12%{opacity:1; transform:scale(1);} 80%{opacity:1;} 100%{opacity:0;} }

  .help-btn{ position:fixed; left:12px; top:12px; z-index:40; display:flex; align-items:center; gap:6px;
    padding:5px 13px 5px 6px; border:2px solid var(--ink); border-radius:var(--rough); cursor:pointer;
    background:#fff; color:var(--ink); font-size:13px; font-weight:900; letter-spacing:.06em; box-shadow:2px 3px 0 var(--ink); }
  .help-btn span{ width:20px; height:20px; border-radius:50%; background:var(--yel); color:var(--ink); border:1.5px solid var(--ink);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; }
  .snd-btn{ position:fixed; right:12px; top:12px; z-index:40; display:flex; align-items:center; gap:6px;
    padding:5px 13px; border:2px solid var(--ink); border-radius:var(--rough2); cursor:pointer;
    background:#fff; color:var(--ink); font-size:13px; font-weight:900; letter-spacing:.06em; box-shadow:2px 3px 0 var(--ink); }
  .snd-btn svg{ width:17px; height:17px; }
  .snd-btn .slash{ display:none; }
  .snd-btn.off .wave{ display:none; }
  .snd-btn.off .slash{ display:block; }

  .overlay{ position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center; padding:18px;
    background:rgba(255,253,247,.6); opacity:0; pointer-events:none; transition:opacity .24s; }
  .overlay.on{ opacity:1; pointer-events:auto; }
  .r-card{ width:min(92vw,430px); max-height:82svh; overflow-y:auto; background:#fff; color:var(--ink);
    border:3px solid var(--ink); border-radius:var(--rough2); box-shadow:6px 7px 0 var(--ink); padding:24px 20px 20px; text-align:center;
    transition:opacity .2s, transform .2s; }
  .r-card::-webkit-scrollbar{ width:7px; }
  .r-card::-webkit-scrollbar-track{ background:transparent; }
  .r-card::-webkit-scrollbar-thumb{ background:rgba(43,43,43,.26); border-radius:99px; }
  .r-title{ font-size:24px; font-weight:900; letter-spacing:.1em; margin-bottom:12px; }
  .h-sec{ position:relative; text-align:left; font-size:15px; font-weight:900; letter-spacing:.08em; margin:14px 0 6px; padding-left:12px; }
  .h-sec::before{ content:""; position:absolute; left:0; top:2px; bottom:2px; width:5px; border-radius:3px; background:var(--pnk); }
  .h-sec:nth-of-type(2)::before{ background:var(--blu); } .h-sec:nth-of-type(3)::before{ background:var(--grn); } .h-sec:nth-of-type(4)::before{ background:var(--org); }
  .r-card p{ text-align:left; font-size:14px; font-weight:500; line-height:1.85; }
  .r-card .h-list{ text-align:left; font-size:14px; font-weight:500; line-height:1.85; margin:0 0 4px 18px; }
  .r-card .close{ margin-top:16px; padding:9px 26px; border:2.5px solid var(--ink); border-radius:var(--rough); cursor:pointer; box-shadow:3px 4px 0 var(--ink);
    background:var(--yel); color:var(--ink); font-size:15px; font-weight:900; letter-spacing:.1em; }
  .r-btns{ display:flex; gap:12px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  .r-btns button{ margin-top:0 !important; }
  .r-btns .ghost{ padding:9px 22px; border:2.5px solid var(--ink); border-radius:var(--rough2); background:#fff; color:var(--ink);
    font-size:14px; font-weight:900; cursor:pointer; box-shadow:3px 4px 0 var(--ink); }
  .res-row{ display:flex; align-items:center; gap:9px; padding:7px 10px; border:2px solid var(--ink); border-radius:var(--rough); background:#fff; margin-top:7px; font-size:14px; font-weight:800; text-align:left; }
  .res-row:nth-child(even){ border-radius:var(--rough2); }
  .res-row .rk{ width:22px; text-align:center; font-weight:900; }
  .res-row .nm{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .res-row .pt{ font-size:14px; font-weight:900; }
  .res-row.top{ background:var(--yel); }
  .win-banner{ font-size:27px; font-weight:900; letter-spacing:.06em; margin-bottom:8px; display:inline-block; padding:0 8px; transform:rotate(-2deg);
    background:linear-gradient(transparent 55%, rgba(255,95,162,.45) 55%, rgba(255,95,162,.45) 92%, transparent 92%); }
  /* 結果は枠外タップで一時的に隠して盤面を見る(peek・全作品共通) */
  #resultOv.on.peek{ background:transparent; }
  #resultOv.on.peek .r-card{ opacity:0; transform:scale(.92); pointer-events:none; }

  .home-foot{ margin-top:auto; padding:26px 0 16px; font-size:12px; font-weight:800; letter-spacing:.08em; color:var(--sub); text-decoration:underline wavy rgba(43,43,43,.35); text-underline-offset:4px; }
  #gameScene.on ~ .home-foot{ display:none; }

  /* ===== スタンプ・チャット(全ゲーム共通の作り) ===== */
  .stamp-btn{ width:48px; height:48px; padding:0; border:none; border-radius:50%; cursor:pointer;
    background:rgba(255,255,255,.96); box-shadow:0 3px 0 rgba(10,8,20,.5);
    display:flex; align-items:center; justify-content:center; font-size:27px; line-height:1; }
  .stamp-btn:active{ transform:translateY(1px) scale(.93); }
  .stamp-mute{ width:34px; height:34px; padding:0; border:none; border-radius:50%; cursor:pointer;
    position:absolute; left:100%; top:7px; margin-left:9px; background:rgba(255,255,255,.96);
    box-shadow:0 3px 0 rgba(10,8,20,.5); display:flex; align-items:center; justify-content:center; color:#555; }
  .stamp-mute svg{ width:19px; height:19px; transform:translateY(1px); }
  .stamp-mute .mute-slash{ display:none; }
  .stamp-mute.muted{ color:var(--red); }
  .stamp-mute.muted .mute-slash{ display:block; }
  .stamp-mute:active{ transform:translateY(1px) scale(.93); }
  #stampBar{ position:relative; display:flex; gap:7px; }
  #chatBox.mini #stampBar{ display:none; }
  #stampBar .stamp-btn{ width:34px; height:34px; font-size:19px; }
  #stampBar .stamp-mute{ width:26px; height:26px; top:4px; }
  #chatBox{ position:fixed; left:10px; bottom:10px; z-index:75; display:none;
    flex-direction:column; align-items:flex-start; gap:7px; width:min(84vw,300px); text-align:left; }
  #chatBox.on{ display:flex; }
  #chatBox.mini .chat-log, #chatBox.mini .chat-row{ display:none; }
  .chat-tog{ align-self:flex-start; display:inline-flex; align-items:center; gap:5px; cursor:pointer;
    padding:5px 10px 5px 12px; border:none; border-radius:999px; box-shadow:none; font-family:inherit;
    background:rgba(35,33,31,.46); color:#fff; font-size:11px; font-weight:900; letter-spacing:.02em; white-space:nowrap; }
  #chatBox:not(.mini) .chat-tog{ position:absolute; right:0; top:8px; align-self:auto; }
  .chat-tog svg{ width:14px; height:14px; flex:none; }
  .chat-tog:active{ transform:translateY(1px); }
  .chat-pop{ display:flex; flex-direction:column; align-items:flex-start; gap:5px; width:100%; }
  .chat-pop:empty{ display:none; }
  .pop-line{ max-width:100%; background:rgba(255,255,255,.96); border-radius:8px; color:#23211f;
    padding:8px 11px; box-shadow:0 2px 9px rgba(35,33,31,.3); font-size:12px; line-height:1.55;
    word-break:break-word; animation:popIn .18s cubic-bezier(.2,1.2,.4,1); }
  .pop-line.out{ opacity:0; transition:opacity .14s linear; }
  @keyframes popIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
  .chat-log{ display:flex; flex-direction:column; width:100%; max-height:126px; overflow-y:auto; overscroll-behavior:contain;
    background:rgba(255,255,255,.96); border-radius:8px; padding:9px 7px 9px 12px; border:none; color:#23211f;
    box-shadow:0 2px 7px rgba(35,33,31,.26); font-size:12px; line-height:1.6; }
  .chat-log:empty{ display:none; }
  .chat-log::-webkit-scrollbar{ width:9px; }
  .chat-log::-webkit-scrollbar-track{ background:transparent; }
  .chat-log::-webkit-scrollbar-thumb{ background:rgba(35,33,31,.22); border-radius:99px; border:3px solid transparent; background-clip:padding-box; }
  .chat-row{ display:flex; width:100%; gap:6px; }
  .c-line{ word-break:break-word; }
  .c-line.c-sys{ opacity:.55; font-size:11.5px; text-align:center; }
  .c-line.c-res{ align-self:stretch; box-sizing:border-box; opacity:.72; margin:5px 6px 3px; padding:4px 8px 5px;
    border:1.1px solid rgba(35,33,31,.17); border-radius:5px; font-size:11.5px; font-weight:700; letter-spacing:.06em; color:rgba(35,33,31,.8); }
  .c-nm{ font-weight:900; margin-right:5px; color:rgba(35,33,31,.9); }
  .chat-in{ flex:1; min-width:0; border:none; border-radius:8px; padding:9px 12px; font-family:inherit;
    font-size:13px; font-weight:700; background:rgba(255,255,255,.96); color:#23211f; box-shadow:0 2px 7px rgba(35,33,31,.26); }
  .chat-in::placeholder{ color:rgba(35,33,31,.45); font-weight:700; }
  .chat-in:focus{ outline:none; box-shadow:0 2px 7px rgba(35,33,31,.26), inset 0 0 0 1.6px rgba(35,33,31,.3); }
  .chat-send{ flex:none; padding:9px 14px; border:none; border-radius:8px; cursor:pointer; font-family:inherit;
    background:rgba(255,255,255,.96); color:#23211f; font-size:12.5px; font-weight:900; white-space:nowrap; box-shadow:0 2px 7px rgba(35,33,31,.26); }
  .chat-send:active{ transform:translateY(1px) scale(.96); }
  .stamp-fly{ position:fixed; bottom:-30px; width:96px; z-index:53; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    filter:drop-shadow(0 5px 9px rgba(0,0,0,.25)); animation:stampFloat 2.2s cubic-bezier(.2,.75,.35,1) forwards; }
  .stamp-fly .s-emoji{ font-size:80px; line-height:1; }
  .stamp-fly .s-name{ margin-top:2px; font-size:15px; font-weight:900; color:var(--ink); white-space:nowrap; letter-spacing:.04em; }   /* 白い画用紙の上なので名前は墨色 */
  .stamp-fly.over-dialog{ z-index:82; }
  @keyframes stampFloat{
    0%{ transform:translate(0,96px) scale(.5); opacity:0; }
    17%{ transform:translate(0,0) scale(1.06); opacity:1; }
    70%{ opacity:1; }
    100%{ transform:translate(var(--dx,0),var(--rise,-40vh)) scale(1.02); opacity:0; }
  }
  /* ===== ★試作用: シーン一覧のパネル(ゲームの見た目とは無関係の道具なので、どの作品でも同じ白いパネル) ===== */

</style>

<div id="doodles"></div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const TAPW=(window.matchMedia&&matchMedia("(pointer:coarse)").matches)?"タップ":"クリック";
window.__TAPW=TAPW;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ================= 効果音(全合成) ================= */
let actx=null, seBus=null, noiseBuf=null;
let seOn=true; try{ seOn=localStorage.getItem("os.se")!=="0"; }catch(e){}
function ensureAudio(){
  if(!actx){
    try{
      actx=new (window.AudioContext||window.webkitAudioContext)();
      seBus=actx.createGain(); seBus.gain.value=seOn?1:0; seBus.connect(actx.destination);
      const len=actx.sampleRate; noiseBuf=actx.createBuffer(1,len,actx.sampleRate);
      const d=noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    }catch(e){}
  }
  if(actx&&actx.state!=="running"){ try{ actx.resume(); }catch(e){} }
}
/* スマホで音の箱が勝手に止まっても、触った時・戻ってきた時に起こし直す(全ゲーム共通の対策) */
function audioWake(){ try{ ensureAudio(); }catch(e){} }
["pointerdown","touchend","keydown"].forEach(function(t){ document.addEventListener(t,audioWake,{capture:true,passive:true}); });
document.addEventListener("visibilitychange",function(){ if(!document.hidden) audioWake(); });
window.addEventListener("pageshow",audioWake);
window.addEventListener("focus",audioWake);
function note(f,t,dur,vol,type,f2){
  if(!actx||document.hidden) return;              // 画面が裏にある間(別のタブ・アプリを見ている間)は鳴らさない
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.006); g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(g); g.connect(seBus); o.start(t); o.stop(t+dur+0.02);
}
function noiseHit(t,f1,f2,q,vol,dur){
  if(!actx||document.hidden) return;
  const n=actx.createBufferSource(); n.buffer=noiseBuf;
  const b=actx.createBiquadFilter(); b.type="bandpass"; b.frequency.setValueAtTime(f1,t);
  b.frequency.exponentialRampToValueAtTime(f2,t+dur*0.9); b.Q.value=q;
  const g=actx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.002);
  g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  n.connect(b); b.connect(g); g.connect(seBus); n.start(t); n.stop(t+dur+0.02);
}
const T0=()=>actx?actx.currentTime:0;
function playSelect(){ if(!actx) return; note(880,T0(),0.07,0.14,"triangle"); }
function playTick(){ if(!actx) return; note(1320,T0(),0.04,0.07,"triangle"); }
function playStep(){ if(!actx) return; const t=T0(); [523,659,784].forEach((f,i)=>note(f,t+i*0.1,0.3,0.12,"triangle")); }
function playFlip(){ if(!actx) return; noiseHit(T0(),1800,3600,1.2,0.16,0.12); note(700,T0(),0.05,0.05,"triangle"); }
function playGet(){ if(!actx) return; const t=T0(); [784,988,1175,1568].forEach((f,i)=>note(f,t+i*0.07,0.3,0.12,"triangle")); note(392,t,0.5,0.1,"sine"); }
function playMiss(){ if(!actx) return; const t=T0(); note(330,t,0.14,0.1,"triangle"); note(262,t+0.12,0.22,0.09,"triangle"); }
function playTurn(){ if(!actx) return; const t=T0(); note(988,t,0.09,0.09,"sine"); note(1319,t+0.08,0.14,0.08,"sine"); }
function playDone(){ if(!actx) return; const t=T0(); note(660,t,0.08,0.1,"triangle"); note(990,t+0.07,0.12,0.09,"triangle"); }
function playWarn(){ if(!actx) return; note(880,T0(),0.06,0.09,"square"); }
function playWin(){ if(!actx) return; const t=T0();
  [523,659,784,1047].forEach((f,i)=>note(f,t+i*0.09,0.22,0.14,"triangle"));
  [523,659,784,1047].forEach(f=>note(f,t+0.42,0.9,0.09,"triangle")); note(262,t+0.42,0.9,0.1,"sine"); }
function playLose(){ if(!actx) return; const t=T0(); [523,466,392,311].forEach((f,i)=>note(f,t+i*0.16,0.3,0.12,"triangle")); }
function renderSnd(){ $("seBtn").classList.toggle("off", !seOn); }
$("seBtn").addEventListener("click",()=>{
  ensureAudio(); seOn=!seOn; try{ localStorage.setItem("os.se", seOn?"1":"0"); }catch(e){}
  if(seBus&&actx) seBus.gain.setTargetAtTime(seOn?1:0, actx.currentTime, 0.02);
  renderSnd(); if(seOn) playSelect();
});

/* ================= ルールと定数 ================= */
const MIN_P=2, MAX_P=12;
const MAX_PAIRS=24;                                   // お題(=ペア)の上限。カードは最大48枚+フェイク
const PCOL=["#ff6b6b","#4dabf7","#69db7c","#ffd43b","#da77f2","#ff922b","#38d9a9","#f783ac","#a9e34b","#74c0fc","#e599f7","#ffa94d"];
const K_OPTS=[1,2,3,4,5,6];                           // 1人が考えるお題の数
const DRAW_OPTS=[30,45,60,75,90,120,150,180];         // 1枚の制限時間(秒)
const TOPIC_OPTS=[30,45,60,90,120,180];               // お題を考える時間(秒)
const TURN_OPTS=[10,15,20,30,45,60];                  // 神経衰弱の1手の制限時間(秒)
const DEF_RULES={ k:1, draw:75, topic:60, turn:20 };
let rules=Object.assign({},DEF_RULES);
const REVEAL_MS=1500;                                 // 2枚めくったあと、見せておく時間
const TOPIC_MAX=20;                                   // お題の文字数の上限
/* おまかせのお題(読める漢字・描けるもの) */
const OMAKASE=["猫","犬","うさぎ","パンダ","キリン","ぞう","ペンギン","くじら","たこ","かに","恐竜","ドラゴン","宇宙人","忍者","ロボット","おばけ",
  "りんご","バナナ","すいか","ぶどう","いちご","おにぎり","ラーメン","すし","ケーキ","アイス","ハンバーガー","目玉焼き","たまご","ドーナツ",
  "家","お城","東京タワー","富士山","火山","海","島","虹","雪だるま","花火","温泉","ピラミッド","観覧車","信号機","電車","車","自転車","飛行機","ロケット","船",
  "傘","時計","めがね","帽子","くつ","かさ","はさみ","えんぴつ","ギター","ピアノ","太鼓","電話","テレビ","冷蔵庫","掃除機","カメラ","王冠","宝箱","鍵",
  "サッカー","野球","水泳","つり","キャンプ","誕生日","結婚式","サンタクロース","鬼","桜","ひまわり","きのこ","サボテン","月","太陽","星","雲","雷","台風"];
const fmtT=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function clampTopic(s){ return [...String(s||"").replace(/\s+/g," ").trim()].slice(0,TOPIC_MAX).join(""); }

/* ================= 状態 =================
   G=ゲームの全状態(絵そのものは入れない)。ホスト(と試作モード)が正で、ゲストはスナップショットで同じものを持つ */
let G=null;
let phaseUI="title";            // title / lobby / game
let online=false, isHost=false, hostId=null, ch=null, code="";
let debug=false, dbgActor=null, dbgShow=false;   // ★試作用
let myId=Math.random().toString(36).slice(2,10);  // 端末ごとの乱数(固定値にしない=クッKeyの事故の教訓)
let myName=""; try{ myName=(localStorage.getItem("os.name")||"").slice(0,16); }catch(e){}
let lobby=[];                   // ロビーのメンバー [{id,n,c,t}]
let localEnd=0;                 // いまのステップの締め切り(自分の端末の時計で)
let pending=null, pendingSent=0; // ゲストの未確認の入力(スナップに載るまで送り直す)
let arts={};                    // cid → 絵のデータ(文字列。""=白紙)
let artParts={};                // cid → 分割で届いている途中の絵 {n, parts:[]}
let artOut={};                  // ゲスト: 送った絵 cid → {d, at}(ホストが受け取ったと分かるまで送り直す)
let artReqAt=0, artServeAt={};  // 絵の取り寄せの間隔
let drafts={};                  // cid → 描きかけのストローク
let drawStart={};               // cid → 描き始めた時刻(自分の端末の時計)
let localDone={};               // cid → 自分が完成を押した
let localFlip=null;             // ゲスト: めくった(返事待ち)カード
let seen={ gid:"", sk:-1, phase:"", getN:0, missN:0, turn:"", over:false };

function VID(){ if(debug){ if(G&&G.phase==="match") return G.turn; return dbgActor; } return myId; }
function me(){ return G && G.players.find(p=>p.id===VID()); }
function pById(id){ return G && G.players.find(p=>p.id===id); }
function activePs(){ return G.players.filter(p=>!p.gone); }
function cById(id){ return G && G.cards.find(c=>c.id===id); }

/* ================= ホスト側の進行 ================= */
function newGame(members){
  const n=members.length, k=Math.max(1,Math.min(rules.k, Math.floor(MAX_PAIRS/Math.max(1,n))));
  G={ gid:Math.random().toString(36).slice(2,8), rules:Object.assign({},rules,{k}),
      players:members.map((m,i)=>({ id:m.id, n:m.n||("P"+(i+1)), c:m.c||PCOL[i%PCOL.length], score:0, gone:false })),
      phase:"topic", sk:0, stepEnd:0, topics:{}, tp:[], cards:[], board:[], pairTotal:0, taken:{},
      turn:"", flip:[], resAt:0, getN:0, missN:0, last:null, drawEnd:0 };
  startStep("topic");
}
function stepMs(){ if(debug) return 0; if(G.phase==="topic") return G.rules.topic*1000; if(G.phase==="match") return G.rules.turn*1000; return 0; }
function startStep(ph){ G.phase=ph; G.sk++; const ms=stepMs(); G.stepEnd=ms? Date.now()+ms : 0; bump(); }
function hostTick(){
  if(gallery) return;                          // ★シーン一覧の間は進行を止める
  if(!G || !(isHost||debug) || G.phase==="over") return;
  const now=Date.now();
  if(G.phase==="topic" && G.stepEnd && now>=G.stepEnd) finishTopics();
  else if(G.phase==="draw" && G.drawEnd && now>=G.drawEnd) forceDrawEnd();
  else if(G.phase==="match"){
    if(G.resAt && now>=G.resAt) resolveFlip();
    else if(!G.resAt && G.stepEnd && now>=G.stepEnd) turnTimeout();
  }
}

/* --- お題づくり --- */
function allTopicsIn(){ return activePs().every(p=>G.topics[p.id]); }
function randomTopics(n,avoid){
  const used=new Set(avoid), pool=shuffle(OMAKASE.filter(t=>!used.has(t))), out=[];
  for(let i=0;i<n;i++) out.push(pool[i]||("お題"+(i+1)));
  return out;
}
function finishTopics(){                     // 締め切り or 全員そろった: 足りない分はおまかせで埋めて割り振りへ
  const k=G.rules.k, all=[];
  activePs().forEach(p=>{
    let l=(G.topics[p.id]||[]).map(clampTopic).filter(Boolean).slice(0,k);
    if(l.length<k) l=l.concat(randomTopics(k-l.length, all.concat(l)));
    G.topics[p.id]=l; l.forEach(t=>all.push(t));
  });
  G.tp=[]; activePs().forEach(p=>G.topics[p.id].forEach(t=>G.tp.push({ t, by:p.id })));
  buildCards();
  startDraw();
}
/* --- 描き手の割り振り(きまりはファイル冒頭のコメント) ---
   tps=[{t,by}]・ids=描ける人のid。戻り値={ res:[[a,b],…](お題ごとの2人), load:{id:枚数} } */
function assignDrawers(tps,ids){
  const n=ids.length, m=tps.length, res=new Array(m), load={};
  const tryOnce=(excludeAuthor,cap)=>{
    ids.forEach(i=>load[i]=0);
    for(const ti of shuffle(tps.map((_,i)=>i))){
      const cand=shuffle(ids.filter(i=>(!excludeAuthor||i!==tps[ti].by) && load[i]<cap)).sort((a,b)=>load[a]-load[b]);   // 少ない人から(同数はランダム)
      if(cand.length<2) return false;
      res[ti]=[cand[0],cand[1]]; load[cand[0]]++; load[cand[1]]++;
    }
    return true;
  };
  const cap=Math.ceil(2*m/Math.max(1,n));
  if(n>=3){ for(let t=0;t<400;t++) if(tryOnce(true,cap)) return { res, load:Object.assign({},load) }; }   // ① 本人以外から・均等に
  for(let t=0;t<400;t++) if(tryOnce(false,cap)) return { res, load:Object.assign({},load) };            // ② 本人も含めてよい
  for(let t=0;t<400;t++) if(tryOnce(false,m)) return { res, load:Object.assign({},load) };              // (保険) 上限なし
  return null;
}
function buildCards(){
  const ids=activePs().map(p=>p.id), a=assignDrawers(G.tp, ids);
  const cards=[]; let k=0;
  const mk=(tp,dr)=>{ cards.push({ id:G.gid+"-"+(k++), tp, dr, q:0, done:false, gone:false }); };
  if(a){ G.tp.forEach((t,i)=>{ mk(i,a.res[i][0]); mk(i,a.res[i][1]); }); }
  /* ④ 枚数がいちばん多い人にそろうまで、足りない人にフェイク(お題なし・どれともペアにならない)を足す */
  const load={}; ids.forEach(i=>load[i]=0); cards.forEach(c=>load[c.dr]++);
  const mx=Math.max(0,...ids.map(i=>load[i]));
  ids.forEach(i=>{ for(let j=load[i];j<mx;j++) mk(-1,i); });
  /* 1人ぶんの描く順番はシャッフル(フェイクもまぜる) */
  ids.forEach(i=>{ shuffle(cards.filter(c=>c.dr===i)).forEach((c,qi)=>c.q=qi); });
  G.cards=cards;
}
/* --- お絵かき --- */
function myCards(id){ return G.cards.filter(c=>c.dr===id && !c.gone).sort((a,b)=>a.q-b.q); }
function startDraw(){
  G.phase="draw"; G.sk++; G.stepEnd=0;
  const mx=Math.max(1,...activePs().map(p=>myCards(p.id).length));
  G.drawEnd= debug? 0 : Date.now()+(mx*G.rules.draw+25)*1000;   // ホスト側の最後の保険(全員の手元の時計がずれても必ず終わる)
  bump();
}
function hostCardDone(cid){
  const c=cById(cid); if(!c||c.done) return;
  c.done=true; if(!(cid in arts)) arts[cid]="";
  if(G.phase==="draw" && G.cards.every(x=>x.done||x.gone)) startMatch(); else bump();
}
function forceDrawEnd(){                      // 保険の締め切り: 届いていない絵は白紙にする
  G.cards.forEach(c=>{ if(!c.done&&!c.gone){ c.done=true; if(!(c.id in arts)) arts[c.id]=""; } });
  startMatch();
}
/* --- 神経衰弱 --- */
function startMatch(){
  const live=G.cards.filter(c=>!c.gone);
  G.board=shuffle(live.map(c=>c.id));
  /* ペアは「お題の文字が同じ2枚」(別の人がたまたま同じお題を出したら、その4枚はどの2枚でもペア=2組ぶん)。
     余った1枚(相方を失った・同じお題が奇数枚)はフェイクと同じく、ペアにならないまま残る */
  const cnt={}; live.forEach(c=>{ const k=cardKey(c); if(k) cnt[k]=(cnt[k]||0)+1; });
  G.pairTotal=Object.values(cnt).reduce((s2,v)=>s2+Math.floor(v/2),0);
  G.taken={}; G.flip=[]; G.resAt=0; G.drawEnd=0;
  const ap=activePs(); G.turn= ap.length? pick(ap).id : "";      // 最初の手番はランダム
  G.phase="match";
  if(!G.pairTotal){ finishGame(); return; }
  startStep("match");
}
function normTopic(t){ return String(t||"").normalize("NFKC").replace(/\s+/g,"").toLowerCase()   // 全角半角・大文字小文字・空白の違いは同じとみなす
  .replace(/[\u30a1-\u30f6]/g,ch2=>String.fromCharCode(ch2.charCodeAt(0)-0x60)); }                      // カタカナもひらがなと同じとみなす(リンゴ=りんご)
function cardKey(c){ return (c && c.tp>=0 && G.tp[c.tp])? normTopic(G.tp[c.tp].t) : ""; }   // フェイクは""=どれともペアにならない
function isPair(a,b){ const ka=cardKey(cById(a)); return !!ka && a!==b && ka===cardKey(cById(b)); }
function takenPairs(){ return Math.floor(Object.keys(G.taken).length/2); }
function resolveFlip(){
  const [a,b]=G.flip; G.resAt=0;
  if(a && b && isPair(a,b)){
    const tp=cById(a).tp;
    G.taken[a]=G.turn; G.taken[b]=G.turn; const p=pById(G.turn); if(p) p.score++;
    G.getN++; G.last={ tp, by:G.turn, a, b }; G.flip=[];
    if(takenPairs()>=G.pairTotal){ finishGame(); return; }
    startStep("match");                        // そろえた人がもう一度
  }else{
    G.missN++; G.flip=[]; nextTurn();
  }
}
function nextTurn(){
  const ap=G.players.filter(p=>!p.gone); if(!ap.length){ finishGame(); return; }
  const i=G.players.findIndex(p=>p.id===G.turn);
  for(let s=1;s<=G.players.length;s++){ const q=G.players[(i+s)%G.players.length]; if(!q.gone){ G.turn=q.id; break; } }
  startStep("match");
}
function turnTimeout(){ G.flip=[]; G.resAt=0; G.missN++; nextTurn(); }
function finishGame(){ G.phase="over"; G.sk++; G.stepEnd=0; G.resAt=0; G.flip=[]; bump(); }

function hostAct(a){
  if(!G) return;
  const p=pById(a.from); if(!p||p.gone) return;
  if(a.t==="topics" && G.phase==="topic"){
    const l=(Array.isArray(a.l)?a.l:[]).map(clampTopic).slice(0,G.rules.k);
    if(l.length<G.rules.k || l.some(x=>!x)) return;
    G.topics[p.id]=l; if(allTopicsIn()) finishTopics(); else bump(); return;
  }
  if(a.t==="untopics" && G.phase==="topic"){ delete G.topics[p.id]; bump(); return; }   // 書き直す
  if(a.t==="flip" && G.phase==="match"){
    if(a.sk!==G.sk || p.id!==G.turn || G.resAt || G.flip.length>=2) return;
    if(!G.board.includes(a.cid) || G.taken[a.cid] || G.flip.includes(a.cid)) return;
    G.flip.push(a.cid);
    if(G.flip.length===2) G.resAt=Date.now()+REVEAL_MS;
    bump(); return;
  }
}
function bump(){ sendSnap(); render(); }

/* ================= 絵のデータ(ペンの軌跡) =================
   座標は0〜255に丸める。先頭1バイト=形式(2)。1本=[消しゴム?, R, G, B, 太さ×10, 点の数(2バイト), x,y,x,y…] をbase64に */
const ART_N=256, MAX_PTS=30000;
const INK=["#2b2b2b","#ff4d4d","#ff9f1c","#ffd23f","#3bb273","#2ec4b6","#3a86ff","#8338ec","#ff5fa2","#8b5a2b"];   // 規定の色(黒・赤・橙・黄・緑・水・青・紫・桃・茶)
const W_MIN=1, W_MAX=24, W_STEP=0.5, W_DEF=5;       // ペンの太さ(256マス基準)。消しゴムはこの2.2倍
const hex2=v=>("0"+Math.max(0,Math.min(255,v|0)).toString(16)).slice(-2);
function encodeArt(st){
  let n=1; st.forEach(s2=>n+=7+s2.p.length); const b=new Uint8Array(n); let o=0; b[o++]=2;
  st.forEach(s2=>{ const np=s2.p.length/2, c=s2.col||"#2b2b2b";
    b[o++]=s2.e?1:0; b[o++]=parseInt(c.slice(1,3),16)||0; b[o++]=parseInt(c.slice(3,5),16)||0; b[o++]=parseInt(c.slice(5,7),16)||0;
    b[o++]=Math.max(1,Math.min(250,Math.round((s2.w||W_DEF)*10))); b[o++]=np>>8; b[o++]=np&255; for(const v of s2.p) b[o++]=v; });
  let str=""; for(let i=0;i<b.length;i+=8192) str+=String.fromCharCode.apply(null,b.subarray(i,i+8192));
  return btoa(str);
}
function decodeArt(d){
  if(!d) return []; let bin=""; try{ bin=atob(d); }catch(e){ return []; }
  if(bin.charCodeAt(0)!==2) return [];
  const out=[]; let o=1, B=i=>bin.charCodeAt(i);
  while(o+7<=bin.length){ const e=B(o)===1, col="#"+hex2(B(o+1))+hex2(B(o+2))+hex2(B(o+3)), w=B(o+4)/10, np=(B(o+5)<<8)|B(o+6); o+=7;
    const pp=[]; for(let i=0;i<np*2 && o<bin.length;i++) pp.push(B(o++)); out.push({ e, col, w, p:pp }); }
  return out;
}
function paintStroke(ctx,s2,sc){
  const pp=s2.p; if(pp.length<2) return;
  ctx.strokeStyle= s2.e? "#fff" : (s2.col||"#2b2b2b"); ctx.lineWidth=(s2.w||W_DEF)*(s2.e?2.2:1)*sc; ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.beginPath(); ctx.moveTo((pp[0]+.5)*sc,(pp[1]+.5)*sc);
  if(pp.length===2) ctx.lineTo((pp[0]+.5)*sc+0.01,(pp[1]+.5)*sc);
  for(let i=2;i<pp.length;i+=2) ctx.lineTo((pp[i]+.5)*sc,(pp[i+1]+.5)*sc);
  ctx.stroke();
}
function paintArt(cv2,st){
  const ctx=cv2.getContext("2d"), sz=cv2.width; ctx.fillStyle="#fff"; ctx.fillRect(0,0,sz,sz);
  const sc=sz/ART_N; st.forEach(x=>paintStroke(ctx,x,sc));
}
/* ★試作用: 自動のお絵かき。同じお題なら似た絵になる(1人で神経衰弱まで確かめるため) */
function autoArt(seedStr){
  let h=2166136261; for(const ch2 of String(seedStr)) h=Math.imul(h^ch2.charCodeAt(0),16777619)>>>0;
  const rnd=()=>{ h^=h<<13; h>>>=0; h^=h>>>17; h^=h<<5; h>>>=0; return (h>>>0)/4294967296; };
  const jit=()=>(Math.random()-.5)*14, st=[], col=INK[1+Math.floor(rnd()*8)], shapes=2+Math.floor(rnd()*3);
  for(let k=0;k<shapes;k++){
    const cx=40+rnd()*176, cy=40+rnd()*176, r=18+rnd()*46, kind=Math.floor(rnd()*3), pp=[];
    const cl=v=>Math.max(0,Math.min(255,Math.round(v)));
    if(kind===0){ for(let a2=0;a2<=24;a2++){ const t=a2/24*Math.PI*2; pp.push(cl(cx+jit()*.3+Math.cos(t)*r), cl(cy+jit()*.3+Math.sin(t)*r)); } }
    else if(kind===1){ const n=3+Math.floor(rnd()*3); for(let a2=0;a2<=n;a2++){ const t=a2/n*Math.PI*2+rnd(); pp.push(cl(cx+Math.cos(t)*r+jit()), cl(cy+Math.sin(t)*r+jit())); } }
    else { for(let a2=0;a2<6;a2++){ pp.push(cl(cx-r+a2*r/2.5+jit()), cl(cy+(a2%2?r*.6:-r*.6)+jit())); } }
    st.push({ e:false, col:k===0?col:INK[Math.floor(rnd()*INK.length)], w:3+rnd()*6, p:pp });
  }
  return st;
}

/* --- 絵の配り方(分割して送る・取りこぼしは取り寄せ) --- */
const CHUNK=60000;
function sendArt(cid,d){
  if(!ch) return; const n=Math.max(1,Math.ceil(d.length/CHUNK));
  for(let i=0;i<n;i++){ try{ ch.send({type:"broadcast",event:"art",payload:{ cid, i, n, d:d.slice(i*CHUNK,(i+1)*CHUNK) }}); }catch(e){} }
}
function gotArt(cid,d){
  arts[cid]=d; paintCard(cid);
  if((isHost||debug) && G && G.phase==="draw") hostCardDone(cid);
}
function onArtChunk(pl){
  if(!pl||!pl.cid) return; if(pl.cid in arts) return;
  const a=artParts[pl.cid]=artParts[pl.cid]||{ n:pl.n, parts:[] };
  a.parts[pl.i]=pl.d||"";
  let ok=true; for(let i=0;i<a.n;i++) if(a.parts[i]===undefined){ ok=false; break; }
  if(ok){ delete artParts[pl.cid]; gotArt(pl.cid, a.parts.join("")); }
}

/* ================= 入力(自分 or 試作モードの操作中の人) ================= */
function submit(o){
  if(!G) return;
  o.sk=G.sk; o.from=VID();
  if(isHost||debug){ hostAct(o); if(debug) dbgNext(); return; }
  pending=o; pendingSent=Date.now(); sendAct(o); render();
}
function sendAct(o){ if(ch){ try{ ch.send({type:"broadcast",event:"act",payload:o}); }catch(e){} } }
function pendingIn(){                          // ゲストの入力がスナップに反映されたか
  if(!pending||!G) return true;
  if(pending.t==="topics") return !!G.topics[pending.from] || G.phase!=="topic";
  if(pending.t==="untopics") return !G.topics[pending.from] || G.phase!=="topic";
  if(pending.t==="flip") return G.sk!==pending.sk || G.flip.includes(pending.cid) || !!G.taken[pending.cid];
  return true;
}
function dbgNext(){                            // 試作モード: まだ入力していない次の人を操作
  if(!G) return;
  const ps=activePs(), i=Math.max(0,ps.findIndex(p=>p.id===dbgActor));
  for(let s=1;s<=ps.length;s++){ const p=ps[(i+s)%ps.length];
    const need = G.phase==="topic"? !G.topics[p.id] : G.phase==="draw"? myCards(p.id).some(c=>!c.done) : false;
    if(need){ if(p.id!==dbgActor){ dbgActor=p.id; render(); } return; } }
}

function curDrawCard(){ const id=VID(); if(!id||G.phase!=="draw") return null; return myCards(id).find(c=>!c.done && !localDone[c.id])||null; }
function drawLeftMs(c){ if(!c||debug) return 0; const st=drawStart[c.id]||Date.now(); return Math.max(0, st+G.rules.draw*1000-Date.now()); }

function wireTopicInput(inp){
  let comp=false;
  const clip=()=>{ const a=[...inp.value]; if(a.length>TOPIC_MAX) inp.value=a.slice(0,TOPIC_MAX).join(""); };
  inp.addEventListener("compositionstart",()=>{ comp=true; });
  inp.addEventListener("compositionend",()=>{ comp=false; clip(); });
  inp.addEventListener("input",()=>{ if(!comp) clip(); });
  inp.addEventListener("keydown",e=>{ if(e.key!=="Enter"||e.isComposing||e.keyCode===229) return; e.preventDefault(); $("tpGo").click(); });
}
$("tpGo").onclick=()=>{
  ensureAudio(); if(!G||G.phase!=="topic") return;
  const id=VID(); const sent = (!!G.topics[id] && !(pending&&pending.t==="untopics")) || (pending&&pending.t==="topics"&&pending.from===id);
  if(sent){                                  // 書き直す: ホストの記録を消して入力欄を開く
    playTick();
    if(isHost||debug){ delete G.topics[id]; bump(); } else { submit({ t:"untopics" }); }
    return;
  }
  const l=[...$("tpRows").querySelectorAll(".tp-in")].map(x=>clampTopic(x.value));
  if(l.some(x=>!x)){ toast("お題を入れてね（おまかせもある）"); return; }
  if(new Set(l).size<l.length){ toast("同じお題が入っている"); return; }
  playSelect(); submit({ t:"topics", l });
};

/* --- お絵かき(キャンバスは作り直さない) --- */
const cv=$("drawCv"), cctx=cv.getContext("2d");
let penCol=INK[0], penW=W_DEF, erasing=false, freeCol="#ff5fa2", curCid=null, stroke=null, clearArm=0;
function sizeCv(){ const s2=Math.round(cv.clientWidth*(window.devicePixelRatio||1)); if(s2>0 && cv.width!==s2){ cv.width=cv.height=s2; redrawCv(); } updateThumb(); }
function redrawCv(){ paintArt(cv, (curCid&&drafts[curCid])||[]); }
function cvPt(e){ const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*ART_N, y=(e.clientY-r.top)/r.height*ART_N;
  return { x:Math.max(0,Math.min(255,Math.round(x-.5))), y:Math.max(0,Math.min(255,Math.round(y-.5))) }; }
function ptCount(cid){ let n=0; (drafts[cid]||[]).forEach(s2=>n+=s2.p.length/2); return n; }
cv.addEventListener("pointerdown",e=>{
  if(!curCid) return; e.preventDefault();
  if(ptCount(curCid)>=MAX_PTS){ toast("これ以上は描けない"); return; }
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  const q=cvPt(e); stroke={ e:erasing, col:penCol, w:penW, p:[q.x,q.y] };
  (drafts[curCid]=drafts[curCid]||[]).push(stroke);
  paintStroke(cctx, stroke, cv.width/ART_N); resetClear();
});
cv.addEventListener("pointermove",e=>{
  if(!stroke||!curCid) return;
  const q=cvPt(e), pp=stroke.p, lx=pp[pp.length-2], ly=pp[pp.length-1];
  if(Math.hypot(q.x-lx,q.y-ly)<1.2) return;
  if(ptCount(curCid)>=MAX_PTS || pp.length>=130000){ stroke=null; return; }
  pp.push(q.x,q.y);
  paintStroke(cctx,{ e:stroke.e, col:stroke.col, w:stroke.w, p:[lx,ly,q.x,q.y] }, cv.width/ART_N);
});
["pointerup","pointercancel","lostpointercapture"].forEach(t=>cv.addEventListener(t,()=>{ stroke=null; }));
/* 色: 規定の色+自由に選べる色(input type=color)。一度だけ作り、あとはクラスの付け替えだけ(パレットを開いている最中に消さない) */
(function buildInks(){
  $("inkRow").innerHTML=INK.map((c,i)=>'<button class="ink-b" type="button" data-c="'+i+'" style="background:'+c+'" aria-label="色"></button>').join("")
    +'<label class="ink-free" id="inkFree" aria-label="好きな色"><input type="color" id="inkPick" value="'+freeCol+'"><i id="inkFreeDot" style="background:'+freeCol+'"></i></label>';
  $("inkRow").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ ensureAudio(); playTick(); penCol=INK[+b.dataset.c]; erasing=false; updateTools(); });
  const pk=$("inkPick");
  const useFree=()=>{ freeCol=pk.value; penCol=freeCol; erasing=false; $("inkFreeDot").style.background=freeCol; updateTools(); };
  pk.addEventListener("input",useFree); pk.addEventListener("change",useFree);
  pk.addEventListener("click",()=>{ ensureAudio(); penCol=freeCol; erasing=false; updateTools(); });
})();
/* 太さのバー: 左=細い・右=太い。つまみの丸は実際に描かれる太さと色 */
function setW(v){ penW=Math.max(W_MIN,Math.min(W_MAX,Math.round(v/W_STEP)*W_STEP)); updateThumb(); }
function updateThumb(){
  const th=$("wThumb"), fr=(penW-W_MIN)/(W_MAX-W_MIN);
  th.style.left=(4+fr*92)+"%";
  const cw=(cv.clientWidth||Math.min(window.innerWidth*0.88,400));
  const d=Math.max(8, penW*(erasing?2.2:1)*cw/ART_N);   // 画面上で描かれる太さそのもの(小さすぎるとつかめないので最小8px)
  th.style.setProperty("--d",d.toFixed(1)+"px");
  th.style.setProperty("--pc", erasing? "#fff" : penCol);
}
(function(){ const tr=$("wTrack"); let drag=false;
  const at=e=>{ const r=tr.getBoundingClientRect(); const fr=Math.max(0,Math.min(1,((e.clientX-r.left)/r.width-.04)/.92)); setW(W_MIN+fr*(W_MAX-W_MIN)); };
  tr.addEventListener("pointerdown",e=>{ ensureAudio(); drag=true; try{ tr.setPointerCapture(e.pointerId); }catch(_){} at(e); });
  tr.addEventListener("pointermove",e=>{ if(drag) at(e); });
  ["pointerup","pointercancel","lostpointercapture"].forEach(t=>tr.addEventListener(t,()=>{ drag=false; }));
  let rep=0; const step=d=>{ setW(penW+d*W_STEP); };
  [["wMinus",-1],["wPlus",1]].forEach(([id,d])=>{ const b=$(id);
    b.addEventListener("click",()=>{ ensureAudio(); playTick(); step(d); });
  });
})();
function updateTools(){
  const pre=INK.indexOf(penCol);
  $("inkRow").querySelectorAll("[data-c]").forEach(b=>b.classList.toggle("sel", !erasing && +b.dataset.c===pre));
  $("inkFree").classList.toggle("sel", !erasing && pre<0);
  $("eraseBtn").classList.toggle("sel",erasing);
  updateThumb();
}
function renderTools(){ updateTools(); }
$("eraseBtn").onclick=()=>{ ensureAudio(); playTick(); erasing=!erasing; updateTools(); };
$("undoBtn").onclick=()=>{ ensureAudio(); if(!curCid||!(drafts[curCid]||[]).length) return; playTick(); drafts[curCid].pop(); redrawCv(); resetClear(); };
function resetClear(){ clearArm=0; $("clearBtn").textContent="全部消す"; $("clearBtn").classList.remove("deny"); }
$("clearBtn").onclick=()=>{ ensureAudio(); if(!curCid) return;
  if(!clearArm){ clearArm=1; $("clearBtn").textContent="確定"; $("clearBtn").classList.add("deny"); playTick(); return; }   // 2段階(ボタン自体が「確定」に変わる)
  drafts[curCid]=[]; redrawCv(); resetClear(); playSelect(); };
document.addEventListener("pointerdown",e=>{ if(clearArm && !e.target.closest("#clearBtn")) resetClear(); },true);
$("drDone").onclick=()=>{ ensureAudio(); if(curCid) finishCard(curCid); };
function finishCard(cid){                      // 完成(または自分の端末での時間切れ)
  if(!G||localDone[cid]) return;

/* --- 神経衰弱(カードは作り直さない) --- */
let gridKey="", cardEls={};
/* 列数: √枚数くらいから、最後の段の空きがいちばん少ない列数を選ぶ(8枚=4×2・24枚=6×4・48枚=8×6)。画面幅に入る列数が上限(スマホは4列) */
function layoutGrid(){
  const g=$("grid"), n=G? G.board.length : 0; if(!n) return;
  const avail=Math.min(window.innerWidth*0.96, 860), GAP=10;
  const maxC=Math.max(2, Math.floor((avail+GAP)/(70+GAP)));
  const c0=Math.ceil(Math.sqrt(n)); let best=Math.min(c0,maxC), bestE=1e9;
  for(let c=Math.min(c0,maxC); c<=Math.min(maxC, c0+2, n); c++){ const e=Math.ceil(n/c)*c-n; if(e<bestE){ bestE=e; best=c; } }
  const w=Math.min(128, (avail-(best-1)*GAP)/best);
  g.style.gridTemplateColumns="repeat("+best+","+w.toFixed(1)+"px)";
}

const BACK_COLS=["#fff3b0","#ffd6e5","#d6f5ec","#dcebff","#efe0ff","#ffe3c7"];
const DOODLE_INKS=["#ff4d4d","#ff9f1c","#3bb273","#2ec4b6","#3a86ff","#8338ec","#ff5fa2"];
function backSvg(i){   // 裏面=色画用紙に「?」のらくがき(カードごとに色を変える)
  const ink=DOODLE_INKS[(i*3)%DOODLE_INKS.length], ink2=DOODLE_INKS[(i*5+2)%DOODLE_INKS.length];
  return '<svg viewBox="0 0 100 100"><g fill="none" stroke-linecap="round" stroke-linejoin="round">'
    +'<path d="M37 39 Q36 22 51 22 Q66 22 65 36 Q64 46 52 51 Q50 53 50 61" stroke="'+ink+'" stroke-width="9"/>'

function buildGrid(){
  const g=$("grid"); g.innerHTML=""; cardEls={}; layoutGrid();
  G.board.forEach((cid,i)=>{
    const el=document.createElement("div"); el.className="card"; el.dataset.cid=cid;
    el.innerHTML='<div class="card-in"><div class="face back" style="--bk:'+BACK_COLS[i%BACK_COLS.length]+'">'+backSvg(i)+'</div><div class="face front"><canvas width="220" height="220"></canvas><div class="cap"></div></div></div>';
    el.addEventListener("click",()=>tapCard(cid));
    g.appendChild(el); cardEls[cid]=el; paintCard(cid);
  });
}
function paintCard(cid){ const el=cardEls[cid]; if(!el||!(cid in arts)||el._painted) return; paintArt(el.querySelector("canvas"), decodeArt(arts[cid])); el._painted=true; }
function tapCard(cid){
  if(!G||G.phase!=="match") return;
  const id=VID(); if(id!==G.turn){ if(!debug) toast(pById(G.turn)? pById(G.turn).n+" の番" : "まだ"); return; }
  if(G.resAt || G.flip.length>=2 || G.taken[cid] || G.flip.includes(cid) || localFlip) return;
  ensureAudio(); playFlip();
  if(!(isHost||debug)){ localFlip={ cid, sk:G.sk, at:Date.now() }; renderMatch(); }
  submit({ t:"flip", cid });
}
function renderMatch(){
  const box=$("matchBox"), on=G.phase==="match"||G.phase==="over";
  box.classList.toggle("on",on); if(!on){ gridKey=""; return; }
  const key=G.gid+"|"+G.board.join(",");
  if(key!==gridKey){ gridKey=key; buildGrid(); }
  if(localFlip && (G.sk!==localFlip.sk || G.flip.includes(localFlip.cid) || Date.now()-localFlip.at>3000)) localFlip=null;
  const over=G.phase==="over";
  G.board.forEach(cid=>{
    const el=cardEls[cid]; if(!el) return; const c=cById(cid), tk=G.taken[cid];
    const up = over || !!tk || G.flip.includes(cid) || (localFlip&&localFlip.cid===cid);
    el.classList.toggle("up",up);
    el.classList.toggle("got",!!tk);
    el.classList.toggle("picked", !tk && G.flip.includes(cid));
    el.classList.toggle("showcap", over || (debug&&dbgShow));
    const owner=tk? pById(tk) : null; if(owner) el.style.setProperty("--oc",owner.c);
    const cap=el.querySelector(".cap");
    const word = c&&c.tp>=0? G.tp[c.tp].t : "お題なし";
    const capTx = (tk||over||(debug&&dbgShow))? esc(word)+(over&&c? '<small>'+esc((pById(c.dr)||{}).n||"")+'</small>' : "") : "";
    if(cap._tx!==capTx){ cap._tx=capTx; cap.innerHTML=capTx; }
    cap.style.background = owner? owner.c : "#fff";
    el.classList.toggle("dim", over || !!tk);
    if(up) paintCard(cid);
  });
  const t=pById(G.turn);
  $("matchNote").textContent= over? "" : (G.resAt? "" : (t&&(t.id===VID())? TAPW+"してカードをめくる" : ""));
  $("overBtns").style.display= over? "flex" : "none";
}

function renderDbg(){

  el.style.display="block";

  let h='<div class="dbg-h">試作用パネル（行を'+TAPW+'でその人を操作）</div>';

    if(ph==="draw"){ const cs=myCards(p.id); inf="描く："+cs.map(c=>(c.done?"済":"")+(c.tp>=0?G.tp[c.tp].t:"フェイク")).join("、"); }
    if(ph==="match"||ph==="over") inf=p.score+"組"+(p.id===G.turn&&ph==="match"?"（手番）":"");
    const act = (ph==="match"? p.id===G.turn : p.id===dbgActor);
    h+='<div class="dbg-row'+(act?" act":"")+'" data-a="'+esc(p.id)+'"><span class="p-dot" style="background:'+p.c+'"></span><span class="nm">'+esc(p.n)+'</span><span class="inf">'+esc(inf)+'</span></div>';
  });
  h+='<div class="dbg-btns">';
  if(ph==="topic") h+='<button class="txt-btn" id="dbOm">全員のお題をおまかせで埋める</button>';
  if(ph==="draw") h+='<button class="txt-btn" id="dbAuto1">この人の残りを自動で描く</button><button class="txt-btn" id="dbAuto">全員の残りを自動で描く</button>';
  if(ph==="match") h+='<button class="txt-btn'+(dbgShow?" sel":"")+'" id="dbShow">'+(dbgShow?"お題を隠す":"お題を表示")+'</button><button class="txt-btn" id="dbPair">ペアを1組めくる</button>';
  if(ph==="topic") h+='<button class="txt-btn" id="dbForce">締め切りにする</button>';
  h+='</div>';
  el.innerHTML=h;
  el.querySelectorAll("[data-a]").forEach(r=>r.onclick=()=>{ if(ph==="match") return; ensureAudio(); playSelect(); dbgActor=r.dataset.a; render(); });
  const on=(id,f)=>{ const b=$(id); if(b) b.onclick=()=>{ ensureAudio(); playSelect(); f(); }; };
  on("dbOm",()=>{ activePs().forEach(p=>{ if(!G.topics[p.id]) G.topics[p.id]=randomTopics(G.rules.k, Object.values(G.topics).flat()); }); finishTopics(); });
  on("dbForce",()=>finishTopics());
  const autoFor=id=>myCards(id).forEach(c=>{ if(c.done) return; localDone[c.id]=true; arts[c.id]=encodeArt(autoArt(c.tp>=0? G.tp[c.tp].t : "fake"+Math.random())); hostCardDone(c.id); });
  on("dbAuto1",()=>{ autoFor(dbgActor); dbgNext(); render(); });
  on("dbAuto",()=>{ activePs().forEach(p=>{ if(G.phase==="draw") autoFor(p.id); }); render(); });
  on("dbShow",()=>{ dbgShow=!dbgShow; render(); });
  on("dbPair",()=>{ if(G.resAt||G.flip.length) return;
    const free=G.board.map(cById).filter(c=>c&&!G.taken[c.id]&&cardKey(c)), grp={};
    free.forEach(c=>(grp[cardKey(c)]=grp[cardKey(c)]||[]).push(c));
    const cs=Object.values(grp).find(g=>g.length>=2); if(!cs) return;
    hostAct({t:"flip",from:G.turn,sk:G.sk,cid:cs[0].id}); hostAct({t:"flip",from:G.turn,sk:G.sk,cid:cs[1].id}); });
}

/* 状態が変わった時の演出(ホストもゲストも同じ関数を通る) */
function onState(){
  if(!G) return;
  if(seen.gid!==G.gid){
    resetLocal();
    seen={ gid:G.gid, sk:-1, phase:"", getN:G.getN, missN:G.missN, turn:"", over:false };
    addSys("── あたらしいゲーム ──");
  }
  if(G.getN>seen.getN){ seen.getN=G.getN;
    const L=G.last, t=L&&G.tp[L.tp], by=L&&pById(L.by);
    if(t){ playGet(); bigFx(esc(t.t)+"<small>"+esc(by?by.n:"")+" GET</small>","get"); addSys((by?by.n:"")+" GET：「"+t.t+"」");
      [L.a,L.b].forEach(cid=>{ const el=cardEls[cid]; if(el){ el.classList.remove("hit"); void el.offsetWidth; el.classList.add("hit"); } }); }
  }
  if(seen.phase!==G.phase){
    const ph=G.phase; seen.phase=ph;
    if(ph==="topic"){ playStep(); bigFx("お題を考えよう"); }
    if(ph==="draw"){ playStep(); bigFx("お絵かきタイム"); addSys("お絵かきタイム"); }
    if(ph==="match"){ playStep(); const t=pById(G.turn); bigFx("神経衰弱スタート<small>最初は "+esc(t?t.n:"")+"</small>"); addSys("神経衰弱スタート（最初は "+(t?t.n:"")+"）"); }
    if(ph==="over" && !seen.over){
      seen.over=true;
      const rl=rankList(), top=rl.length? rl[0].p.score : 0, winners=rl.filter(r=>r.p.score===top).map(r=>r.p);
      addSys(winners.map(p=>p.n).join("・")+" の勝ち","c-res");
      if(debug || winners.some(p=>p.id===myId)) playWin(); else playLose();
      setTimeout(openResult,1200);
    }
  }
  if(G.missN>seen.missN){ seen.missN=G.missN; playMiss(); }
  if(G.phase==="match" && seen.turn!==G.turn+"|"+G.sk){
    const prevTurn=seen.turn.split("|")[0]; seen.turn=G.turn+"|"+G.sk;
    if(G.turn===myId && prevTurn!==myId && !debug){ playTurn(); toast("あなたの番"); }
  }
  G.players.forEach(p=>{ if(p.gone && !(seen.gone||(seen.gone={}))[p.id]){ seen.gone[p.id]=1; addSys(p.n+" が退出した"); toast(p.n+" が退出した"); } });
}

function genCode(){ let s=""; for(let i=0;i<5;i++) s+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]; return s; }
function pickCode(t){                         // 招待メッセージを丸ごと貼っても合言葉だけ取り出す
  t=String(t||"");
  let m=/[?&]join=([A-Za-z0-9]{4,6})/.exec(t); if(m) return m[1].toUpperCase();
  const u=t.toUpperCase(); m=/合言葉[：:\s]*([A-Z0-9]{4,6})/.exec(u); if(m) return m[1];
  return u.replace(/[^A-Z0-9]/g,"");
}

function onLeave(id){
  if(id===myId) return; cancelGone(id);
  if(id===hostId && !isHost){ toast("オーナーが退出しました"); goTitle(); return; }
  if(!isHost) return;
  if(!G || phaseUI!=="game"){ lobby=lobby.filter(p=>p.id!==id); renderLobby(); sendSnap(); return; }
  const p=pById(id); if(!p||p.gone) return;
  p.gone=true; lobby=lobby.filter(q=>q.id!==id);   // 「◯◯ が退出した」はonStateで全員の画面に出す
  if(!activePs().length){ finishGame(); return; }
  if(G.phase==="topic"){ delete G.topics[id]; if(allTopicsIn()){ finishTopics(); return; } }
  if(G.phase==="draw"){                            // 描き終わっていないカードは取り除く(相方を失ったお題はペアにならない)
    G.cards.forEach(c=>{ if(c.dr===id && !c.done) c.gone=true; });
    if(G.cards.every(x=>x.done||x.gone)){ startMatch(); return; }
  }
  if(G.phase==="match" && G.turn===id){ G.flip=[]; G.resAt=0; nextTurn(); return; }
  bump();
}

    nt.textContent="部屋を探しています…"; nt.className="room-note";
    code=c; isHost=false; online=true; lobby=[]; lastVer=-1;
    openChannel(code,()=>{
      try{ ch.send({type:"broadcast",event:"hello",payload:{id:myId,n:myName}}); }catch(e){}
      joinWatch=setTimeout(()=>{ if(!hostId){ nt.textContent="部屋がみつからない。合言葉を確認しよう"; nt.className="room-note err"; leaveChannel(); } },4000);
    });
  };
};
function openChannel(c,onReady){
  ch=sbClient().channel("os-"+c,{ config:{ presence:{ key:myId }, broadcast:{ self:false } } });
  ch.on("broadcast",{event:"hello"},({payload})=>{
    if(!isHost||!payload) return; cancelGone(payload.id);
    if(lobbyById(payload.id)){ sendSnap(); return; }                       // もういる(再接続)
    if(phaseUI==="game"||lobby.length>=MAX_P){ try{ ch.send({type:"broadcast",event:"locked",payload:{to:payload.id,full:phaseUI!=="game"}}); }catch(e){} return; }
    lobby.push({ id:payload.id, n:String(payload.n||"").slice(0,16), c:nextColor(), t:Date.now() });
    renderLobby(); sendSnap();
  });
  ch.on("broadcast",{event:"locked"},({payload})=>{ if(payload&&payload.to===myId){ leaveChannel();
    roomStatus('<div class="room-note err">'+(payload.full?"満室です（"+MAX_P+"人まで）":"今はゲーム中みたい。次のゲーム開始まで待ってね")+'</div>'); } });
  ch.on("broadcast",{event:"snap"},({payload})=>{ if(!isHost&&payload) applySnap(payload); });
  ch.on("broadcast",{event:"act"},({payload})=>{ if(!isHost||!payload) return;
    if(payload.t==="rename"){ const p=lobbyById(payload.from); if(p) p.n=String(payload.n||"").slice(0,16); if(G){ const q=pById(payload.from); if(q) q.n=p?p.n:q.n; } if(phaseUI==="lobby") renderLobby(); sendSnap(); return; }
    hostAct(payload); });
  ch.on("broadcast",{event:"art"},({payload})=>onArtChunk(payload));
  ch.on("broadcast",{event:"artreq"},({payload})=>{     // ホストだけが答える(全員の絵を持っている)
    if(!isHost||!payload||!Array.isArray(payload.cids)) return;
    const now=Date.now();
    payload.cids.slice(0,8).forEach(cid=>{ if(!(cid in arts)) return; if(now-(artServeAt[cid]||0)<1500) return; artServeAt[cid]=now; sendArt(cid,arts[cid]); });
  });
  ch.on("broadcast",{event:"stamp"},({payload})=>{ if(!payload) return; speakStamp(payload.i|0); spawnStamp(payload.i|0, payload.n||"あいて"); });
  ch.on("broadcast",{event:"chat"},({payload})=>{
    if(!payload||!payload.t||payload.from===myId) return;
    recvChat(payload.n||"あいて", String(payload.t).slice(0,40), payload.c||""); });
  ch.on("broadcast",{event:"bye"},({payload})=>{ if(payload) onLeave(payload.id); });
  ch.on("broadcast",{event:"kick"},({payload})=>{ if(payload&&payload.to===myId&&!isHost){ toast("オーナーに退出させられました"); goTitle(); } });
  ch.on("presence",{event:"leave"},({leftPresences})=>{ (leftPresences||[]).forEach(p=>{ if(!p||!p.id) return;
    if(isHost && phaseUI==="lobby") onLeave(p.id); else markGone(p.id); }); });
  ch.on("presence",{event:"join"},({newPresences})=>{ (newPresences||[]).forEach(p=>{ if(p&&p.id) cancelGone(p.id); }); });
  let readyDone=false;
  ch.subscribe(async status=>{
    if(status==="SUBSCRIBED"){
      try{ await ch.track({id:myId}); }catch(e){}
      if(readyDone){ if(isHost) sendSnap(); else { try{ ch.send({type:"broadcast",event:"hello",payload:{id:myId,n:myName}}); }catch(e){} } return; }
      readyDone=true; if(onReady) onReady();
    } else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){ roomStatus('<div class="room-note err">通信失敗。通信環境を見直そう</div>'); }
  });
}
function startHb(){ clearInterval(hbIv); hbIv=setInterval(sendSnap,1500); }
function sendSnap(){
  if(!isHost||!ch||debug) return;
  ver++;
  const p={ v:ver, hid:hostId, rules, lob:lobby.map(x=>({id:x.id,n:x.n,c:x.c})) };
  if(phaseUI==="game"&&G){ p.G=G; p.left=G.stepEnd? Math.max(0,G.stepEnd-Date.now()) : 0; }
  try{ ch.send({type:"broadcast",event:"snap",payload:p}); }catch(e){}
}
function applySnap(p){
  if(p.hid!==hostId){ lastVer=-1; }                                     // オーナーが替わったら番号を振り直す
  if(p.v<=lastVer) return; lastVer=p.v;
  clearTimeout(joinWatch); hostId=p.hid; rules=p.rules||rules; lobby=p.lob||[];
  if(!p.G){
    if(phaseUI==="game"){ G=null; document.querySelectorAll(".overlay").forEach(o=>o.classList.remove("on","peek")); }
    if(phaseUI!=="lobby"){ phaseUI="lobby"; showScene("lobbyScene"); }
    renderLobby(); return;
  }
  G=p.G; localEnd=Date.now()+(p.left||0);
  if(pending && pendingIn()) pending=null;
  if(pending && Date.now()-pendingSent>900){ pendingSent=Date.now(); sendAct(pending); }   // 届いていなければ送り直す
  /* 送った絵: ホストが受け取った(=そのカードが完成扱い)と分かるまで送り直す */
  Object.keys(artOut).forEach(cid=>{ const c=G.cards.find(x=>x.id===cid); if(!c||c.done||c.gone){ delete artOut[cid]; return; }
    if(Date.now()-artOut[cid].at>2500){ artOut[cid].at=Date.now(); sendArt(cid,artOut[cid].d); } });
  /* 神経衰弱の間に、まだ届いていない絵があれば取り寄せる */
  if(G.phase==="match"||G.phase==="over"){
    const miss=G.board.filter(cid=>!(cid in arts)); if(miss.length && Date.now()-artReqAt>2500){ artReqAt=Date.now(); try{ ch.send({type:"broadcast",event:"artreq",payload:{ from:myId, cids:miss.slice(0,8) }}); }catch(e){} }
  }
  if(phaseUI!=="game") enterGame();
  onState(); render();
}

function ruleSummary(){ return "お題 1人"+rules.k+"個・1枚 "+rules.draw+"秒<br>お題を考える時間 "+fmtT(rules.topic)+"・1手 "+rules.turn+"秒"; }
function renderLobby(){

    h+='<div class="lobby-row"><span class="p-dot" style="background:'+p.c+'"></span><span class="nm'+(p.n?"":" undef")+'">'+esc(p.n||UNDEF_NM)+'</span>'

  });

  h+= isHost? ruleFrameHTML() : '<div class="rule-sum">'+ruleSummary()+'</div>';

  h+='<div class="room-note">'+(okN? n+"人：お題 "+(n*k)+" 個・カード "+(n*k*2)+" 枚"+(k<rules.k?"（人数が多いのでお題は1人"+k+"個）":"") : MIN_P+"〜"+MAX_P+"人で遊べます（いま"+n+"人）")+'</div>';
  if(isHost) h+='<button class="btn-main" id="lobbyStart"'+(okN?"":" disabled")+'>はじめる</button>';
  $("lobbyBox").innerHTML=h;
  if(!nameAsked){ nameAsked=true; openNameOv(); }
  $("codeShow").onclick=async ()=>{ ensureAudio(); playSelect();
    try{ await navigator.clipboard.writeText(inviteText(code)); toast("招待メッセージをコピーした"); }
    catch(e){ try{ const ta=document.createElement("textarea"); ta.value=inviteText(code); document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("招待メッセージをコピーした"); }catch(_){ toast("コピーできなかった…"); } } };
  if(!isHost) return;
  $("lobbyBox").querySelectorAll(".stp").forEach(b=>b.onclick=()=>{ ensureAudio(); playSelect();
    const k2=b.dataset.k, a=OPTS[k2], i=Math.max(0,a.indexOf(rules[k2])), j=Math.max(0,Math.min(a.length-1,i+(+b.dataset.s)));
    rules[k2]=a[j]; renderLobby(); sendSnap(); });
  $("ruleReset").onclick=()=>{ ensureAudio(); playSelect(); rules=Object.assign({},DEF_RULES); renderLobby(); sendSnap(); };
  $("lobbyBox").querySelectorAll("[data-kick]").forEach(b=>b.onclick=()=>{ ensureAudio(); playSelect(); const id=b.dataset.kick;
    lobby=lobby.filter(p=>p.id!==id); try{ ch.send({type:"broadcast",event:"kick",payload:{to:id}}); }catch(e){} renderLobby(); sendSnap(); });
  const ls=$("lobbyStart"); if(ls) ls.onclick=()=>{ ensureAudio(); playSelect();
    if(!(lobby.length>=MIN_P&&lobby.length<=MAX_P)) return;
    enterGame(); newGame(lobby.map(p=>({id:p.id,n:p.n||UNDEF_NM,c:p.c}))); };
}

function playStamp(i){
  if(!actx) return; const t=T0();
  if(i===0){ note(523,t,0.2,0.3,"sine"); note(392,t+0.15,0.22,0.3,"sine"); note(300,t+0.32,0.36,0.26,"sine"); }

let stampMuted=false;   // 毎回ミュートOFFで始める(保存しない)
function spawnStamp(i,who,self){
  if(stampMuted && !self) return;

const STAMP_WORDS=["やめてよぉ","すごぉい","わろたぁ"];
let stampTTSVoice=null, stampTTSWarm=false;
function speakStamp(i){
  try{
    if(!window.speechSynthesis||!seOn||stampMuted||document.hidden) return;
    if(!stampTTSVoice){ const vs=speechSynthesis.getVoices()||[]; stampTTSVoice=vs.find(v=>/ja/i.test(v.lang))||null; }
    if(!stampTTSWarm){ stampTTSWarm=true; speechSynthesis.onvoiceschanged=()=>{ const v2=speechSynthesis.getVoices()||[]; stampTTSVoice=v2.find(v=>/ja/i.test(v.lang))||stampTTSVoice; }; }
    const u=new SpeechSynthesisUtterance(STAMP_WORDS[Math.max(0,Math.min(2,i|0))]); u.lang="ja-JP"; u.rate=1.05; u.pitch=1.1;
    if(stampTTSVoice) u.voice=stampTTSVoice;
    if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}
}

   画面の多いゲームを調整するための道具。シーンを選ぶたびに状態を作り直して、その画面をそのまま出す。

let gallery=false, sgIdx=0, sgLeft=15, sgSeq=0;
const SCENES=[];
function sc(g,n,run){ SCENES.push({ g, n, run }); }
function sgGo(i){
  if(!SCENES.length) return;
  sgIdx=(i+SCENES.length)%SCENES.length; try{ localStorage.setItem(SG_KEY,String(sgIdx)); }catch(e){}
  sgLeft=15; sgReset();
  try{ SCENES[sgIdx].run(); }catch(e){ console.error(e); toast("このシーンでエラー："+e.message,4000); }
  sgPanel();
}
function sgPanel(){
  let el=$("sgPanel");
  if(!el){
    el=document.createElement("div"); el.id="sgPanel"; if(window.innerWidth<700) el.classList.add("fold");
    el.innerHTML='<div class="sg-head"><svg class="sg-grip" viewBox="0 0 10 16" aria-hidden="true"><g fill="currentColor"><circle cx="3" cy="3" r="1.4"/><circle cx="7" cy="3" r="1.4"/><circle cx="3" cy="8" r="1.4"/><circle cx="7" cy="8" r="1.4"/><circle cx="3" cy="13" r="1.4"/><circle cx="7" cy="13" r="1.4"/></g></svg><b>シーン一覧</b><span id="sgNo"></span><button id="sgFold" type="button"></button></div>'
      +'<div class="sg-nav"><button id="sgPrev" type="button">◀ 前</button><button id="sgNext" type="button">次 ▶</button></div>'
      +'<div class="sg-cur" id="sgCur"></div><div class="sg-list" id="sgList"></div>'
      +'<button id="sgEnd" class="sg-end" type="button">シーン一覧をやめる</button>';
    document.body.appendChild(el);
    let h="", last="";
    SCENES.forEach((s,i)=>{ if(s.g!==last){ last=s.g; h+='<div class="sg-g">'+esc(s.g)+'</div>'; } h+='<button type="button" class="sg-i" data-i="'+i+'">'+esc(s.n)+'</button>'; });
    $("sgList").innerHTML=h;
    $("sgList").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>sgGo(+b.dataset.i));
    $("sgPrev").onclick=()=>sgGo(sgIdx-1);
    $("sgNext").onclick=()=>sgGo(sgIdx+1);
    $("sgFold").onclick=()=>{ el.classList.toggle("fold"); sgPanel(); };
    dragWin(el,[el.querySelector(".sg-head"),$("sgCur")],"os.sgPos");   // 頭の部分をつまんで動かす
    $("sgEnd").onclick=closeGallery;
  }
  const s=SCENES[sgIdx];
  $("sgNo").textContent=(sgIdx+1)+" / "+SCENES.length;

/* ★デバッグ用の窓の共通部品(2026-09-25牧村指示)
   ・dragWin(窓, つまむ所[], 保存キー)=つまんで動かせる。離すといちばん近い画面の端に吸い付く・置いた場所は覚えておく
   ・onSD(関数)=SとDを同時に押した時に呼ぶ(開く/閉じる)。入力欄の中では反応しない。キーの位置で見るので日本語入力中でも効く */
function dragWin(el,handles,key){
  /* 離した時は左右どちらか近い方の画面の端へ吸い付く(2026-09-25牧村指示。上下には張り付かない=上下の位置は置いた所のまま)。
     保存するのは{e:吸い付いた端(l/r), p:上下の位置}=画面の大きさが変わっても同じ端にくっついたまま */
  const M=8;                                                   // 端からのすき間
  const vw=()=>window.innerWidth, vh=()=>window.innerHeight;
  const set=(x,y)=>{ el.style.left=x+"px"; el.style.top=y+"px"; el.style.right="auto"; el.style.bottom="auto"; };
  const fit=(v,max)=>Math.max(M,Math.min(max-M,v));            // 窓がまるごと画面に入る範囲
  const stick=(e,p)=>{ const w=el.offsetWidth, h=el.offsetHeight;
    if(!(vw()>0&&vh()>0)) return;                              // 画面の大きさが分からない時(裏のタブ等)は動かさない
    if(e==="l") set(M, fit(p,vh()-h)); else if(e==="r") set(vw()-w-M, fit(p,vh()-h));
    else if(e==="t") set(fit(p,vw()-w), M); else set(fit(p,vw()-w), vh()-h-M);
    el._snap={ e, p }; };
  const nearest=()=>{ const r=el.getBoundingClientRect();   // 窓の中心が画面の左半分なら左端・右半分なら右端
    return { e: (r.left+r.width/2)<=vw()/2? "l" : "r", p:r.top }; };
  el._place=()=>{ if(el._snap) stick(el._snap.e,el._snap.p); };
  el.dataset.drag="1";
  try{ const sv=JSON.parse(localStorage.getItem(key)||"null");
    if(sv&&(sv.e==="l"||sv.e==="r")) stick(sv.e,sv.p);
    else if(sv&&(sv.e==="t"||sv.e==="b")){ set(sv.p, sv.e==="t"? M : Math.max(M,vh()-el.offsetHeight-M)); if(vw()>0){ const n=nearest(); stick(n.e,n.p); } }   // 上下に張り付いていた古い保存は左右へ直す
    else if(sv&&typeof sv.x==="number"){ set(sv.x,sv.y); if(vw()>0){ const n=nearest(); stick(n.e,n.p); } }   // 吸い付く前に保存された位置
  }catch(e){}
  handles.forEach(h=>{ let d=null;
    h.addEventListener("pointerdown",e=>{ if(e.button!==0||e.target.closest("button")) return;
      const r=el.getBoundingClientRect(); d={ dx:e.clientX-r.left, dy:e.clientY-r.top, id:e.pointerId };
      el.classList.remove("snapping");
      try{ h.setPointerCapture(e.pointerId); }catch(_){} el.classList.add("dragging"); e.preventDefault(); });
    h.addEventListener("pointermove",e=>{ if(!d||e.pointerId!==d.id) return;
      let x=e.clientX-d.dx, y=e.clientY-d.dy;
      if(vw()>0&&vh()>0){ x=Math.max(-el.offsetWidth+60,Math.min(vw()-60,x)); y=Math.max(0,Math.min(vh()-30,y)); }
      set(x,y); });
    const up=()=>{ if(!d) return; d=null; el.classList.remove("dragging");
      if(!(vw()>0&&vh()>0)) return;
      const n=nearest(); el.classList.add("snapping"); stick(n.e,n.p);                 // すっと端へ吸い付く
      setTimeout(()=>el.classList.remove("snapping"),260);
      try{ localStorage.setItem(key,JSON.stringify(el._snap)); }catch(_){} };
    ["pointerup","pointercancel","lostpointercapture"].forEach(t=>h.addEventListener(t,up));
  });
  if(!dragWin.rs){ dragWin.rs=1; window.addEventListener("resize",()=>document.querySelectorAll("[data-drag]").forEach(w=>w._place&&w._place())); }
}
function onSD(fn){
  const held=new Set();
  document.addEventListener("keydown",e=>{
    if(e.ctrlKey||e.metaKey||e.altKey||e.repeat) return;
    const t=e.target; if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable)) return;
    if(e.code!=="KeyS"&&e.code!=="KeyD") return;
    held.add(e.code); if(held.has("KeyS")&&held.has("KeyD")){ held.clear(); e.preventDefault(); fn(); }
  });
  document.addEventListener("keyup",e=>held.delete(e.code));
  window.addEventListener("blur",()=>held.clear());
}
