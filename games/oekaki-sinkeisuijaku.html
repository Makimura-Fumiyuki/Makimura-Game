const SG_KEY="os.sgIdx";
const SG_NM=["まきむら","さくら","たろう","ゆい","けん","みお","そら","はる"];
const SG_TOP=["ねこ","ロケット","おにぎり","かさ","ぞう","ラーメン","ひまわり","おばけ","くるま","りんご","ペンギン","さかな"];
function sgReset(){
  clearTimeout(toastT); $("toast").classList.remove("on"); clearTimeout(fxT); $("bigFx").className="";
  goTitle();                                                     // 部屋・状態・チャット・ダイアログ・絵を片付けてタイトルへ
  rules=Object.assign({},DEF_RULES); code=""; nameAsked=true; pending=null; dbgShow=false;
  erasing=false; penCol=INK[0]; penW=W_DEF; resetClear(); updateTools(); setMini(true);
}
/* 状態を作る。o.guest=参加者側で見る／o.k=1人のお題の数 */
function sgG(n,o){
  o=o||{};
  G={ gid:"sg"+(++sgSeq), rules:Object.assign({},DEF_RULES,{ k:o.k||1 }),
      players:[...Array(n)].map((_,i)=>({ id:i?"g"+i:myId, n:SG_NM[i], c:PCOL[i], score:0, gone:false })),
      phase:o.phase||"topic", sk:5, stepEnd:0, topics:{}, tp:[], cards:[], board:[], pairTotal:0, taken:{},
      turn:"", flip:[], resAt:0, getN:0, missN:0, last:null, drawEnd:0 };
  isHost=!o.guest; online=!!o.guest; hostId=o.guest? "g1" : myId;
  return G;
}
function sgDeal(){                      // 全員のお題を決めて、描く人を割り振る
  let t=0; activePs().forEach(p=>{ G.topics[p.id]=[]; for(let i=0;i<G.rules.k;i++) G.topics[p.id].push(SG_TOP[(t++)%SG_TOP.length]); });
  G.tp=[]; activePs().forEach(p=>G.topics[p.id].forEach(x=>G.tp.push({ t:x, by:p.id })));
  buildCards();
  myCards(myId).forEach(c=>{ if(c.tp<0){ const r=G.cards.find(x=>x.dr!==myId&&x.tp>=0); if(r){ const tmp=c.tp; c.tp=r.tp; r.tp=tmp; } } });   // 自分の分はお題ありにそろえる
}
function sgArtsAll(){ G.cards.forEach(c=>{ arts[c.id]=encodeArt(autoArt(c.tp>=0? G.tp[c.tp].t : "fake"+c.id)); c.done=true; }); }
function sgBoard(){                     // 神経衰弱の盤を作る(最初はあなたの番)
  G.board=shuffle(G.cards.filter(c=>!c.gone).map(c=>c.id));
  const cnt={}; G.cards.forEach(c=>{ const k2=cardKey(c); if(k2) cnt[k2]=(cnt[k2]||0)+1; });
  G.pairTotal=Object.values(cnt).reduce((s2,v)=>s2+Math.floor(v/2),0); G.turn=myId;
}
function sgGroups(){ const grp={}; G.board.forEach(cid=>{ const k2=cardKey(cById(cid)); if(k2) (grp[k2]=grp[k2]||[]).push(cid); }); return Object.values(grp).filter(g=>g.length>=2); }
function sgTake(pr,pid){ G.taken[pr[0]]=pid; G.taken[pr[1]]=pid; pById(pid).score++; }
function sgPrime(){
  seen={ gid:G.gid, sk:G.sk, phase:G.phase, getN:G.getN, missN:G.missN, turn:G.turn+"|"+G.sk, over:G.phase==="over", gone:{} };
  G.players.forEach(p=>{ if(p.gone) seen.gone[p.id]=1; });
}
function sgShow(){ if(G.phase==="topic"||G.phase==="match") G.stepEnd=Date.now()+sgLeft*1000; enterGame(); sgPrime(); localEnd=G.stepEnd; render();
  if(G.phase==="draw"){ const c0=curDrawCard(); if(c0){ drawStart[c0.id]=Date.now()-(G.rules.draw-sgLeft)*1000; renderTimer(); } } }
function sgFire(fn){ if(fn) fn(); onState(); render(); }
function sgPhaseIn(){ seen.phase=""; seen.over=false; onState(); render(); }
function sgLobby(n,o){
  o=o||{}; online=true; isHost=!o.guest; hostId=o.guest? "g1" : myId; code="HUBAP"; nameAsked=true;
  const ids=[...Array(n)].map((_,i)=>i?"g"+i:myId);
  if(o.guest && n>1){ ids[0]="g1"; ids[1]=myId; }
  lobby=ids.map((id,i)=>({ id, n:(o.undef&&i===n-1)? "" : SG_NM[id===myId?0:+id.slice(1)], c:PCOL[i], t:i }));
  if(o.k) rules.k=o.k;
  phaseUI="lobby"; showScene("lobbyScene"); renderLobby();
}
const sgTopic=(n,o)=>{ sgG(n,o); if(o&&o.set) o.set(G); sgShow(); };
const sgDraw=(o)=>{ o=o||{}; sgG(4,Object.assign({ phase:"draw" },o)); sgDeal(); if(o.set) o.set(G); sgShow(); };
const sgMatch=(o)=>{ o=o||{}; sgG(4,Object.assign({ phase:"match", k:2 },o)); sgDeal(); sgArtsAll(); sgBoard(); if(o.set) o.set(G); sgShow(); };
const sgOverG=(scores,o)=>{ o=o||{}; sgG(4,Object.assign({ phase:"over", k:2 },o)); sgDeal(); sgArtsAll(); sgBoard();
  const gs=sgGroups(); let gi=0; scores.forEach((n,pi)=>{ for(let j=0;j<n&&gi<gs.length;j++) sgTake(gs[gi++],G.players[pi].id); });
  G.turn=""; sgShow(); };

    if(k===1){ let d=""; for(let i=0;i<=10;i++){ const r=i%2?11:26, a=-Math.PI/2+i*Math.PI/5; d+=(i?" L":"M")+(Math.cos(a)*r).toFixed(1)+" "+(Math.sin(a)*r).toFixed(1); } return d+" Z"; }   // 星
    if(k===2) return "M0 22 C-30 0 -22 -24 0 -8 C22 -24 30 0 0 22 Z";                                                                                       // ハート

    if(k===6){ let d="M 14 0 A14 14 0 1 1 -14 0 A14 14 0 1 1 14 0"; for(let i=0;i<8;i++){ const a=i*Math.PI/4; d+=" M"+(Math.cos(a)*20).toFixed(1)+" "+(Math.sin(a)*20).toFixed(1)+" L"+(Math.cos(a)*30).toFixed(1)+" "+(Math.sin(a)*30).toFixed(1); } return d; }   // 太陽
    return "M-30 6 L22 6 M10 -6 L24 6 L10 18";                                                                                                               // やじるし
  };
  const n=Math.round(Math.max(14, Math.min(34, W*H/42000)));

  for(let i=0;i<n;i++){
    let x, y;
    if(R()<.72){ x= R()<.5? R()*W*.17 : W*(.83+R()*.17); y=R()*H; }     // 左右の端
    else { x= R()<.5? R()*W*.3 : W*(.7+R()*.3); y= R()<.5? R()*H*.12 : H*(.88+R()*.12); }   // 上下の端(真ん中は空ける)
    const col=DOODLE_INKS[Math.floor(R()*DOODLE_INKS.length)], sc=.8+R()*.9, rot=Math.floor(R()*360), k=Math.floor(R()*8);
    const fill=(k===1||k===2)&&R()<.4? col : "none";
    g+='<path d="'+shape(k)+'" transform="translate('+x.toFixed(0)+' '+y.toFixed(0)+') rotate('+rot+') scale('+sc.toFixed(2)+')" fill="'+fill+'" fill-opacity=".35" stroke="'+col+'" stroke-width="'+(3.2/sc).toFixed(2)+'" stroke-linecap="round" stroke-linejoin="round" opacity="'+(W<640?".38":".62")+'"/>';   // 狭い画面はUIの後ろに重なりやすいので薄く
  }
  $("doodles").innerHTML='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+g+'</svg>';
}
let dodT=0; window.addEventListener("resize",()=>{ clearTimeout(dodT); dodT=setTimeout(drawDoodles,250); });
drawDoodles();
updateTools();
renderSnd();
if(/[?&]scenes=1/.test(location.search)) setTimeout(openGallery,60);   // ★?scenes=1 でシーン一覧から始める
})();
</script>

<script>document.addEventListener("focusin",function(e){var t=e.target;if(t&&t.tagName==="INPUT"&&t.value){setTimeout(function(){try{t.select();}catch(_){}},0);}});(function(){var tap=(window.matchMedia&&matchMedia("(pointer:coarse)").matches)?"タップ":"クリック";window.__TAPW=tap;function run(){var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);var n;while(n=w.nextNode()){var v=n.nodeValue;if(v&&(v.indexOf("タップ")>=0||v.indexOf("タッチ")>=0))n.nodeValue=v.split("タッチ").join(tap).split("タップ").join(tap);}}if(document.readyState!=="loading")run();else document.addEventListener("DOMContentLoaded",run);})();</script>
