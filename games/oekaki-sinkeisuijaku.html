<!--
  おえかき神経衰弱（仮名称・2026-09-24着手）
  ■ ながれ: お題づくり → 描き手の割り振り → おえかき(全員同時・1枚ずつ制限時間) → 神経衰弱
  ■ オンラインは他のパーティ系と同じ「ホスト権威＋スナップショット」
    ・スナップショットには進行の状態だけを入れる(お題の文字も入っている＝開発者ツールで覗けば見える。牧村了承済みの割り切り)
    ・絵はスナップショットに入れない。描き終わった瞬間に「ペンの軌跡」を1回だけ全員へ配る(event "art"・大きい時は分割)
      取りこぼした人は "artreq" でホストに送り直してもらう(ホストは全員の絵を持っている)
  ■ 描き手の割り振りのきまり(assignDrawers)
    ① 3人以上いれば「お題を出した本人以外」から2人を選ぶ(1人あたりの上限=ceil(2×お題数÷人数)で均等にしながら、ランダムに何回かやり直す)
    ② ①が作れない時(2人プレイなど)は本人も含めて選ぶ
    ③ 同じお題の2枚を同じ人が描くことはない
    ④ (廃止 2026-10-07)枚数がそろわない人には「フェイク」(お題のない自由枠・どのカードともペアにならない)を足して全員の枚数を最大の人にそろえる
    ※「1人◯個」でお題を出すので、ふつうは①の時点で全員ぴったり同じ枚数になり、フェイクは出ない
       (フェイクが出るのは、途中で抜けた人がいる等で数がずれた時)
    ※途中で抜けた人の描き終わっていないカードは取り除く。相方を失ったお題の1枚は、ペアのできないカード(フェイクと同じ扱い)になる
  ■ 試作用の「ひとりでためす」(DEBUG)は本番公開前に外すか牧村さんに確認すること(window.__osDev と同じ位置づけ)
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
  /* ===== 見た目: 白い画用紙に、カラフルなインクでらくがきしたような雰囲気 =====
     ・線はぜんぶ「墨色のインク」、塗りはマーカーの原色
     ・角丸は手描き風のいびつな形(--rough/--rough2)。影は黒インクのずらし(ぼかさない) */
  :root{
    --paper:#fffdf7;
    --ink:#2b2b2b;
    --sub:#6d6a64;
    --red:#ff4d4d; --org:#ff9f1c; --yel:#ffd23f; --grn:#3bb273; --mint:#2ec4b6; --blu:#3a86ff; --pur:#8338ec; --pnk:#ff5fa2;
    --rough:255px 15px 225px 15px/15px 225px 15px 255px;
    --rough2:15px 225px 15px 255px/255px 15px 225px 15px;
    --uiw:min(94vw,500px);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;
     font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif; }
  body{ min-height:100svh; color:var(--ink);
    background-color:var(--paper);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .4  0 0 0 0 .3  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    display:flex; flex-direction:column; align-items:center;
    user-select:none; -webkit-user-select:none; overflow-x:hidden; }
  html{ overflow-x:hidden; }   /* 横にはみ出した物で画面の幅が変わり、カードの列数がずれるのを防ぐ(2026-10-07) */
  input{ user-select:text; -webkit-user-select:text; }
  /* 背景のらくがき(JSで散らす) */
  #doodles{ position:fixed; inset:0; z-index:-1; pointer-events:none; }
  #doodles svg{ width:100%; height:100%; display:block; }

  .scene{ display:none; width:100%; flex-direction:column; align-items:center; padding:14px 0 40px; }
  .scene.on{ display:flex; animation:sceneIn .34s cubic-bezier(.2,.8,.3,1); }
  @keyframes sceneIn{ 0%{ opacity:0; transform:translateY(18px); } 100%{ opacity:1; transform:none; } }
  #lobbyScene{ padding-top:64px; }
  #gameScene{ padding-top:150px; padding-bottom:290px; }   /* 上下にスクロール余白(全ゲーム共通ルール) */

  /* ===== タイトル ===== */
  .logo{ margin:9vh 0 2px; display:flex; flex-direction:column; align-items:center; line-height:1.05; }
  .logo .l1{ display:flex; gap:.04em; font-size:clamp(34px,9.6vw,54px); font-weight:900; letter-spacing:.02em; }
  .logo .l1 span{ display:inline-block; -webkit-text-stroke:0; }
  .logo .l1 span:nth-child(1){ color:var(--red); transform:rotate(-8deg) translateY(2px); }
  .logo .l1 span:nth-child(2){ color:var(--org); transform:rotate(6deg) translateY(-3px); }
  .logo .l1 span:nth-child(3){ color:var(--grn); transform:rotate(-4deg) translateY(1px); }
  .logo .l1 span:nth-child(4){ color:var(--blu); transform:rotate(9deg) translateY(-2px); }
  .logo .l2{ position:relative; font-size:clamp(46px,13vw,74px); font-weight:900; letter-spacing:.04em; transform:rotate(-2deg); margin-top:4px; }
  .logo .l2::before{ content:""; position:absolute; left:-4%; right:-4%; bottom:10%; height:38%; z-index:-1;
    background:var(--yel); border-radius:var(--rough); transform:rotate(1.5deg); opacity:.9; }
  .t-sub{ font-size:13px; font-weight:800; letter-spacing:.12em; color:var(--sub); margin:16px 0 26px; }
  .room-row{ display:flex; gap:12px; margin-top:6px; }
  .room-row button{ padding:14px 12px; cursor:pointer; width:min(150px,calc((100vw - 46px)/2)); white-space:nowrap;
    background:#fff; color:var(--ink); border:2.5px solid var(--ink); border-radius:var(--rough); box-shadow:3px 4px 0 var(--ink);
    font-size:16px; font-weight:900; letter-spacing:.06em; }
  .room-row button:nth-child(1){ background:#ffe9ef; transform:rotate(-1.5deg); }
  .room-row button:nth-child(2){ background:#e4f4ff; transform:rotate(1.2deg); }
  .room-row button:active{ box-shadow:1px 1px 0 var(--ink); translate:2px 3px; }
  #roomArea{ display:flex; flex-direction:column; align-items:center; gap:6px; width:var(--uiw); margin-top:14px; }
  .dev-box{ margin-top:34px; width:var(--uiw); max-width:380px; border:2px dashed rgba(43,43,43,.4); border-radius:var(--rough2);
    padding:12px 14px 14px; display:flex; flex-direction:column; align-items:center; gap:9px; background:rgba(255,255,255,.6); }
  .dev-box .dev-h{ font-size:11.5px; font-weight:900; letter-spacing:.14em; color:var(--sub); }

  .sec-label{ font-size:12px; font-weight:900; letter-spacing:.22em; color:var(--sub); margin-bottom:9px; }
  .rule-frame{ width:var(--uiw); background:#fff; border:2.5px solid var(--ink); border-radius:var(--rough2); box-shadow:3px 4px 0 var(--ink);
    padding:14px 12px; display:grid; grid-template-columns:1fr 1fr; gap:12px 10px; }
  .rule-col{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .rc-name{ font-size:12px; font-weight:800; letter-spacing:.06em; color:var(--sub); }
  .rc-row{ display:flex; align-items:center; gap:8px; }
  .rc-val{ min-width:72px; text-align:center; font-size:17px; font-weight:900; color:var(--ink); }
  .stp{ width:34px; height:34px; border:2px solid var(--ink); border-radius:var(--rough); cursor:pointer;
    background:#fff; color:var(--ink); font-size:18px; font-weight:900; line-height:1; }
  .stp:active{ translate:1px 2px; }
  .stp:disabled{ opacity:.3; cursor:default; }
  .rule-reset{ display:block; margin:10px auto 0; border:none; background:none; padding:4px 2px;
    font-size:12.5px; font-weight:800; color:var(--ink); text-decoration:underline wavy rgba(43,43,43,.5); text-underline-offset:4px; cursor:pointer; }
  .rule-frame.ro .stp{ opacity:.4; pointer-events:none; }   /* オーナー以外=同じUIを見せて、押せないことをグレーで示す */
  .rule-reset:disabled{ opacity:.4; cursor:default; pointer-events:none; }
  .rule-sum{ font-size:12.5px; font-weight:700; color:var(--sub); text-align:center; line-height:1.7; }

  .btn-main{ width:var(--uiw); max-width:340px; margin-top:14px; padding:13px; cursor:pointer;
    background:var(--yel); color:var(--ink); border:3px solid var(--ink); border-radius:var(--rough2); box-shadow:4px 5px 0 var(--ink);
    font-size:18px; font-weight:900; letter-spacing:.12em; transform:rotate(-.8deg); }
  .btn-main:active{ box-shadow:1px 1px 0 var(--ink); translate:3px 4px; }
  .btn-main:disabled{ filter:grayscale(1); opacity:.5; cursor:default; }
  .txt-btn{ padding:8px 20px; border:2px solid var(--ink); border-radius:var(--rough); box-shadow:2px 3px 0 var(--ink);
    background:#fff; color:var(--ink); font-size:14px; font-weight:800; letter-spacing:.06em; cursor:pointer; white-space:nowrap; }
  .txt-btn:active{ box-shadow:0 0 0 var(--ink); translate:2px 3px; }
  .txt-btn.sel{ background:var(--yel); }
  .txt-btn.deny{ background:var(--red); color:#fff; }
  .txt-btn:disabled{ opacity:.35; cursor:default; }

  /* ===== ロビー ===== */
  .lobby-title{ font-size:19px; font-weight:900; letter-spacing:.06em; margin-bottom:14px; }
  #lobbyBox{ display:flex; flex-direction:column; align-items:center; gap:13px; width:var(--uiw); }
  .lobby-list{ display:flex; flex-direction:column; gap:8px; width:100%; }
  .lobby-row{ display:flex; align-items:center; gap:10px; background:#fff; border:2px solid var(--ink); border-radius:var(--rough);
    padding:8px 14px; font-size:15px; font-weight:800; }
  .lobby-row:nth-child(even){ border-radius:var(--rough2); }
  .lobby-row .nm{ flex:1; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lobby-row .nm.undef{ opacity:.42; font-weight:700; }
  .p-dot{ width:13px; height:13px; border-radius:50%; flex:none; border:1.5px solid var(--ink); }
  .p-dot.mine{ cursor:pointer; }   /* 自分の丸は押すと色を変えられる(大きさはほかの人と同じ) */
  .lobby-row .hostmark{ flex:none; font-size:11px; font-weight:900; color:var(--ink); background:var(--yel); border:1.5px solid var(--ink); border-radius:999px; padding:1px 9px 2px; }
  .lobby-row .you{ flex:none; font-size:11px; font-weight:900; color:#fff; background:var(--ink); border-radius:999px; padding:2px 10px 3px; }
  .lobby-row .kick-btn{ flex:none; font-size:11px; font-weight:900; color:var(--red); background:#fff;
    border:1.5px solid var(--red); border-radius:999px; padding:3px 10px; cursor:pointer; }
  .lobby-row .give-btn{ flex:none; font-size:11px; font-weight:900; color:var(--ink); background:#fff;
    border:1.5px solid var(--ink); border-radius:999px; cursor:pointer; }
  .lobby-row .kick-btn, .lobby-row .give-btn{ width:86px; padding:3px 0; text-align:center; white-space:nowrap; }   /* 譲渡・追放は同じ固定サイズ(2026-09-28) */
  .lobby-row .nm.mine{ flex:0 1 auto; cursor:pointer; text-decoration:underline dotted rgba(43,43,43,.4); text-underline-offset:3px; }   /* 自分の名前=押すと名前を変えられる */
  .lobby-row .nm-pen{ flex:1; display:flex; align-items:center; cursor:pointer; opacity:.45; }
  .lobby-row .nm-pen svg{ width:14px; height:14px; }
  .code-row{ display:flex; align-items:center; gap:8px; }
  .code-input{ width:170px; padding:10px 14px; border:2.5px solid var(--ink); border-radius:var(--rough2);
    background:#fff; color:var(--ink); font-size:19px; font-weight:900; letter-spacing:.24em; text-align:center; }
  .paste-btn{ width:42px; height:42px; border:none; background:none; color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center; }
  .paste-btn svg{ width:22px; height:22px; }
  .code-show{ display:flex; align-items:center; gap:10px; justify-content:center; cursor:pointer; background:#fff;
    border:2.5px solid var(--ink); border-radius:var(--rough); box-shadow:3px 4px 0 var(--ink); padding:9px 22px; font-size:27px; font-weight:900; letter-spacing:.28em; }
  .code-show svg{ width:19px; height:19px; opacity:.7; }
  .room-note{ font-size:12.5px; font-weight:700; letter-spacing:.05em; color:var(--sub); text-align:center; }
  .room-note.err{ color:var(--red); }

  /* ===== ゲーム ===== */
  .top-bar{ width:var(--uiw); display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; margin-bottom:10px; }
  .top-bar>:first-child{ justify-self:start; }
  .top-bar>:last-child{ justify-self:end; }
  .pill{ font-size:12.5px; font-weight:900; letter-spacing:.06em; background:#fff; border:2px solid var(--ink);
    border-radius:var(--rough); padding:4px 12px; white-space:nowrap; transform:rotate(-2deg); }
  .phase-tag{ font-size:16px; font-weight:900; letter-spacing:.06em; white-space:nowrap;
    background:linear-gradient(transparent 55%, rgba(255,210,63,.85) 55%, rgba(255,210,63,.85) 92%, transparent 92%); padding:0 4px; }
  .timer{ font-size:23px; font-weight:900; letter-spacing:.04em; font-variant-numeric:tabular-nums; }
  .timer.warn{ color:var(--red); }
  /* メンバーリスト=決まったサイズのグリッド(2026-10-02・盤上人狼と同じ考え方)。名前は省略表示・右下に状態 */
  .roster{ width:var(--uiw); display:grid; grid-template-columns:repeat(auto-fill,108px); justify-content:center; gap:7px; margin-bottom:12px; }
  .ros{ width:108px; height:48px; display:flex; flex-direction:column; justify-content:space-between; padding:5px 8px;
    background:#fff; border:2px solid var(--ink); border-radius:var(--rough); font-size:12.5px; font-weight:800; }
  .ros:nth-child(even){ border-radius:var(--rough2); }
  .ros .rt{ display:flex; align-items:center; gap:5px; min-width:0; }
  .ros .nm{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:left; }
  .ros .av{ width:13px; height:13px; border-radius:50%; flex:none; border:1.5px solid var(--ink); }
  .ros .rb{ display:flex; justify-content:flex-end; align-items:center; height:16px; }
  .ros .sc{ width:44px; text-align:right; font-size:12px; font-weight:900; }
  /* 「決定」「完成」の印=マーカーで線を引いたような手描きの印(2026-10-07・この作品の画用紙の見た目に合わせた) */
  .ros .ok{ width:46px; display:inline-flex; align-items:center; justify-content:center; gap:1px; font-size:10.5px; font-weight:900; color:var(--ink); line-height:15px;
    background:linear-gradient(transparent 45%, rgba(59,178,115,.55) 45%, rgba(59,178,115,.55) 92%, transparent 92%); transform:rotate(-4deg); }
  .ros .ok svg{ width:11px; height:11px; flex:none; }
  .ros.me{ background:#e4f4ff; }
  .ros.turn{ background:var(--yel); box-shadow:2px 3px 0 var(--ink); transform:rotate(-1.5deg); }
  .ros.gone{ opacity:.35; }
  .ros.gone .nm{ text-decoration:line-through; }
  .status{ font-size:16px; font-weight:900; letter-spacing:.06em; text-align:center; margin:2px 0 12px; min-height:24px; }
  .status span{ padding:0 6px; background:linear-gradient(transparent 50%, var(--pc,var(--yel)) 50%, var(--pc,var(--yel)) 90%, transparent 90%); }
  .hint{ font-size:13.5px; font-weight:800; letter-spacing:.04em; text-align:center; line-height:1.7; }
  .hint.sub{ font-size:12px; font-weight:700; color:var(--sub); }
  .sub-btns{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .sub-btns .txt-btn{ min-width:120px; }

  /* お題づくり */
  #topicBox{ display:none; width:var(--uiw); flex-direction:column; align-items:center; gap:10px; }
  #topicBox.on{ display:flex; }
  .tp-row{ display:flex; gap:8px; align-items:center; width:100%; max-width:400px; }
  .tp-in{ flex:1; min-width:0; padding:10px 13px; border:2.5px solid var(--ink); border-radius:var(--rough2); font-size:16px; font-weight:800;
    background:#fff; color:var(--ink); }
  .tp-in:focus{ outline:none; box-shadow:3px 4px 0 var(--blu); }
  .tp-in:disabled{ opacity:.55; }
  .tp-row .txt-btn{ padding:8px 13px; font-size:13px; }

  /* おえかき(2026-10-02作り直し)
     自分の描く絵を横に並べる。まん中の1枚=いま描いている絵・ほかは左右に小さく、ぼかして置く(押すとまん中に来る) */
  #drawBox{ display:none; width:100%; flex-direction:column; align-items:center; gap:10px; }
  #drawBox.on{ display:flex; }
  .dr-topic{ width:var(--F,320px); text-align:right; margin:-6px 0 -9px; font-size:13px; font-weight:800; color:var(--sub); letter-spacing:.06em; min-height:19px; font-variant-numeric:tabular-nums; }   /* 「N / M」=絵の枠の外の右上(2026-10-07) */
  .dr-word{ font-size:clamp(22px,6.4vw,30px); font-weight:900; letter-spacing:.06em; text-align:center; line-height:1.35; padding:0 8px; max-width:var(--uiw);
    background:linear-gradient(transparent 58%, rgba(255,95,162,.45) 58%, rgba(255,95,162,.45) 92%, transparent 92%); transform:rotate(-1.5deg); word-break:break-all; }
  .dr-word.free{ font-size:clamp(18px,5vw,23px); background:linear-gradient(transparent 58%, rgba(58,134,255,.35) 58%, rgba(58,134,255,.35) 92%, transparent 92%); }
  .dr-strip{ position:relative; width:100%; height:calc(var(--F,320px) + 14px); overflow:hidden; flex:none; }
  .dr-slot{ position:absolute; left:50%; top:2px; width:var(--F,320px); height:var(--F,320px); transform-origin:50% 50%;
    background:#fff; border:none; border-radius:8px; overflow:hidden; cursor:pointer;
    filter:blur(1.2px) saturate(.55); opacity:.48;
    transition:transform .42s cubic-bezier(.25,.85,.3,1), filter .3s, opacity .3s; }
  .dr-slot.focus{ filter:none; opacity:1; cursor:default; }
  /* 絵のふち=1枚ぶんの時間のゲージ(2026-10-07)。うすい線の上の墨の線が、その絵の時間に合わせて減っていく */
  .dr-slot .gauge{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  .gauge .g-tr{ fill:none; stroke:rgba(43,43,43,.16); stroke-width:3; }
  .gauge .g-v{ fill:none; stroke:var(--ink); stroke-width:3; stroke-dasharray:100 100; transition:stroke-dashoffset .22s linear, stroke .3s; }
  .gauge .g-v.low{ stroke:var(--red); }
  .dr-slot canvas{ display:block; width:100%; height:100%; touch-action:none; pointer-events:none; }
  .dr-slot.focus canvas{ pointer-events:auto; cursor:crosshair; }
  .dr-strip.t-pen .dr-slot.focus canvas, .dr-strip.t-erase .dr-slot.focus canvas{ cursor:none; }
  /* カーソルを合わせると、いまの太さ・色で描かれる丸を出す(マウスだけ) */
  #penGhost{ position:fixed; z-index:70; display:none; pointer-events:none; border-radius:50%; transform:translate(-50%,-50%);
    border:1.5px solid rgba(43,43,43,.85); box-shadow:0 0 0 1px rgba(255,255,255,.9); }

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const TAPW=(window.matchMedia&&matchMedia("(pointer:coarse)").matches)?"タップ":"クリック";
window.__TAPW=TAPW;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ================= 効果音(全合成) ================= */
let actx=null, seBus=null, noiseBuf=null;
let seOn=true; try{ seOn=localStorage.getItem("os.se")!=="0"; }catch(e){}
function ensureAudio(){
  if(!actx){
    try{
      actx=new (window.AudioContext||window.webkitAudioContext)();
      seBus=actx.createGain(); seBus.gain.value=seOn?1:0; seBus.connect(actx.destination);
      const len=actx.sampleRate; noiseBuf=actx.createBuffer(1,len,actx.sampleRate);
      const d=noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    }catch(e){}
  }
  if(actx&&actx.state!=="running"){ try{ actx.resume(); }catch(e){} }
}
/* スマホで音の箱が勝手に止まっても、触った時・戻ってきた時に起こし直す(全ゲーム共通の対策) */
function audioWake(){ try{ ensureAudio(); }catch(e){} }
["pointerdown","touchend","keydown"].forEach(function(t){ document.addEventListener(t,audioWake,{capture:true,passive:true}); });
document.addEventListener("visibilitychange",function(){ if(!document.hidden) audioWake(); });
window.addEventListener("pageshow",audioWake);
window.addEventListener("focus",audioWake);
function note(f,t,dur,vol,type,f2){
  if(!actx||document.hidden) return;              // 画面が裏にある間(別のタブ・アプリを見ている間)は鳴らさない
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.006); g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(g); g.connect(seBus); o.start(t); o.stop(t+dur+0.02);
}
function noiseHit(t,f1,f2,q,vol,dur){
  if(!actx||document.hidden) return;
  const n=actx.createBufferSource(); n.buffer=noiseBuf;

function VID(){ if(debug){ if(G&&G.phase==="match") return G.turn; return dbgActor; } return myId; }

/* ================= ホスト側の進行 ================= */
function newGame(members){
  const n=members.length, k=Math.max(1,Math.min(rules.k, Math.floor(MAX_PAIRS/Math.max(1,n))));
  G={ gid:Math.random().toString(36).slice(2,8), rules:Object.assign({},rules,{k}),
      players:members.map((m,i)=>({ id:m.id, n:m.n||("P"+(i+1)), c:m.c||PCOL[i%PCOL.length], score:0, gone:false })),
      phase:"topic", sk:0, stepEnd:0, topics:{}, tp:[], cards:[], board:[], pairTotal:0, taken:{},
      turn:"", flip:[], resAt:0, getN:0, missN:0, last:null, drawEnd:0, ready:{} };
  startStep("topic");
}
function stepMs(){ if(debug) return 0; if(G.phase==="topic") return G.rules.topic*1000; if(G.phase==="match") return G.rules.turn*1000; if(G.phase==="draw") return G.rules.draw*1000; return 0; }
function startStep(ph){ G.phase=ph; G.sk++; const ms=stepMs(); G.stepEnd=ms? Date.now()+ms : 0; bump(); }
function hostTick(){
  if(gallery) return;                          // ★シーン一覧の間は進行を止める
  if(!G || !(isHost||debug) || G.phase==="over") return;
  const now=Date.now();
  if(G.phase==="topic" && G.stepEnd && now>=G.stepEnd) finishTopics();
  else if(G.phase==="draw" && G.drawEnd && now>=G.drawEnd) forceDrawEnd();
  else if(G.phase==="match"){
    if(G.resAt && now>=G.resAt) resolveFlip();
    else if(!G.resAt && G.stepEnd && now>=G.stepEnd) turnTimeout();
  }
}

/* --- お題づくり --- */
function allTopicsIn(){ return activePs().every(p=>G.topics[p.id]); }
function randomTopics(n,avoid){
  const used=new Set(avoid), pool=shuffle(OMAKASE.filter(t=>!used.has(t))), out=[];
  for(let i=0;i<n;i++) out.push(pool[i]||("お題"+(i+1)));
  return out;
}
function finishTopics(){                     // 締め切り or 全員そろった: 足りない分はおまかせで埋めて割り振りへ
  const k=G.rules.k, all=[];
  activePs().forEach(p=>{
    let l=(G.topics[p.id]||[]).map(clampTopic).filter(Boolean).slice(0,k);
    if(l.length<k) l=l.concat(randomTopics(k-l.length, all.concat(l)));
    G.topics[p.id]=l; l.forEach(t=>all.push(t));
  });
  G.tp=[]; activePs().forEach(p=>G.topics[p.id].forEach(t=>G.tp.push({ t, by:p.id })));
  buildCards();
  startDraw();
}
/* --- 描き手の割り振り(きまりはファイル冒頭のコメント) ---
   tps=[{t,by}]・ids=描ける人のid。戻り値={ res:[[a,b],…](お題ごとの2人), load:{id:枚数} } */
function assignDrawers(tps,ids){
  const n=ids.length, m=tps.length, res=new Array(m), load={};
  const tryOnce=(excludeAuthor,cap)=>{
    ids.forEach(i=>load[i]=0);
    for(const ti of shuffle(tps.map((_,i)=>i))){
      const cand=shuffle(ids.filter(i=>(!excludeAuthor||i!==tps[ti].by) && load[i]<cap)).sort((a,b)=>load[a]-load[b]);   // 少ない人から(同数はランダム)
      if(cand.length<2) return false;
      res[ti]=[cand[0],cand[1]]; load[cand[0]]++; load[cand[1]]++;
    }
    return true;
  };
  const cap=Math.ceil(2*m/Math.max(1,n));
  if(n>=3){ for(let t=0;t<400;t++) if(tryOnce(true,cap)) return { res, load:Object.assign({},load) }; }   // ① 本人以外から・均等に
  for(let t=0;t<400;t++) if(tryOnce(false,cap)) return { res, load:Object.assign({},load) };            // ② 本人も含めてよい
  for(let t=0;t<400;t++) if(tryOnce(false,m)) return { res, load:Object.assign({},load) };              // (保険) 上限なし
  return null;
}
function buildCards(){
  const ids=activePs().map(p=>p.id), a=assignDrawers(G.tp, ids);
  const cards=[]; let k=0;
  const mk=(tp,dr)=>{ cards.push({ id:G.gid+"-"+(k++), tp, dr, q:0, done:false, gone:false }); };
  if(a){ G.tp.forEach((t,i)=>{ mk(i,a.res[i][0]); mk(i,a.res[i][1]); }); }
  /* ★フェイク(お題なしの絵)は2026-10-07に廃止。1人◯個のお題なので、ふつうは全員ぴったり同じ枚数になる */
  /* 1人ぶんの描く順番はシャッフル */
  ids.forEach(i=>{ shuffle(cards.filter(c=>c.dr===i)).forEach((c,qi)=>c.q=qi); });
  G.cards=cards;
}
/* --- おえかき --- */
function myCards(id){ return G.cards.filter(c=>c.dr===id && !c.gone).sort((a,b)=>a.q-b.q); }
function startDraw(){
  G.phase="draw"; G.sk++; G.ready={};
  G.stepEnd= debug? 0 : Date.now()+G.rules.draw*1000;            // おえかきの時間は全体でN秒(全員同じ締め切り)
  G.drawEnd= debug? 0 : G.stepEnd+DRAW_GRACE;                     // ホスト側の最後の保険: 締め切りのあと少し待っても届かない絵は白紙
  bump();
}
function hostCardDone(cid){
  const c=cById(cid); if(!c||c.done) return;
  c.done=true; if(!(cid in arts)) arts[cid]="";
  if(G.phase==="draw" && drawAllIn()) startMatch(); else bump();
}
/* 全員が「完成」を押した=その場でおえかきを終える(各自の端末が時間切れと同じ扱いで絵を確定して送る) */
function allReady(){ return activePs().every(p=>G.ready&&G.ready[p.id]); }
function endDrawNow(){ const now=Date.now(); if(G.stepEnd&&G.stepEnd<=now) return; G.stepEnd=now; G.drawEnd=now+DRAW_GRACE; bump(); }
function forceDrawEnd(){                      // 保険の締め切り: 届いていない絵は白紙にする
  G.cards.forEach(c=>{ if(!c.done&&!c.gone&&!drGone(c)){ c.done=true; if(!(c.id in arts)) arts[c.id]=""; } });
  startMatch();
}
/* --- 神経衰弱 --- */
function startMatch(){
  /* ★ペアにならないカードは盤に出さない(2026-10-07・フェイクの仕様をなくした)。途中で抜けた人の相方・同じお題が奇数枚の余りは取り除く */
  const keep={}, live=[];
  G.cards.forEach(c=>{ if(!c.done&&!c.gone&&drGone(c)) c.gone=true; });   // 抜けたままの人の描けていないカードは取り除く
  G.cards.filter(c=>!c.gone).forEach(c=>{ const k=cardKey(c); if(!k) return; (keep[k]=keep[k]||[]).push(c); });
  Object.values(keep).forEach(a=>{ a.slice(0, a.length-(a.length%2)).forEach(c=>live.push(c)); });
  G.board=shuffle(live.map(c=>c.id));
  /* ペアは「お題の文字が同じ2枚」(別の人がたまたま同じお題を出したら、その4枚はどの2枚でもペア=2組ぶん)。
     余った1枚(相方を失った・同じお題が奇数枚)はフェイクと同じく、ペアにならないまま残る */
  const cnt={}; live.forEach(c=>{ const k=cardKey(c); if(k) cnt[k]=(cnt[k]||0)+1; });
  G.pairTotal=Object.values(cnt).reduce((s2,v)=>s2+Math.floor(v/2),0);
  G.taken={}; G.flip=[]; G.resAt=0; G.drawEnd=0;
  const ap=activePs(); G.turn= ap.length? pick(ap).id : "";      // 最初の手番はランダム
  G.phase="match";
  if(!G.pairTotal){ finishGame(); return; }
  startStep("match");
}
function normTopic(t){ return String(t||"").normalize("NFKC").replace(/\s+/g,"").toLowerCase()   // 全角半角・大文字小文字・空白の違いは同じとみなす
  .replace(/[\u30a1-\u30f6]/g,ch2=>String.fromCharCode(ch2.charCodeAt(0)-0x60)); }                      // カタカナもひらがなと同じとみなす(リンゴ=りんご)
function cardKey(c){ return (c && c.tp>=0 && G.tp[c.tp])? normTopic(G.tp[c.tp].t) : ""; }   // フェイクは""=どれともペアにならない
function isPair(a,b){ const ka=cardKey(cById(a)); return !!ka && a!==b && ka===cardKey(cById(b)); }
function takenPairs(){ return Math.floor(Object.keys(G.taken).length/2); }
function resolveFlip(){
  const [a,b]=G.flip; G.resAt=0;
  if(a && b && isPair(a,b)){
    const tp=cById(a).tp;
    G.taken[a]=G.turn; G.taken[b]=G.turn; const p=pById(G.turn); if(p) p.score++;
    G.getN++; G.last={ tp, by:G.turn, a, b }; G.flip=[];
    if(takenPairs()>=G.pairTotal){ finishGame(); return; }
    startStep("match");                        // そろえた人がもう一度
  }else{
    G.missN++; G.flip=[]; nextTurn();
  }
}
function nextTurn(){
  const ap=G.players.filter(p=>!p.gone); if(!ap.length){ finishGame(); return; }
  const i=G.players.findIndex(p=>p.id===G.turn);
  for(let s=1;s<=G.players.length;s++){ const q=G.players[(i+s)%G.players.length]; if(!q.gone){ G.turn=q.id; break; } }
  startStep("match");
}
function turnTimeout(){ G.flip=[]; G.resAt=0; G.missN++; nextTurn(); }
function finishGame(){ G.phase="over"; G.sk++; G.stepEnd=0; G.resAt=0; G.flip=[]; bump(); }

function hostAct(a){
  if(!G) return;
  const p=pById(a.from); if(!p||p.gone) return;
  if(a.t==="topics" && G.phase==="topic"){
    const l=(Array.isArray(a.l)?a.l:[]).map(clampTopic).slice(0,G.rules.k);
    if(l.length<G.rules.k || l.some(x=>!x)) return;
    G.topics[p.id]=l; if(allTopicsIn()) finishTopics(); else bump(); return;
  }
  if(a.t==="untopics" && G.phase==="topic"){ delete G.topics[p.id]; bump(); return; }   // キャンセル(入れ直す)
  /* 完成=「いつ終わってもよい」の合図(押したあとも描ける・もう一度押すとキャンセル)。全員そろったら終わる */
  if(a.t==="ready" && G.phase==="draw"){ G.ready=G.ready||{}; G.ready[p.id]=1; if(allReady()) endDrawNow(); else bump(); return; }
  if(a.t==="unready" && G.phase==="draw"){ if(G.ready) delete G.ready[p.id]; bump(); return; }
  if(a.t==="flip" && G.phase==="match"){
    if(a.sk!==G.sk || p.id!==G.turn || G.resAt || G.flip.length>=2) return;
    if(!G.board.includes(a.cid) || G.taken[a.cid] || G.flip.includes(a.cid)) return;
    G.flip.push(a.cid);
    if(G.flip.length===2) G.resAt=Date.now()+REVEAL_MS;
    bump(); return;
  }
}
function bump(){ sendSnap(); render(); }

/* ================= 絵のデータ(描いた操作の記録) =================
   座標は0〜255に丸める。先頭1バイト=形式(3)。1つの操作=[種類, R, G, B, 不透明度, 太さ×10, 点の数(2バイト), x,y,x,y…] をbase64に
   種類: 0ペン 1消しゴム 2四角(2点) 3丸(2点) 4塗りつぶし(1点) 5全部消す
   ★描く時はいつも ART_R(720px四方) のキャンバスで描く=塗りつぶしの結果がどの画面でも同じになる。カードなど小さい所へは縮めて写す */
const ART_N=256, ART_R=720, MAX_PTS=30000, FILL_MAX=80, ERASE_MUL=2;
/* 規定の色(19色+自由な色=10×2)。上の段=明るい色・下の段=暗い色で、列ごとに同じ色みをそろえる(2026-10-07)
   白黒 / 灰 / 赤 / 薄赤 / 橙・茶 / 黄・黄土 / 緑 / 水・青 / 桃 / 紫(下の段の最後は自由な色) */
const INK=["#ffffff","#aaaaaa","#ff0013","#feafa8","#ff7829","#ffc126","#11b03c","#26c9ff","#ff008f","#8a3ffc",
  "#000000","#666666","#990000","#cb5a57","#964112","#b0701c","#017420","#0050cd","#99004e"];
const PEN_LV=[2,3.5,6,10.5,18], PEN_DEF=2, W_DEF=6;   // ペンの太さは5段階(256マス基準・×1.75刻み)。消しゴムはこの2倍
const OPK={ pen:0, erase:1, rect:2, oval:3, fill:4, clear:5 }, OPN=["pen","erase","rect","oval","fill","clear"];
const hex2=v=>("0"+Math.max(0,Math.min(255,v|0)).toString(16)).slice(-2);
function encodeArt(st){
  let n=1; st.forEach(s2=>n+=8+(s2.p?s2.p.length:0)); const b=new Uint8Array(n); let o=0; b[o++]=3;
  st.forEach(s2=>{ const pp=s2.p||[], np=pp.length/2, c=/^#[0-9a-f]{6}$/i.test(s2.col||"")? s2.col : "#000000";
    b[o++]=OPK[s2.k]|0; b[o++]=parseInt(c.slice(1,3),16); b[o++]=parseInt(c.slice(3,5),16); b[o++]=parseInt(c.slice(5,7),16);
    b[o++]=Math.round(Math.max(0,Math.min(1,s2.a==null?1:s2.a))*255); b[o++]=Math.max(1,Math.min(250,Math.round((s2.w||W_DEF)*10)));
    b[o++]=np>>8; b[o++]=np&255; for(const v of pp) b[o++]=v; });
  let str=""; for(let i=0;i<b.length;i+=8192) str+=String.fromCharCode.apply(null,b.subarray(i,i+8192));

function decodeArt(d){
  if(!d) return []; let bin=""; try{ bin=atob(d); }catch(e){ return []; }
  const ver=bin.charCodeAt(0), out=[]; let o=1, B=i=>bin.charCodeAt(i);
  if(ver===2){                                   // 1つ前の形式(ペンと消しゴムだけ)

/* 塗りつぶし: 押した所と同じ色(少しの差は同じとみなす)のつながった所を塗る。線のふちのすき間が残らないよう1px広げる */
function floodFill(ctx,px,py,col,a,sc){
  const W=ctx.canvas.width, H=ctx.canvas.height;
  const x0=Math.max(0,Math.min(W-1,Math.floor((px+.5)*sc))), y0=Math.max(0,Math.min(H-1,Math.floor((py+.5)*sc)));
  const img=ctx.getImageData(0,0,W,H), d=img.data, i0=(y0*W+x0)*4, tr=d[i0], tg=d[i0+1], tb=d[i0+2];
  const fr=parseInt(col.slice(1,3),16)||0, fg=parseInt(col.slice(3,5),16)||0, fb=parseInt(col.slice(5,7),16)||0;
  if(a>=.99 && Math.abs(fr-tr)+Math.abs(fg-tg)+Math.abs(fb-tb)<6) return;
  const TOL=96, m=new Uint8Array(W*H);
  const same=p=>{ const q=p*4; return Math.abs(d[q]-tr)+Math.abs(d[q+1]-tg)+Math.abs(d[q+2]-tb)<=TOL; };
  const stack=[x0,y0];
  while(stack.length){
    const y=stack.pop(); let x=stack.pop(), p=y*W+x;
    if(m[p]) continue;
    while(x>0 && !m[p-1] && same(p-1)){ x--; p--; }
    let up=false, dn=false;
    while(x<W && !m[p] && same(p)){
      m[p]=1;
      if(y>0){ const q=p-W; if(!m[q]&&same(q)){ if(!up){ stack.push(x,y-1); up=true; } } else up=false; }
      if(y<H-1){ const q=p+W; if(!m[q]&&same(q)){ if(!dn){ stack.push(x,y+1); dn=true; } } else dn=false; }
      x++; p++;
    }
  }
  const N=W*H;
  for(let p=0;p<N;p++){
    let on=m[p]===1;
    if(!on){ const x=p%W; on=(x>0&&m[p-1]===1)||(x<W-1&&m[p+1]===1)||(p>=W&&m[p-W]===1)||(p<N-W&&m[p+W]===1); }
    if(on){ const q=p*4; d[q]+=(fr-d[q])*a; d[q+1]+=(fg-d[q+1])*a; d[q+2]+=(fb-d[q+2])*a; d[q+3]=255; }
  }
  ctx.putImageData(img,0,0);
}
function paintOp(ctx,s2,sc){
  const k=s2.k, pp=s2.p||[], a=s2.a==null?1:s2.a;
  if(k==="clear"){ ctx.globalAlpha=1; ctx.fillStyle="#fff"; ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height); return; }
  if(k==="fill"){ if(pp.length>=2) floodFill(ctx,pp[0],pp[1],s2.col||"#000000",a,sc); return; }
  ctx.save();
  ctx.globalAlpha= k==="erase"? 1 : a;
  ctx.strokeStyle= k==="erase"? "#fff" : (s2.col||"#000000"); ctx.fillStyle=s2.col||"#000000";
  ctx.lineWidth=(s2.w||W_DEF)*(k==="erase"?ERASE_MUL:1)*sc; ctx.lineCap="round"; ctx.lineJoin= k==="rect"? "miter" : "round";
  if(k==="rect"||k==="oval"){
    if(pp.length>=4){ const x0=(pp[0]+.5)*sc, y0=(pp[1]+.5)*sc, x1=(pp[2]+.5)*sc, y1=(pp[3]+.5)*sc; ctx.beginPath();
      if(k==="rect") ctx.rect(Math.min(x0,x1),Math.min(y0,y1),Math.abs(x1-x0),Math.abs(y1-y0));
      else ctx.ellipse((x0+x1)/2,(y0+y1)/2,Math.abs(x1-x0)/2,Math.abs(y1-y0)/2,0,0,Math.PI*2);
      ctx.fill(); }   // 四角・丸は塗りつぶし(2026-10-07)
    ctx.restore(); return;
  }
  if(pp.length>=2){
    ctx.beginPath(); ctx.moveTo((pp[0]+.5)*sc,(pp[1]+.5)*sc);
    if(pp.length===2) ctx.lineTo((pp[0]+.5)*sc+0.01,(pp[1]+.5)*sc);
    for(let i=2;i<pp.length;i+=2) ctx.lineTo((pp[i]+.5)*sc,(pp[i+1]+.5)*sc);
    ctx.stroke();
  }
  ctx.restore();
}

const AUTO_INK=INK.filter(c=>["#ffffff","#aaaaaa","#feafa8"].indexOf(c)<0);   // 自動の絵に白などは使わない
/* ★試作用: 自動のおえかき。同じお題なら似た絵になる(1人で神経衰弱まで確かめるため) */
function autoArt(seedStr){
  let h=2166136261; for(const ch2 of String(seedStr)) h=Math.imul(h^ch2.charCodeAt(0),16777619)>>>0;
  const rnd=()=>{ h^=h<<13; h>>>=0; h^=h>>>17; h^=h<<5; h>>>=0; return (h>>>0)/4294967296; };
  const jit=()=>(Math.random()-.5)*14, st=[], col=AUTO_INK[Math.floor(rnd()*AUTO_INK.length)], shapes=2+Math.floor(rnd()*3);
  for(let k=0;k<shapes;k++){
    const cx=40+rnd()*176, cy=40+rnd()*176, r=18+rnd()*46, kind=Math.floor(rnd()*3), pp=[];
    const cl=v=>Math.max(0,Math.min(255,Math.round(v)));
    if(kind===0){ for(let a2=0;a2<=24;a2++){ const t=a2/24*Math.PI*2; pp.push(cl(cx+jit()*.3+Math.cos(t)*r), cl(cy+jit()*.3+Math.sin(t)*r)); } }
    else if(kind===1){ const n=3+Math.floor(rnd()*3); for(let a2=0;a2<=n;a2++){ const t=a2/n*Math.PI*2+rnd(); pp.push(cl(cx+Math.cos(t)*r+jit()), cl(cy+Math.sin(t)*r+jit())); } }
    else { for(let a2=0;a2<6;a2++){ pp.push(cl(cx-r+a2*r/2.5+jit()), cl(cy+(a2%2?r*.6:-r*.6)+jit())); } }
    st.push({ k:"pen", col:k===0?col:AUTO_INK[Math.floor(rnd()*AUTO_INK.length)], a:1, w:3+rnd()*6, p:pp });
  }
  return st;
}

  const T=G.rules.draw*1000, el=Math.max(0,T-Math.max(0,localEnd-Date.now()));

}
/* ゲージ: 絵ごとに「その絵の番の時間」の残り。移動してほかの絵を描いていても、時間の来た絵のふちで減っていく(2026-10-07) */
function gaugeTick(){
  const n=strip.cids.length; if(!n||!G) return;
  const T=G.rules.draw*1000, L=T/n, live=!!G.stepEnd && !debug;
  const el= live? Math.max(0,T-Math.max(0,localEnd-Date.now())) : 0;
  strip.els.forEach((s2,i)=>{ const g=s2.querySelector(".g-v"); if(!g) return;
    const f= live? Math.max(0,Math.min(1,((i+1)*L-el)/L)) : 1;
    const off=(100*(1-f)).toFixed(2); if(g._o!==off){ g._o=off; g.style.strokeDashoffset=off; }
    g.classList.toggle("low", live && f>0 && f<1 && ((i+1)*L-el)<=5000); });
}

function moveGhost(e,cv2,i){

function shapeTo(q){                           // 図形: Shiftを押している間は正方形・正円

    let m=Math.max(Math.abs(dx),Math.abs(dy)); m=Math.min(m, gx>0?255-s.sx:s.sx, gy>0?255-s.sy:s.sy);
    x=s.sx+gx*m; y=s.sy+gy*m; }

function preview(){ if(!stroke) return; const c=stroke.cv.getContext("2d"); c.globalAlpha=1; c.drawImage(baseCv,0,0); paintOp(c, stroke, ART_R/ART_N); }
function endStroke(cv2){

  if(flat){ const c=s.cv.getContext("2d"); c.drawImage(baseCv,0,0); }
  else { (drafts[s.cid]=drafts[s.cid]||[]).push({ k:s.k, col:s.col, a:s.a, w:s.w, p:s.p.slice() }); redo[s.cid]=[]; }

function wireCanvas(cv2,i){
  const pt=e=>{ const r=cv2.getBoundingClientRect(), x=(e.clientX-r.left)/r.width*ART_N, y=(e.clientY-r.top)/r.height*ART_N;
    return { x:Math.max(0,Math.min(255,Math.round(x-.5))), y:Math.max(0,Math.min(255,Math.round(y-.5))) }; };
  cv2.addEventListener("pointerdown",e=>{
    if(i!==strip.cur||!curCid||localDone[curCid]||stroke) return;
    e.preventDefault(); e.stopPropagation(); ensureAudio();
    const q=pt(e), ops=drafts[curCid]=drafts[curCid]||[];
    if(tool==="fill"){
      if(ops.filter(o=>o.k==="fill").length>=FILL_MAX){ toast("塗りつぶしはこれ以上使えません"); return; }
      const op={ k:"fill", col:penCol, a:penA, w:1, p:[q.x,q.y] }; ops.push(op); redo[curCid]=[];
      paintOp(cv2.getContext("2d"), op, ART_R/ART_N); playTick(); resetClear(); pushRecent(penCol); updateTools(); return;
    }
    if(ptCount(curCid)>=MAX_PTS){ toast("これ以上描けません"); return; }
    try{ cv2.setPointerCapture(e.pointerId); }catch(_){}
    baseCtx.globalAlpha=1; baseCtx.drawImage(cv2,0,0);
    const shape=tool==="rect"||tool==="oval";
    stroke={ k:tool, col:penCol, a:tool==="erase"?1:penA, w:penW(), p:shape?[q.x,q.y,q.x,q.y]:[q.x,q.y], cv:cv2, cid:curCid, sx:q.x, sy:q.y, lp:q, shift:e.shiftKey };
    preview(); resetClear();

  });

      const pp=stroke.p, lx=pp[pp.length-2], ly=pp[pp.length-1];
      if(Math.hypot(q.x-lx,q.y-ly)<1.2) return;

      pp.push(q.x,q.y);

  cv2.addEventListener("pointerleave",hideGhost);
}

let gridW=0;
function stableW(){ const d=document.documentElement; return Math.min(window.innerWidth||9999, (d&&d.clientWidth)||9999); }
function layoutGrid(force){
  const g=$("grid"), n=G? G.board.length : 0; if(!n) return;
  const W=stableW(); if(!force && gridW && Math.abs(W-gridW)<30) return;   // ★幅が少し揺れただけでは並べ直さない(スマホで列数が行ったり来たりするのを防ぐ)

  const maxC=Math.max(2, Math.floor((avail+GAP)/(70+GAP)));
  const c0=Math.ceil(Math.sqrt(n)); let best=Math.min(c0,maxC), bestE=1e9;

  const w=Math.min(128, (avail-(best-1)*GAP)/best);
  g.style.gridTemplateColumns="repeat("+best+","+w.toFixed(1)+"px)";
}

function paintCardArt(cv2,cid){

   ロボットはお題を出す・絵を描く(自動の絵)・完成を押す・神経衰弱でめくる(見たカードをある程度おぼえる) */
let solo=false, cpuAt={}, cpuMem={}, cpuObs={}, cpuGid="";
const isCpu=id=>/^cpu/.test(id||"");
const rint=(a,b)=>a+Math.random()*(b-a);
function startSolo(n,k){

function cpuFinishCards(){                     // おえかきの終わり: ロボットの絵を確定する
  G.cards.forEach(c=>{ if(c.done||c.gone||!isCpu(c.dr)) return;
    if(!(c.id in arts)) arts[c.id]=""; localDone[c.id]=true; hostCardDone(c.id); });   // ロボットは描かない=白紙(カードにはお題の文字が出る・2026-10-10)
}
function cpuTick(){
  if(!solo||!G||gallery||G.phase==="over") return;
  if(cpuGid!==G.gid){ cpuGid=G.gid; cpuAt={}; cpuMem={}; cpuObs={}; }
  const now=Date.now(), cpus=activePs().filter(p=>isCpu(p.id));
  if(G.phase==="topic"){
    cpus.forEach(p=>{ if(G.phase!=="topic"||G.topics[p.id]) return; const k="t"+p.id;
      if(!cpuAt[k]) cpuAt[k]=now;   // ロボットは即決(2026-10-07)
      else if(now>=cpuAt[k]) hostAct({ t:"topics", from:p.id, sk:G.sk, l:randomTopics(G.rules.k, Object.values(G.topics).flat()) }); });
    return;
  }
  if(G.phase==="draw"){
    const T=G.rules.draw*1000;
    cpus.forEach(p=>{ const k="r"+p.id; if(G.phase!=="draw") return;
      if(!cpuAt[k]) cpuAt[k]=now;   // すぐに完成を押す=自分が完成を押した時点で終わる
      else if(cpuAt[k]>0 && now>=cpuAt[k]){ cpuAt[k]=-1; if(!(G.ready&&G.ready[p.id])) hostAct({ t:"ready", from:p.id, sk:G.sk }); } });
    if(G.phase==="draw" && G.stepEnd && now>=G.stepEnd) cpuFinishCards();
    return;
  }
  if(G.phase!=="match") return;
  G.flip.forEach(cid=>{ const o=G.sk+":"+cid; if(cpuObs[o]) return; cpuObs[o]=1; if(Math.random()<.72) cpuMem[cid]=cardKey(cById(cid)); });   // めくられたカードを(ある程度)おぼえる
  const tn=G.turn; if(!isCpu(tn) || G.resAt || G.flip.length>=2) return;
  const k="m"+G.sk+"_"+G.flip.length;
  if(!cpuAt[k]){ cpuAt[k]=now+380; return; }   // めくるのが見える程度の間だけあける
  if(now<cpuAt[k]) return;
  const live=G.board.filter(cid=>!G.taken[cid] && !G.flip.includes(cid)), unk=live.filter(cid=>!(cid in cpuMem));
  let pc=null;
  if(!G.flip.length){
    const by={}; live.forEach(cid=>{ const kk=cpuMem[cid]; if(kk) (by[kk]=by[kk]||[]).push(cid); });
    const pr=Object.values(by).find(a=>a.length>=2);
    pc= pr? pr[0] : pick(unk.length? unk : live);
  }else{
    const k1=cardKey(cById(G.flip[0])), known=live.filter(cid=>k1 && cpuMem[cid]===k1);
    pc= (known.length && Math.random()<.85)? known[0] : pick(unk.length? unk : live);
  }
  if(pc) hostAct({ t:"flip", from:tn, sk:G.sk, cid:pc });
}

let zoom=1, panX=0, panY=0, panning=null, spaceHeld=false, pinch=null;

function applyZoom(){
  const z=$("gameScene"); if(!z) return;
  const lim=(innerWidth+innerHeight)*(zoom-1)/2 + 60;
  panX=Math.max(-lim,Math.min(lim,panX)); panY=Math.max(-lim,Math.min(lim,panY));
  z.style.transform=(zoom===1&&!panX&&!panY)?"":("translate("+panX+"px,"+panY+"px) scale("+zoom+")");

function zoomAtPt(z1,cxp,cyp){                 // その点を動かさずに拡大縮小する
  const z0=zoom; z1=Math.max(1,Math.min(4,Math.round(z1*100)/100)); if(z1===z0) return;
  const r=$("gameScene").getBoundingClientRect(), dx=cxp-(r.left+r.width/2), dy=cyp-(r.top+r.height/2);
  zoom=z1; if(zoom===1){ panX=0; panY=0; } else { panX+=dx*(1-z1/z0); panY+=dy*(1-z1/z0); }
  applyZoom();
}

function onState(){
  if(!G) return;
  let justMatch=false;
  if(seen.gid!==G.gid){
    resetLocal();
    seen={ gid:G.gid, sk:-1, phase:"", getN:G.getN, missN:G.missN, turn:"", over:false };
    addSys("── あたらしいゲーム ──");
  }
  if(G.getN>seen.getN){ seen.getN=G.getN;
    const L=G.last, t=L&&G.tp[L.tp], by=L&&pById(L.by);
    if(t){ playGet(); bigFx(esc(t.t)+"<small>"+esc(by?by.n:"")+" GET</small>","get",by?by.c:"",[L.a,L.b]); addSys((by?by.n:"")+" GET：「"+t.t+"」");
      [L.a,L.b].forEach(cid=>{ const el=cardEls[cid]; if(el){ el.classList.remove("hit"); void el.offsetWidth; el.classList.add("hit"); } }); }
  }
  if(seen.phase!==G.phase){
    const ph=G.phase; seen.phase=ph;
    resetZoom();
    if(ph==="topic"){ playStep(); bigFx("お題を考えよう"); }
    if(ph==="draw"){ playStep(); bigFx("おえかきタイム"); addSys("おえかきタイム"); }
    if(ph==="match"){ justMatch=true; playStep(); const t=pById(G.turn); bigFx("神経衰弱スタート"); addSys("神経衰弱スタート"); }
    if(ph==="over" && !seen.over){
      seen.over=true; clearRecent();
      const winners=winnersOf();
      addSys(winners.map(p=>p.n).join("・")+" の勝ち","c-res");
      if(debug || winners.some(p=>p.id===myId)) playWin(); else playLose();
      setTimeout(openResult,1200);
    }
  }
  if(G.missN>seen.missN){ seen.missN=G.missN; playMiss(); }
  if(G.phase==="match" && seen.turn!==G.turn+"|"+G.sk){
    const prevTurn=seen.turn.split("|")[0]; seen.turn=G.turn+"|"+G.sk;
    if(G.turn===myId && prevTurn!==myId && !debug){ if(justMatch) setTimeout(myTurnFx,1700); else myTurnFx(); }   // 音+画面のまん中に大きく+スマホは振動(2026-10-07)
  }
  G.players.forEach(p=>{ seen.gone=seen.gone||{};
    if(p.gone && !seen.gone[p.id]){ seen.gone[p.id]=1; addSys(p.n+"が退出しました"); toast(p.n+"が退出しました"); }
    else if(!p.gone && seen.gone[p.id]){ delete seen.gone[p.id]; addSys(p.n+"が戻りました"); } });
}

function openChannel(c,onReady){
  joinT=Date.now(); spectating=false; seatTake("os",c);
  ch=sbClient().channel("os-"+c,{ config:{ presence:{ key:myId }, broadcast:{ self:false } } });
  ch.on("broadcast",{event:"hello"},({payload})=>{
    if(!isHost||!payload) return; cancelGone(payload.id);
    if(isKicked(payload.id)){ try{ ch.send({type:"broadcast",event:"kick",payload:{to:payload.id}}); }catch(e){} return; }   // 追放した人は戻さない
    if(phaseUI==="game"&&G&&restorePlayer(payload.id)) return;          // ★退出あつかいになっていた人が戻ってきた(リンクから入り直した)=ゲームに戻す
    if(lobbyById(payload.id)){ sendSnap(); return; }                       // もういる(再接続)
    if(phaseUI==="game"){ try{ ch.send({type:"broadcast",event:"spec",payload:{to:payload.id}}); }catch(e){} sendSnap(); setTimeout(updateSpecBadge,800); return; }   // ★ゲーム中=観戦者として入る(2026-10-02)
    if(lobby.length>=MAX_P){ try{ ch.send({type:"broadcast",event:"locked",payload:{to:payload.id,full:true}}); }catch(e){} return; }
    lobby.push({ id:payload.id, n:String(payload.n||"").slice(0,16), c:nextColor(), t:Date.now() });
    renderLobby(); sendSnap();
  });
  ch.on("broadcast",{event:"locked"},({payload})=>{ if(payload&&payload.to===myId){ leaveChannel();
    roomStatus('<div class="room-note err">満室のため参加できません（'+MAX_P+'人まで）</div>'); } });   // ゲーム中に来た人は観戦者として入れるので、断るのは満室の時だけ
  ch.on("broadcast",{event:"spec"},({payload})=>{ if(payload&&payload.to===myId&&!isHost){ clearTimeout(joinWatch); } });   // 観戦者として入れてもらえた(画面はsnapで切り替わる)
  ch.on("broadcast",{event:"snap"},({payload})=>{ if(!payload) return;
    if(isHost){   // ★オーナーが2人いる(引き継ぎが重なった・前のオーナーが戻ってきた)=新しく引き継いだ方、同じなら先に入った方に合わせる
      if(payload.hid&&payload.hid!==myId&&((payload.he|0)>hostEp||((payload.he|0)===hostEp&&hostRank(payload.hid)<hostRank(myId)))){
        isHost=false; clearInterval(hbIv); hbIv=0; hostId=payload.hid; lastVer=-1; hostChgAt=0; applySnap(payload); }
      return; }
    applySnap(payload); });
  ch.on("broadcast",{event:"act"},({payload})=>{ if(!isHost||!payload) return;
    if(payload.t==="color"){ const p=lobbyById(payload.from); if(p&&/^#[0-9a-f]{6}$/i.test(payload.c||"")){ p.c=payload.c; if(phaseUI==="lobby") renderLobby(); sendSnap(); } return; }   // 自分の色を変えた
    if(payload.t==="rename"){ const p=lobbyById(payload.from); if(p) p.n=String(payload.n||"").slice(0,16); if(G){ const q=pById(payload.from); if(q) q.n=p?p.n:q.n; } if(phaseUI==="lobby") renderLobby(); sendSnap(); return; }
    hostAct(payload); });
  ch.on("broadcast",{event:"art"},({payload})=>onArtChunk(payload));
  ch.on("broadcast",{event:"artreq"},({payload})=>{     // ホストだけが答える(全員の絵を持っている)。引き継いだばかりのオーナーが頼んだ時(any)は誰でも答える
    if(!payload||!Array.isArray(payload.cids)) return;
    if(!isHost&&!(payload.any&&payload.from===hostId)) return;
    const now=Date.now();
    payload.cids.slice(0,8).forEach(cid=>{ if(!(cid in arts)) return; if(now-(artServeAt[cid]||0)<1500) return; artServeAt[cid]=now; sendArt(cid,arts[cid]); });
  });
  ch.on("broadcast",{event:"stamp"},({payload})=>{ if(!payload) return; speakStamp(payload.i|0); spawnStamp(payload.i|0, payload.n||"あいて"); });
  ch.on("broadcast",{event:"chat"},({payload})=>{
    if(!payload||!payload.t||payload.from===myId) return;
    recvChat(payload.n||"あいて", String(payload.t).slice(0,40), payload.c||"", !!payload.sp); });
  ch.on("broadcast",{event:"bye"},({payload})=>{ if(!payload) return;
    if(payload.soft){ markGone(payload.id); return; }                      // ★ページが隠れただけ(スマホのアプリ切り替え等)=すぐ退出にせず、いつもの猶予を待つ(戻ってきたらhelloで取り消し)
    onLeave(payload.id); });
  ch.on("broadcast",{event:"cur"},({payload})=>showRcur(payload));
  ch.on("broadcast",{event:"host"},({payload})=>onHostMsg(payload));
  ch.on("broadcast",{event:"kick"},({payload})=>{ if(payload&&payload.to===myId&&!isHost){ toast("オーナーから追放されました"); goTitle(); } });
  ch.on("presence",{event:"leave"},({leftPresences})=>{ (leftPresences||[]).forEach(p=>{ if(!p||!p.id) return;
    markGone(p.id); }); });   // ロビー中も猶予(30秒)。明示の退出はbyeで即時
  ch.on("presence",{event:"join"},({newPresences})=>{ (newPresences||[]).forEach(p=>{ if(!p||!p.id) return; cancelGone(p.id);
    if(isHost&&phaseUI==="game"&&G&&!isKicked(p.id)) restorePlayer(p.id); }); });   // 同じページのまま通信が戻った人もゲームに戻す
  let readyDone=false;
  ch.subscribe(async status=>{
    if(status==="SUBSCRIBED"){
      try{ await ch.track({id:myId,n:myName||"",t:joinT}); }catch(e){}
      if(readyDone){ if(isHost) sendSnap(); else { try{ ch.send({type:"broadcast",event:"hello",payload:{id:myId,n:myName}}); }catch(e){} } return; }
      readyDone=true; if(onReady) onReady();
    } else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){ roomStatus('<div class="room-note err">通信に失敗しました。通信環境を確認してください</div>'); }
  });
}
function startHb(){ clearInterval(hbIv); hbIv=setInterval(sendSnap,1500); }
function sendSnap(){
  if(!isHost||!ch||debug) return;
  ver++;
  const p={ v:ver, hid:hostId, he:hostEp, rules, lob:lobby.map(x=>({id:x.id,n:x.n,c:x.c})) };
  if(phaseUI==="game"&&G){ p.G=G; p.left=G.stepEnd? Math.max(0,G.stepEnd-Date.now()) : 0; }
  try{ ch.send({type:"broadcast",event:"snap",payload:p}); }catch(e){}
}
function applySnap(p){
  if(hostId&&p.hid!==hostId&&Date.now()-hostChgAt<3000) return;       // 譲渡の直後に届いた元のオーナーのsnapは捨てる
  if(p.hid!==hostId){ lastVer=-1; }                                     // オーナーが替わったら番号を振り直す
  if(p.v<=lastVer) return; lastVer=p.v;
  clearTimeout(joinWatch); clearTimeout(succWatch); hostId=p.hid; hostEp=Math.max(hostEp,p.he|0); rules=p.rules||rules; lobby=p.lob||[];
  if(localLobby){ if(p.G&&p.G.phase==="over"){ renderLobby(); return; } localLobby=false; }   // ★先にロビーへ戻った人を、終わったゲームの結果に引き戻さない
  if(!p.G){
    if(spectating){ spectating=false; toast("ロビーに参加しました"); }   // ★観戦していた人はゲームが終わったらロビーに参加
    if(!lobbyById(myId)&&Date.now()-lastHeal>2000){ lastHeal=Date.now(); try{ ch.send({type:"broadcast",event:"hello",payload:{id:myId,n:myName}}); }catch(e){} }   // ★オーナーの一覧に自分がいない=名乗り直す
    if(phaseUI==="game"){ G=null; document.querySelectorAll(".overlay").forEach(o=>o.classList.remove("on","peek")); }
    if(phaseUI!=="lobby"){ phaseUI="lobby"; showScene("lobbyScene"); }
    renderLobby(); return;
  }
  G=p.G; localEnd=Date.now()+(p.left||0);
  { const mp=G.players.find(q=>q.id===myId);
    if(mp&&mp.gone&&Date.now()-lastHeal>2000){ lastHeal=Date.now(); try{ ch.send({type:"broadcast",event:"hello",payload:{id:myId,n:myName}}); }catch(e){} }   // ★退出あつかいになっていた=名乗って戻してもらう
  }
  { const sp=!G.players.some(q=>q.id===myId); if(sp&&!spectating){ toast("観戦モードで参加しました"); addSys("観戦モードで参加"); } spectating=sp; }
  if(pending && pendingIn()) pending=null;
  if(pending && Date.now()-pendingSent>900){ pendingSent=Date.now(); sendAct(pending); }   // 届いていなければ送り直す
  /* 送った絵: ホストが受け取った(=そのカードが完成扱い)と分かるまで送り直す */
  Object.keys(artOut).forEach(cid=>{ const c=G.cards.find(x=>x.id===cid); if(!c||c.done||c.gone){ delete artOut[cid]; return; }
    if(Date.now()-artOut[cid].at>2500){ artOut[cid].at=Date.now(); sendArt(cid,artOut[cid].d); } });
  /* 神経衰弱の間に、まだ届いていない絵があれば取り寄せる */
  if(G.phase==="match"||G.phase==="over"){
    const miss=G.board.filter(cid=>!(cid in arts)); if(miss.length && Date.now()-artReqAt>2500){ artReqAt=Date.now(); try{ ch.send({type:"broadcast",event:"artreq",payload:{ from:myId, cids:miss.slice(0,8) }}); }catch(e){} }
  }
  if(phaseUI!=="game") enterGame();
  onState(); render();
}

let stampMuted=false;   // 毎回ミュートOFFで始める(保存しない)
function spawnStamp(i,who,self){

  const el=document.createElement("div"); el.className="stamp-fly";
  const hx=0.06+Math.random()*0.88; el.style.left="max(0px, min(calc("+(hx*100).toFixed(1)+"% - 48px), calc(100% - 96px)))";   // 画面の外へはみ出さない(はみ出すとスマホで画面の幅が揺れる)
  const central=1-Math.abs(hx-0.5)*2;

const STAMP_WORDS=["やめてよぉ","すごぉい","わろたぁ"];
let stampTTSVoice=null, stampTTSWarm=false;
function speakStamp(i){
  try{
    if(!window.speechSynthesis||!seOn||stampMuted||document.hidden) return;
    if(!stampTTSVoice){ const vs=speechSynthesis.getVoices()||[]; stampTTSVoice=vs.find(v=>/ja/i.test(v.lang))||null; }
    if(!stampTTSWarm){ stampTTSWarm=true; speechSynthesis.onvoiceschanged=()=>{ const v2=speechSynthesis.getVoices()||[]; stampTTSVoice=v2.find(v=>/ja/i.test(v.lang))||stampTTSVoice; }; }
    const u=new SpeechSynthesisUtterance(STAMP_WORDS[Math.max(0,Math.min(2,i|0))]); u.volume=0.5; u.lang="ja-JP"; u.rate=1.05; u.pitch=1.1;
    if(stampTTSVoice) u.voice=stampTTSVoice;
    if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}

function sgNorm(s){ return String(s||"").toLowerCase().replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/[\s　]+/g,""); }
function sgFilter(){

/* ★デバッグ用の窓の共通部品(2026-09-25牧村指示)
   ・dragWin(窓, つまむ所[], 保存キー)=つまんで動かせる。離すといちばん近い画面の端に吸い付く・置いた場所は覚えておく
   ・onSD(関数)=SとDを同時に押した時に呼ぶ(開く/閉じる)。入力欄の中では反応しない。キーの位置で見るので日本語入力中でも効く */
function dragWin(el,handles,key){
  /* 離した時は左右どちらか近い方の画面の端へ吸い付く(2026-09-25牧村指示。上下には張り付かない=上下の位置は置いた所のまま)。
     保存するのは{e:吸い付いた端(l/r), p:上下の位置}=画面の大きさが変わっても同じ端にくっついたまま */
  const M=8;                                                   // 端からのすき間
  const vw=()=>window.innerWidth, vh=()=>window.innerHeight;
  const set=(x,y)=>{ el.style.left=x+"px"; el.style.top=y+"px"; el.style.right="auto"; el.style.bottom="auto"; };
  const fit=(v,max)=>Math.max(M,Math.min(max-M,v));            // 窓がまるごと画面に入る範囲
  const stick=(e,p)=>{ const w=el.offsetWidth, h=el.offsetHeight;
    if(!(vw()>0&&vh()>0)) return;                              // 画面の大きさが分からない時(裏のタブ等)は動かさない
    if(e==="l") set(M, fit(p,vh()-h)); else if(e==="r") set(vw()-w-M, fit(p,vh()-h));
    else if(e==="t") set(fit(p,vw()-w), M); else set(fit(p,vw()-w), vh()-h-M);
    el._snap={ e, p }; };
  const nearest=()=>{ const r=el.getBoundingClientRect();   // 窓の中心が画面の左半分なら左端・右半分なら右端
    return { e: (r.left+r.width/2)<=vw()/2? "l" : "r", p:r.top }; };
  el._place=()=>{ if(el._snap) stick(el._snap.e,el._snap.p); };
  el.dataset.drag="1";
  try{ const sv=JSON.parse(localStorage.getItem(key)||"null");
    if(sv&&(sv.e==="l"||sv.e==="r")) stick(sv.e,sv.p);
    else if(sv&&(sv.e==="t"||sv.e==="b")){ set(sv.p, sv.e==="t"? M : Math.max(M,vh()-el.offsetHeight-M)); if(vw()>0){ const n=nearest(); stick(n.e,n.p); } }   // 上下に張り付いていた古い保存は左右へ直す
    else if(sv&&typeof sv.x==="number"){ set(sv.x,sv.y); if(vw()>0){ const n=nearest(); stick(n.e,n.p); } }   // 吸い付く前に保存された位置
  }catch(e){}
  handles.forEach(h=>{ let d=null;
    h.addEventListener("pointerdown",e=>{ if(e.button!==0||e.target.closest("button")) return;
      const r=el.getBoundingClientRect(); d={ dx:e.clientX-r.left, dy:e.clientY-r.top, id:e.pointerId };
      el.classList.remove("snapping");
      try{ h.setPointerCapture(e.pointerId); }catch(_){} el.classList.add("dragging"); e.preventDefault(); });
    h.addEventListener("pointermove",e=>{ if(!d||e.pointerId!==d.id) return;
      let x=e.clientX-d.dx, y=e.clientY-d.dy;
      if(vw()>0&&vh()>0){ x=Math.max(-el.offsetWidth+60,Math.min(vw()-60,x)); y=Math.max(0,Math.min(vh()-30,y)); }
      set(x,y); });
    const up=()=>{ if(!d) return; d=null; el.classList.remove("dragging");
      if(!(vw()>0&&vh()>0)) return;
      const n=nearest(); el.classList.add("snapping"); stick(n.e,n.p);                 // すっと端へ吸い付く
      setTimeout(()=>el.classList.remove("snapping"),260);
      try{ localStorage.setItem(key,JSON.stringify(el._snap)); }catch(_){} };
    ["pointerup","pointercancel","lostpointercapture"].forEach(t=>h.addEventListener(t,up));
  });
  if(!dragWin.rs){ dragWin.rs=1; window.addEventListener("resize",()=>document.querySelectorAll("[data-drag]").forEach(w=>w._place&&w._place())); }
}
function onSD(fn){
  const held=new Set();
  document.addEventListener("keydown",e=>{
    if(e.ctrlKey||e.metaKey||e.altKey||e.repeat||!e.shiftKey) return;   // ★Shift+S+D(2026-10-02・今後の全ゲーム共通)
    const t=e.target; if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable)) return;
    if(e.code!=="KeyS"&&e.code!=="KeyD") return;
    held.add(e.code); if(held.has("KeyS")&&held.has("KeyD")){ held.clear(); e.preventDefault(); fn(); }
  });
  document.addEventListener("keyup",e=>held.delete(e.code));
  window.addEventListener("blur",()=>held.clear());
}

const SG_KEY="os.sgIdx";
const SG_NM=["まきむら","さくら","たろう","ゆい","けん","みお","そら","はる"];
const SG_TOP=["ねこ","ロケット","おにぎり","かさ","ぞう","ラーメン","ひまわり","おばけ","くるま","りんご","ペンギン","さかな"];
function sgReset(){
  clearTimeout(toastT); $("toast").classList.remove("on"); clearTimeout(fxT); $("bigFx").className="";
  goTitle();                                                     // 部屋・状態・チャット・ダイアログ・絵を片付けてタイトルへ

/* 状態を作る。o.guest=参加者側で見る／o.k=1人のお題の数 */
function sgG(n,o){
  o=o||{};
  G={ gid:"sg"+(++sgSeq), rules:Object.assign({},DEF_RULES,{ k:o.k||1 }),
      players:[...Array(n)].map((_,i)=>({ id:i?"g"+i:myId, n:SG_NM[i], c:PCOL[i], score:0, gone:false })),
      phase:o.phase||"topic", sk:5, stepEnd:0, topics:{}, tp:[], cards:[], board:[], pairTotal:0, taken:{},
      turn:"", flip:[], resAt:0, getN:0, missN:0, last:null, drawEnd:0, ready:{} };
  isHost=!o.guest; online=!!o.guest; hostId=o.guest? "g1" : myId;
  return G;
}
function sgDeal(){                      // 全員のお題を決めて、描く人を割り振る
  let t=0; activePs().forEach(p=>{ G.topics[p.id]=[]; for(let i=0;i<G.rules.k;i++) G.topics[p.id].push(SG_TOP[(t++)%SG_TOP.length]); });
  G.tp=[]; activePs().forEach(p=>G.topics[p.id].forEach(x=>G.tp.push({ t:x, by:p.id })));
  buildCards();
  myCards(myId).forEach(c=>{ if(c.tp<0){ const r=G.cards.find(x=>x.dr!==myId&&x.tp>=0); if(r){ const tmp=c.tp; c.tp=r.tp; r.tp=tmp; } } });   // 自分の分はお題ありにそろえる
}
function sgArtsAll(){ G.cards.forEach(c=>{ arts[c.id]=encodeArt(autoArt(c.tp>=0? G.tp[c.tp].t : "fake"+c.id)); c.done=true; }); }
function sgBoard(){                     // 神経衰弱の盤を作る(最初はあなたの番)
  G.board=shuffle(G.cards.filter(c=>!c.gone).map(c=>c.id));
  const cnt={}; G.cards.forEach(c=>{ const k2=cardKey(c); if(k2) cnt[k2]=(cnt[k2]||0)+1; });
  G.pairTotal=Object.values(cnt).reduce((s2,v)=>s2+Math.floor(v/2),0); G.turn=myId;
}
function sgGroups(){ const grp={}; G.board.forEach(cid=>{ const k2=cardKey(cById(cid)); if(k2) (grp[k2]=grp[k2]||[]).push(cid); }); return Object.values(grp).filter(g=>g.length>=2); }
function sgTake(pr,pid){ G.taken[pr[0]]=pid; G.taken[pr[1]]=pid; pById(pid).score++; }
function sgPrime(){
  seen={ gid:G.gid, sk:G.sk, phase:G.phase, getN:G.getN, missN:G.missN, turn:G.turn+"|"+G.sk, over:G.phase==="over", gone:{} };
  G.players.forEach(p=>{ if(p.gone) seen.gone[p.id]=1; });
}
function sgShow(){ if(G.phase==="topic"||G.phase==="match"||G.phase==="draw") G.stepEnd=Date.now()+sgLeft*1000; enterGame(); sgPrime(); localEnd=G.stepEnd; render(); }
function sgFire(fn){ if(fn) fn(); onState(); render(); }
function sgPhaseIn(){ seen.phase=""; seen.over=false; onState(); render(); }
function sgLobby(n,o){
  o=o||{}; online=true; isHost=!o.guest; hostId=o.guest? "g1" : myId; code="HUBAP"; nameAsked=true;
  const ids=[...Array(n)].map((_,i)=>i?"g"+i:myId);
  if(o.guest && n>1){ ids[0]="g1"; ids[1]=myId; }
  lobby=ids.map((id,i)=>({ id, n:(o.undef&&i===n-1)? "" : SG_NM[id===myId?0:+id.slice(1)], c:PCOL[i], t:i }));
  if(o.k) rules.k=o.k;
  phaseUI="lobby"; showScene("lobbyScene"); renderLobby();
}
const sgTopic=(n,o)=>{ sgG(n,o); if(o&&o.set) o.set(G); sgShow(); };
const sgDraw=(o)=>{ o=o||{}; sgG(4,Object.assign({ phase:"draw" },o)); sgDeal(); if(o.set) o.set(G); sgShow(); };
const sgMatch=(o)=>{ o=o||{}; sgG(4,Object.assign({ phase:"match", k:2 },o)); sgDeal(); sgArtsAll(); sgBoard(); if(o.set) o.set(G); sgShow(); };
const sgOverG=(scores,o)=>{ o=o||{}; sgG(4,Object.assign({ phase:"over", k:2 },o)); sgDeal(); sgArtsAll(); sgBoard();
  const gs=sgGroups(); let gi=0; scores.forEach((n,pi)=>{ for(let j=0;j<n&&gi<gs.length;j++) sgTake(gs[gi++],G.players[pi].id); });

/* ================= 背景のらくがき(白い画用紙にカラフルなインク) =================
   画面の端に寄せてランダムに散らす(真ん中のUIとなるべく重ねない)。画面サイズが変わったら描き直す */
/* ★2026-10-08: ときどき1つを消しゴムで消して(ジグザグにこすって消える)、別の場所にペンで描き直す */
const DOD_ZIG="M-50 -44 L50 -36 L-50 -22 L50 -10 L-50 4 L50 16 L-50 30 L50 42 L-50 50";   // 消しゴムでこする道すじ(落書きの大きさ±40を全部おおう)
let dodSeq=0;
function dodShape(k){
  if(k===0){ let d="M0 0"; for(let t=0;t<=16;t+=.35){ const r=t*1.9; d+=" L"+(Math.cos(t)*r).toFixed(1)+" "+(Math.sin(t)*r).toFixed(1); } return d; }                 // うずまき
  if(k===1){ let d=""; for(let i=0;i<=10;i++){ const r=i%2?11:26, a=-Math.PI/2+i*Math.PI/5; d+=(i?" L":"M")+(Math.cos(a)*r).toFixed(1)+" "+(Math.sin(a)*r).toFixed(1); } return d+" Z"; }   // 星
  if(k===2) return "M0 22 C-30 0 -22 -24 0 -8 C22 -24 30 0 0 22 Z";                                                                                       // ハート
  if(k===3){ let d="M-34 0"; for(let i=1;i<=8;i++) d+=" L"+(-34+i*8.5)+" "+(i%2?-10:10); return d; }                                                        // ぎざぎざ
  if(k===4){ let d="M-38 0"; for(let x=-38;x<=38;x+=4) d+=" L"+x+" "+(Math.sin(x/6)*9).toFixed(1); return d; }                                              // なみなみ
  if(k===5){ let d=""; for(let t=0;t<=Math.PI*4.3;t+=.2){ const r=20+Math.sin(t*3)*3+t*.6; d+=(t?" L":"M")+(Math.cos(t)*r).toFixed(1)+" "+(Math.sin(t)*r*.8).toFixed(1); } return d; }   // ぐるぐる丸
  if(k===6){ let d="M 14 0 A14 14 0 1 1 -14 0 A14 14 0 1 1 14 0"; for(let i=0;i<8;i++){ const a=i*Math.PI/4; d+=" M"+(Math.cos(a)*20).toFixed(1)+" "+(Math.sin(a)*20).toFixed(1)+" L"+(Math.cos(a)*30).toFixed(1)+" "+(Math.sin(a)*30).toFixed(1); } return d; }   // 太陽
  return "M-30 6 L22 6 M10 -6 L24 6 L10 18";                                                                                                               // やじるし
}
/* 落書きどうしは重ねない(2026-10-10)。1つの落書き=中心(x,y)・半径r(形の大きさ±40×拡大率)の円とみなして、ほかの円とぶつからない所に置く */
function dodSpots(sv,skip){ const a=[]; (sv? sv.querySelectorAll("g.dod") : []).forEach(g=>{ if(g!==skip) a.push({ x:+g.dataset.x, y:+g.dataset.y, r:+g.dataset.r }); }); return a; }
function dodPick(W,H,sc,spots){
  const R=Math.random, r=38*sc+4;
  for(let i=0;i<90;i++){
    let x, y;
    if(R()<.72){ x= R()<.5? R()*W*.17 : W*(.83+R()*.17); y=R()*H; }     // 左右の端
    else { x= R()<.5? R()*W*.3 : W*(.7+R()*.3); y= R()<.5? R()*H*.12 : H*(.88+R()*.12); }   // 上下の端(真ん中は空ける)
    if(spots.every(p=>Math.hypot(p.x-x,p.y-y)>=p.r+r+3)) return { x, y, r };   // +3=座標の丸めで食い込まないように
  }
  return null;
}
function dodOne(W,H,spots,at){   // 落書き1つ(位置・色・形はランダム)。<g>の中に「消しゴムでこする用のマスク」も持つ。置ける所が無ければ""
  const R=Math.random;
  const col=DOODLE_INKS[Math.floor(R()*DOODLE_INKS.length)], k=Math.floor(R()*8);
  let sc=.8+R()*.9, p=dodPick(W,H,sc,spots);
  if(!p && at){ sc=Math.min(sc, Math.max(.5,(at.r-4)/38)); p={ x:at.x, y:at.y, r:38*sc+4 }; }   // 描き直しで空きが無い=消した落書きの場所に置く
  if(!p) return "";
  const rot=Math.floor(R()*360), fill=(k===1||k===2)&&R()<.4? col : "none", id="dm"+(++dodSeq);
  return '<g class="dod" data-x="'+p.x.toFixed(0)+'" data-y="'+p.y.toFixed(0)+'" data-r="'+p.r.toFixed(1)+'" transform="translate('+p.x.toFixed(0)+' '+p.y.toFixed(0)+') rotate('+rot+') scale('+sc.toFixed(2)+')" opacity="'+(W<640?".38":".62")+'">'   // 狭い画面はUIの後ろに重なりやすいので薄く
    +'<mask id="'+id+'" maskUnits="userSpaceOnUse" x="-90" y="-90" width="180" height="180"><rect x="-90" y="-90" width="180" height="180" fill="#fff"/>'
    +'<path class="dz" d="'+DOD_ZIG+'" fill="none" stroke="#000" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="100"/></mask>'
    +'<g mask="url(#'+id+')"><path class="dp" d="'+dodShape(k)+'" fill="'+fill+'" fill-opacity=".35" stroke="'+col+'" stroke-width="'+(3.2/sc).toFixed(2)+'" stroke-linecap="round" stroke-linejoin="round" pathLength="100"/></g></g>';
}
function drawDoodles(){
  const W=window.innerWidth, H=window.innerHeight;
  const n=Math.round(Math.max(14, Math.min(34, W*H/42000)));
  $("doodles").innerHTML='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"></svg>';
  const sv=$("doodles").querySelector("svg");
  for(let i=0;i<n;i++){ const h=dodOne(W,H,dodSpots(sv)); if(h) sv.insertAdjacentHTML("beforeend",h); }
}
/* ★すべての落書きを順番に描き直す(2026-10-10): いちばん古い落書きから消して、別の場所に描く。2つまで同時に進む。
   1つ=消す1.1秒+間0.35秒+描く1.6秒。1.7秒ごとに次を始めるので、全部(14〜34個)がおよそ0.5〜1分で入れかわる */
function dodCycle(){
  const sv=$("doodles").querySelector("svg"); if(!sv||document.hidden) return;
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const old=[...sv.querySelectorAll("g.dod")].find(g=>!g.dataset.busy); if(!old) return;
  const dz=old.querySelector(".dz"); if(!dz||!dz.animate) return;
  old.dataset.busy="1";
  const er=dz.animate([{strokeDashoffset:100},{strokeDashoffset:0}],{ duration:1100, easing:"ease-in-out", fill:"forwards" });   // 消しゴムでこする
  er.onfinish=()=>{
    if(!old.isConnected) return;               // 画面サイズが変わって作り直された
    const at={ x:+old.dataset.x, y:+old.dataset.y, r:+old.dataset.r };
    old.remove();
    const W=window.innerWidth, H=window.innerHeight, tmp=document.createElementNS("http://www.w3.org/2000/svg","svg");
    tmp.innerHTML=dodOne(W,H,dodSpots(sv),at); const ng=tmp.firstChild; if(!ng) return;
    ng.dataset.busy="1";
    const dp=ng.querySelector(".dp"), fl=dp.getAttribute("fill");
    dp.setAttribute("stroke-dasharray","100 100"); dp.setAttribute("stroke-dashoffset","100"); if(fl!=="none") dp.setAttribute("fill-opacity","0");
    sv.appendChild(ng);                          // いちばん後ろ=いちばん新しい(次に消されるのは最後)
    setTimeout(()=>{   // 少し間をあけてからペンで描く
      const pn=dp.animate([{strokeDashoffset:100},{strokeDashoffset:0}],{ duration:1600, easing:"cubic-bezier(.4,.1,.4,1)", fill:"forwards" });
      pn.onfinish=()=>{ if(fl!=="none") dp.animate([{fillOpacity:0},{fillOpacity:.35}],{ duration:400, fill:"forwards" }); delete ng.dataset.busy; };
    },350);
  };
}
setInterval(dodCycle, 1700);
let dodT=0; window.addEventListener("resize",()=>{ clearTimeout(dodT); dodT=setTimeout(drawDoodles,250); });
